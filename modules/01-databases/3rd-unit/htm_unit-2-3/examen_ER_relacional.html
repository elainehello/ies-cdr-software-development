<body>
<header><h1>Examen práctico: modelo E/R y modelo relacional</h1>
<p>Bases de Datos · Temas 2 y 3 · del enunciado al diagrama en papel, con los criterios para decidir rápido.</p></header>
<nav id="tabs" role="tablist"></nav>
<main>
<section id="v-method"></section><section id="v-read" hidden></section><section id="v-restr" hidden></section><section id="v-dict" hidden></section>
<section id="v-quiz" hidden></section><section id="v-tables" hidden></section><section id="v-exam" hidden></section>
</main>
<script>
// =====================================================================
//  MOTOR DE DIBUJO E/R "ESTILO PAPEL" (notación del Tema 2)
//  spec = { w, h, ents, rels, hier, cons }
//  Cada elemento puede llevar step: solo se dibuja si step <= paso actual.
// =====================================================================
const SVGNS = "http://www.w3.org/2000/svg";
const _ctx = document.createElement("canvas").getContext("2d");
function tw(s, font) { _ctx.font = font || "12px Arial"; return _ctx.measureText(String(s)).width; }
function mk(tag, a, p) { const n = document.createElementNS(SVGNS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; }
function tx(p, x, y, s, cls, anchor) { const t = mk("text", { x, y, class: cls, "text-anchor": anchor || "middle" }, p); t.textContent = s; return t; }

const F_ENT = "700 13px -apple-system, Segoe UI, Roboto, Arial, sans-serif";
const F_REL = "700 12px -apple-system, Segoe UI, Roboto, Arial, sans-serif";

function cardParse(s) {
    const m = String(s).match(/\(\s*(\d+)\s*,\s*([0-9nN]+)\s*\)/);
    if (!m) return { min: 0, max: Infinity };
    return { min: +m[1], max: /n/i.test(m[2]) ? Infinity : +m[2] };
}
function corr(r) {
    if (r.type) return r.type;
    const A = cardParse(r.ca).max > 1, B = cardParse(r.cb).max > 1;
    return A && B ? "N:M" : (A ? "N" : "1") + ":" + (B ? "N" : "1");
}
function rBorder(g, tx_, ty) {
    const dx = tx_ - g.x, dy = ty - g.y;
    if (!dx && !dy) return { x: g.x, y: g.y };
    const s = Math.min((g.w / 2) / Math.abs(dx || 1e-9), (g.h / 2) / Math.abs(dy || 1e-9));
    return { x: g.x + dx * s, y: g.y + dy * s };
}
function dBorder(g, tx_, ty) {
    const dx = tx_ - g.x, dy = ty - g.y;
    const t = 1 / (Math.abs(dx) / (g.w / 2) + Math.abs(dy) / (g.h / 2) || 1);
    return { x: g.x + dx * t, y: g.y + dy * t };
}
function boxHit(g, lx, ly, s) {
    const w = tw(s, "700 12px monospace") / 2 + 3;
    return !(lx + w < g.x - g.w / 2 || lx - w > g.x + g.w / 2 || ly + 3 < g.y - g.h / 2 || ly - 12 > g.y + g.h / 2);
}

function drawER(spec, opt) {
    opt = opt || {};
    const step = opt.step === undefined ? 99 : opt.step;
    const vis = (o, def) => (o.step === undefined ? (def || 0) : o.step) <= step;
    const hl = opt.highlight || null; // id resaltado
    const svg = mk("svg", { viewBox: `0 0 ${spec.w} ${spec.h}`, role: "img", "aria-label": opt.label || "Diagrama entidad/relación", class: "er" });
    const defs = mk("defs", {}, svg);
    const arrow = (id, cls) => { const m = mk("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, defs); mk("path", { d: "M0,0 L10,5 L0,10 z", class: cls }, m); };
    const uid = "m" + Math.random().toString(36).slice(2, 8);
    arrow(uid + "a", "mk-ink"); arrow(uid + "r", "mk-red");
    const gE = mk("g", {}, svg), gS = mk("g", {}, svg), gL = mk("g", {}, svg);

    const EG = {};
    spec.ents.forEach(e => {
        const label = e.label || e.id;
        const w = Math.max(tw(label, F_ENT) + 28, 86), h = 36;
        EG[e.id] = { x: e.x, y: e.y, w, h, e };
    });
    const RG = {};
    spec.rels.forEach(r => {
        const w = Math.max(tw(r.label || r.n, F_REL) + 42, 92), h = r.dep ? 56 : 50;
        RG[r.id || r.n] = { x: r.x, y: r.y, w, h, r };
    });

    // ---------- atributos (piruletas)
    function lollipops(g, attrs, isRel, stepDef) {
        const sides = { t: [], b: [], l: [], r: [] };
        (attrs || []).forEach(a => { if (vis(a, stepDef)) sides[a.side || "t"].push(a); });
        const dot = (cx, cy, a) => {
            const c = mk("circle", { cx, cy, r: 4.6, class: a.pk ? "dot pk" : "dot" }, gS);
            if (a.ia) { mk("path", { d: `M${cx},${cy - 4.6} A4.6,4.6 0 0 1 ${cx},${cy + 4.6} Z`, class: "dot-half" }, gS); }
            return c;
        };
        const label = a => (a.der ? "D · " : "") + a.n + (a.multi ? " (1,n)" : a.opt ? " (0,1)" : "");
        const stemCls = a => "stem" + (a.opt || a.multiOpt ? " dash" : "");
        ["t", "b"].forEach(sd => {
            const arr = sides[sd]; if (!arr.length) return;
            const s = sd === "t" ? -1 : 1;
            const y0 = g.y + s * g.h / 2;
            const need = Math.max(...arr.map(a => tw(label(a), (a.pk ? "700 " : "") + "11.5px Arial, sans-serif") / 2 + 14));
            const gap = arr.length > 1 ? Math.max((g.w - 24) / (arr.length - 1), need) : 0;
            const span = gap * (arr.length - 1);
            arr.forEach((a, i) => {
                const x = arr.length === 1 ? g.x : g.x - span / 2 + gap * i;
                const len = (a.len || (i % 2 ? 34 : 18));
                const cy = y0 + s * len;
                mk("line", { x1: x, y1: y0, x2: x, y2: cy - s * 4.6, class: stemCls(a) }, gE);
                dot(x, cy, a);
                const t = tx(gL, x, cy + (s < 0 ? -9 : 18), label(a), "att" + (a.pk ? " pk" : ""));
                if (a.pk) t.setAttribute("text-decoration", "underline");
            });
        });
        ["l", "r"].forEach(sd => {
            const arr = sides[sd]; if (!arr.length) return;
            const s = sd === "l" ? -1 : 1;
            const x0 = g.x + s * g.w / 2;
            arr.forEach((a, i) => {
                const y = g.y + (i - (arr.length - 1) / 2) * 19;
                const ys = Math.max(g.y - g.h / 2 + 5, Math.min(g.y + g.h / 2 - 5, y));
                const cx = x0 + s * (a.len || 26);
                mk("line", { x1: x0, y1: ys, x2: cx - s * 4.6, y2: y, class: stemCls(a) }, gE);
                dot(cx, y, a);
                const t = tx(gL, cx + s * 9, y + 4, label(a), "att" + (a.pk ? " pk" : ""), s > 0 ? "start" : "end");
                if (a.pk) t.setAttribute("text-decoration", "underline");
            });
        });
    }

    // ---------- entidades
    spec.ents.forEach(e => {
        if (!vis(e, 1)) return;
        const g = EG[e.id];
        const cls = "ent" + (hl && hl === e.id ? " hl" : "");
        mk("rect", { x: g.x - g.w / 2, y: g.y - g.h / 2, width: g.w, height: g.h, class: cls }, gS);
        if (e.weak && vis({ step: e.weakStep }, 5)) mk("rect", { x: g.x - g.w / 2 + 4, y: g.y - g.h / 2 + 4, width: g.w - 8, height: g.h - 8, class: "ent inner" }, gS);
        tx(gS, g.x, g.y + 4.5, e.label || e.id, "ent-t");
        lollipops(g, e.attrs, false, 2);
    });

    // ---------- etiqueta de cardinalidad junto a la entidad
    function cardLbl(eg, from, s, role, sideSign) {
        const p = rBorder(eg, from.x, from.y);
        let ux = from.x - p.x, uy = from.y - p.y; const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
        const sg = sideSign || 1;
        const nx = -uy * sg, ny = ux * sg;
        let al = 16, lx, ly;
        do { lx = p.x + ux * al + nx * 13; ly = p.y + uy * al + ny * 13 + 4; al += 3; } while (boxHit(eg, lx, ly, s) && al < 70);
        tx(gL, lx, ly, s, "card");
        if (role) {
            const ra = al + 18 + (Math.abs(ux) > 0.6 ? tw(s, "700 11.5px Arial") : 0), rx = p.x + ux * ra + nx * 10, ry = p.y + uy * ra + ny * 10 + 4 + (Math.abs(nx) < 0.3 ? ny * 8 : 0);
            tx(gL, rx, ry, role, "role", nx > 0.3 ? "start" : nx < -0.3 ? "end" : "middle");
        }
    }

    // ---------- interrelaciones
    const LINE = {}; // puntos de las líneas entidad-rombo (para arcos de restricción)
    spec.rels.forEach(r => {
        if (!vis(r, 3)) return;
        const key = r.id || r.n;
        const g = RG[key];
        const showCard = vis({ step: r.cardStep }, 4);
        const cls = "rel" + (hl && hl === key ? " hl" : "");
        mk("polygon", { points: `${g.x},${g.y - g.h / 2} ${g.x + g.w / 2},${g.y} ${g.x},${g.y + g.h / 2} ${g.x - g.w / 2},${g.y}`, class: cls }, gS);
        if (r.dep && vis({ step: r.depStep }, 5)) {
            tx(gS, g.x, g.y - 8, r.dep, "dep");
            tx(gS, g.x, g.y + 7, r.label || r.n, "rel-t");
            if (showCard) tx(gS, g.x, g.y + 19, corr(r), "corr");
        } else {
            tx(gS, g.x, g.y + (showCard ? 0 : 4), r.label || r.n, "rel-t");
            if (showCard) tx(gS, g.x, g.y + 13, corr(r), "corr");
        }
        const ends = r.ends ? r.ends.map(e => [e.e, e.c, e.role]) : [[r.a, r.ca, r.roleA], [r.b, r.cb, r.roleB]];
        if (!r.ends && r.a === r.b) {
            const eg = EG[r.a];
            let ux = g.x - eg.x, uy = g.y - eg.y; const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
            [[1, r.ca, r.roleA], [-1, r.cb, r.roleB]].forEach(([s, c, role]) => {
                const off = { x: -uy * 30 * s, y: ux * 30 * s };
                const fake = { x: eg.x + off.x, y: eg.y + off.y, w: eg.w, h: eg.h };
                const b = rBorder(fake, g.x + off.x * 0.4, g.y + off.y * 0.4);
                const a = dBorder(g, b.x, b.y);
                mk("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gE);
                if (showCard) cardLbl({ ...eg, x: fake.x, y: fake.y }, a, c, role, s);
            });
        } else {
            ends.forEach(([id, c, role]) => {
                const eg = EG[id]; if (!eg || !vis(eg.e, 1)) return;
                const a = dBorder(g, eg.x, eg.y), b = rBorder(eg, g.x, g.y);
                mk("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gE);
                LINE[key + "|" + id] = { a, b };
                if (showCard) cardLbl(eg, a, c, role, r.flip && r.flip[id] ? -1 : 1);
            });
        }
        lollipops({ x: g.x, y: g.y, w: g.w * 0.62, h: g.h }, r.attrs, true, 5);
    });

    // ---------- jerarquías
    (spec.hier || []).forEach(h => {
        if (!vis(h, 6)) return;
        const sg = EG[h.sup];
        const baseY = h.y - 12, apexY = h.y + 15;
        mk("polygon", { points: `${h.x - 19},${baseY} ${h.x + 19},${baseY} ${h.x},${apexY}`, class: "tri" }, gS);
        const sp = rBorder(sg, h.x, baseY);
        mk("line", { x1: sp.x, y1: sp.y, x2: h.x, y2: baseY, class: "edge" }, gE);
        if (h.total) mk("circle", { cx: (sp.x + h.x) / 2, cy: (sp.y + baseY) / 2, r: 5, class: "tri" }, gS);
        const angs = [];
        h.subs.forEach(id => {
            const eg = EG[id]; const b = rBorder(eg, h.x, apexY);
            mk("line", { x1: h.x, y1: apexY, x2: b.x, y2: b.y, class: "edge" }, gE);
            angs.push(Math.atan2(b.y - apexY, b.x - h.x));
        });
        if (h.excl && angs.length > 1) {
            const R = 26, a1 = Math.min(...angs), a2 = Math.max(...angs);
            mk("path", { d: `M${h.x + R * Math.cos(a1)},${apexY + R * Math.sin(a1)} A${R},${R} 0 0 1 ${h.x + R * Math.cos(a2)},${apexY + R * Math.sin(a2)}`, class: "edge" }, gE);
        }
        if (h.label !== false) tx(gL, h.x + 26, h.y + 2, h.label || ((h.total ? "total" : "parcial") + " · " + (h.excl ? "exclusiva" : "solapada")), "hlab", "start");
    });

    // ---------- restricciones entre interrelaciones
    (spec.cons || []).forEach(c => {
        if (!vis(c, 6)) return;
        const g1 = RG[c.r1], g2 = RG[c.r2];
        if (c.kind === "exclusion" || c.kind === "inclusion") {
            const p1 = dBorder(g1, g2.x, g2.y), p2 = dBorder(g2, g1.x, g1.y);
            const a = { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "cons dash" };
            if (c.kind === "inclusion") a["marker-end"] = `url(#${uid}r)`;
            mk("line", a, gE);
            if (c.label) tx(gL, (p1.x + p2.x) / 2 + (c.lx || 8), (p1.y + p2.y) / 2 + (c.ly || 4), c.label, "clab", c.lx < 0 ? "end" : "start");
        } else {
            // arco que corta las dos líneas que salen de la entidad
            const L1 = LINE[c.r1 + "|" + c.ent], L2 = LINE[c.r2 + "|" + c.ent];
            if (!L1 || !L2) return;
            const d = c.dist || 38;
            const at = (L) => { const ux = L.a.x - L.b.x, uy = L.a.y - L.b.y, l = Math.hypot(ux, uy); return { x: L.b.x + ux / l * d, y: L.b.y + uy / l * d }; };
            const p1 = at(L1), p2 = at(L2);
            const eg = EG[c.ent];
            const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
            let vx = mx - eg.x, vy = my - eg.y; const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
            const bulge = c.bulge || 26;
            const cx = mx + vx * bulge, cy = my + vy * bulge;
            // extender el arco un poco más allá de las líneas
            const ext = (p, q) => ({ x: p.x + (p.x - q.x) * 0.12, y: p.y + (p.y - q.y) * 0.12 });
            const s1 = ext(p1, p2), s2 = ext(p2, p1);
            const a = { d: `M${s1.x},${s1.y} Q${cx},${cy} ${s2.x},${s2.y}`, class: "cons" };
            if (c.kind === "inclusividad") a["marker-end"] = `url(#${uid}r)`;
            mk("path", a, gE);
            if (c.label) tx(gL, cx + vx * 14 + (c.lx || 0), cy + vy * 14 + 4 + (c.ly || 0), c.label, "clab");
        }
    });
    return svg;
}

// ---------- enunciado anotado + diagrama paso a paso
let EXSTATE = { ex: 0, step: 1 };
function markup(text, step) {
  return escH(text).replace(/\{(\w):([^}|]+)(?:\|([^}]+))?\}/g, (m, k, w, tip) => {
    const L = LAYERS.find(l => l.k === k);
    const on = L && L.step <= step;
    return `<mark class="${k}${on ? "" : " off"}" title="${escH(L ? L.name : "")}${tip ? ": " + escH(tip) : ""}">${w}${on && tip ? `<sup>${escH(tip)}</sup>` : ""}</mark>`;
  }).replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
}
function renderRead() {
  const ex = EXAMPLES[EXSTATE.ex], st = EXSTATE.step;
  $("v-read").innerHTML = `
  <div class="panel">
   <div class="row"><h2>Del texto al diagrama, paso a paso</h2>
    <select id="sel-ex">${EXAMPLES.map((e, i) => `<option value="${i}" ${i === EXSTATE.ex ? "selected" : ""}>${escH(e.title)}</option>`).join("")}</select></div>
   <p class="lead">Avanza paso a paso: cada paso subraya un tipo de palabra en el texto y dibuja lo que le corresponde. Pasa el ratón (o toca) sobre lo subrayado para ver qué significa.</p>
   <div class="stepbar">${STEPS.slice(1).map((s, i) => `<button class="sb ${i + 1 === st ? "on" : ""} ${i + 1 < st ? "done" : ""}" data-s="${i + 1}"><span>${i + 1}</span>${s}</button>`).join("")}</div>
   <div class="split">
    <div class="text"><p>${markup(ex.text, st)}</p></div>
    <div class="side">
     <div class="note"><b>Paso ${st}: ${STEPS[st]}</b><p>${ex.notes[st]}</p></div>
     <div class="legend-mini">${LAYERS.filter(l => l.step <= st).map(l => `<mark class="${l.k}">${l.name}</mark>`).join(" ")}</div>
    </div>
   </div>
   <div class="diagram" id="read-dia"></div>
   <div class="row nav"><button id="r-prev" ${st === 1 ? "disabled" : ""}>← Paso anterior</button><button class="primary" id="r-next" ${st === 6 ? "disabled" : ""}>Paso siguiente →</button></div>
  </div>`;
  $("read-dia").appendChild(drawER(ex.spec, { step: st }));
  $("sel-ex").onchange = e => { EXSTATE = { ex: +e.target.value, step: 1 }; renderRead(); };
  document.querySelectorAll("#v-read .sb").forEach(b => b.onclick = () => { EXSTATE.step = +b.dataset.s; renderRead(); });
  $("r-prev").onclick = () => { EXSTATE.step--; renderRead(); };
  $("r-next").onclick = () => { EXSTATE.step++; renderRead(); };
}

// ---------- entrenamiento
let QZ = null;
function quizStart(cat) {
  const pool = QUIZ.map((q, i) => ({ q, i })).filter(x => cat === "all" || x.q[0] === cat);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  QZ = { cat, list: pool, k: 0, ok: 0, ko: 0, answered: false, fails: [] };
  quizDraw();
}
function quizDraw() {
  const box = $("quiz-box");
  const n = QZ.list.length;
  $("quiz-stats").textContent = `Pregunta ${Math.min(QZ.k + 1, n)} de ${n} · Aciertos ${QZ.ok} · Fallos ${QZ.ko}`;
  $("quiz-bar").style.width = n ? ((QZ.ok + QZ.ko) / n * 100) + "%" : "0%";
  if (QZ.k >= n) {
    const nota = n ? QZ.ok / n * 10 : 0;
    box.innerHTML = `<div class="result"><div class="big">${nota.toFixed(1).replace(".", ",")}</div><p>${QZ.ok} de ${n} correctas.</p>${QZ.fails.length ? `<h4>Repasa estas:</h4><ul>${QZ.fails.map(f => `<li>${escH(f[1])} → <b>${escH(f[2][f[3]])}</b></li>`).join("")}</ul>` : "<p>¡Perfecto!</p>"}<button class="primary" id="q-again">Otra ronda</button></div>`;
    $("q-again").onclick = () => quizStart(QZ.cat);
    return;
  }
  const q = QZ.list[QZ.k].q;
  const order = q[2].map((_, i) => i).sort(() => Math.random() - 0.5);
  QZ.answered = false;
  box.innerHTML = `<span class="badge">${QCAT[q[0]]}</span><p class="qtext">«${escH(q[1])}»</p><p class="muted">¿Qué dibujas o qué haces?</p>
    <div class="opts">${order.map((o, p) => `<button class="opt" data-o="${o}"><b>${"ABCD"[p]}</b> ${escH(q[2][o])}</button>`).join("")}</div>
    <div class="fb" hidden></div><div class="row nav"><span></span><button class="primary" id="q-next" hidden>Siguiente →</button></div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (QZ.answered) return; QZ.answered = true;
    const o = +b.dataset.o, good = o === q[3];
    good ? QZ.ok++ : (QZ.ko++, QZ.fails.push(q));
    box.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.o === q[3]) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
    const fb = box.querySelector(".fb"); fb.hidden = false; fb.innerHTML = (good ? "✓ <b>Correcto.</b> " : "✗ <b>No.</b> ") + escH(q[4]);
    $("q-next").hidden = false; $("q-next").focus();
    $("quiz-stats").textContent = `Pregunta ${QZ.k + 1} de ${QZ.list.length} · Aciertos ${QZ.ok} · Fallos ${QZ.ko}`;
  });
  $("q-next").onclick = () => { QZ.k++; quizDraw(); };
}
function renderQuiz() {
  $("v-quiz").innerHTML = `<div class="panel"><div class="row"><h2>Entrenamiento rápido: frase → dibujo</h2>
   <select id="q-cat"><option value="all">Todo (${QUIZ.length} frases)</option>${Object.entries(QCAT).map(([k, v]) => `<option value="${k}">${v} (${QUIZ.filter(q => q[0] === k).length})</option>`).join("")}</select></div>
   <p class="lead">Frases como las del examen. Objetivo: reconocer cada construcción en menos de 10 segundos. Teclas A, B, C, D para responder y Enter para seguir.</p>

document.addEventListener("keydown", e => {
  if (!QZ || $("v-quiz").hidden || e.target.tagName === "SELECT") return;
  const i = "ABCD".indexOf(e.key.toUpperCase());
  const btns = document.querySelectorAll("#quiz-box .opt");
  if (i >= 0 && btns[i] && !QZ.answered) btns[i].click();
  else if (e.key === "Enter" && QZ.answered && e.target.tagName !== "BUTTON") { QZ.k++; quizDraw(); }
});

   <div class="rule3"><div><b>1:1</b><span>la clave de la más importante pasa a la otra</span></div><div><b>1:N</b><span>la clave del lado 1 pasa al lado N</span></div><div><b>N:M</b><span>tabla nueva con la unión de las dos claves</span></div></div>
   <div class="pgrid">${PATTERNS.map((p, i) => `<div class="pcard"><h3>${p.t}</h3><div class="dsvg" data-p="${i}"></div><div class="arrowdown">↓</div><div class="rtabs">${p.tabs.map(t => `<div>${t}</div>`).join("")}</div><p>${p.rule}</p></div>`).join("")}</div>
   <div class="tip">El <b>mínimo</b> decide los nulos: (0,…) junto a la entidad a la que apunta la clave ajena → admite NULL; (1,…) → NOT NULL. El <b>borrado</b>: CASCADE si la clave ajena forma parte de la PK (débil, N:M, subtipo); SET NULL si admite nulos; RESTRICT en el resto.</div></div>`;
  document.querySelectorAll("[data-p]").forEach(d => d.appendChild(drawER(PATTERNS[+d.dataset.p].spec)));
}

    "He anotado los supuestos que he tenido que decidir",
    "En el paso a tablas: PK subrayada, FK en cursiva con flecha, * en las que admiten nulos",

  const saved = store("ex-checks") || {};
  $("v-exam").innerHTML = `
  <div class="panel"><div class="row"><h2>Cómo organizar la hoja del examen</h2><button id="b-print">Imprimir esta hoja</button></div>

     <div class="time"><div style="flex:1" class="t1">Leer + subrayar<br>10%</div><div style="flex:1.5" class="t2">Borrador<br>15%</div><div style="flex:4" class="t3">Diagrama<br>45%</div><div style="flex:2" class="t4">Tablas<br>20%</div><div style="flex:1" class="t5">Repaso<br>10%</div></div>
     <h3>Consejos para dibujar en papel</h3>
     <ul>
      <li>Empieza por la <b>entidad con más relaciones</b> en el centro de la hoja.</li>
      <li>Deja <b>espacio</b> entre entidades: los rombos y las cardinalidades lo necesitan.</li>
      <li>Escribe la cardinalidad <b>pegada a la entidad</b> y el tipo (1:N) <b>dentro del rombo</b>.</li>
      <li>Atributos como <b>piruletas</b>: ● identificador, ◐ alternativo, ○ normal.</li>
      <li>Usa <b>lápiz</b> para el primer dibujo y repasa con bolígrafo al final.</li>

   <div class="cklist">${checks.map((c, i) => `<label><input type="checkbox" data-c="${i}" ${saved[i] ? "checked" : ""}> ${c}</label>`).join("")}</div>

  </div>`;
  document.querySelectorAll("[data-c]").forEach(c => c.onchange = () => { const s = store("ex-checks") || {}; s[c.dataset.c] = c.checked; store("ex-checks", s); });

}

const VIEWS = [["method", "1 · Método"], ["read", "2 · Leer el enunciado"], ["restr", "3 · Las 4 restricciones"], ["dict", "4 · Diccionario"], ["quiz", "5 · Entrenamiento"], ["tables", "6 · Paso a tablas"], ["exam", "7 · El día del examen"]];
function show(v) {
  VIEWS.forEach(([k]) => { $("v-" + k).hidden = k !== v; $("t-" + k).classList.toggle("on", k === v); $("t-" + k).setAttribute("aria-selected", k === v); });
  store("ex-view", v);
  window.scrollTo({ top: 0 });
}
function init() {
  $("tabs").innerHTML = VIEWS.map(([k, n]) => `<button id="t-${k}" role="tab">${n}</button>`).join("");
  VIEWS.forEach(([k]) => $("t-" + k).onclick = () => show(k));
  renderMethod(); renderRead(); renderRestr(); renderDict(); renderQuiz(); renderTables(); renderExam();
  document.querySelectorAll('a.cell').forEach(a => a.onclick = e => { e.preventDefault(); document.querySelector(a.getAttribute("href")).scrollIntoView({ behavior: "smooth" }); });
  const v = store("ex-view");
  show(VIEWS.some(x => x[0] === v) ? v : "method");
}
init();
