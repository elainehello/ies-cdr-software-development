<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entidad/Relación · Ejercicios resueltos</title>
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --soft:#eff6ff;
  --bg:#f8fafc; --card:#ffffff; --card2:#f8fafc; --ink:#0f172a; --muted:#475569;
  --border:#e2e8f0; --track:#e2e8f0;
  --ok-bg:#dcfce7; --ok:#15803d; --bad-bg:#fee2e2; --bad:#b91c1c;
  --ent:#ffffff; --entStroke:#1e293b; --rel:#fef3c7; --relStroke:#92400e;
  --card-label:#c2410c; --q:#7c3aed; --hier:#0f766e;
  --radius:12px; --shadow:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -2px rgba(0,0,0,.04);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --primary:#60a5fa; --primary-dark:#3b82f6; --soft:#1e293b;
    --bg:#0b1220; --card:#111827; --card2:#0f172a; --ink:#e2e8f0; --muted:#94a3b8;
    --border:#1f2937; --track:#1f2937;
    --ok-bg:#14532d; --ok:#bbf7d0; --bad-bg:#7f1d1d; --bad:#fecaca;
    --ent:#0f172a; --entStroke:#cbd5e1; --rel:#3b2a0a; --relStroke:#fbbf24;
    --card-label:#fb923c; --q:#c4b5fd; --hier:#5eead4;
    --shadow:0 10px 20px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:20px 16px 48px;display:flex;justify-content:center}
.wrap{width:100%;max-width:1100px}
header{text-align:center;margin-bottom:16px}
h1{font-size:1.7rem;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:.95rem}
h2{font-size:1.2rem;margin:4px 0 10px}
h3{font-size:1rem;margin:18px 0 8px}
p,li{line-height:1.6}
ul,ol{padding-left:22px}
code,.mono{font-family:var(--mono);font-size:.88em}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--track);padding:4px;border-radius:10px;margin-bottom:16px}
.tab{border:none!important;background:transparent!important;padding:10px;font-weight:600;color:var(--muted)}
.tab.active{background:var(--card)!important;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.view[hidden]{display:none}

button,select{padding:9px 13px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
button:hover,select:hover{border-color:var(--primary)}
button:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ok{background:var(--ok-bg);color:var(--ok);font-weight:600}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.muted{color:var(--muted)}

/* exercise picker */
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pick{min-width:44px;padding:8px 10px;font-weight:600}
.pick.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pick.done{border-color:var(--ok);}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ex-head h2{margin:0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--primary)}

details.enun{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--card2)}
details.enun summary{cursor:pointer;font-weight:600}
details.enun .txt{white-space:pre-line;margin-top:8px;line-height:1.6}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.toolbar .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.switch input{width:16px;height:16px;accent-color:var(--primary)}

.diagram{border:1px solid var(--border);border-radius:10px;background:var(--card2);overflow:auto;-webkit-overflow-scrolling:touch}
.diagram svg{display:block;width:100%;height:auto}
.diagram.zoom svg{width:auto;max-width:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}

/* svg */
.e-box{fill:var(--ent);stroke:var(--entStroke);stroke-width:1.6}
.e-name{font:700 12.5px -apple-system,Segoe UI,Roboto,Arial,sans-serif;fill:var(--ink)}
.e-attr{font:11px -apple-system,Segoe UI,Roboto,Arial,sans-serif;fill:var(--muted)}
.e-attr.pk{fill:var(--ink);font-weight:600}
.r-box{fill:var(--rel);stroke:var(--relStroke);stroke-width:1.6}
.r-name{font:700 11.5px -apple-system,Segoe UI,Roboto,Arial,sans-serif;fill:var(--ink)}
.r-type{font:700 10.5px var(--mono);fill:var(--relStroke)}
.edge{stroke:var(--entStroke);stroke-width:1.4;fill:none}
.card-lbl{font:700 11.5px var(--mono);fill:var(--card-label);paint-order:stroke;stroke:var(--card2);stroke-width:4px;stroke-linejoin:round}
.card-lbl.q{fill:var(--q)}
.role-lbl{font:italic 10.5px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--card2);stroke-width:4px}
.r-attr{font:11px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--card2);stroke-width:3px}
.r-attr.pk{text-decoration:underline;fill:var(--ink)}
.a-dot{fill:var(--card2);stroke:var(--entStroke);stroke-width:1.2}
.h-tri{fill:var(--card2);stroke:var(--hier);stroke-width:1.8}
.h-edge{stroke:var(--hier);stroke-width:1.6;fill:none}
.h-lbl{font:italic 10.5px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--hier);paint-order:stroke;stroke:var(--card2);stroke-width:3px}
.c-edge{stroke:var(--bad);stroke-width:1.4;stroke-dasharray:5 4;fill:none}
.c-lbl{font:italic 700 10.5px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--bad);paint-order:stroke;stroke:var(--card2);stroke-width:3px}

/* analysis */
.rels{display:grid;gap:10px}
.relcard{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card2)}
.relcard.ok{border-color:var(--ok);background:var(--ok-bg)}
.relcard.bad{border-color:var(--bad);background:var(--bad-bg)}
.relcard .t{font-weight:700}
.relcard .t .type{font-family:var(--mono);color:var(--relStroke);margin-left:6px}
.relcard ul{margin-top:6px}
.relcard .why{margin-top:6px;font-size:.92rem;color:var(--muted)}
.pr-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;font-size:.9rem}
.pr-row label{display:inline-flex;gap:6px;align-items:center}
.pr-row select{padding:5px 8px;font-family:var(--mono)}
.score{font-weight:700}

.notes{margin-top:10px;padding:10px 14px;border-left:4px solid var(--card-label);background:var(--card2);border-radius:6px}
.notes li{margin:2px 0}

/* relational */
.rschema{font-family:var(--mono);font-size:.9rem;line-height:1.9}
.rschema .tbl{margin-bottom:6px}
.rschema .tn{font-weight:700}
.rschema .pk{text-decoration:underline;font-weight:700}
.rschema .fk{font-style:italic;color:var(--primary)}
.rschema .uq{font-weight:700}
.rschema .fkl{color:var(--muted);font-size:.85em;padding-left:18px}
pre.sql{font-family:var(--mono);font-size:.82rem;line-height:1.5;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;white-space:pre;max-height:460px}
details.sec{margin-top:14px}
details.sec>summary{cursor:pointer;font-weight:700;font-size:1rem;padding:6px 0}

/* guide */
.guide h3{color:var(--primary)}
.rule{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card2);margin:8px 0}
.rule b{color:var(--card-label)}
table.tb{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
table.tb th,table.tb td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
table.tb th{background:var(--card2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}

@media (max-width:700px){
  .panel{padding:16px 14px}
  .grid2{grid-template-columns:1fr}
  h1{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Modelo Entidad/Relación → Modelo Relacional</h1>
  <p class="subtitle">Temas 2 y 3 · Los 18 ejercicios resueltos con diagrama, cardinalidades, paso a tablas y SQL</p>
</header>

<div class="tabs" role="tablist">
  <button class="tab active" id="tab-ex" role="tab" aria-selected="true">Ejercicios</button>
  <button class="tab" id="tab-guide" role="tab" aria-selected="false">Guía: notación y método</button>
</div>

<section class="view" id="view-ex">
  <div class="picker" id="picker" aria-label="Elegir ejercicio"></div>
  <div class="panel" id="ex-panel"></div>
</section>

<section class="view guide" id="view-guide" hidden></section>
</div>

<script>
// =====================================================================
//  EJERCICIOS DEL TEMA 2 (los mismos se pasan a tablas en el Tema 3)
//  Atributos: #id = identificador · x* = opcional (0,1) · x+ = multivaluado · x! = identificador alternativo
//  Cardinalidad ca va junto a la entidad a, cb junto a b:
//  (mín,máx) junto a X = cuántos X se relacionan con UN ejemplar de la otra entidad.
// =====================================================================
const EXERCISES = [
{
 id: 1, page: 52, title: "Red de metro", tags: ["1:N", "N:M", "atributo en interrelación"],
 text: `Se desea diseñar una base de datos que almacene información sobre la red del metro.
Además se tendrán en cuenta los siguientes supuestos semánticos:
a.- Los trenes están asignados a una línea determinada.
b.- Cada tren se guarda en una cochera determinada.
c.- En una línea cada estación tiene un número de orden.`,
 ents: [
  { id: "COCHERA", x: 120, y: 70, attrs: ["#cod_cochera", "direccion"] },
  { id: "TREN", x: 120, y: 330, attrs: ["#cod_tren", "modelo", "fecha_compra"] },
  { id: "LINEA", label: "LÍNEA", x: 520, y: 330, attrs: ["#cod_linea", "nombre", "color"] },
  { id: "ESTACION", label: "ESTACIÓN", x: 520, y: 70, attrs: ["#cod_estacion", "nombre", "direccion"] }
 ],
 rels: [
  { n: "Guarda", a: "COCHERA", b: "TREN", ca: "(1,1)", cb: "(0,n)", x: 120, y: 200,
    why: "«Cada tren se guarda en <b>una cochera determinada</b>» → junto a COCHERA va (1,1). Una cochera puede guardar varios trenes y podría estar vacía → (0,n) junto a TREN." },
  { n: "Asignado", a: "LINEA", b: "TREN", ca: "(1,1)", cb: "(1,n)", x: 320, y: 330,
    why: "«Los trenes están asignados a <b>una línea determinada</b>» → (1,1) junto a LÍNEA. Una línea en servicio tiene al menos un tren → (1,n) junto a TREN." },
  { n: "Pertenece", a: "LINEA", b: "ESTACION", ca: "(1,n)", cb: "(1,n)", x: 520, y: 200, attrs: ["num_orden"], ap: "r",
    why: "Una línea tiene muchas estaciones y una estación de correspondencia está en varias líneas → N:M. El <b>número de orden</b> no es de la estación ni de la línea, sino de la pareja (línea, estación): la estación Sol puede ser la 5ª en una línea y la 12ª en otra. Por eso es atributo de la interrelación." }
 ],
 notes: [
  "Si el profesor dice que cada estación pertenece a una sola línea, Pertenece pasaría a ser 1:N y num_orden se iría a la tabla ESTACION.",
  "Los atributos (modelo, color…) no los da el enunciado: son ejemplos razonables. En el examen basta con el identificador y los que pida el texto."
 ]
},
{
 id: 2, page: 52, title: "Municipios y viviendas", tags: ["1:N", "N:M", "reflexiva", "dos relaciones entre las mismas entidades"],
 text: `Queremos tener información de municipios, viviendas y personas. Las viviendas se encuentran en un solo municipio, pero pueden existir municipios sin viviendas.
Toda persona está empadronada en un municipio y vive en una vivienda.
Cada persona sólo puede habitar en una vivienda pero puede ser propietaria de más de una vivienda.
Nos interesa conocer las personas que dependen del cabeza de familia (observar que éste a su vez es una persona).
Elaborar:
· Diagrama Entidad/Relación
· Esquema de las tablas que se generarán, indicando los campos clave.`,
 ents: [
  { id: "MUNICIPIO", x: 120, y: 80, attrs: ["#cod_municipio", "nombre", "provincia"] },
  { id: "VIVIENDA", x: 600, y: 80, attrs: ["#cod_vivienda", "direccion"] },
  { id: "PERSONA", x: 360, y: 360, attrs: ["#dni", "nombre", "apellidos"] }
 ],
 rels: [
  { n: "Situada", a: "MUNICIPIO", b: "VIVIENDA", ca: "(1,1)", cb: "(0,n)", x: 360, y: 80,
    why: "«Las viviendas se encuentran en <b>un solo municipio</b>» → (1,1) junto a MUNICIPIO. «Pueden existir municipios <b>sin viviendas</b>» → mínimo 0: (0,n) junto a VIVIENDA." },
  { n: "Empadronada", a: "MUNICIPIO", b: "PERSONA", ca: "(1,1)", cb: "(0,n)", x: 150, y: 250,
    why: "«<b>Toda</b> persona está empadronada en <b>un</b> municipio» → (1,1) junto a MUNICIPIO. Un municipio sin viviendas no tendrá habitantes → (0,n) junto a PERSONA." },
  { n: "Habita", a: "VIVIENDA", b: "PERSONA", ca: "(1,1)", cb: "(0,n)", x: 430, y: 215,
    why: "«Cada persona <b>sólo puede habitar en una vivienda</b>» y «toda persona vive en una vivienda» → (1,1) junto a VIVIENDA. Una vivienda puede estar vacía o tener varios habitantes → (0,n)." },
  { n: "Posee", a: "PERSONA", b: "VIVIENDA", ca: "(1,n)", cb: "(0,n)", x: 600, y: 250, ap: "r",
    why: "«Puede ser propietaria de <b>más de una</b> vivienda» → (0,n) junto a VIVIENDA (puede no tener ninguna). Una vivienda tiene al menos un propietario y puede tener varios (copropiedad) → (1,n) junto a PERSONA. Resultado N:M." },
  { n: "Depende", a: "PERSONA", b: "PERSONA", ca: "(0,1)", cb: "(0,n)", roleA: "cabeza", roleB: "dependiente", x: 360, y: 540,
    why: "Interrelación <b>reflexiva</b>: el cabeza de familia también es una PERSONA. Cada persona depende de ninguno o un cabeza (el propio cabeza no depende de nadie) → (0,1) en el rol cabeza. Un cabeza tiene varios dependientes → (0,n)." }
 ],
 notes: [
  "Habita y Posee unen las mismas dos entidades pero significan cosas distintas: hay que dibujar <b>dos rombos</b>.",
  "Si se supone que cada vivienda tiene un único propietario, Posee sería 1:N: (1,1) junto a PERSONA y la clave del propietario iría a VIVIENDA.",
  "En la tabla PERSONA, dni_cabeza admite nulos porque el mínimo es 0."
 ]
},
{
 id: 3, page: 52, title: "En la Ópera", tags: ["1:1", "1:N", "N:M", "dos relaciones entre las mismas entidades"],
 text: `a.- Una Orquesta puede interpretar varios conciertos.
b.- La orquesta tiene un director titular pero puede contar con directores invitados.
c.- En un mismo concierto puede interpretarse varias obras y las pueden interpretar varios solistas.
d.- Un solista puede participar en varios conciertos.
e.- Cada obra es escrita por un solo compositor.
f.- En una obra pueden participar varios solistas.
Construir el modelo E/R relacionado con el ejercicio suponiendo que la información se pretende almacenar en una base de datos.`,
 ents: [
  { id: "DIRECTOR", x: 110, y: 90, attrs: ["#cod_director", "nombre"] },
  { id: "ORQUESTA", x: 430, y: 90, attrs: ["#cod_orquesta", "nombre"] },
  { id: "COMPOSITOR", x: 760, y: 90, attrs: ["#cod_compositor", "nombre"] },
  { id: "CONCIERTO", x: 430, y: 340, attrs: ["#cod_concierto", "fecha", "lugar"] },
  { id: "OBRA", x: 760, y: 340, attrs: ["#cod_obra", "titulo"] },
  { id: "SOLISTA", x: 760, y: 580, attrs: ["#cod_solista", "nombre", "instrumento"] }
 ],
 rels: [
  { n: "Titular", a: "DIRECTOR", b: "ORQUESTA", ca: "(1,1)", cb: "(0,1)", x: 270, y: 45, fkIn: "ORQUESTA", rename: { cod_director: "cod_director_titular" },
    why: "«La orquesta tiene <b>un</b> director titular» → (1,1) junto a DIRECTOR. Un director es titular de una orquesta como mucho (y los invitados no lo son de ninguna) → (0,1) junto a ORQUESTA. Es 1:1: la clave del director pasa a ORQUESTA." },
  { n: "Invitado", a: "DIRECTOR", b: "ORQUESTA", ca: "(0,n)", cb: "(0,n)", x: 270, y: 150,
    why: "«Puede contar con directores invitados» → (0,n) junto a DIRECTOR (puede no tener). Un director puede ser invitado por varias orquestas → (0,n). N:M." },
  { n: "Interpreta", a: "ORQUESTA", b: "CONCIERTO", ca: "(1,1)", cb: "(0,n)", x: 430, y: 215,
    why: "«Una orquesta puede interpretar <b>varios</b> conciertos» → (0,n) junto a CONCIERTO. Cada concierto lo da una orquesta → (1,1)." },
  { n: "Escribe", a: "COMPOSITOR", b: "OBRA", ca: "(1,1)", cb: "(1,n)", x: 760, y: 215,
    why: "«Cada obra es escrita por <b>un solo</b> compositor» → (1,1) junto a COMPOSITOR. Un compositor guardado ha escrito al menos una obra → (1,n)." },
  { n: "Incluye", a: "CONCIERTO", b: "OBRA", ca: "(0,n)", cb: "(1,n)", x: 595, y: 340,
    why: "«En un mismo concierto pueden interpretarse <b>varias obras</b>» → (1,n) junto a OBRA. Una obra puede tocarse en varios conciertos o en ninguno todavía → (0,n). N:M." },
  { n: "Participa", a: "SOLISTA", b: "CONCIERTO", ca: "(0,n)", cb: "(1,n)", x: 560, y: 470,
    why: "«Un solista puede participar en <b>varios</b> conciertos» → (1,n) junto a CONCIERTO. Un concierto puede tener varios solistas o ninguno → (0,n). N:M." },
  { n: "Interviene", a: "SOLISTA", b: "OBRA", ca: "(0,n)", cb: "(1,n)", x: 760, y: 460, ap: "r",
    why: "«En una obra pueden participar <b>varios</b> solistas» → (0,n) junto a SOLISTA. Un solista interpreta varias obras → (1,n). N:M." }
 ],
 notes: [
  "Alternativa más precisa: una interrelación <b>ternaria</b> CONCIERTO–OBRA–SOLISTA si hace falta saber qué solista tocó qué obra en qué concierto. Con tres binarias no se puede deducir.",
  "Titular e Invitado unen las mismas entidades: son dos rombos distintos."
 ]
},
{
 id: 4, page: 53, title: "Compañía aérea", tags: ["entidad débil (ID)", "jerarquía", "N:M"],
 text: `a.- En una compañía aérea los pasajeros reservan plazas para las partidas. Una partida es un número de vuelo y una fecha.
b.- Un mismo vuelo puede tener lugar en diferentes fechas.
c.- Las aeronaves se encuadran en grupos según el tipo de avión.
d.- Un mismo piloto es capaz de tripular diversos tipos de aviones.
e.- Los empleados de la compañía pueden formar parte de la tripulación de diferentes partidas.
f.- Un piloto es un empleado más de la compañía.`,
 ents: [
  { id: "VUELO", x: 110, y: 80, attrs: ["#num_vuelo", "origen", "destino"] },
  { id: "PARTIDA", x: 110, y: 320, weak: true, attrs: ["#fecha"] },
  { id: "PASAJERO", x: 110, y: 560, attrs: ["#dni", "nombre"] },
  { id: "AERONAVE", x: 450, y: 320, attrs: ["#matricula"] },
  { id: "TIPO_AVION", label: "TIPO_AVIÓN", x: 790, y: 320, attrs: ["#cod_tipo", "modelo", "plazas"] },
  { id: "EMPLEADO", x: 450, y: 560, attrs: ["#cod_empleado", "nombre", "puesto"] },
  { id: "PILOTO", x: 790, y: 720, attrs: ["num_licencia"] }
 ],
 rels: [
  { n: "Tiene", a: "VUELO", b: "PARTIDA", ca: "(1,1)", cb: "(1,n)", dep: "ID", x: 110, y: 200,
    why: "«Una partida es <b>un número de vuelo y una fecha</b>»: la fecha sola no identifica una partida, necesita el número de vuelo → PARTIDA es <b>débil por identificación (ID)</b>. «Un mismo vuelo puede tener lugar en diferentes fechas» → (1,n) junto a PARTIDA." },
  { n: "Reserva", a: "PASAJERO", b: "PARTIDA", ca: "(0,n)", cb: "(1,n)", x: 110, y: 440, attrs: ["num_plaza"], ap: "r",
    why: "Un pasajero reserva plaza en una o varias partidas → (1,n) junto a PARTIDA. Una partida tiene muchos pasajeros o ninguno → (0,n). N:M; la plaza depende de la pareja (pasajero, partida)." },

a.- En la farmacia se requiere una catalogación de todos los medicamentos existentes, para lo cual se almacenará un código de medicamento, nombre del medicamento, tipo de medicamento (jarabe, comprimido, pomada, etc), unidades en stock, unidades vendidas y precio. Existen medicamentos de venta libre y otros que solo pueden dispensarse con receta médica.
b.- La farmacia compra cada medicamento a un laboratorio, o bien los fabrica ella misma. Se desea conocer el código del laboratorio, nombre, teléfono, dirección y fax, así como el nombre de la persona de contacto.

 id: 15, page: 61, title: "Cursos de formación", tags: ["reflexiva N:M", "débil (ID)", "restricción de exclusión"],
 text: `El departamento de formación de una empresa desea construir una base de datos para planificar y gestionar la formación de sus empleados.
La empresa organiza cursos internos de formación de los que desea conocer el código de curso, el nombre, descripción, duración y coste.
Un curso puede tener como prerrequisito haber realizado otro(s) previamente, y, a su vez la realización de un curso puede ser prerrequisito de otros. Un curso que es un prerrequisito de otro puede serlo de forma obligatoria o solo recomendable.
Un mismo curso tiene diferentes ediciones, es decir, se imparte en diferentes lugares, fechas y con diferentes horarios (intensivo, de mañana o de tarde). En una misma fecha de inicio solo puede impartirse una edición de un curso.
Los cursos se imparten por personal de la propia empresa.
De los empleados se desea almacenar su código de empleado, nombre y apellidos, dirección, teléfono, NIF, fecha de nacimiento, nacionalidad, sexo, firma y salario, así como si está capacitado para impartir cursos.

 id: 16, page: 62, title: "Campeonato de ajedrez", tags: ["jerarquía", "(2,2)", "débiles (ID)", "reflexiva", "multivaluados"],
 text: `El club de Ajedrez de Villatortas de Arriba ha sido encargado por la Federación Internacional de Ajedrez de la organización de los próximos campeonatos mundiales que se celebrarán en la citada localidad. Por este motivo, se desea llevar a una base de datos toda la gestión relativa a participantes, alojamientos y partidas. Teniendo en cuenta que:
a.- En el campeonato participan jugadores y árbitros; de ambos se quiere conocer el número de asociado, nombre, dirección, teléfono y campeonatos en los que ha participado (como jugador o como árbitro). De los jugadores se precisa además el nivel de juego en una escala de 1 a 10.
b.- Ningún árbitro puede participar como jugador.
c.- Los países envían al campeonato un conjunto de jugadores y árbitros, aunque no todos los países envían participantes. Todo jugador y árbitro es enviado por un único país. Un país puede ser representado por otro país.
d.- Cada país se identifica por un número correlativo según su orden alfabético e interesa conocer además de su nombre, el número de clubes de ajedrez existentes en el mismo.
e.- Cada partida se identifica por un número correlativo (Cód_P), la juegan dos jugadores y la arbitra un árbitro. Interesa registrar las partidas que juega cada jugador y el color (blancas o negras) con el que juega. Ha de tenerse en cuenta que un árbitro no puede arbitrar a jugadores enviados por el mismo país que le ha enviado a él.
f.- Todo participante participa en al menos una partida.
g.- Tanto jugadores como árbitros se alojan en uno de los hoteles en los que se desarrollan las partidas; se desea conocer en qué hotel y en qué fechas se ha alojado cada uno de los participantes. Los participantes pueden no permanecer en Villatortas durante todo el campeonato, sino acudir cuando tienen que jugar alguna partida, alojándose en el mismo o distinto hotel. De cada hotel, se desea conocer el nombre, la dirección y el teléfono.
h.- El campeonato se desarrolla a lo largo de una serie de jornadas (día, mes, año) y cada partida tiene lugar en una de las jornadas aunque no tengan lugar partidas todas las jornadas.
i.- Cada partida se celebra en una de las salas de las que pueden disponer los hoteles; se desea conocer el número de entradas vendidas en la sala para cada partida. De cada sala, se desea conocer la capacidad y medios de que dispone (radio, televisión, video...) para facilitar la retransmisión de los encuentros. Una sala puede disponer de varios medios distintos.
j.- De cada partida se pretende registrar todos los movimientos que la componen; la identificación de movimiento se establece en base a un número de orden dentro de cada partida: para cada movimiento se guardan la jugada (5 posiciones) y un breve comentario realizado por un experto.`,

 id: 17, page: 63, title: "Energía eléctrica", tags: ["jerarquía de 4 subtipos", "ternaria", "reflexiva N:M", "(2,n)"],
 text: `Se pretende llevar a cabo un control sobre la energía eléctrica que se produce y consume en un determinado país. Se parte de las siguientes hipótesis:
a.- Existen productores básicos de electricidad que se identifican por un nombre, de los cuales interesa su producción media, su producción máxima y fecha de entrada en funcionamiento. Estos productores básicos lo son de una de las siguientes categorías: Hidroeléctrica, Solar, Nuclear o Térmica. De una central hidroeléctrica o presa nos interesa saber su ocupación, capacidad máxima y número de turbinas. De una central solar nos interesa saber la superficie total de paneles solares, la media anual de horas de sol y tipo (fotovoltaica o termodinámica). De una central nuclear, nos interesa saber el número de reactores que posee, el volumen de plutonio consumido y el de residuos nucleares que produce. De una central térmica, nos interesa saber el número de hornos que posee, el volumen de carbón consumido y el volumen de su emisión de gases.
b.- Por motivos de seguridad nacional interesa controlar el plutonio de que se provee una central nuclear; este control se refiere a la cantidad de plutonio que compra a cada uno de sus posibles suministradores (nombre y país) y que porta un determinado transportista (nombre y matrícula); ha de tenerse en cuenta que el mismo suministrador puede vender plutonio a distintas centrales nucleares y que cada porte (un único porte por compra) puede realizarlo un transportista diferente.
c.- Cada día, los productores entregan la energía producida a una o varias estaciones primarias, las cuales pueden recibir diariamente una cantidad distinta de energía de cada uno de estos productores. Los productores entregan siempre el total de su producción. Las estaciones primarias se identifican por su nombre y tienen un número de transformadores de baja a alta tensión y son cabecera de una a varias redes de distribución.
d.- Una red de distribución se identifica por un número de red y solo puede tener una estación primaria como cabecera. La propiedad de una red puede ser compartida por varias compañías eléctricas; a cada compañía eléctrica se la identifica por su nombre.
e.- La energía sobrante en una de las redes puede enviarse a otra red. Se registra el volumen total de energía intercambiada entre dos redes.
f.- Una red está compuesta por una serie de líneas; cada línea se identifica por un número secuencial dentro del número de red y tiene una determinada longitud. La menor de las líneas posibles abastecerá al menos a dos subestaciones.
g.- Una subestación es abastecida solo por una línea y distribuye a una o varias zonas de servicio; a tales efectos, las provincias (código y nombre) se encuentran divididas en tales zonas de servicio, aunque no puede haber zonas de servicio que pertenezcan a más de una provincia. Cada zona de servicio puede ser atendida por más de una subestación.
h.- En cada zona de servicio se desea registrar el consumo medio y el número de consumidores finales de cada una de las siguientes categorías: particulares, empresas e instituciones.`,

 id: 18, page: 64, title: "Conflictos bélicos", tags: ["jerarquía solapada", "ternaria", "débiles (ID)", "(2,n) (1,3)"],
 text: `Una organización internacional pretende realizar un seguimiento de los conflictos bélicos que se producen en todo el mundo. Para ello creará una base de datos que responderá al siguiente análisis:
a.- Se entiende por conflicto cualquier lucha armada que afecte a uno o varios países y en la cual se produzcan muertos y/o heridos. Todo conflicto se identificará por un nombre que habitualmente hará referencia a la zona o causa que provoca el conflicto, aunque dado que este nombre puede cambiar con el paso del tiempo, dentro de la base de datos cada conflicto se identificará mediante un código numérico sin significado alguno. Para cada conflicto se desea recoger los países a que afecta, así como el número de muertos y heridos contabilizados hasta el momento.
b.- Los conflictos pueden ser de distintos tipos según la causa que los ha originado, clasificándose, a lo sumo, en cuatro grupos: territoriales, religiosos, económicos o raciales; en cada uno de estos grupos se recogerán diversos datos. En los conflictos territoriales se recogerán las regiones afectadas, en los religiosos las religiones afectadas, en los económicos las materias primas disputadas y en los raciales las etnias enfrentadas.
c.- En los conflictos intervienen diversos grupos armados (al menos dos) y diversas organizaciones mediadoras (podría no haber ninguna). Los mismos grupos armados y organizaciones mediadoras pueden intervenir en diferentes conflictos. Tanto los grupos armados como las organizaciones mediadoras podrán entrar y salir del conflicto; en ambos casos se recogerá tanto la fecha de incorporación como la fecha de salida. Temporalmente, tanto un grupo armado como una organización mediadora podrían no intervenir en conflicto alguno.
d.- De cada grupo armado se recoge el código que se le asigna y un nombre. Cada grupo armado dispone de al menos una división y es liderado al menos por un líder político. Las divisiones de que dispone un grupo armado se numeran consecutivamente y se registra el número de barcos, tanques, aviones y hombres de que dispone; asimismo se recoge el número de bajas que ha tenido. Para los grupos armados se recoge el número de bajas como suma de las bajas producidas en todas sus divisiones.
e.- Los traficantes de armas suministran diferentes tipos de arma a los grupos armados. De cada tipo de armas se recoge un nombre y un indicador de su capacidad destructiva. De cada traficante se recoge su nombre, los diferentes tipos de arma que puede suministrar y cantidad de armas de cada uno de los tipos de arma que podría suministrar. Se mantiene el número total de armas de cada uno de los diferentes tipos de armas suministrado por cada traficante a cada grupo armado.
f.- Los líderes políticos se identifican por su nombre y por el código de grupo armado que lideran. Además se recoge una descripción textual de los apoyos que éste posee.
g.- Cada división la pueden dirigir conjuntamente un máximo de tres jefes militares, aunque cada jefe militar no dirige más de una división. A cada jefe militar se le identifica por un código, además se recoge el rango que éste posee, y dado que un jefe militar no actúa por iniciativa propia sino que siempre obedece las órdenes de un único líder político de entre aquellos que lideran el grupo armado al que el jefe pertenece, se registra el líder político al que obedece.
h.- De las organizaciones mediadoras se recogerá su código, su nombre, su tipo (gubernamental, no gubernamental o internacional), la organización de que depende (una como máximo), el número de personas que mantiene desplegadas en cada conflicto y el tipo de ayuda que presta en cada conflicto que será de uno y solo uno de los tres tipos siguientes: médica, diplomática o presencial.
i.- Con diversos fines, los líderes políticos dialogan con las organizaciones; se desea recoger explícitamente esta información. Así para cada líder se recogerán aquellas organizaciones con que dialoga y viceversa.`,

<script>
// =====================================================================
//  UTILIDADES

const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
function lsGet(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch (e) { return f; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function parseCard(s) {
    const m = String(s).match(/\(\s*(\d+)\s*,\s*([0-9nNmM*]+)\s*\)/);
    if (!m) return { min: 0, max: Infinity };
    return { min: +m[1], max: /^[nNmM*]$/.test(m[2]) ? Infinity : +m[2] };
}
function parseAttr(raw) {
    let n = raw, pk = false, nul = false, multi = false, uq = false;
    if (n.startsWith("#")) { pk = true; n = n.slice(1); }
    while (/[*+!]$/.test(n)) {
        const c = n.slice(-1);
        if (c === "*") nul = true; else if (c === "+") multi = true; else uq = true;
        n = n.slice(0, -1);
    }
    return { n, pk, nul, multi, uq };
}
function relType(rel) {
    if (rel.type) return rel.type;
    if (rel.ends) {
        const L = ["N", "M", "P"]; let i = 0;
        return rel.ends.map(e => parseCard(e.c).max > 1 ? L[i++] : "1").join(":");
    }
    const A = parseCard(rel.ca).max > 1, B = parseCard(rel.cb).max > 1;
    if (A && B) return "N:M";
    return (A ? "N" : "1") + ":" + (B ? "N" : "1");
}
function describe(c) {
    const { min, max } = parseCard(c);
    if (min === 0 && max === 1) return "0 o 1";
    if (min === 1 && max === 1) return "exactamente 1";
    if (min === 0 && max === Infinity) return "0 o varios";
    if (min === 1 && max === Infinity) return "1 o varios";
    if (max === Infinity) return `al menos ${min}`;
    if (min === max) return `exactamente ${min}`;
    return `entre ${min} y ${max}`;
}

// =====================================================================
//  RENDER DEL DIAGRAMA E/R (SVG)
// =====================================================================
function textW(s, px) { return String(s).length * px * 0.58; }
const _cv = document.createElement("canvas").getContext("2d");
function measure(s, font) { _cv.font = font; return _cv.measureText(String(s)).width; }

function attrLabel(a) {
    let s = a.n;
    if (a.multi) s += " (1,n)";
    else if (a.nul) s += " (0,1)";
    if (a.uq) s += " · IA";
    return s;
}

function entGeom(e, mode) {
    const attrs = (e.attrs || []).map(parseAttr);
    const shown = mode === "all" ? attrs : mode === "keys" ? attrs.filter(a => a.pk) : [];
    const label = e.label || e.id;
    let w = Math.max(textW(label, 12.5) + 26, 92);
    shown.forEach(a => { w = Math.max(w, textW(attrLabel(a), 11) + 24); });

}
function relGeom(r) {

// intersección de la recta centro->(tx,ty) con el borde del rectángulo
function rectBorder(g, tx, ty) {
    const dx = tx - g.x, dy = ty - g.y;
    if (!dx && !dy) return { x: g.x, y: g.y };
    const sx = (g.w / 2) / Math.abs(dx || 1e-9), sy = (g.h / 2) / Math.abs(dy || 1e-9);
    const s = Math.min(sx, sy);
    return { x: g.x + dx * s, y: g.y + dy * s };
}
function diamondBorder(g, tx, ty) {
    const dx = tx - g.x, dy = ty - g.y;
    const t = 1 / (Math.abs(dx) / (g.w / 2) + Math.abs(dy) / (g.h / 2));
    return { x: g.x + dx * t, y: g.y + dy * t };
}

// ¿la etiqueta centrada en (lx, ly-baseline) pisa la caja de la entidad?
function hitsBox(g, lx, ly, s) {
    const w = textW(s, 11.5) / 2 + 3;

            const ty = y0 + 34 + i * 13.5;
            txt(gShapes, x0 + 12, ty, attrLabel(a), "e-attr" + (a.pk ? " pk" : ""), "start");
            if (a.pk) el("line", { x1: x0 + 12, y1: ty + 2.5, x2: x0 + 12 + measure(a.n, "600 11px -apple-system, Segoe UI, Roboto, Arial, sans-serif"), y2: ty + 2.5, "stroke-width": 1, style: "stroke:var(--ink)" }, gShapes);
        });
        grow(x0, y0, x0 + g.w, y0 + g.h);
    });

    function cardLabel(entG, from, txtS, isQ, role) {
        // from = punto del rombo; etiqueta junto a la entidad
        const p = rectBorder(entG, from.x, from.y);
        let ux = from.x - p.x, uy = from.y - p.y;
        const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
        const nx = -uy, ny = ux;
        let along = 17, lx, ly;
        do {
            lx = p.x + ux * along + nx * 13; ly = p.y + uy * along + ny * 13 + 4;
            along += 3;
        } while (hitsBox(entG, lx, ly, txtS) && along < 60);
        txt(gLabels, lx, ly, txtS, "card-lbl" + (isQ ? " q" : ""));
        grow(lx - 22, ly - 12, lx + 22, ly + 4);
        if (role) {
            const rx = p.x + ux * 17 - nx * 14, ry = p.y + uy * 17 - ny * 14 + 4;
            txt(gLabels, rx, ry, role, "role-lbl");
            grow(rx - 30, ry - 12, rx + 30, ry + 4);
        }
    }

    function drawRelAttrs(r, g, ents) {
        const attrs = (r.attrs || []).map(parseAttr);
        if (!attrs.length) return;
        let pos = r.ap;
        if (!pos) {
            const vertical = ents.some(eg => Math.abs(eg.y - g.y) > Math.abs(eg.x - g.x));
            pos = vertical ? "r" : "t";
        }
        attrs.forEach((a, i) => {
            const label = a.n + (a.nul ? " (0,1)" : "");
            let vx, vy, cx, cy, tx, ty, anchor;
            if (pos === "r" || pos === "l") {
                const s = pos === "r" ? 1 : -1;
                vx = g.x + s * g.w / 2; vy = g.y;
                cx = vx + s * 16; cy = g.y + (i - (attrs.length - 1) / 2) * 15;
                tx = cx + s * 7; ty = cy + 4; anchor = s > 0 ? "start" : "end";
            } else {
                const s = pos === "b" ? 1 : -1;
                vx = g.x; vy = g.y + s * g.h / 2;
                cx = g.x + 10; cy = vy + s * (14 + i * 15);
                tx = cx + 7; ty = cy + 4; anchor = "start";
            }
            el("line", { x1: vx, y1: vy, x2: cx, y2: cy, class: "edge" }, gEdges);
            el("circle", { cx, cy, r: 3.6, class: "a-dot" }, gShapes);
            const t = txt(gLabels, tx, ty, label, "r-attr" + (a.pk ? " pk" : ""), anchor);
            if (a.pk) t.setAttribute("text-decoration", "underline");
            const w = textW(label, 11);
            grow(anchor === "end" ? tx - w : tx, ty - 11, anchor === "end" ? tx : tx + w, ty + 3);
        });
    }

    // --- interrelaciones
    const RG = {};
    ex.rels.forEach((r, ri) => {
        const g = relGeom(r); RG[r.n] = g;
        const q = hidden(ri);
        const pts = `${g.x},${g.y - g.h / 2} ${g.x + g.w / 2},${g.y} ${g.x},${g.y + g.h / 2} ${g.x - g.w / 2},${g.y}`;
        el("polygon", { points: pts, class: "r-box" }, gShapes);
        txt(gShapes, g.x, g.y - 1, r.label || r.n, "r-name");
        const sub = (r.dep ? r.dep + " · " : "") + (q ? "?:?" : relType(r));
        txt(gShapes, g.x, g.y + 12, sub, "r-type");
        grow(g.x - g.w / 2, g.y - g.h / 2, g.x + g.w / 2, g.y + g.h / 2);

        const connected = [];
        if (r.ends) {
            r.ends.forEach(end => {
                const eg = EG[end.e]; connected.push(eg);
                const a = diamondBorder(g, eg.x, eg.y), b = rectBorder(eg, g.x, g.y);
                el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gEdges);
                cardLabel(eg, g, q ? "(?,?)" : end.c, q, end.role);
            });
        } else if (r.a === r.b) {
            const eg = EG[r.a]; connected.push(eg);
            let ux = g.x - eg.x, uy = g.y - eg.y; const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
            const nx = -uy * 22, ny = ux * 22;
            [[1, r.ca, r.roleA], [-1, r.cb, r.roleB]].forEach(([s, c, role]) => {
                const fake = { x: eg.x + nx * s, y: eg.y + ny * s, w: eg.w, h: eg.h };
                const target = { x: g.x + nx * s * 0.5, y: g.y + ny * s * 0.5 };
                const b = rectBorder(fake, target.x, target.y);
                const a = diamondBorder(g, b.x, b.y);
                el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gEdges);
                // etiqueta junto a la entidad, en la línea correspondiente
                let vx = a.x - b.x, vy = a.y - b.y; const l2 = Math.hypot(vx, vy) || 1; vx /= l2; vy /= l2;
                const lab = q ? "(?,?)" : c;
                let along = 18, lx, ly;
                do {
                    lx = b.x + vx * along + (-vy) * 12 * s; ly = b.y + vy * along + vx * 12 * s + 4;
                    along += 3;
                } while (hitsBox(eg, lx, ly, lab) && along < 60);
                txt(gLabels, lx, ly, lab, "card-lbl" + (q ? " q" : ""));
                grow(lx - 22, ly - 12, lx + 22, ly + 4);
                if (role) {
                    const vertical = Math.abs(vy) > Math.abs(vx);
                    const al = vertical ? along + 24 : along + 2, pp = vertical ? 14 : 28;
                    const rx = b.x + vx * al + (-vy) * pp * s, ry = b.y + vy * al + vx * pp * s + 4;
                    txt(gLabels, rx, ry, role, "role-lbl");
                    grow(rx - 34, ry - 12, rx + 34, ry + 4);
                }
            });
        } else {
            [[r.a, r.ca], [r.b, r.cb]].forEach(([id, c]) => {
                const eg = EG[id]; connected.push(eg);
                const a = diamondBorder(g, eg.x, eg.y), b = rectBorder(eg, g.x, g.y);
                el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gEdges);
                cardLabel(eg, g, q ? "(?,?)" : c, q, id === r.a ? r.roleA : r.roleB);
            });
        }
        drawRelAttrs(r, g, connected);
    });

    // --- jerarquías
    (ex.hier || []).forEach(h => {
        const sg = EG[h.sup];
        const up = h.dir === "up";
        const hx = h.x, hy = h.y;
        const baseY = up ? hy + 12 : hy - 12, apexY = up ? hy - 15 : hy + 15;
        el("polygon", { points: `${hx - 19},${baseY} ${hx + 19},${baseY} ${hx},${apexY}`, class: "h-tri" }, gShapes);
        const sp = rectBorder(sg, hx, baseY);
        el("line", { x1: sp.x, y1: sp.y, x2: hx, y2: baseY, class: "h-edge" }, gEdges);
        if (h.total) {
            const mx = (sp.x + hx) / 2, my = (sp.y + baseY) / 2;
            el("circle", { cx: mx, cy: my, r: 5, class: "h-tri" }, gShapes);
        }
        const angs = [];
        h.subs.forEach(id => {
            const eg = EG[id];
            const b = rectBorder(eg, hx, apexY);
            el("line", { x1: hx, y1: apexY, x2: b.x, y2: b.y, class: "h-edge" }, gEdges);
            angs.push(Math.atan2(b.y - apexY, b.x - hx));
        });
        if (h.excl && angs.length > 1) {
            const R = 26, a1 = Math.min(...angs), a2 = Math.max(...angs);
            const p1 = { x: hx + R * Math.cos(a1), y: apexY + R * Math.sin(a1) };
            const p2 = { x: hx + R * Math.cos(a2), y: apexY + R * Math.sin(a2) };
            el("path", { d: `M${p1.x},${p1.y} A${R},${R} 0 0 1 ${p2.x},${p2.y}`, class: "h-edge" }, gEdges);
        }
        const lab = h.label || ((h.total ? "total" : "parcial") + ", " + (h.excl ? "exclusiva" : "solapada"));
        txt(gLabels, hx + 26, hy + 4, lab, "h-lbl", "start");
        grow(hx - 30, hy - 30, hx + 30 + textW(lab, 10.5), hy + 30);
    });

    // --- restricciones entre interrelaciones
    (ex.cons || []).forEach(c => {
        const a = RG[c.a], b = RG[c.b];
        el("path", { d: `M${a.x + a.w / 2},${a.y} L${b.x - b.w / 2},${b.y}`, class: "c-edge" }, gEdges);
        txt(gLabels, (a.x + b.x) / 2, Math.min(a.y, b.y) - 28, c.label, "c-lbl");
    });

    const pad = 18;
    const vb = [bounds.x1 - pad, bounds.y1 - pad, bounds.x2 - bounds.x1 + pad * 2, bounds.y2 - bounds.y1 + pad * 2];
    svg.setAttribute("viewBox", vb.join(" "));
    svg.setAttribute("width", Math.round(vb[2]));
    svg.setAttribute("height", Math.round(vb[3]));
    return svg;
}

function sqlType(n) {
    n = n.toLowerCase();
    if (n === "dia_hora") return "DATETIME";
    if (/^hora/.test(n)) return "TIME";
    if (/^fecha|_fecha|^antiguedad/.test(n)) return "DATE";
    if (/precio|salario|coste|cuantia|fianza|senal|importe/.test(n)) return "DECIMAL(10,2)";
    if (/^(principal|puerta_grande|hipotecado|licencia_apertura|con_receta|obligatorio|exterior|titulacion|capacitado)$/.test(n)) return "BOOLEAN";
    if (/^(dni|nif)/.test(n)) return "CHAR(9)";
    if (/^nss/.test(n)) return "CHAR(12)";
    if (/^(num_|cod_|n_|anio|orejas|rabos|aforo|m2|stock|unidades|reactores|turbinas|hornos|habitaciones|banos|nivel|capacidad|entradas|muertos|heridos|bajas|barcos|tanques|aviones|hombres|personas|duracion|cantidad|volumen|vol_|prod_|horas_sol|superficie|ocupacion|consumo|longitud|orden_)/.test(n)) return "INT";
    if (/telefono|fax/.test(n)) return "VARCHAR(15)";
    if (/descripcion|comentario|apoyos|direccion|experiencia/.test(n)) return "VARCHAR(255)";
    return "VARCHAR(100)";
}

function buildSchema(ex) {
    const E = {}; ex.ents.forEach(e => { E[e.id] = e; });
    const superOf = {}; (ex.hier || []).forEach(h => h.subs.forEach(s => { superOf[s] = h.sup; }));
    const ownerOf = {}; ex.rels.forEach(r => { if (r.dep === "ID") ownerOf[r.b] = r.a; });

    const pkMemo = {};
    function pkCols(id) { // [{n, type}]
        if (pkMemo[id]) return pkMemo[id];
        let res;
        const own = (E[id].attrs || []).map(parseAttr).filter(a => a.pk && !a.multi).map(a => ({ n: a.n, type: sqlType(a.n) }));
        if (superOf[id]) res = pkCols(superOf[id]);
        else if (ownerOf[id]) res = pkCols(ownerOf[id]).concat(own);
        else res = own;
        pkMemo[id] = res;
        return res;
    }

    const T = {}; const order = [];
    function table(name, src) { if (!T[name]) { T[name] = { name, cols: [], fks: [], uniq: [], src }; order.push(name); } return T[name]; }
    function addCol(t, c) {
        if (t.cols.some(x => x.n === c.n)) return false;
        t.cols.push(c); return true;
    }
    function freeName(t, base, suffix) {
        if (!t.cols.some(c => c.n === base)) return base;
        let n = base + "_" + suffix; let i = 2;
        while (t.cols.some(c => c.n === n)) n = base + "_" + suffix + (i++);
        return n;
    }
    function addFK(t, refId, opts) {
        // opts: {pk, nul, rename, suffix, role, uniq}
        const ref = pkCols(refId);
        const names = ref.map(rc => {
            let n = (opts.rename && opts.rename[rc.n]) || (opts.role ? rc.n + "_" + opts.role : rc.n);
            n = freeName(t, n, opts.suffix || refId.toLowerCase());
            addCol(t, { n, type: rc.type, pk: !!opts.pk, nul: !!opts.nul, fk: true });
            return n;
        });
        const del = opts.pk ? "C" : opts.nul ? "N" : "R";
        t.fks.push({ cols: names, ref: refId, refcols: ref.map(r => r.n), del, upd: "C" });
        if (opts.uniq) t.uniq.push(names);
        return names;
    }

    // 1) entidades
    ex.ents.forEach(e => {
        const t = table(e.id, "entidad" + (e.weak ? " débil" : "") + (superOf[e.id] ? " (subtipo de " + superOf[e.id] + ")" : ""));
        if (superOf[e.id]) addFK(t, superOf[e.id], { pk: true });
        else if (ownerOf[e.id]) addFK(t, ownerOf[e.id], { pk: true });
        (e.attrs || []).map(parseAttr).forEach(a => {
            if (a.multi) return;
            addCol(t, { n: a.n, type: sqlType(a.n), pk: a.pk, nul: a.nul });
            if (a.uq) t.uniq.push([a.n]);
        });
    });
    // 2) atributos multivaluados
    ex.ents.forEach(e => {
        (e.attrs || []).map(parseAttr).filter(a => a.multi).forEach(a => {
            const t = table(e.id + "_" + a.n.toUpperCase(), "atributo multivaluado de " + e.id);
            addFK(t, e.id, { pk: true });
            addCol(t, { n: a.n, type: sqlType(a.n), pk: true });
        });
    });
    // 3) interrelaciones
    function relAttrs(t, r, forcePk, allNull) {
        (r.attrs || []).map(parseAttr).forEach(a => {
            addCol(t, { n: freeName(t, a.n, r.n.toLowerCase()), type: sqlType(a.n), pk: forcePk && a.pk, nul: a.nul || !!allNull });
        });
    }
    ex.rels.forEach(r => {
        if (r.dep === "ID") return;
        const tName = (r.table || r.n).toUpperCase();
        if (r.ends) {
            const t = table(tName, "interrelación ternaria " + r.n);
            const pkSet = r.pk || r.ends.map(e => e.e);
            r.ends.forEach(end => addFK(t, end.e, { pk: pkSet.includes(end.e), role: end.col, rename: end.rename }));
            relAttrs(t, r, true);
            return;
        }
        const A = parseCard(r.ca), B = parseCard(r.cb);
        if (r.a === r.b) {
            if (A.max > 1 && B.max > 1) {
                const t = table(tName, "interrelación reflexiva N:M " + r.n);
                addFK(t, r.a, { pk: true, role: r.roleA, suffix: r.roleA });
                addFK(t, r.a, { pk: true, role: r.roleB, suffix: r.roleB });
                relAttrs(t, r, true);
            } else {
                const t = T[r.a];
                addFK(t, r.a, { nul: A.min === 0 || r.nullable, role: r.roleA, suffix: r.roleA, uniq: B.max === 1 });
                relAttrs(t, r, false, A.min === 0 || r.nullable);
            }
            return;
        }
        if (A.max > 1 && B.max > 1) {
            const t = table(tName, "interrelación N:M " + r.n);
            addFK(t, r.a, { pk: true, rename: r.renameA || r.rename });
            addFK(t, r.b, { pk: true, rename: r.renameB || r.rename });
            relAttrs(t, r, true);
            return;
        }
        let inT, refId, refCard;
        if (A.max === 1 && B.max > 1) { inT = r.b; refId = r.a; refCard = A; }
        else if (B.max === 1 && A.max > 1) { inT = r.a; refId = r.b; refCard = B; }
        else { inT = r.fkIn || r.b; refId = inT === r.a ? r.b : r.a; refCard = inT === r.a ? B : A; }
        const t = T[inT];
        const oneToOne = A.max === 1 && B.max === 1;
        const nul = refCard.min === 0 || !!r.nullable;
        addFK(t, refId, { nul, rename: r.rename, suffix: r.n.toLowerCase(), uniq: oneToOne });
        relAttrs(t, r, false, nul);
    });
    // pk primero
    order.forEach(n => { const t = T[n]; t.cols.sort((a, b) => (b.pk ? 1 : 0) - (a.pk ? 1 : 0)); });
    return order.map(n => T[n]);
}

function schemaHTML(tables) {
    return tables.map(t => {
        const fkCols = new Set(t.fks.flatMap(f => f.cols));
        const uqCols = new Set(t.uniq.filter(u => u.length === 1).flat());
        const cols = t.cols.map(c => {
            let cls = []; if (c.pk) cls.push("pk"); if (fkCols.has(c.n)) cls.push("fk"); if (uqCols.has(c.n) && !c.pk) cls.push("uq");
            return `<span class="${cls.join(" ")}">${esc(c.n)}</span>${c.nul ? "*" : ""}`;
        }).join(", ");
        const fks = t.fks.map(f => `<div class="fkl">${esc(f.cols.join(", "))} → ${esc(f.ref)} &nbsp;(B:${f.del}, M:${f.upd})</div>`).join("");
        return `<div class="tbl"><span class="tn">${esc(t.name)}</span> (${cols})${fks}</div>`;
    }).join("");
}

function schemaSQL(tables, title) {
    const DEL = { C: "CASCADE", N: "SET NULL", R: "RESTRICT" };
    const created = new Set(); const out = []; const later = [];
    // orden: primero las tablas cuyas FK (no reflexivas) ya existen
    const pending = tables.slice();
    const ordered = [];
    let guard = 0;
    while (pending.length && guard++ < 500) {
        const i = pending.findIndex(t => t.fks.every(f => f.ref === t.name || created.has(f.ref)));
        const t = i >= 0 ? pending.splice(i, 1)[0] : pending.shift();
        ordered.push(t); created.add(t.name);
    }
    const done = new Set();
    ordered.forEach(t => {
        const lines = t.cols.map(c => `  ${c.n} ${c.type}${c.pk || !c.nul ? " NOT NULL" : ""}`);
        lines.push(`  PRIMARY KEY (${t.cols.filter(c => c.pk).map(c => c.n).join(", ")})`);
        t.uniq.forEach(u => lines.push(`  UNIQUE (${u.join(", ")})`));
        t.fks.forEach((f, k) => {
            const def = `CONSTRAINT fk_${t.name.toLowerCase()}_${k + 1} FOREIGN KEY (${f.cols.join(", ")}) REFERENCES ${f.ref} (${f.refcols.join(", ")}) ON DELETE ${DEL[f.del]} ON UPDATE CASCADE`;
            if (f.ref === t.name || done.has(f.ref)) lines.push("  " + def);
            else later.push(`ALTER TABLE ${t.name} ADD ${def};`);
        });
        out.push(`CREATE TABLE ${t.name} (\n${lines.join(",\n")}\n);`);
        done.add(t.name);
    });
    let sql = `-- ${title}\n-- Generado a partir del diagrama E/R (sintaxis MySQL / MariaDB)\n\n` + out.join("\n\n");
    if (later.length) sql += "\n\n-- Claves ajenas que forman un ciclo: se añaden al final\n" + later.join("\n");
    return sql + "\n";
}

function buildPicker() {
    const box = $("picker"); box.innerHTML = "";

        const b = document.createElement("button");

        b.textContent = ex.id + "º";

    });

function cardOptions(actual) {
    const base = ["(0,1)", "(1,1)", "(0,n)", "(1,n)"];
    if (!base.includes(actual)) base.push(actual);
    return base;
}

function renderExercise() {
    const ex = EXERCISES.find(e => e.id === STATE.ex) || EXERCISES[0];
    const P = $("ex-panel"); P.innerHTML = "";
    const L = {}; ex.ents.forEach(e => { L[e.id] = e.label || e.id; });

    const head = document.createElement("div"); head.className = "ex-head";
    head.innerHTML = `<div><h2>Ejercicio ${ex.id}º · ${esc(ex.title)}</h2><div class="badges">${(ex.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join("")}</div></div>`;
    const nav = document.createElement("div"); nav.style.cssText = "display:flex;gap:6px";
    const idx = EXERCISES.indexOf(ex);
    const prev = document.createElement("button"); prev.textContent = "← Anterior"; prev.disabled = idx === 0;
    const next = document.createElement("button"); next.textContent = "Siguiente →"; next.disabled = idx === EXERCISES.length - 1;
    prev.onclick = () => { STATE.ex = EXERCISES[idx - 1].id; lsSet("er-ex", STATE.ex); STATE.practice = false; STATE.revealed = new Set(); STATE.checked = {}; buildPicker(); renderExercise(); };
    next.onclick = () => { STATE.ex = EXERCISES[idx + 1].id; lsSet("er-ex", STATE.ex); STATE.practice = false; STATE.revealed = new Set(); STATE.checked = {}; buildPicker(); renderExercise(); };
    nav.append(prev, next); head.appendChild(nav);
    P.appendChild(head);

    const en = document.createElement("details"); en.className = "enun"; en.open = true;
    en.innerHTML = `<summary>Enunciado (Tema 2, pág. ${ex.page})</summary><div class="txt">${esc(ex.text.trim())}</div>`;
    P.appendChild(en);

    // barra de herramientas
    const tb = document.createElement("div"); tb.className = "toolbar";
    tb.innerHTML = `
      <label class="switch"><input type="checkbox" id="sw-practice" ${STATE.practice ? "checked" : ""}> Modo práctica (ocultar cardinalidades)</label>
      <span class="sp"></span>
      <select id="sel-attrs" aria-label="Atributos">
        <option value="all">Todos los atributos</option>
        <option value="keys">Solo identificadores</option>
        <option value="none">Sin atributos</option>
      </select>
      <button id="btn-zoom">${STATE.zoom ? "Ajustar al ancho" : "Ampliar (tamaño real)"}</button>`;
    P.appendChild(tb);

    const dia = document.createElement("div"); dia.className = "diagram" + (STATE.zoom ? " zoom" : "");
    P.appendChild(dia);
    const legend = document.createElement("div"); legend.className = "legend";
    legend.innerHTML = `<span>▭ entidad · ▭▭ entidad débil · ◇ interrelación (ID = dependencia en identificación)</span><span>(mín,máx) junto a una entidad = cuántos de ESA entidad por cada uno de la otra</span><span>△ jerarquía: arco = exclusiva, círculo = total</span><span>atributo subrayado = identificador · (0,1) opcional · (1,n) multivaluado · IA = identificador alternativo</span>`;
    P.appendChild(legend);

    function drawDiagram() {
        dia.innerHTML = "";
        dia.appendChild(renderER(ex, { attrs: STATE.attrs, hidden: (i) => STATE.practice && !STATE.revealed.has(i) }));
    }
    drawDiagram();

    $("sel-attrs").value = STATE.attrs;
    $("sel-attrs").onchange = (e) => { STATE.attrs = e.target.value; lsSet("er-attrs", STATE.attrs); drawDiagram(); };
    $("btn-zoom").onclick = () => { STATE.zoom = !STATE.zoom; renderExercise(); };
    $("sw-practice").onchange = (e) => { STATE.practice = e.target.checked; STATE.revealed = new Set(); STATE.checked = {}; renderExercise(); };

    // análisis / práctica
    const an = document.createElement("div");
    an.innerHTML = `<h3>${STATE.practice ? "Práctica: elige la cardinalidad de cada extremo" : "Análisis de las interrelaciones"}</h3>`;
    const list = document.createElement("div"); list.className = "rels";
    ex.rels.forEach((r, i) => {
        const c = document.createElement("div"); c.className = "relcard";
        if (STATE.checked[i] === true) c.classList.add("ok");
        if (STATE.checked[i] === false) c.classList.add("bad");
        const showSol = !STATE.practice || STATE.revealed.has(i);
        const ends = r.ends ? r.ends.map(e => ({ e: e.e, c: e.c, role: e.role }))
                   : [{ e: r.a, c: r.ca, role: r.roleA, other: r.b, orole: r.roleB }, { e: r.b, c: r.cb, role: r.roleB, other: r.a, orole: r.roleA }];
        const names = r.ends ? r.ends.map(e => L[e.e]).join(" – ") : (r.a === r.b ? `${L[r.a]} – ${L[r.a]} (reflexiva)` : `${L[r.a]} – ${L[r.b]}`);
        let html = `<div class="t">${esc(r.label || r.n)} <span class="muted">(${esc(names)})</span>${showSol ? `<span class="type">${esc((r.dep ? r.dep + " · " : "") + relType(r))}</span>` : ""}</div>`;
        if (STATE.practice) {
            html += `<div class="pr-row">` + ends.map((e, k) => {
                const lab = e.role ? `${L[e.e]} (${e.role})` : L[e.e];
                return `<label>Junto a <b>${esc(lab)}</b> <select data-k="${k}">${["—"].concat(cardOptions(e.c)).map(o => `<option>${o}</option>`).join("")}</select></label>`;
            }).join("") + `<label>Tipo <select data-k="type">${["—", "1:1", "1:N", "N:1", "N:M"].concat(r.ends ? [relType(r)] : []).filter((v, j, a) => a.indexOf(v) === j).map(o => `<option>${o}</option>`).join("")}</select></label></div>`;
        }
        if (showSol) {
            html += "<ul>" + ends.map(e => {
                if (r.ends) return `<li><b>${esc(e.c)}</b> junto a ${esc(L[e.e])}: fijada una combinación de los otros extremos → ${describe(e.c)} ${esc(L[e.e])}.</li>`;
                const who = e.orole ? `${L[e.other]} (como ${e.orole})` : L[e.other];
                const what = e.role ? `${L[e.e]} (como ${e.role})` : L[e.e];
                return `<li><b>${esc(e.c)}</b> junto a ${esc(e.role ? L[e.e] + " (" + e.role + ")" : L[e.e])}: por cada ${esc(who)} → ${describe(e.c)} ${esc(what)}.</li>`;
            }).join("") + "</ul>";
            if (r.why) html += `<div class="why">${r.why}</div>`;
        }
        c.innerHTML = html;
        list.appendChild(c);
    });
    an.appendChild(list);
    if (STATE.practice) {
        const row = document.createElement("div"); row.className = "toolbar";
        const chk = document.createElement("button"); chk.className = "btn-primary"; chk.textContent = "Comprobar";
        const sol = document.createElement("button"); sol.textContent = "Ver solución completa";
        const score = document.createElement("span"); score.className = "score";
        const ok = Object.values(STATE.checked).filter(v => v).length;
        if (Object.keys(STATE.checked).length) score.textContent = `${ok} de ${ex.rels.length} interrelaciones correctas`;
        chk.onclick = () => {
            const cards = list.querySelectorAll(".relcard");
            ex.rels.forEach((r, i) => {
                const sels = cards[i].querySelectorAll("select");
                const vals = {}; sels.forEach(s => { vals[s.dataset.k] = s.value; });
                const ends = r.ends ? r.ends.map(e => e.c) : [r.ca, r.cb];
                const good = ends.every((c, k) => vals[k] === c) && vals.type === relType(r);
                STATE.checked[i] = good;
                if (good) STATE.revealed.add(i);
            });
            const allOk = ex.rels.every((r, i) => STATE.checked[i]);
            if (allOk) { const d = lsGet("er-done", {}); d[ex.id] = true; lsSet("er-done", d); buildPicker(); }
            renderExercise();
        };
        sol.onclick = () => { ex.rels.forEach((r, i) => STATE.revealed.add(i)); renderExercise(); };
        row.append(chk, sol, score);
        an.appendChild(row);
        // mantener lo elegido tras redibujar
        list.querySelectorAll(".relcard").forEach((card, i) => {
            const saved = STATE.sel && STATE.sel[ex.id] && STATE.sel[ex.id][i];
            card.querySelectorAll("select").forEach(s => {
                if (saved && saved[s.dataset.k]) s.value = saved[s.dataset.k];
                s.addEventListener("change", () => {
                    STATE.sel = STATE.sel || {}; STATE.sel[ex.id] = STATE.sel[ex.id] || {}; STATE.sel[ex.id][i] = STATE.sel[ex.id][i] || {};
                    STATE.sel[ex.id][i][s.dataset.k] = s.value;
                });
            });
        });
    }
    if (ex.hier && ex.hier.length && !STATE.practice) {
        const h = document.createElement("div"); h.className = "rels"; h.style.marginTop = "10px";
        ex.hier.forEach(x => {
            const d = document.createElement("div"); d.className = "relcard";
            d.innerHTML = `<div class="t">Jerarquía ${esc(x.sup)} → ${esc(x.subs.join(", "))} <span class="type" style="font-family:var(--mono);color:var(--hier)">${x.total ? "total" : "parcial"} · ${x.excl ? "exclusiva" : "solapada"}</span></div>${x.why ? `<div class="why">${x.why}</div>` : ""}`;
            h.appendChild(d);
        });
        an.appendChild(h);
    }
    P.appendChild(an);

    if (ex.notes && ex.notes.length && !STATE.practice) {
        const n = document.createElement("div"); n.className = "notes";
        n.innerHTML = `<b>Decisiones de diseño y alternativas</b><ul>${ex.notes.map(s => `<li>${s}</li>`).join("")}</ul>`;
        P.appendChild(n);
    }

    // Tema 3
    const tables = buildSchema(ex);
    const rs = document.createElement("details"); rs.className = "sec"; rs.open = !STATE.practice;
    rs.innerHTML = `<summary>Paso al modelo relacional (Tema 3) · ${tables.length} tablas</summary>
      <p class="muted" style="margin:4px 0 10px">Notación del grafo relacional: <span style="text-decoration:underline;font-weight:700">clave primaria</span> subrayada, <i style="color:var(--primary)">clave ajena</i> en cursiva (→ tabla a la que apunta), <b>clave alternativa</b> en negrita, * = admite nulos. B/M = borrado/modificación: C cascada, N nulos, R restringido.</p>
      <div class="rschema">${schemaHTML(tables)}</div>`;
    P.appendChild(rs);

    const sq = document.createElement("details"); sq.className = "sec";
    const sql = schemaSQL(tables, `Ejercicio ${ex.id}º - ${ex.title}`);
    sq.innerHTML = `<summary>Script SQL (CREATE TABLE)</summary><div class="toolbar"><button id="btn-copy">Copiar SQL</button><span class="muted" id="copy-msg"></span></div><pre class="sql"></pre>`;
    sq.querySelector("pre").textContent = sql;
    P.appendChild(sq);
    sq.querySelector("#btn-copy").onclick = async () => {
        try { await navigator.clipboard.writeText(sql); $("copy-msg").textContent = "Copiado ✓"; }
        catch (e) {
            const r = document.createRange(); r.selectNodeContents(sq.querySelector("pre"));
            const s = getSelection(); s.removeAllRanges(); s.addRange(r);
            $("copy-msg").textContent = "Seleccionado: pulsa Ctrl+C";
        }
    };
}

// =====================================================================
//  GUÍA
// =====================================================================
function renderGuide() {
    const G = $("view-guide");
    G.innerHTML = GUIDE_HTML;
    G.querySelectorAll("[data-mini]").forEach(box => {
        const ex = MINI[box.dataset.mini];
        box.appendChild(renderER(ex, { attrs: box.dataset.attrs || "none" }));
    });
}

// =====================================================================
//  INICIO
// =====================================================================
if (!EXERCISES.some(e => e.id === STATE.ex)) STATE.ex = 1;
buildPicker();
renderExercise();
renderGuide();
setTab(STATE.tab === "guide" ? "guide" : "ex");

</script>
</body>
</html>
