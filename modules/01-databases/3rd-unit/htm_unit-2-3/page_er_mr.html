<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo E/R y Relacional</title>
<style>
:root{color-scheme:light dark;
 --bg:#f6f4ee;--paper:#fffdf8;--ink:#1d2433;--muted:#5d6676;--line:#d9d4c7;--accent:#2f5bd3;--accent2:#e9efff;
 --red:#c8322b;--green:#1f8a4c;--greenbg:#e5f5ea;--redbg:#fbe7e5;
 --m-e:#ffd84d;--m-k:#ff9a76;--m-a:#a6e3a1;--m-r:#8cc8ff;--m-c:#d6b3ff;--m-w:#ffc2e0;--m-x:#ff6b6b;
 --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#14171d;--paper:#1c2028;--ink:#e7e9ee;--muted:#9aa3b2;--line:#353b47;--accent:#7ea2ff;--accent2:#232c42;
 --red:#ff7a70;--green:#5fd18f;--greenbg:#183324;--redbg:#3a1d1b;
 --m-e:#8a7200;--m-k:#8f4a2f;--m-a:#2f6b2c;--m-r:#265a8c;--m-c:#5b3a8a;--m-w:#83385f;--m-x:#8f2a2a;
}}
:root[data-theme="dark"]{
 --bg:#14171d;--paper:#1c2028;--ink:#e7e9ee;--muted:#9aa3b2;--line:#353b47;--accent:#7ea2ff;--accent2:#232c42;
 --red:#ff7a70;--green:#5fd18f;--greenbg:#183324;--redbg:#3a1d1b;
 --m-e:#8a7200;--m-k:#8f4a2f;--m-a:#2f6b2c;--m-r:#265a8c;--m-c:#5b3a8a;--m-w:#83385f;--m-x:#8f2a2a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 16px 6px;max-width:1180px;margin:auto}
header h1{margin:0;font-size:1.6rem}
header p{margin:4px 0 0;color:var(--muted)}
nav#tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:1180px;margin:auto;border-bottom:1px solid var(--line)}
nav#tabs button{white-space:nowrap;flex:none}
main{max-width:1180px;margin:auto;padding:16px}
button,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;min-width:0;max-width:100%}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] button.on,:root[data-theme="dark"] button.primary{color:#0d1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.on,:root:not([data-theme="light"]) button.primary{color:#0d1220}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:1.3rem}
h3{margin:12px 0 6px;font-size:1.05rem} h4{margin:14px 0 4px;font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lead{color:var(--muted);margin:0 0 12px}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row.nav{margin-top:12px}
code{background:var(--accent2);padding:1px 5px;border-radius:5px;font-size:.88em;word-break:break-word}
/* método */
ol.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
ol.flow li{display:flex;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
ol.flow .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
ol.flow p{margin:3px 0 6px;font-size:.93rem}
.q{display:inline-block;font-size:.85rem;font-style:italic;color:var(--accent)}
.legend-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.lg{display:flex;flex-direction:column;gap:2px}.lg span{font-size:.87rem;color:var(--muted)}
.magic{background:var(--accent2);border-radius:12px;padding:14px;margin-bottom:10px}
.mq{font-size:1.1rem}.ma{margin-top:6px}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-weight:700}
.mini{max-width:620px;margin:auto}
.checks{margin:8px 0 0;padding-left:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{border-radius:12px;padding:12px;border:2px solid var(--line)}
.tile h3{margin:0 0 4px}.tile p{margin:4px 0}.tile .ex{font-style:italic;color:var(--muted);font-size:.9rem}
.tile.ent{border-color:var(--m-e)}.tile.att{border-color:var(--m-a)}.tile.rel{border-color:var(--m-r)}
/* marcas */
mark{border-radius:4px;padding:0 3px;color:inherit;background:transparent;transition:background .2s}
mark.e{background:var(--m-e)}mark.k{background:var(--m-k)}mark.a{background:var(--m-a)}mark.r{background:var(--m-r)}
mark.c{background:var(--m-c)}mark.w{background:var(--m-w)}mark.x{background:var(--m-x)}
mark.off{background:transparent!important}
mark sup{font-size:.68em;font-weight:600;margin-left:3px;opacity:.8;font-style:italic}
mark.off sup{display:none}
.text{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 16px;line-height:1.85}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin:12px 0}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note{background:var(--accent2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.note p{margin:6px 0 0}
.legend-mini{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px;font-size:.85rem}
.stepbar{display:flex;gap:6px;flex-wrap:wrap}
.sb{display:flex;align-items:center;gap:6px;font-size:.88rem;padding:6px 10px}
.sb span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:.78rem;font-weight:700}
.sb.done span{background:var(--green);color:#fff}
.sb.on span{background:#fff;color:var(--accent)}
.diagram{background:#fffefa;border:1px dashed var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:720px;height:auto}
@media (max-width:760px){.diagram:not(.small)::before{content:"↔ desliza para ver el diagrama completo";display:block;font-size:.8rem;color:#5d6676;margin-bottom:4px}}
.diagram.small svg{min-width:0}
/* restricciones */
.matrix{display:grid;grid-template-columns:minmax(110px,.8fr) 1fr 1fr;gap:8px;margin:10px 0}
.mh{font-size:.92rem;padding:6px;text-align:center;color:var(--muted)}.mh.side{text-align:left;display:block;align-self:center}
.cell{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;text-decoration:none;color:var(--ink);border:2px solid}
.cell b{font-size:1.05rem}.cell span{font-size:.85rem;font-weight:600}.cell em{font-size:.85rem;color:var(--muted)}
.cell.no{background:var(--redbg);border-color:var(--red)}.cell.no span{color:var(--red)}
.cell.yes{background:var(--greenbg);border-color:var(--green)}.cell.yes span{color:var(--green)}
.cell:hover{transform:translateY(-1px)}
.tip{background:var(--accent2);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.95rem}
.def{font-size:1.05rem;background:var(--bg);padding:10px 12px;border-radius:10px;border-left:4px solid var(--accent)}
.quote{font-style:italic;border-left:3px solid var(--line);padding-left:10px}
.restr ul{margin:4px 0;padding-left:20px}
table.inst{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:4px}
table.inst td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.inst tr.ok td:first-child{color:var(--green);font-weight:700}table.inst tr.ko td:first-child{color:var(--red);font-weight:700}
table.inst tr.ko{background:var(--redbg)}
table.inst td:last-child{color:var(--muted)}
.sqlnote{font-size:.9rem;background:var(--bg);border-radius:8px;padding:8px 10px}
table.tb{width:100%;border-collapse:collapse;font-size:.93rem}
table.tb th,table.tb td{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}
table.tb th{background:var(--bg)}
/* diccionario */
.dict{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:1fr 30px 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.dcue{font-style:italic}
.darrow{color:var(--accent);font-size:1.3rem;text-align:center}
.dsvg{background:#fffefa;border-radius:8px;margin-top:6px;max-width:440px}
.dsvg svg{display:block;width:100%;height:auto}
/* quiz */
.stats{font-size:.9rem;color:var(--muted)}
.track{height:6px;background:var(--line);border-radius:4px;margin:6px 0 14px;overflow:hidden}
.bar{height:100%;background:var(--accent);transition:width .3s}
.badge{background:var(--accent2);color:var(--accent);font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:20px}
.qtext{font-size:1.2rem;margin:12px 0 4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;padding:11px 14px}
.opt b{display:inline-block;width:22px;color:var(--accent)}
.opt.right{background:var(--greenbg);border-color:var(--green)}.opt.wrong{background:var(--redbg);border-color:var(--red)}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.result{text-align:center}.result .big{font-size:3.2rem;font-weight:800;color:var(--accent)}.result ul{text-align:left}
/* tablas */
.rule3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rule3 div{background:var(--accent2);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.rule3 b{font-size:1.3rem;color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.pcard h3{margin:0 0 6px}.pcard .dsvg{max-width:none}
.pcard p{font-size:.9rem;margin:8px 0 0}
.arrowdown{text-align:center;color:var(--accent);font-size:1.3rem;line-height:1}
.rtabs{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--paper);border-radius:8px;padding:8px;border:1px solid var(--line)}
.rtabs i{color:var(--accent)}
/* examen */
.sheet{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:auto 1fr auto;gap:8px;aspect-ratio:1/1.3;max-height:520px;border:2px solid var(--ink);border-radius:6px;padding:10px;background:#fffefa;color:#1d2433}
.z{border:1.5px dashed #8a8a8a;border-radius:6px;padding:8px;display:flex;flex-direction:column;font-size:.85rem}
.z span{color:#5d6676}
.z1{grid-column:1;grid-row:1/3}.z2{grid-column:2;grid-row:1/3;background:#eef3ff}.z3{grid-column:1;grid-row:3}.z4{grid-column:2;grid-row:3;background:#f0faf2}
.time{display:flex;border-radius:10px;overflow:hidden;font-size:.78rem;text-align:center;color:#1d2433}
.time div{padding:8px 2px}.t1{background:#ffd84d}.t2{background:#ffc2e0}.t3{background:#8cc8ff}.t4{background:#a6e3a1}.t5{background:#d6b3ff}
.cklist{display:grid;gap:6px}.cklist label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.cklist input{margin-top:5px;width:18px;height:18px;flex:none}
/* ---- SVG del diagrama (estilo papel, siempre fondo claro) ---- */
svg.er{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d2433}
svg.er text{fill:#1d2433}
.er .ent{fill:#fff;stroke:#1d2433;stroke-width:1.7}
.er .ent.inner{fill:none}
.er .ent-t{font-weight:700;font-size:14px}
.er .rel{fill:#eef3ff;stroke:#1d2433;stroke-width:1.6}
.er .rel-t{font-size:12.5px;font-weight:600}
.er .dep{font-size:10px;font-weight:700;fill:#c8322b!important}
.er .corr{font-size:10.5px;fill:#2f5bd3!important;font-weight:700}
.er .edge{stroke:#1d2433;stroke-width:1.4;fill:none}
.er .stem{stroke:#1d2433;stroke-width:1.1}
.er .stem.dash{stroke-dasharray:4 3}
.er .dot{fill:#fff;stroke:#1d2433;stroke-width:1.2}
.er .dot.pk,.er .dot-half{fill:#1d2433}
.er .att{font-size:11.5px}
.er .att.pk{text-decoration:underline;font-weight:700}
.er .card{font-size:11.5px;fill:#7a2fb8!important;font-weight:700}
.er .role{font-size:10.5px;font-style:italic;fill:#5d6676!important}
.er .tri{fill:#fff;stroke:#1d2433;stroke-width:1.5}
.er .hlab{font-size:10px;fill:#5d6676!important;font-style:italic}
.er .cons{stroke:#c8322b;stroke-width:2;fill:none}
.er .cons.dash{stroke-dasharray:6 4}
.er .clab{font-size:11px;fill:#c8322b!important;font-weight:700}
.er .mk-ink{fill:#1d2433}.er .mk-red{fill:#c8322b}
.er .hl{stroke:#2f5bd3;stroke-width:3}
.diagram,.dsvg{color-scheme:light}
@media (max-width:760px){
 .split,.split2{grid-template-columns:1fr}
 .drow{grid-template-columns:1fr}.darrow{display:none}
 .rule3{grid-template-columns:1fr}
 .matrix{grid-template-columns:1fr 1fr}.matrix .mh:first-child{display:none}.matrix .mh.side{grid-column:1/-1}
 .pgrid{grid-template-columns:1fr}
 .panel{padding:14px}
 header h1{font-size:1.3rem}
}
@media print{
 nav#tabs,header p,#b-print,#b-reset,.row.nav{display:none}
 body{background:#fff}.panel{box-shadow:none;break-inside:avoid}
}

:root{
 --primary:var(--accent);--primary-dark:#2448ad;--soft:var(--accent2);--card:var(--paper);--card2:#f8f6f0;
 --border:var(--line);--track:#e8e3d6;--ok-bg:var(--greenbg);--ok:var(--green);--bad-bg:var(--redbg);--bad:var(--red);
 --ent:#fff;--entStroke:#1d2433;--rel:#eef3ff;--relStroke:#2f5bd3;--card-label:#7a2fb8;--q:#7a2fb8;--hier:#0f766e;
 --radius:16px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card2:#171b22;--track:#2a303b;--primary-dark:#5f86f0;--entStroke:#cbd5e1;--rel:#232c42;--relStroke:#7ea2ff;--card-label:#c4a1ff;--q:#c4a1ff;--hier:#5eead4}}
:root[data-theme="dark"]{--card2:#171b22;--track:#2a303b;--primary-dark:#5f86f0;--entStroke:#cbd5e1;--rel:#232c42;--relStroke:#7ea2ff;--card-label:#c4a1ff;--q:#c4a1ff;--hier:#5eead4}
/* exercise picker */
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pick{min-width:44px;padding:8px 10px;font-weight:600}
.pick.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pick.done{border-color:var(--ok);}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ex-head h2{margin:0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}


details.enun{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--card2)}
details.enun summary{cursor:pointer;font-weight:600}
details.enun .txt{white-space:pre-line;margin-top:8px;line-height:1.6}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.toolbar .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.switch input{width:16px;height:16px;accent-color:var(--primary)}

.diagram.zoom svg{width:auto;max-width:none;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}

/* svg */
.e-box{fill:var(--ent);stroke:var(--entStroke);stroke-width:1.6}
.e-name{font:700 12.5px -apple-system,Segoe UI,Roboto,Arial,sans-serif;fill:var(--ink)}
.e-attr{font:11px -apple-system,Segoe UI,Roboto,Arial,sans-serif;fill:var(--muted)}
.e-attr.pk{fill:var(--ink);font-weight:600}
.r-box{fill:var(--rel);stroke:var(--relStroke);stroke-width:1.6}
.r-name{font:700 11.5px -apple-system,Segoe UI,Roboto,Arial,sans-serif;fill:var(--ink)}
.r-type{font:700 10.5px var(--mono);fill:var(--relStroke)}
.edge{stroke:var(--entStroke);stroke-width:1.4;fill:none}
.card-lbl{font:700 11.5px var(--mono);fill:var(--card-label);paint-order:stroke;stroke:var(--card2);stroke-width:4px;stroke-linejoin:round}
.card-lbl.q{fill:var(--q)}
.role-lbl{font:italic 10.5px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--card2);stroke-width:4px}
.r-attr{font:11px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--card2);stroke-width:3px}
.r-attr.pk{text-decoration:underline;fill:var(--ink)}
.a-dot{fill:var(--card2);stroke:var(--entStroke);stroke-width:1.2}
.h-tri{fill:var(--card2);stroke:var(--hier);stroke-width:1.8}
.h-edge{stroke:var(--hier);stroke-width:1.6;fill:none}
.h-lbl{font:italic 10.5px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--hier);paint-order:stroke;stroke:var(--card2);stroke-width:3px}
.c-edge{stroke:var(--bad);stroke-width:1.4;stroke-dasharray:5 4;fill:none}
.c-lbl{font:italic 700 10.5px -apple-system,Segoe UI,Arial,sans-serif;fill:var(--bad);paint-order:stroke;stroke:var(--card2);stroke-width:3px}

/* analysis */
.rels{display:grid;gap:10px}
.relcard{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card2)}
.relcard.ok{border-color:var(--ok);background:var(--ok-bg)}
.relcard.bad{border-color:var(--bad);background:var(--bad-bg)}
.relcard .t{font-weight:700}
.relcard .t .type{font-family:var(--mono);color:var(--relStroke);margin-left:6px}
.relcard ul{margin-top:6px}
.relcard .why{margin-top:6px;font-size:.92rem;color:var(--muted)}
.pr-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;font-size:.9rem}
.pr-row label{display:inline-flex;gap:6px;align-items:center}
.pr-row select{padding:5px 8px;font-family:var(--mono)}
.score{font-weight:700}

.notes{margin-top:10px;padding:10px 14px;border-left:4px solid var(--card-label);background:var(--card2);border-radius:6px}
.notes li{margin:2px 0}

/* relational */
.rschema{font-family:var(--mono);font-size:.9rem;line-height:1.9}
.rschema .tbl{margin-bottom:6px}
.rschema .tn{font-weight:700}
.rschema .pk{text-decoration:underline;font-weight:700}
.rschema .fk{font-style:italic;color:var(--primary)}
.rschema .uq{font-weight:700}
.rschema .fkl{color:var(--muted);font-size:.85em;padding-left:18px}
pre.sql{font-family:var(--mono);font-size:.82rem;line-height:1.5;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;white-space:pre;max-height:460px}
details.sec{margin-top:14px}
details.sec>summary{cursor:pointer;font-weight:700;font-size:1rem;padding:6px 0}

/* guide */
.guide h3{color:var(--primary)}
.rule{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card2);margin:8px 0}
.rule b{color:var(--card-label)}



.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}


/* flujo Tema 3 */
.stepper{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 6px;padding:0;counter-reset:s}
.step{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:10px;font-size:.85rem;line-height:1.25;height:100%}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--track);color:var(--muted)}
.step.active{border-color:var(--primary);background:var(--soft);font-weight:600}
.step.active .n{background:var(--primary);color:#fff}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.flow-body{margin-top:12px}

 text: `En el gimnasio "Siempre en Forma" se quiere implantar una base de datos para llevar el control de los socios, recursos utilizados, etc. Las especificaciones que nos han dado son las siguientes:
a.- Existen varias salas, de las cuales se quiere guardar información, como los metros cuadrados que ocupa, ubicación y el tipo de sala (cardio, general, muscular). Cada sala se identifica por un número.
b.- Hay salas que tienen aparatos y salas que no. En las salas se pueden impartir clases o no.
c.- Cada aparato está asignado a una única sala y de cada uno de ellos se quiere tener almacenado su código, descripción y estado de conservación.
d.- También se quiere mantener información relacionada con las clases que se imparten (descripción y día/hora en la que se imparten); cada clase se identifica por un código de clase. Cada clase tiene asignada una sala en la que se imparte y un monitor.
e.- De cada monitor se quiere conocer el DNI, nombre, teléfono, si tienen o no titulación y experiencia profesional, así como las clases que pueden impartir (preparación como monitor de aeróbic, step, streching, etc).
f.- De cada socio se quiere conocer el número de socio, nombre, dirección, teléfono, profesión y datos bancarios así como las clases a las que asiste.
g.- El gimnasio dispone también de pistas de squash, de las que se quiere conocer el número de pista, ubicación y estado. Las pistas de squash pueden ser utilizadas por socios, y existe un servicio de reserva de pista (en una fecha y a una hora).`,

b.- La farmacia compra cada medicamento a un laboratorio, o bien los fabrica ella misma. Se desea conocer el código del laboratorio, nombre, teléfono, dirección y fax, así como el nombre de la persona de contacto.

 id: 15, page: 61, title: "Cursos de formación", tags: ["reflexiva N:M", "débil (ID)", "restricción de exclusión"],
 text: `El departamento de formación de una empresa desea construir una base de datos para planificar y gestionar la formación de sus empleados.
La empresa organiza cursos internos de formación de los que desea conocer el código de curso, el nombre, descripción, duración y coste.
Un curso puede tener como prerrequisito haber realizado otro(s) previamente, y, a su vez la realización de un curso puede ser prerrequisito de otros. Un curso que es un prerrequisito de otro puede serlo de forma obligatoria o solo recomendable.
Un mismo curso tiene diferentes ediciones, es decir, se imparte en diferentes lugares, fechas y con diferentes horarios (intensivo, de mañana o de tarde). En una misma fecha de inicio solo puede impartirse una edición de un curso.
Los cursos se imparten por personal de la propia empresa.
De los empleados se desea almacenar su código de empleado, nombre y apellidos, dirección, teléfono, NIF, fecha de nacimiento, nacionalidad, sexo, firma y salario, así como si está capacitado para impartir cursos.

 id: 16, page: 62, title: "Campeonato de ajedrez", umlPos: { PARTICIPANTE_CAMPEONATO: [190, 245] }, tags: ["jerarquía", "(2,2)", "débiles (ID)", "reflexiva", "multivaluados"],
 text: `El club de Ajedrez de Villatortas de Arriba ha sido encargado por la Federación Internacional de Ajedrez de la organización de los próximos campeonatos mundiales que se celebrarán en la citada localidad. Por este motivo, se desea llevar a una base de datos toda la gestión relativa a participantes, alojamientos y partidas. Teniendo en cuenta que:
a.- En el campeonato participan jugadores y árbitros; de ambos se quiere conocer el número de asociado, nombre, dirección, teléfono y campeonatos en los que ha participado (como jugador o como árbitro). De los jugadores se precisa además el nivel de juego en una escala de 1 a 10.
b.- Ningún árbitro puede participar como jugador.
c.- Los países envían al campeonato un conjunto de jugadores y árbitros, aunque no todos los países envían participantes. Todo jugador y árbitro es enviado por un único país. Un país puede ser representado por otro país.
d.- Cada país se identifica por un número correlativo según su orden alfabético e interesa conocer además de su nombre, el número de clubes de ajedrez existentes en el mismo.
e.- Cada partida se identifica por un número correlativo (Cód_P), la juegan dos jugadores y la arbitra un árbitro. Interesa registrar las partidas que juega cada jugador y el color (blancas o negras) con el que juega. Ha de tenerse en cuenta que un árbitro no puede arbitrar a jugadores enviados por el mismo país que le ha enviado a él.
f.- Todo participante participa en al menos una partida.
g.- Tanto jugadores como árbitros se alojan en uno de los hoteles en los que se desarrollan las partidas; se desea conocer en qué hotel y en qué fechas se ha alojado cada uno de los participantes. Los participantes pueden no permanecer en Villatortas durante todo el campeonato, sino acudir cuando tienen que jugar alguna partida, alojándose en el mismo o distinto hotel. De cada hotel, se desea conocer el nombre, la dirección y el teléfono.
h.- El campeonato se desarrolla a lo largo de una serie de jornadas (día, mes, año) y cada partida tiene lugar en una de las jornadas aunque no tengan lugar partidas todas las jornadas.
i.- Cada partida se celebra en una de las salas de las que pueden disponer los hoteles; se desea conocer el número de entradas vendidas en la sala para cada partida. De cada sala, se desea conocer la capacidad y medios de que dispone (radio, televisión, video...) para facilitar la retransmisión de los encuentros. Una sala puede disponer de varios medios distintos.
j.- De cada partida se pretende registrar todos los movimientos que la componen; la identificación de movimiento se establece en base a un número de orden dentro de cada partida: para cada movimiento se guardan la jugada (5 posiciones) y un breve comentario realizado por un experto.`,

 id: 17, page: 63, title: "Energía eléctrica", tags: ["jerarquía de 4 subtipos", "ternaria", "reflexiva N:M", "(2,n)"],
 text: `Se pretende llevar a cabo un control sobre la energía eléctrica que se produce y consume en un determinado país. Se parte de las siguientes hipótesis:
a.- Existen productores básicos de electricidad que se identifican por un nombre, de los cuales interesa su producción media, su producción máxima y fecha de entrada en funcionamiento. Estos productores básicos lo son de una de las siguientes categorías: Hidroeléctrica, Solar, Nuclear o Térmica. De una central hidroeléctrica o presa nos interesa saber su ocupación, capacidad máxima y número de turbinas. De una central solar nos interesa saber la superficie total de paneles solares, la media anual de horas de sol y tipo (fotovoltaica o termodinámica). De una central nuclear, nos interesa saber el número de reactores que posee, el volumen de plutonio consumido y el de residuos nucleares que produce. De una central térmica, nos interesa saber el número de hornos que posee, el volumen de carbón consumido y el volumen de su emisión de gases.
b.- Por motivos de seguridad nacional interesa controlar el plutonio de que se provee una central nuclear; este control se refiere a la cantidad de plutonio que compra a cada uno de sus posibles suministradores (nombre y país) y que porta un determinado transportista (nombre y matrícula); ha de tenerse en cuenta que el mismo suministrador puede vender plutonio a distintas centrales nucleares y que cada porte (un único porte por compra) puede realizarlo un transportista diferente.
c.- Cada día, los productores entregan la energía producida a una o varias estaciones primarias, las cuales pueden recibir diariamente una cantidad distinta de energía de cada uno de estos productores. Los productores entregan siempre el total de su producción. Las estaciones primarias se identifican por su nombre y tienen un número de transformadores de baja a alta tensión y son cabecera de una a varias redes de distribución.
d.- Una red de distribución se identifica por un número de red y solo puede tener una estación primaria como cabecera. La propiedad de una red puede ser compartida por varias compañías eléctricas; a cada compañía eléctrica se la identifica por su nombre.
e.- La energía sobrante en una de las redes puede enviarse a otra red. Se registra el volumen total de energía intercambiada entre dos redes.
f.- Una red está compuesta por una serie de líneas; cada línea se identifica por un número secuencial dentro del número de red y tiene una determinada longitud. La menor de las líneas posibles abastecerá al menos a dos subestaciones.
g.- Una subestación es abastecida solo por una línea y distribuye a una o varias zonas de servicio; a tales efectos, las provincias (código y nombre) se encuentran divididas en tales zonas de servicio, aunque no puede haber zonas de servicio que pertenezcan a más de una provincia. Cada zona de servicio puede ser atendida por más de una subestación.
h.- En cada zona de servicio se desea registrar el consumo medio y el número de consumidores finales de cada una de las siguientes categorías: particulares, empresas e instituciones.`,

 id: 18, page: 64, title: "Conflictos bélicos", tags: ["jerarquía solapada", "ternaria", "débiles (ID)", "(2,n) (1,3)"],
 text: `Una organización internacional pretende realizar un seguimiento de los conflictos bélicos que se producen en todo el mundo. Para ello creará una base de datos que responderá al siguiente análisis:
a.- Se entiende por conflicto cualquier lucha armada que afecte a uno o varios países y en la cual se produzcan muertos y/o heridos. Todo conflicto se identificará por un nombre que habitualmente hará referencia a la zona o causa que provoca el conflicto, aunque dado que este nombre puede cambiar con el paso del tiempo, dentro de la base de datos cada conflicto se identificará mediante un código numérico sin significado alguno. Para cada conflicto se desea recoger los países a que afecta, así como el número de muertos y heridos contabilizados hasta el momento.
b.- Los conflictos pueden ser de distintos tipos según la causa que los ha originado, clasificándose, a lo sumo, en cuatro grupos: territoriales, religiosos, económicos o raciales; en cada uno de estos grupos se recogerán diversos datos. En los conflictos territoriales se recogerán las regiones afectadas, en los religiosos las religiones afectadas, en los económicos las materias primas disputadas y en los raciales las etnias enfrentadas.
c.- En los conflictos intervienen diversos grupos armados (al menos dos) y diversas organizaciones mediadoras (podría no haber ninguna). Los mismos grupos armados y organizaciones mediadoras pueden intervenir en diferentes conflictos. Tanto los grupos armados como las organizaciones mediadoras podrán entrar y salir del conflicto; en ambos casos se recogerá tanto la fecha de incorporación como la fecha de salida. Temporalmente, tanto un grupo armado como una organización mediadora podrían no intervenir en conflicto alguno.
d.- De cada grupo armado se recoge el código que se le asigna y un nombre. Cada grupo armado dispone de al menos una división y es liderado al menos por un líder político. Las divisiones de que dispone un grupo armado se numeran consecutivamente y se registra el número de barcos, tanques, aviones y hombres de que dispone; asimismo se recoge el número de bajas que ha tenido. Para los grupos armados se recoge el número de bajas como suma de las bajas producidas en todas sus divisiones.
e.- Los traficantes de armas suministran diferentes tipos de arma a los grupos armados. De cada tipo de armas se recoge un nombre y un indicador de su capacidad destructiva. De cada traficante se recoge su nombre, los diferentes tipos de arma que puede suministrar y cantidad de armas de cada uno de los tipos de arma que podría suministrar. Se mantiene el número total de armas de cada uno de los diferentes tipos de armas suministrado por cada traficante a cada grupo armado.
f.- Los líderes políticos se identifican por su nombre y por el código de grupo armado que lideran. Además se recoge una descripción textual de los apoyos que éste posee.
g.- Cada división la pueden dirigir conjuntamente un máximo de tres jefes militares, aunque cada jefe militar no dirige más de una división. A cada jefe militar se le identifica por un código, además se recoge el rango que éste posee, y dado que un jefe militar no actúa por iniciativa propia sino que siempre obedece las órdenes de un único líder político de entre aquellos que lideran el grupo armado al que el jefe pertenece, se registra el líder político al que obedece.
h.- De las organizaciones mediadoras se recogerá su código, su nombre, su tipo (gubernamental, no gubernamental o internacional), la organización de que depende (una como máximo), el número de personas que mantiene desplegadas en cada conflicto y el tipo de ayuda que presta en cada conflicto que será de uno y solo uno de los tres tipos siguientes: médica, diplomática o presencial.
i.- Con diversos fines, los líderes políticos dialogan con las organizaciones; se desea recoger explícitamente esta información. Así para cada líder se recogerán aquellas organizaciones con que dialoga y viceversa.`,

// =====================================================================
//  DIAGRAMA UML (modelo lógico: una clase «table» por tabla)
// =====================================================================
const UML_FONT = "11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
const UML_FONT_B = "700 12.5px -apple-system, Segoe UI, Roboto, Arial, sans-serif";

function umlRows(t) {
    const fkCols = new Set(t.fks.flatMap(f => f.cols));
    const uq = new Set(t.uniq.filter(u => u.length === 1).flat());
    return t.cols.map(c => {
        const key = c.pk && fkCols.has(c.n) ? "PFK" : c.pk ? "PK" : fkCols.has(c.n) ? "FK" : uq.has(c.n) ? "UQ" : "";
        return { key, text: `${c.n} : ${c.type}${c.nul ? " [0..1]" : ""}` };
    });
}

function layoutUML(tables, ex) {
    const G = {};
    tables.forEach(t => {
        const rws = umlRows(t);
        let w = measure(t.name, UML_FONT_B) + 40;
        rws.forEach(r => { w = Math.max(w, measure(r.text, UML_FONT) + 50); });
        G[t.name] = { w: Math.ceil(w), h: 40 + rws.length * 16 + 8, rows: rws };
    });
    // posición de partida = la de la entidad o el rombo en el diagrama E/R
    const SX = 1.75, SY = 1.6;
    const pos = {};
    ex.ents.forEach(e => { pos[e.id] = { x: e.x * SX, y: e.y * SY }; });
    ex.rels.forEach(r => { pos[(r.table || r.n).toUpperCase()] = { x: r.x * SX, y: r.y * SY }; });
    tables.forEach(t => {
        let p = (ex.umlPos && ex.umlPos[t.name]) ? { x: ex.umlPos[t.name][0] * SX, y: ex.umlPos[t.name][1] * SY } : pos[t.name];
        if (!p) { // multivaluado: junto a su entidad
            const f = t.fks[0]; const q = f && pos[f.ref];
            p = q ? { x: q.x + G[f.ref].w * 0.2, y: q.y + G[f.ref].h / 2 + G[t.name].h / 2 + 60 } : { x: 0, y: 0 };
        }
        G[t.name].x = p.x; G[t.name].y = p.y;
    });
    // separar cajas que se pisan (relajación simple)
    const names = tables.map(t => t.name), M = 34;
    for (let it = 0; it < 300; it++) {
        let moved = false;
        for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
            const a = G[names[i]], b = G[names[j]];
            const ox = (a.w + b.w) / 2 + M - Math.abs(a.x - b.x);
            const oy = (a.h + b.h) / 2 + M - Math.abs(a.y - b.y);
            if (ox > 0 && oy > 0) {
                moved = true;
                if (ox / (a.w + b.w) < oy / (a.h + b.h)) { const d = (ox / 2 + 1) * (a.x <= b.x ? 1 : -1); a.x -= d; b.x += d; }
                else { const d = (oy / 2 + 1) * (a.y <= b.y ? 1 : -1); a.y -= d; b.y += d; }
            }
        }
        if (!moved) break;
    }
    return G;
}

function renderUML(tables, ex) {
    const svg = el("svg", { role: "img", "aria-label": "Diagrama UML de tablas: " + ex.title });
    const defs = el("defs", {}, svg);
    // marcadores: triángulo hueco (generalización) y rombo relleno (composición)
    const mk = (id, path, fill) => {
        const m = el("marker", { id, viewBox: "0 0 20 20", refX: 19, refY: 10, markerWidth: 14, markerHeight: 14, orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" }, defs);
        el("path", { d: path, style: `fill:${fill};stroke:var(--entStroke);stroke-width:1.4` }, m);
    };
    mk("u-gen", "M1,2 L19,10 L1,18 Z", "var(--card2)");
    mk("u-comp", "M1,10 L10,4 L19,10 L10,16 Z", "var(--entStroke)");

    const G = layoutUML(tables, ex);
    const gE = el("g", {}, svg), gB = el("g", {}, svg), gL = el("g", {}, svg);
    const b = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
    const grow = (x1, y1, x2, y2) => { b.x1 = Math.min(b.x1, x1); b.y1 = Math.min(b.y1, y1); b.x2 = Math.max(b.x2, x2); b.y2 = Math.max(b.y2, y2); };

    // cajas
    tables.forEach(t => {
        const g = G[t.name]; const x0 = g.x - g.w / 2, y0 = g.y - g.h / 2;
        el("rect", { x: x0, y: y0, width: g.w, height: g.h, rx: 4, class: "e-box" }, gB);
        el("rect", { x: x0, y: y0, width: g.w, height: 34, rx: 4, style: "fill:var(--soft);stroke:var(--entStroke);stroke-width:1.6" }, gB);
        txt(gB, g.x, y0 + 12, "«table»", "u-st");
        txt(gB, g.x, y0 + 27, t.name, "e-name");
        g.rows.forEach((r, i) => {
            const ry = y0 + 50 + i * 16;
            if (r.key) {
                const kw = r.key.length * 7 + 8;
                el("rect", { x: x0 + 7, y: ry - 10, width: kw, height: 13, rx: 3, class: "u-key u-" + r.key.toLowerCase() }, gB);
                txt(gB, x0 + 7 + kw / 2, ry, r.key, "u-keyt");
            }
            txt(gB, x0 + 44, ry, r.text, "u-col" + (r.key.includes("P") ? " pk" : ""), "start");
        });
        grow(x0, y0, x0 + g.w, y0 + g.h);
    });

    // aristas (pares repetidos se separan)
    const pairCount = {}, pairIdx = {};
    tables.forEach(t => t.fks.forEach(f => { if (f.ref !== t.name) { const k = [t.name, f.ref].sort().join("|"); pairCount[k] = (pairCount[k] || 0) + 1; } }));
    tables.forEach(t => t.fks.forEach(f => {
        const c = G[t.name], p = G[f.ref];
        if (!p) return;
        if (f.ref === t.name) { // auto-referencia: lazo a la derecha
            const x = c.x + c.w / 2, y1 = c.y - 8, y2 = c.y + 14;
            el("path", { d: `M${x},${y1} H${x + 38} V${y2} H${x}`, class: "edge" }, gE);
            txt(gL, x + 8, y1 - 4, f.pm, "u-mult", "start");
            txt(gL, x + 8, y2 + 13, f.cm, "u-mult", "start");
            txt(gL, x + 44, (y1 + y2) / 2 + 4, f.rel, "u-rel", "start");
            grow(x, y1 - 16, x + 44 + measure(f.rel, "italic 10.5px Arial"), y2 + 16);
            return;
        }
        const k = [t.name, f.ref].sort().join("|");
        const i = pairIdx[k] = (pairIdx[k] === undefined ? 0 : pairIdx[k] + 1);
        const off = (i - (pairCount[k] - 1) / 2) * 16;
        let dx = p.x - c.x, dy = p.y - c.y; const L = Math.hypot(dx, dy) || 1;
        const nx = -dy / L * off, ny = dx / L * off;
        const cc = { x: c.x + nx, y: c.y + ny, w: c.w, h: c.h }, pc = { x: p.x + nx, y: p.y + ny, w: p.w, h: p.h };
        const a = rectBorder(cc, pc.x, pc.y), z = rectBorder(pc, cc.x, cc.y);
        const attrs = { x1: a.x, y1: a.y, x2: z.x, y2: z.y, class: "edge" };
        if (f.kind === "gen") attrs["marker-end"] = "url(#u-gen)";
        if (f.kind === "comp") attrs["marker-end"] = "url(#u-comp)";
        el("line", attrs, gE);
        if (f.kind !== "gen") {
            let ux = z.x - a.x, uy = z.y - a.y; const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
            const px = -uy * 11, py = ux * 11;
            const m1 = { x: a.x + ux * 16 + px, y: a.y + uy * 16 + py + 4 };
            const m2 = { x: z.x - ux * (f.kind === "comp" ? 30 : 16) + px, y: z.y - uy * (f.kind === "comp" ? 30 : 16) + py + 4 };
            txt(gL, m1.x, m1.y, f.cm, "u-mult");
            txt(gL, m2.x, m2.y, f.pm, "u-mult");
            const mid = { x: (a.x + z.x) / 2 - px * 0.9, y: (a.y + z.y) / 2 - py * 0.9 + 4 };
            if (f.rel && f.rel !== "multivaluado") txt(gL, mid.x, mid.y, f.rel, "u-rel");
        }
    }));

    const pad = 24;
    svg.setAttribute("viewBox", [b.x1 - pad, b.y1 - pad, b.x2 - b.x1 + pad * 2 + 40, b.y2 - b.y1 + pad * 2].join(" "));
    svg.setAttribute("width", Math.round(b.x2 - b.x1 + pad * 2 + 40));
    svg.setAttribute("height", Math.round(b.y2 - b.y1 + pad * 2));
    return svg;
}

function plantUML(tables, ex) {
    const out = ["@startuml", `' Ejercicio ${ex.id} - ${ex.title}`, "hide circle", "skinparam classAttributeIconSize 0", "skinparam linetype ortho", ""];
    tables.forEach(t => {
        const fkCols = new Set(t.fks.flatMap(f => f.cols));
        out.push(`class ${t.name} <<table>> {`);
        t.cols.forEach(c => {
            const tags = [c.pk ? "PK" : "", fkCols.has(c.n) ? "FK" : ""].filter(Boolean).join(", ");
            out.push(`  ${c.n} : ${c.type}${c.nul ? " [0..1]" : ""}${tags ? " <<" + tags + ">>" : ""}`);
        });
        (t.checks || []).forEach(c => out.push(`  .. CHECK (${c.expr}) ..`));
        out.push("}");
    });
    out.push("");
    tables.forEach(t => t.fks.forEach(f => {
        if (f.kind === "gen") out.push(`${f.ref} <|-- ${t.name}`);
        else if (f.kind === "comp") out.push(`${f.ref} "${f.pm}" *-- "${f.cm}" ${t.name}${f.rel && f.rel !== "multivaluado" ? " : " + f.rel : ""}`);
        else out.push(`${t.name} "${f.cm}" --> "${f.pm}" ${f.ref}${f.rel ? " : " + f.rel.replace(/[()]/g, "") : ""}`);
    }));
    out.push("@enduml");
    return out.join("\n") + "\n";
}

function colExplain(t, c, fk, ex) {
    const parts = [];
    if (c.pk && !fk) parts.push("Identificador de la entidad");
    if (fk) {
        if (fk.kind === "gen") parts.push(`Hereda la clave del supertipo ${fk.ref}: es PK y FK a la vez`);
        else if (fk.kind === "comp" && fk.rel === "multivaluado") parts.push(`Clave de ${fk.ref}: cada valor del atributo multivaluado es una fila`);
        else if (fk.kind === "comp") parts.push(`Clave de la entidad fuerte ${fk.ref} (débil por identificación, ${fk.rel})`);
        else if (c.pk) parts.push(`Clave de ${fk.ref} (tabla de la interrelación ${fk.rel})`);
        else parts.push(`Interrelación ${fk.rel}: la clave de ${fk.ref} pasa a esta tabla (${fk.pm} ${fk.ref} por cada fila)`);
    }
    if (c.nul) parts.push(fk ? "admite nulos porque el mínimo es 0" : "opcional (0,1)");
    return parts.join(" · ") || "Atributo";
}

<script>
// =====================================================================
//  MOTOR DE DIBUJO E/R "ESTILO PAPEL" (notación del Tema 2)
//  spec = { w, h, ents, rels, hier, cons }
//  Cada elemento puede llevar step: solo se dibuja si step <= paso actual.
// =====================================================================
const SVGNS = "http://www.w3.org/2000/svg";
const _ctx = document.createElement("canvas").getContext("2d");
function tw(s, font) { _ctx.font = font || "12px Arial"; return _ctx.measureText(String(s)).width; }
function mk(tag, a, p) { const n = document.createElementNS(SVGNS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; }
function tx(p, x, y, s, cls, anchor) { const t = mk("text", { x, y, class: cls, "text-anchor": anchor || "middle" }, p); t.textContent = s; return t; }

const F_ENT = "700 13px -apple-system, Segoe UI, Roboto, Arial, sans-serif";
const F_REL = "700 12px -apple-system, Segoe UI, Roboto, Arial, sans-serif";

function cardParse(s) {
    const m = String(s).match(/\(\s*(\d+)\s*,\s*([0-9nN]+)\s*\)/);
    if (!m) return { min: 0, max: Infinity };
    return { min: +m[1], max: /n/i.test(m[2]) ? Infinity : +m[2] };
}
function corr(r) {
    if (r.type) return r.type;
    const A = cardParse(r.ca).max > 1, B = cardParse(r.cb).max > 1;
    return A && B ? "N:M" : (A ? "N" : "1") + ":" + (B ? "N" : "1");
}
function rBorder(g, tx_, ty) {
    const dx = tx_ - g.x, dy = ty - g.y;
    if (!dx && !dy) return { x: g.x, y: g.y };
    const s = Math.min((g.w / 2) / Math.abs(dx || 1e-9), (g.h / 2) / Math.abs(dy || 1e-9));
    return { x: g.x + dx * s, y: g.y + dy * s };
}
function dBorder(g, tx_, ty) {
    const dx = tx_ - g.x, dy = ty - g.y;
    const t = 1 / (Math.abs(dx) / (g.w / 2) + Math.abs(dy) / (g.h / 2) || 1);
    return { x: g.x + dx * t, y: g.y + dy * t };
}
function boxHit(g, lx, ly, s) {
    const w = tw(s, "700 12px monospace") / 2 + 3;
    return !(lx + w < g.x - g.w / 2 || lx - w > g.x + g.w / 2 || ly + 3 < g.y - g.h / 2 || ly - 12 > g.y + g.h / 2);
}

function drawER(spec, opt) {
    opt = opt || {};
    const step = opt.step === undefined ? 99 : opt.step;
    const vis = (o, def) => (o.step === undefined ? (def || 0) : o.step) <= step;
    const hl = opt.highlight || null; // id resaltado
    const svg = mk("svg", { viewBox: opt.viewBox || `0 0 ${spec.w} ${spec.h}`, role: "img", "aria-label": opt.label || "Diagrama entidad/relación", class: "er" });
    const defs = mk("defs", {}, svg);
    const arrow = (id, cls) => { const m = mk("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, defs); mk("path", { d: "M0,0 L10,5 L0,10 z", class: cls }, m); };
    const uid = "m" + Math.random().toString(36).slice(2, 8);
    arrow(uid + "a", "mk-ink"); arrow(uid + "r", "mk-red");
    const gE = mk("g", {}, svg), gS = mk("g", {}, svg), gL = mk("g", {}, svg);

    const EG = {};
    spec.ents.forEach(e => {
        const label = e.label || e.id;
        const w = Math.max(tw(label, F_ENT) + 28, 86), h = 36;
        EG[e.id] = { x: e.x, y: e.y, w, h, e };
    });
    const RG = {};
    spec.rels.forEach(r => {
        const w = Math.max(tw(r.label || r.n, F_REL) + 42, 92), h = r.dep ? 56 : 50;
        RG[r.id || r.n] = { x: r.x, y: r.y, w, h, r };
    });

    // ---------- atributos (piruletas)
    function lollipops(g, attrs, isRel, stepDef) {
        const sides = { t: [], b: [], l: [], r: [] };
        (attrs || []).forEach(a => { if (vis(a, stepDef)) sides[a.side || "t"].push(a); });
        const dot = (cx, cy, a) => {
            const c = mk("circle", { cx, cy, r: 4.6, class: a.pk ? "dot pk" : "dot" }, gS);
            if (a.ia) { mk("path", { d: `M${cx},${cy - 4.6} A4.6,4.6 0 0 1 ${cx},${cy + 4.6} Z`, class: "dot-half" }, gS); }
            return c;
        };
        const label = a => (a.der ? "D · " : "") + a.n + (a.multi ? " (1,n)" : a.opt ? " (0,1)" : "");
        const stemCls = a => "stem" + (a.opt || a.multiOpt ? " dash" : "");
        ["t", "b"].forEach(sd => {
            const arr = sides[sd]; if (!arr.length) return;
            const s = sd === "t" ? -1 : 1;
            const y0 = g.y + s * g.h / 2;
            const need = Math.max(...arr.map(a => tw(label(a), (a.pk ? "700 " : "") + "11.5px Arial, sans-serif") / 2 + 14));
            const gap = arr.length > 1 ? Math.max((g.w - 24) / (arr.length - 1), need) : 0;
            const span = gap * (arr.length - 1);
            arr.forEach((a, i) => {
                const sh = arr[0].shift;
                const x = sh ? g.x + sh * (22 + gap * i) : arr.length === 1 ? g.x : g.x - span / 2 + gap * i;
                const len = (a.len || (i % 2 ? 34 : 18));
                const cy = y0 + s * len;
                const ys0 = g.dw ? g.y + s * (g.h / 2) * Math.max(0, 1 - Math.abs(x - g.x) / (g.dw / 2)) : y0;
                // en abanico: si el atributo cae fuera de la caja, la línea sale del borde en diagonal
                const xs = g.dw ? x : Math.max(g.x - g.w / 2 + 6, Math.min(g.x + g.w / 2 - 6, x));
                const L = Math.hypot(x - xs, cy - ys0) || 1;
                mk("line", { x1: xs, y1: ys0, x2: x - (x - xs) / L * 4.6, y2: cy - (cy - ys0) / L * 4.6, class: stemCls(a) }, gE);
                dot(x, cy, a);
                const t = tx(gL, x, cy + (s < 0 ? -9 : 18), label(a), "att" + (a.pk ? " pk" : ""));
                if (a.pk) t.setAttribute("text-decoration", "underline");
            });
        });
        ["l", "r"].forEach(sd => {
            const arr = sides[sd]; if (!arr.length) return;
            const s = sd === "l" ? -1 : 1;
            const x0 = g.x + s * (g.dw || g.w) / 2;
            arr.forEach((a, i) => {
                const sh = arr[0].shift;
                const y = sh ? g.y + sh * (17 + 19 * i) : g.y + (i - (arr.length - 1) / 2) * 19;
                const ys = Math.max(g.y - g.h / 2 + 5, Math.min(g.y + g.h / 2 - 5, y));
                const cx = x0 + s * (a.len || 26);
                const xs0 = g.dw ? g.x + s * (g.dw / 2) * Math.max(0, 1 - Math.abs(ys - g.y) / (g.h / 2)) : x0;
                mk("line", { x1: xs0, y1: ys, x2: cx - s * 4.6, y2: y, class: stemCls(a) }, gE);
                dot(cx, y, a);
                const t = tx(gL, cx + s * 9, y + 4, label(a), "att" + (a.pk ? " pk" : ""), s > 0 ? "start" : "end");
                if (a.pk) t.setAttribute("text-decoration", "underline");
            });
        });
    }

    // ---------- entidades
    spec.ents.forEach(e => {
        if (!vis(e, 1)) return;
        const g = EG[e.id];
        const cls = "ent" + (hl && hl === e.id ? " hl" : "");
        mk("rect", { x: g.x - g.w / 2, y: g.y - g.h / 2, width: g.w, height: g.h, class: cls }, gS);
        if (e.weak && vis({ step: e.weakStep }, 5)) mk("rect", { x: g.x - g.w / 2 + 4, y: g.y - g.h / 2 + 4, width: g.w - 8, height: g.h - 8, class: "ent inner" }, gS);
        tx(gS, g.x, g.y + 4.5, e.label || e.id, "ent-t");
        lollipops(g, e.attrs, false, 2);
    });

    // ---------- etiqueta de cardinalidad junto a la entidad
    function cardLbl(eg, from, s, role, sideSign) {
        const p = rBorder(eg, from.x, from.y);
        let ux = from.x - p.x, uy = from.y - p.y; const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
        const sg = sideSign || 1;
        const nx = -uy * sg, ny = ux * sg;
        let al = 16, lx, ly;
        do { lx = p.x + ux * al + nx * 13; ly = p.y + uy * al + ny * 13 + 4; al += 3; } while (boxHit(eg, lx, ly, s) && al < 70);
        tx(gL, lx, ly, s, "card");
        if (role) {
            const ra = al + 18 + (Math.abs(ux) > 0.6 ? tw(s, "700 11.5px Arial") : 0), rx = p.x + ux * ra + nx * 10, ry = p.y + uy * ra + ny * 10 + 4 + (Math.abs(nx) < 0.3 ? ny * 8 : 0);
            tx(gL, rx, ry, role, "role", nx > 0.3 ? "start" : nx < -0.3 ? "end" : "middle");
        }
    }

    // ---------- interrelaciones
    const LINE = {}; // puntos de las líneas entidad-rombo (para arcos de restricción)
    spec.rels.forEach(r => {
        if (!vis(r, 3)) return;
        const key = r.id || r.n;
        const g = RG[key];
        const showCard = vis({ step: r.cardStep }, 4);
        const cls = "rel" + (hl && hl === key ? " hl" : "");
        mk("polygon", { points: `${g.x},${g.y - g.h / 2} ${g.x + g.w / 2},${g.y} ${g.x},${g.y + g.h / 2} ${g.x - g.w / 2},${g.y}`, class: cls }, gS);
        if (r.dep && vis({ step: r.depStep }, 5)) {
            tx(gS, g.x, g.y - 8, r.dep, "dep");
            tx(gS, g.x, g.y + 7, r.label || r.n, "rel-t");
            if (showCard) tx(gS, g.x, g.y + 19, corr(r), "corr");
        } else {
            tx(gS, g.x, g.y + (showCard ? 0 : 4), r.label || r.n, "rel-t");
            if (showCard) tx(gS, g.x, g.y + 13, corr(r), "corr");
        }
        const ends = r.ends ? r.ends.map(e => [e.e, e.c, e.role]) : [[r.a, r.ca, r.roleA], [r.b, r.cb, r.roleB]];
        if (!r.ends && r.a === r.b) {
            const eg = EG[r.a];
            let ux = g.x - eg.x, uy = g.y - eg.y; const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
            [[1, r.ca, r.roleA], [-1, r.cb, r.roleB]].forEach(([s, c, role]) => {
                const off = { x: -uy * 30 * s, y: ux * 30 * s };
                const fake = { x: eg.x + off.x, y: eg.y + off.y, w: eg.w, h: eg.h };
                const b = rBorder(fake, g.x + off.x * 0.4, g.y + off.y * 0.4);
                const a = dBorder(g, b.x, b.y);
                mk("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gE);
                if (showCard) cardLbl({ ...eg, x: fake.x, y: fake.y }, a, c, role, s);
            });
        } else {
            ends.forEach(([id, c, role]) => {
                const eg = EG[id]; if (!eg || !vis(eg.e, 1)) return;
                const a = dBorder(g, eg.x, eg.y), b = rBorder(eg, g.x, g.y);
                mk("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gE);
                LINE[key + "|" + id] = { a, b };
                if (showCard) cardLbl(eg, a, c, role, r.flip && r.flip[id] ? -1 : 1);
            });
        }
        lollipops({ x: g.x, y: g.y, w: g.w * 0.62, h: g.h, dw: g.w }, r.attrs, true, 5);
    });

    // ---------- jerarquías
    (spec.hier || []).forEach(h => {
        if (!vis(h, 6)) return;
        const sg = EG[h.sup];
        const up = h.dir === "up", baseY = up ? h.y + 12 : h.y - 12, apexY = up ? h.y - 15 : h.y + 15;
        mk("polygon", { points: `${h.x - 19},${baseY} ${h.x + 19},${baseY} ${h.x},${apexY}`, class: "tri" }, gS);
        const sp = rBorder(sg, h.x, baseY);
        mk("line", { x1: sp.x, y1: sp.y, x2: h.x, y2: baseY, class: "edge" }, gE);
        if (h.total) mk("circle", { cx: (sp.x + h.x) / 2, cy: (sp.y + baseY) / 2, r: 5, class: "tri" }, gS);
        const angs = [];
        h.subs.forEach(id => {
            const eg = EG[id]; const b = rBorder(eg, h.x, apexY);
            mk("line", { x1: h.x, y1: apexY, x2: b.x, y2: b.y, class: "edge" }, gE);
            angs.push(Math.atan2(b.y - apexY, b.x - h.x));
        });
        if (h.excl && angs.length > 1) {
            const R = 26, a1 = Math.min(...angs), a2 = Math.max(...angs);
            mk("path", { d: `M${h.x + R * Math.cos(a1)},${apexY + R * Math.sin(a1)} A${R},${R} 0 0 1 ${h.x + R * Math.cos(a2)},${apexY + R * Math.sin(a2)}`, class: "edge" }, gE);
        }
        if (h.label !== false) tx(gL, h.x + 26, h.y + 2, h.label || ((h.total ? "total" : "parcial") + " · " + (h.excl ? "exclusiva" : "solapada")), "hlab", "start");
    });

    // ---------- restricciones entre interrelaciones
    (spec.cons || []).forEach(c => {
        if (!vis(c, 6)) return;
        const g1 = RG[c.r1], g2 = RG[c.r2];
        if (c.kind === "exclusion" || c.kind === "inclusion") {
            const p1 = dBorder(g1, g2.x, g2.y), p2 = dBorder(g2, g1.x, g1.y);
            const a = { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "cons dash" };
            if (c.kind === "inclusion") a["marker-end"] = `url(#${uid}r)`;
            mk("line", a, gE);
            if (c.label) tx(gL, (p1.x + p2.x) / 2 + (c.lx || 8), (p1.y + p2.y) / 2 + (c.ly || 4), c.label, "clab", c.lx < 0 ? "end" : "start");
        } else {
            // arco que corta las dos líneas que salen de la entidad
            const L1 = LINE[c.r1 + "|" + c.ent], L2 = LINE[c.r2 + "|" + c.ent];
            if (!L1 || !L2) return;
            const d = c.dist || 38;
            const at = (L) => { const ux = L.a.x - L.b.x, uy = L.a.y - L.b.y, l = Math.hypot(ux, uy); return { x: L.b.x + ux / l * d, y: L.b.y + uy / l * d }; };
            const p1 = at(L1), p2 = at(L2);
            const eg = EG[c.ent];
            const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
            let vx = mx - eg.x, vy = my - eg.y; const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
            const bulge = c.bulge || 26;
            const cx = mx + vx * bulge, cy = my + vy * bulge;
            // extender el arco un poco más allá de las líneas
            const ext = (p, q) => ({ x: p.x + (p.x - q.x) * 0.12, y: p.y + (p.y - q.y) * 0.12 });
            const s1 = ext(p1, p2), s2 = ext(p2, p1);
            const a = { d: `M${s1.x},${s1.y} Q${cx},${cy} ${s2.x},${s2.y}`, class: "cons" };
            if (c.kind === "inclusividad") a["marker-end"] = `url(#${uid}r)`;
            mk("path", a, gE);
            if (c.label) tx(gL, cx + vx * 14 + (c.lx || 0), cy + vy * 14 + 4 + (c.ly || 0), c.label, "clab");
        }
    });
    return svg;
}

// Dibuja ajustando el viewBox al contenido real (mide el diagrama completo
// una vez, para que el encuadre no salte al ir paso a paso).
function drawFit(spec, opt) {
    opt = Object.assign({}, opt);
    if (!spec._vb) {
        const full = drawER(spec, { step: 99, viewBox: "0 0 10 10" });
        const host = document.createElement("div");
        host.style.cssText = "position:absolute;left:-9999px;top:0;width:2000px;visibility:hidden";
        host.appendChild(full); document.body.appendChild(host);
        let bb; try { bb = full.getBBox(); } catch (e) { bb = null; }
        host.remove();
        const p = 14;
        spec._vb = bb && bb.width ? [bb.x - p, bb.y - p, bb.width + 2 * p, bb.height + 2 * p].map(Math.round) : [0, 0, spec.w || 900, spec.h || 600];
    }
    opt.viewBox = spec._vb.join(" ");
    const svg = drawER(spec, opt);
    svg.dataset.w = spec._vb[2];
    svg.style.maxWidth = Math.round(spec._vb[2] * 1.1) + "px";
    svg.style.marginInline = "auto";
    return svg;
}

if (typeof STATE !== "undefined") STATE.exStep = 99;
// =====================================================================
//  EJERCICIOS NUEVOS (19º–23º): restricciones entre interrelaciones,
//  débil por existencia y atributo derivado.
//  Atributo derivado: sufijo ~  ·  cons: { a, b, kind, mark, ent }

EXERCISES.push(
{
 id: 19, page: null, title: "Becas y proyectos de investigación", tags: ["exclusividad", "1:1", "1:N"],
 text: `Una universidad quiere controlar la financiación de su personal investigador.
De cada departamento se guarda su código y su nombre. Todo profesor pertenece a un único departamento y en cada departamento hay al menos un profesor. De los profesores se conoce su DNI, nombre y categoría.
La universidad concede becas, de las que se guarda un código, el organismo que la financia y el importe. Cada beca se concede como mucho a un profesor (puede quedar vacante) y un profesor puede disfrutar como mucho de una beca. Interesa saber la fecha de inicio de la beca.

// =====================================================================
//  LOS 18 EJERCICIOS EN NOTACIÓN DE PAPEL
//  Convierte el formato de EXERCISES (atributos dentro de la caja) al
//  formato de drawER (piruletas), eligiendo el lado libre de cada entidad.
// =====================================================================
// Ajustes manuales por ejercicio: { ENTIDAD: "l" | "r" | "t" | "b" | "lr" | "tb" }
const ATTR_SIDE = {
    2: { PERSONA: "l" },
    19: { PROFESOR: "l" },
    21: { ASIGNATURA: "t" },
    23: { MASCOTA: "t" },
    16: { PARTIDA: "l", PARTICIPANTE: "b" },
    17: { SOLAR: "b", HIDROELECTRICA: "b", RED: "b" },
    18: { CONFLICTO: "l", Media: "tb" }
};

const SHIFT = { t: -1, b: 1, r: -1, l: 1 };
function paperAttr(raw, side, used) {
    const a = parseAttr(raw);
    const o = { n: a.comp ? a.n + " (" + a.comp.join(", ") + ")" : a.n, pk: a.pk, opt: a.nul, multi: a.multi, ia: a.uq && !a.pk, der: a.der, side };
    // lado compartido con una línea: los atributos se apartan hacia el lado contrario a la cardinalidad
    if (used && used[side] >= 1) o.shift = SHIFT[side];
    return o;
}
function sideOf(g, x, y) {
    const dx = x - g.x, dy = y - g.y;
    if (Math.abs(dx) / (g.w / 2) > Math.abs(dy) / (g.h / 2)) return dx > 0 ? "r" : "l";
    return dy > 0 ? "b" : "t";
}
// Devuelve la lista de lados (uno por atributo) repartiendo según la capacidad de cada lado.
function pickSides(g, used, n, forced, isRel) {
    if (!n) return [];
    if (forced) { const f = forced.split(""); const per = Math.ceil(n / f.length); return Array.from({ length: n }, (_, i) => f[Math.min(f.length - 1, Math.floor(i / per))]); }
    const capTB = isRel ? 1 : Math.max(2, Math.floor((g.w + 10) / 62));
    const capLR = isRel ? 3 : 6;
    const cap = s => (s === "t" || s === "b") ? capTB : capLR;
    const pref = n > capTB ? ["r", "l", "t", "b"] : ["t", "b", "r", "l"];
    const score = x => (used[x] || 0);
    let pool = pref.filter(x => score(x) === 0);
    if (!pool.length) pool = pref.filter(x => score(x) < 1);
    if (!pool.length) pool = [pref.slice().sort((x, y) => score(x) - score(y))[0]];
    // si un solo lado libre basta (aunque se abra en abanico), usar solo ese
    const out = []; let left = n;
    const caps = pool.map(cap), total = caps.reduce((p, c) => p + c, 0);
    if (caps[0] >= n || pool.length === 1) return Array(n).fill(pool[0]);
    pool.forEach((s, i) => {
        const take = i === pool.length - 1 ? left : Math.min(left, Math.max(caps[i], Math.round(n * caps[i] / total)));
        for (let k = 0; k < take; k++) out.push(s);
        left -= take;
    });
    return out;
}

const PAPER_CACHE = new WeakMap();
function paperSpec(ex, mode) {
    if (!PAPER_CACHE.has(ex)) PAPER_CACHE.set(ex, {});
    const C = PAPER_CACHE.get(ex);
    if (C[mode]) return C[mode];
    const keep = raw => mode === "all" || (mode === "keys" && raw.startsWith("#"));
    const G = {};
    ex.ents.forEach(e => {
        const label = e.label || e.id;
        G[e.id] = { x: e.x, y: e.y, w: Math.max(tw(label, F_ENT) + 28, 86), h: 36, used: {} };
    });
    const R = {};
    ex.rels.forEach(r => { R[r.id || r.n] = { x: r.x, y: r.y, w: Math.max(tw(r.label || r.n, F_REL) + 42, 92), h: 50, used: {} }; });
    const mark = (g, x, y) => {
        const s = sideOf(g, x, y); g.used[s] = (g.used[s] || 0) + 1;
        // si la línea llega cerca de una esquina, su cardinalidad invade también el lado contiguo
        const p = rBorder(g, x, y);
        if ((s === "t" || s === "b") && Math.abs(p.x - g.x) > g.w / 2 - 26) { const o = p.x > g.x ? "r" : "l"; g.used[o] = (g.used[o] || 0) + 0.5; }
        if ((s === "l" || s === "r") && Math.abs(p.y - g.y) > g.h / 2 - 6) { const o = p.y > g.y ? "b" : "t"; g.used[o] = (g.used[o] || 0) + 0.5; }
    };
    ex.rels.forEach(r => {
        const rg = R[r.id || r.n];
        const ends = r.ends ? r.ends.map(e => e.e) : [r.a, r.b];
        ends.forEach(id => { if (G[id]) { mark(G[id], r.x, r.y); mark(rg, G[id].x, G[id].y); } });
    });
    (ex.hier || []).forEach(h => {
        mark(G[h.sup], h.x, h.y);
        h.subs.forEach(s => mark(G[s], h.x, h.y));
    });
    const forced = (ex.id && ATTR_SIDE[ex.id]) || {};
    const ents = ex.ents.map(e => {
        const list = (e.attrs || []).filter(keep);

function cardMethodHTML(ex) {

   <li><b>Escribe el par (mín,máx) junto a la otra entidad</b>, la que estás contando, no la que elegiste en el paso 1. Es la convención de tus apuntes.</li>
   <li><b>Repite en el sentido contrario y junta los máximos</b> (ignora los mínimos): 1 y 1 → <b>1:1</b> · 1 y n → <b>1:N</b> · n y n → <b>N:M</b>.</li>

<script>

//  UTILIDADES

}

// =====================================================================

function renderERBoxes(ex, opts) {
    const mode = opts.attrs;                    // all | keys | none
    const hidden = opts.hidden || (() => false); // (relIndex) => ocultar cardinalidades

                grow(lx - 22, ly - 12, lx + 22, ly + 4);
                if (role) {
                    const vertical = Math.abs(vy) > Math.abs(vx);
                    const al = vertical ? along + 24 : along + 2, pp = vertical ? 14 : 28;
                    const rx = b.x + vx * al + (-vy) * pp * s, ry = b.y + vy * al + vx * pp * s + 4;
                    txt(gLabels, rx, ry, role, "role-lbl");
                    grow(rx - 34, ry - 12, rx + 34, ry + 4);
                }
            });
        } else {
            [[r.a, r.ca], [r.b, r.cb]].forEach(([id, c]) => {
                const eg = EG[id]; connected.push(eg);
                const a = diamondBorder(g, eg.x, eg.y), b = rectBorder(eg, g.x, g.y);
                el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" }, gEdges);
                cardLabel(eg, g, q ? "(?,?)" : c, q, id === r.a ? r.roleA : r.roleB);
            });
        }
        drawRelAttrs(r, g, connected);
    });

    // --- jerarquías
    (ex.hier || []).forEach(h => {
        const sg = EG[h.sup];
        const up = h.dir === "up";
        const hx = h.x, hy = h.y;
        const baseY = up ? hy + 12 : hy - 12, apexY = up ? hy - 15 : hy + 15;
        el("polygon", { points: `${hx - 19},${baseY} ${hx + 19},${baseY} ${hx},${apexY}`, class: "h-tri" }, gShapes);
        const sp = rectBorder(sg, hx, baseY);
        el("line", { x1: sp.x, y1: sp.y, x2: hx, y2: baseY, class: "h-edge" }, gEdges);
        if (h.total) {
            const mx = (sp.x + hx) / 2, my = (sp.y + baseY) / 2;
            el("circle", { cx: mx, cy: my, r: 5, class: "h-tri" }, gShapes);
        }
        const angs = [];
        h.subs.forEach(id => {
            const eg = EG[id];
            const b = rectBorder(eg, hx, apexY);
            el("line", { x1: hx, y1: apexY, x2: b.x, y2: b.y, class: "h-edge" }, gEdges);
            angs.push(Math.atan2(b.y - apexY, b.x - hx));
        });
        if (h.excl && angs.length > 1) {
            const R = 26, a1 = Math.min(...angs), a2 = Math.max(...angs);
            const p1 = { x: hx + R * Math.cos(a1), y: apexY + R * Math.sin(a1) };
            const p2 = { x: hx + R * Math.cos(a2), y: apexY + R * Math.sin(a2) };
            el("path", { d: `M${p1.x},${p1.y} A${R},${R} 0 0 1 ${p2.x},${p2.y}`, class: "h-edge" }, gEdges);
        }
        const lab = h.label || ((h.total ? "total" : "parcial") + ", " + (h.excl ? "exclusiva" : "solapada"));
        txt(gLabels, hx + 26, hy + 4, lab, "h-lbl", "start");
        grow(hx - 30, hy - 30, hx + 30 + textW(lab, 10.5), hy + 30);
    });

    // --- restricciones entre interrelaciones
    (ex.cons || []).forEach(c => {
        const a = RG[c.a], b = RG[c.b];
        el("path", { d: `M${a.x + a.w / 2},${a.y} L${b.x - b.w / 2},${b.y}`, class: "c-edge" }, gEdges);
        txt(gLabels, (a.x + b.x) / 2, Math.min(a.y, b.y) - 28, c.label, "c-lbl");
    });

    const pad = 18;
    const vb = [bounds.x1 - pad, bounds.y1 - pad, bounds.x2 - bounds.x1 + pad * 2, bounds.y2 - bounds.y1 + pad * 2];
    svg.setAttribute("viewBox", vb.join(" "));
    svg.setAttribute("width", Math.round(vb[2]));
    svg.setAttribute("height", Math.round(vb[3]));
    return svg;
}

function sqlType(n) {
    n = n.toLowerCase();
    if (n === "dia_hora") return "DATETIME";
    if (n === "hora") return "TIME";
    if (n === "jugada") return "CHAR(5)";
    if (/^fecha|_fecha|^antiguedad/.test(n)) return "DATE";
    if (/precio|salario|coste|cuantia|fianza|senal|importe/.test(n)) return "DECIMAL(10,2)";
    if (/^(principal|puerta_grande|hipotecado|licencia_apertura|con_receta|obligatorio|exterior|titulacion|capacitado)$/.test(n)) return "BOOLEAN";
    if (/^(cuota|presupuesto)$/.test(n)) return "DECIMAL(10,2)";
    if (n === "nota") return "DECIMAL(4,2)";
    if (n === "fecha_hora") return "DATETIME";
    if (/^km_/.test(n)) return "DECIMAL(7,2)";
    if (/^(saldo|limite_credito)$/.test(n)) return "DECIMAL(12,2)";
    if (n === "descuento") return "DECIMAL(5,2)";
    if (/^monto/.test(n)) return "DECIMAL(10,2)";
    if (n === "existencias") return "INT";
    if (n === "rut") return "VARCHAR(12)";
    if (n === "pagina_web") return "VARCHAR(255)";
    if (n === "creditos") return "INT";
    if (n === "cubierta") return "BOOLEAN";
    if (n === "curso_academico") return "CHAR(9)";
    if (n === "diagnostico") return "VARCHAR(255)";
    if (/^(dni|nif)/.test(n)) return "CHAR(9)";
    if (/^nss/.test(n)) return "CHAR(12)";
    if (/^(num_|cod_|n_|anio|orejas|rabos|aforo|m2|stock|unidades|reactores|turbinas|hornos|habitaciones|banos|nivel|capacidad|entradas|muertos|heridos|bajas|barcos|tanques|aviones|hombres|personas|duracion|cantidad|volumen|vol_|prod_|horas_sol|superficie|ocupacion|consumo|longitud|orden_|plazas|total$|capacidad_destructiva)/.test(n)) return "INT";
    if (/telefono|fax/.test(n)) return "VARCHAR(15)";
    if (/descripcion|comentario|apoyos|direccion|experiencia/.test(n)) return "VARCHAR(255)";
    return "VARCHAR(100)";
}

function buildSchema(ex) {
    const E = {}; ex.ents.forEach(e => { E[e.id] = e; });
    const superOf = {}; (ex.hier || []).forEach(h => h.subs.forEach(s => { superOf[s] = h.sup; }));
    const ownerOf = {}, ownerRel = {}; ex.rels.forEach(r => { if (r.dep === "ID") { ownerOf[r.b] = r.a; ownerRel[r.b] = r; } });

    const pkMemo = {};
    function pkCols(id) { // [{n, type}]
        if (pkMemo[id]) return pkMemo[id];
        let res;
        const own = (E[id].attrs || []).map(parseAttr).filter(a => a.pk && !a.multi).map(a => ({ n: a.n, type: sqlType(a.n) }));
        if (superOf[id]) res = pkCols(superOf[id]);
        else if (ownerOf[id]) res = pkCols(ownerOf[id]).concat(own);
        else res = own;
        pkMemo[id] = res;
        return res;
    }

    const T = {}; const order = [];
    function table(name, src) { if (!T[name]) { T[name] = { name, cols: [], fks: [], uniq: [], checks: [], src }; order.push(name); } return T[name]; }
    function addCol(t, c) {
        if (t.cols.some(x => x.n === c.n)) return false;
        t.cols.push(c); return true;
    }
    function freeName(t, base, suffix) {
        if (!t.cols.some(c => c.n === base)) return base;
        let n = base + "_" + suffix; let i = 2;
        while (t.cols.some(c => c.n === n)) n = base + "_" + suffix + (i++);
        return n;
    }
    function addFK(t, refId, opts) {
        // opts: {pk, nul, rename, suffix, role, uniq}
        const ref = pkCols(refId);
        const names = ref.map(rc => {
            let n = (opts.rename && opts.rename[rc.n]) || (opts.role ? rc.n + "_" + opts.role : rc.n);
            n = freeName(t, n, opts.suffix || refId.toLowerCase());
            addCol(t, { n, type: rc.type, pk: !!opts.pk, nul: !!opts.nul, fk: true });
            return n;
        });
        const del = opts.pk || opts.cascade ? "C" : opts.nul ? "N" : "R";
        t.fks.push({ cols: names, ref: refId, refcols: ref.map(r => r.n), del, upd: "C",
                     kind: opts.kind || "assoc", pm: opts.pm || (opts.nul ? "0..1" : "1"), cm: opts.cm || "0..*", rel: opts.rel || "" });
        if (opts.uniq) t.uniq.push(names);
        return names;
    }

    // 1) entidades
    ex.ents.forEach(e => {
        const t = table(e.id, "entidad" + (e.weak ? " débil" : "") + (superOf[e.id] ? " (subtipo de " + superOf[e.id] + ")" : ""));
        if (superOf[e.id]) addFK(t, superOf[e.id], { pk: true, kind: "gen", pm: "1", cm: "0..1", rel: "es un" });
        else if (ownerOf[e.id]) addFK(t, ownerOf[e.id], { pk: true, kind: "comp", pm: "1", cm: mult(ownerRel[e.id].cb), rel: ownerRel[e.id].n });
        (e.attrs || []).map(parseAttr).forEach(a => {
            if (a.multi || a.der) return;
            if (a.comp) { a.comp.forEach(c => addCol(t, { n: c, type: sqlType(c), nul: a.nul })); return; }
            addCol(t, { n: a.n, type: sqlType(a.n), pk: a.pk, nul: a.nul });
            if (a.uq) t.uniq.push([a.n]);
        });
    });
    // 2) atributos multivaluados
    ex.ents.forEach(e => {
        (e.attrs || []).map(parseAttr).filter(a => a.multi).forEach(a => {
            const t = table(e.id + "_" + a.n.toUpperCase(), "atributo multivaluado de " + e.id);
            addFK(t, e.id, { pk: true, kind: "comp", pm: "1", cm: "1..*", rel: "multivaluado" });
            addCol(t, { n: a.n, type: sqlType(a.n), pk: true });
        });
    });
    // 3) interrelaciones
    function relAttrs(t, r, forcePk, allNull) {
        (r.attrs || []).map(parseAttr).forEach(a => {
            addCol(t, { n: freeName(t, a.n, r.n.toLowerCase()), type: sqlType(a.n), pk: forcePk && a.pk, nul: a.nul || !!allNull });
        });
    }
    ex.rels.forEach(r => {
        if (r.dep === "ID") return;
        const tName = (r.table || r.n).toUpperCase();
        if (r.ends) {
            const t = table(tName, "interrelación ternaria " + r.n);
            const pkSet = r.pk || r.ends.map(e => e.e);
            r.ends.forEach(end => addFK(t, end.e, { pk: pkSet.includes(end.e), role: end.col, rename: end.rename, pm: "1", cm: "0..*", rel: r.n }));
            relAttrs(t, r, true);
            return;
        }
        const A = parseCard(r.ca), B = parseCard(r.cb);
        if (r.a === r.b) {
            if (A.max > 1 && B.max > 1) {
                const t = table(tName, "interrelación reflexiva N:M " + r.n);
                const c1 = addFK(t, r.a, { pk: true, role: r.roleA, suffix: r.roleA, cm: mult(r.cb), rel: r.n + " (" + r.roleA + ")" });
                const c2 = addFK(t, r.a, { pk: true, role: r.roleB, suffix: r.roleB, cm: mult(r.ca), rel: r.n + " (" + r.roleB + ")" });
                if (c1.length === 1) t.checks.push({ expr: `${c1[0]} <> ${c2[0]}`, why: `Reflexiva ${r.n}: un ${r.a} no puede relacionarse consigo mismo.`, auto: true });
                relAttrs(t, r, true);
            } else {
                const t = T[r.a];
                const nulR = A.min === 0 || !!r.nullable;
                const cR = addFK(t, r.a, { nul: nulR, role: r.roleA, suffix: r.roleA, uniq: B.max === 1, pm: mult(r.ca), cm: mult(r.cb), rel: r.n });
                const own = pkCols(r.a);
                if (cR.length === 1 && own.length === 1) t.checks.push({ expr: `${cR[0]} <> ${own[0].n}`, why: `Reflexiva ${r.n}: un ${r.a} no puede ser su propio ${r.roleA}.`, auto: true });
                relAttrs(t, r, false, A.min === 0 || r.nullable);
            }
            return;
        }
        if (A.max > 1 && B.max > 1) {
            const t = table(tName, "interrelación N:M " + r.n);
            addFK(t, r.a, { pk: true, rename: r.renameA || r.rename, cm: mult(r.cb), rel: r.n });
            addFK(t, r.b, { pk: true, rename: r.renameB || r.rename, cm: mult(r.ca), rel: r.n });
            relAttrs(t, r, true);
            return;
        }
        let inT, refId, refCard, refS, othS;
        if (A.max === 1 && B.max > 1) { inT = r.b; refId = r.a; refCard = A; refS = r.ca; othS = r.cb; }
        else if (B.max === 1 && A.max > 1) { inT = r.a; refId = r.b; refCard = B; refS = r.cb; othS = r.ca; }
        else { inT = r.fkIn || r.b; refId = inT === r.a ? r.b : r.a; refCard = inT === r.a ? B : A; refS = inT === r.a ? r.cb : r.ca; othS = inT === r.a ? r.ca : r.cb; }
        const t = T[inT];
        const oneToOne = A.max === 1 && B.max === 1;
        const nul = refCard.min === 0 || !!r.nullable;
        addFK(t, refId, { nul, rename: r.rename, suffix: r.n.toLowerCase(), uniq: oneToOne, pm: mult(refS), cm: mult(othS), rel: r.n, cascade: r.dep === "E" });
        relAttrs(t, r, false, nul);
    });
    // restricción de inclusión entre dos tablas → clave ajena compuesta (si la clave de la tabla incluyente coincide)
    (ex.cons || []).filter(c => c.kind === "inclusion").forEach(c => {
        const rA = ex.rels.find(r => (r.id || r.n) === c.a), rB = ex.rels.find(r => (r.id || r.n) === c.b);
        const t1 = T[(rA.table || rA.n).toUpperCase()], t2 = T[(rB.table || rB.n).toUpperCase()];
        if (!t1 || !t2) return;
        const pk2 = t2.cols.filter(x => x.pk).map(x => x.n);
        if (pk2.every(n => t1.cols.some(x => x.n === n))) {
            t1.fks.push({ cols: pk2, ref: t2.name, refcols: pk2, del: "C", upd: "C", kind: "assoc", pm: "1", cm: "0..*", rel: "inclusión" });
        }
    });
    // pk primero
    order.forEach(n => { const t = T[n]; t.cols.sort((a, b) => (b.pk ? 1 : 0) - (a.pk ? 1 : 0)); });
    const extra = (typeof CONSTRAINTS !== "undefined" && CONSTRAINTS[ex.id]) || {};
    (extra.checks || []).forEach(([tn, expr, why]) => { if (!T[tn]) throw new Error("CHECK en tabla inexistente " + tn); T[tn].checks.push({ expr, why }); });
    return order.map(n => T[n]);
}

function schemaHTML(tables) {
    return tables.map(t => {
        const fkCols = new Set(t.fks.flatMap(f => f.cols));
        const uqCols = new Set(t.uniq.filter(u => u.length === 1).flat());
        const cols = t.cols.map(c => {
            let cls = []; if (c.pk) cls.push("pk"); if (fkCols.has(c.n)) cls.push("fk"); if (uqCols.has(c.n) && !c.pk) cls.push("uq");
            return `<span class="${cls.join(" ")}">${esc(c.n)}</span>${c.nul ? "*" : ""}`;
        }).join(", ");
        const fks = t.fks.map(f => `<div class="fkl">${esc(f.cols.join(", "))} → ${esc(f.ref)} &nbsp;(B:${f.del}, M:${f.upd})</div>`).join("");
        return `<div class="tbl"><span class="tn">${esc(t.name)}</span> (${cols})${fks}</div>`;
    }).join("");
}

function dbName(title) {
    return title.replace(/^Ejercicio \d+º - /, "").normalize("NFD").replace(/[̀-ͯ]/g, "")
        .toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40) || "ejercicio";
}

// Convención de clase:
//   pk_tabla · fk_tabla_tablareferenciada · ck_tabla_campo · uk_tabla_campo
//   todo en minúsculas · PK simple en línea («col int primary key»)
//   on delete/update cascade solo cuando la FK forma parte de la PK (débil, N:M, subtipo, multivaluado)
function schemaSQL(tables, title) {
    const created = new Set(); const out = []; const later = [];
    const pending = tables.slice();
    const ordered = [];
    let guard = 0;
    while (pending.length && guard++ < 500) {
        const i = pending.findIndex(t => t.fks.every(f => f.ref === t.name || created.has(f.ref)));
        const t = i >= 0 ? pending.splice(i, 1)[0] : pending.shift();
        ordered.push(t); created.add(t.name);
    }
    const done = new Set();
    ordered.forEach(t => {
        const tn = t.name.toLowerCase();
        const used = new Set();
        const uniqName = base => { let n = base, k = 2; while (used.has(n)) n = base + "_" + (k++); used.add(n); return n; };
        const pkCols = t.cols.filter(c => c.pk);
        const inlinePk = pkCols.length === 1;
        const fkCols = new Set(t.fks.flatMap(f => f.cols));
        const lines = t.cols.map(c => {
            let l = `${c.n} ${c.type.toLowerCase()}`;
            if (c.pk && inlinePk) l += " primary key";
            else if (!c.pk && !c.nul && fkCols.has(c.n)) l += " not null";
            return l;
        });
        if (!inlinePk) lines.push(`constraint ${uniqName("pk_" + tn)} primary key (${pkCols.map(c => c.n).join(", ")})`);
        t.uniq.forEach(u => lines.push(`constraint ${uniqName("uk_" + tn + "_" + u[0])} unique (${u.join(", ")})`));
        t.fks.forEach(f => {
            const ref = f.ref.toLowerCase();
            let name = "fk_" + tn + "_" + ref;
            if (used.has(name)) name = name + "_" + f.cols[0];
            name = uniqName(name);
            let def = `constraint ${name} foreign key (${f.cols.join(", ")}) references ${ref}(${f.refcols.join(", ")})`;
            if (f.del === "C") def += "\n\ton delete cascade on update cascade";
            else if (f.del === "N") def += "\n\ton delete set null on update cascade";
            if (f.ref === t.name || done.has(f.ref)) lines.push(def);
            else later.push(`alter table ${tn} add ${def};`);
        });
        (t.checks || []).forEach(c => {
            const col = t.cols.map(x => x.n).filter(n => new RegExp("\\b" + n + "\\b").test(c.expr))
                .sort((a, b) => c.expr.search(new RegExp("\\b" + a + "\\b")) - c.expr.search(new RegExp("\\b" + b + "\\b")))[0] || "chk";
            const expr = c.expr.replace(/\b(IS NOT NULL|IS NULL|NOT|AND|OR|IN|BETWEEN)\b/g, m => m.toLowerCase());
            lines.push(`constraint ${uniqName("ck_" + tn + "_" + col)} check (${expr})`);
        });
        out.push(`create table ${tn}(\n${lines.join(",\n")}\n);`);
        done.add(t.name);
    });
    const db = dbName(title);
    let sql = `-- ${title}\n-- Generado a partir del diagrama E/R (MySQL / MariaDB)\n\ndrop database if exists ${db};\ncreate database ${db};\nuse ${db};\n\n` + out.join("\n\n");
    if (later.length) sql += "\n\n-- Claves ajenas que forman un ciclo: se añaden al final\n" + later.join("\n");
    return sql + "\n";
}

const STATE = {

};

function setTab(t) {
    STATE.tab = t; lsSet("er-tab", t);

        $("view-" + k).hidden = t !== k;

function selectExercise(id) {

}
function buildPicker() {
