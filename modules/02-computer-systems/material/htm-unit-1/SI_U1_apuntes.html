<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bitsHTML = (s, cls) => `<span class="bits">${[...s].map((c, i) => c === " " ? '<span class="gap"></span>' : `<span class="${cls ? cls(i) : (c === "1" ? "one" : "")}">${c}</span>`).join("")}</span>`;
const group = (s, n) => { const out = []; for (let i = s.length; i > 0; i -= n) out.unshift(s.slice(Math.max(0, i - n), i)); return out; };
const sub = (n, b) => `${n}<sub>(${b}</sub>`;

// =====================================================================
//  APUNTES
// =====================================================================
function renderNotes() {
 const toc = [["h", "1. Historia"], ["a", "2. Arquitectura"], ["vn", "2.1 Von Neumann"], ["cpu", "2.1.1 CPU"], ["mem", "2.1.2 Memoria"], ["ri", "3. Representación"], ["med", "3.1 Medidas"], ["num", "3.2 Sistemas de numeración"], ["alf", "3.3 Codificación alfanumérica"], ["ent", "3.4 Enteros"], ["real", "3.5 Reales"]];
 $("v-notes").innerHTML = `
 <div class="toc">${toc.map(([id, t]) => `<a href="#n-${id}">${t}</a>`).join("")}</div>

 <div class="panel" id="n-h"><h2>1. Historia de los ordenadores</h2>
  <h3>Antes de la electrónica</h3>
  <div class="pre">
   <div><b>Ábaco</b><br>Primer instrumento para calcular.</div>
   <div><b>Pascalina</b> (máquina aritmética)<br>Realizaba <b>sumas y restas</b>.</div>
   <div><b>Máquina de Leibniz</b> (1671)<br>Realizaba las <b>cuatro operaciones</b> aritméticas.</div>
  </div>
  <div class="grid2" style="margin-top:8px">
   <div><h3>Máquinas mecánicas · Charles Babbage</h3><ul>
    <li><b>Máquina de diferencias</b>: funciones de 2.º grado con 6 cifras.</li>
    <li><b>Máquina analítica</b>: ejecutar cualquier operación <b>sin intervención humana</b> durante el cálculo (idea de ordenador programable).</li></ul></div>
   <div><h3>Máquinas electromecánicas</h3><ul>
    <li><b>Máquina tabuladora</b> de Herman Hollerith: usada en el <b>censo de EE. UU.</b></li>
    <li><b>Z1</b> de Konrad Zuse: calculadora mecánica <b>binaria</b> operada con electricidad y de programabilidad limitada.</li></ul></div>
  </div>
  <h3>Las cinco generaciones</h3>
  <div class="timeline">
   <div class="gen g1"><h4>1.ª</h4><div class="yr">1940–1959</div><div class="tech">Válvulas de vacío</div><ul><li>ENIAC, UNIVAC</li><li>Mucho calor, gran tamaño, poca capacidad</li><li>Lenguaje máquina y ensamblador</li><li>Monoprogramación, sin SO</li></ul></div>
   <div class="gen g2"><h4>2.ª</h4><div class="yr">1960–1965</div><div class="tech">Transistores</div><ul><li>ATLAS</li><li>Menor tamaño y calor, más fiable</li><li>FORTRAN, COBOL, ALGOL</li><li>Germen del SO: procesamiento por lotes</li></ul></div>
   <div class="gen g3"><h4>3.ª</h4><div class="yr">1965–1975</div><div class="tech">Circuitos integrados</div><ul><li>IBM 360 (primera familia compatible)</li><li>Supercomputador CDC 6600, minis PDP-8/PDP-11</li><li>Multiprogramación y tiempo compartido</li><li>Programación estructurada (Dijkstra, 1968)</li></ul></div>
   <div class="gen g4"><h4>4.ª</h4><div class="yr">1975–1990</div><div class="tech">Microprocesador</div><ul><li>Intel 4004 (1971), Pentium</li><li>Memorias de semiconductor, memoria virtual</li><li>C y Ada · UNIX · interfaces gráficas</li><li>Supercomputadores paralelos</li></ul></div>
   <div class="gen g5"><h4>5.ª</h4><div class="yr">1990–hoy</div><div class="tech">Paralelismo, biológica, cuántica</div><ul><li>Hardware: proceso en paralelo, computación biológica y cuántica</li><li>Software: lenguaje natural e inteligencia artificial</li><li>Caché de varios niveles</li></ul></div>
  </div>
  <div class="tscroll"><table class="tb">
   <tr><th></th><th>1.ª</th><th>2.ª</th><th>3.ª</th><th>4.ª</th><th>5.ª</th></tr>
   <tr><th>Tecnología</th><td>Válvulas de vacío</td><td>Transistor</td><td>C. integrados SSI–MSI</td><td>Microprocesadores LSI–VLSI–ULSI</td><td>Proceso en paralelo, biológica y cuántica</td></tr>
   <tr><th>Máquinas</th><td>ENIAC, UNIVAC</td><td>ATLAS</td><td>IBM 360</td><td>Intel 4004, Pentium</td><td>—</td></tr>
   <tr><th>Memoria</th><td>Tubos de Williams, tambores y cintas magnéticas</td><td>Núcleos de ferrita</td><td>Memorias en C.I., memoria caché</td><td>Memoria virtual</td><td>Caché de varios niveles</td></tr>
   <tr><th>Lenguajes</th><td>Máquina, ensamblador</td><td>Alto nivel: FORTRAN, COBOL</td><td>Alto nivel estructurados</td><td>Alto nivel: POO, lógica, funcional</td><td>Lenguaje natural</td></tr>
   <tr><th>Producto</th><td>Computador</td><td>Computador comercial</td><td>Minicomputador</td><td>Microcomputador</td><td>Multiprocesador</td></tr>
  </table></div>
  <div class="grid2">
   <div><h3>Piezas clave</h3><ul>
    <li><b>Tríodo o audión</b> (Lee de Forest, 1906): válvula con <b>cátodo</b> (filamento que emite electrones), <b>ánodo</b> (placa que los atrae) y <b>rejilla</b> entre ambos. Primer dispositivo que <b>amplificaba</b> la señal eléctrica.</li>
    <li><b>Transistor</b>: semiconductor que actúa como <b>amplificador o conmutador</b>. Sustituye al tríodo; forma puertas lógicas y memorias.</li>
    <li><b>Circuito integrado</b>: chip con muchos componentes (transistores, resistencias, diodos) embebidos en resina.</li>
    <li><b>Microprocesador</b>: un C.I. que contiene <b>toda la UCP</b>; millones de transistores en una placa de silicio.</li></ul></div>
   <div><h3>Niveles de integración (componentes por chip)</h3>
    <table class="tb"><tr><th>Sigla</th><th>Escala</th><th>Componentes</th></tr>
     <tr><td><b>SSI</b></td><td>Small · pequeña</td><td>&lt; 12</td></tr>
     <tr><td><b>MSI</b></td><td>Medium · media</td><td>12 – 99</td></tr>
     <tr><td><b>LSI</b></td><td>Large · grande</td><td>100 – 9 999</td></tr>
     <tr><td><b>VLSI</b></td><td>Very Large · muy grande</td><td>10 000 – 99 999</td></tr>
     <tr><td><b>ULSI</b></td><td>Ultra Large · ultra grande</td><td>≥ 100 000</td></tr></table>
    <p class="muted">Truco: S-M-L-VL-UL como las tallas de ropa.</p></div>
  </div>
  <div class="exam"><b>Para el examen:</b> relaciona cada generación con su <b>tecnología</b> (válvula → transistor → C.I. → microprocesador → paralelo/cuántica) y con un hito de software (sin SO → lotes → multiprogramación → UNIX/GUI → IA).</div>
 </div>

 <div class="panel" id="n-a"><h2>2. La arquitectura de los ordenadores</h2>
  <p>La <b>arquitectura</b> es la organización interna del ordenador. Incluye: <b>componentes y su organización</b>, <b>conjunto de instrucciones</b>, <b>estructura de las instrucciones</b> y <b>modos de direccionamiento</b>.</p>
  <div class="grid2">
   <div class="diabox"><b>Von Neumann</b> · una sola memoria para datos <u>e</u> instrucciones
    <svg class="dia" viewBox="0 0 360 150"><rect x="10" y="50" width="90" height="50" rx="6" fill="#c7d2fe" stroke="#1d2433"/><text x="55" y="80" text-anchor="middle" font-weight="700">CPU</text>
     <rect x="250" y="40" width="100" height="70" rx="6" fill="#bbf7d0" stroke="#1d2433"/><text x="300" y="70" text-anchor="middle" font-weight="700" font-size="12">MEMORIA</text><text x="300" y="88" text-anchor="middle" font-size="11">datos + instrucciones</text>
     <line x1="100" y1="75" x2="250" y2="75" stroke="#1d2433" stroke-width="5"/><text x="175" y="66" text-anchor="middle" font-size="11">un único bus</text>
     <text x="175" y="130" text-anchor="middle" font-size="11" fill="#c8322b">cuello de botella: datos e instrucciones se turnan</text></svg></div>
   <div class="diabox"><b>Harvard</b> · memorias y buses separados
    <svg class="dia" viewBox="0 0 360 150"><rect x="130" y="50" width="90" height="50" rx="6" fill="#c7d2fe" stroke="#1d2433"/><text x="175" y="80" text-anchor="middle" font-weight="700">CPU</text>
     <rect x="5" y="45" width="95" height="60" rx="6" fill="#fde68a" stroke="#1d2433"/><text x="52" y="72" text-anchor="middle" font-size="11" font-weight="700">MEMORIA</text><text x="52" y="88" text-anchor="middle" font-size="11">de datos</text>
     <rect x="255" y="45" width="100" height="60" rx="6" fill="#bbf7d0" stroke="#1d2433"/><text x="305" y="72" text-anchor="middle" font-size="11" font-weight="700">MEMORIA</text><text x="305" y="88" text-anchor="middle" font-size="11">de instrucciones</text>
     <line x1="100" y1="75" x2="130" y2="75" stroke="#1d2433" stroke-width="4"/><line x1="220" y1="75" x2="255" y2="75" stroke="#1d2433" stroke-width="4"/>
     <text x="175" y="130" text-anchor="middle" font-size="11" fill="#1f8a4c">lee instrucción y dato a la vez</text></svg></div>
  </div>

    <b>N<sub>i</sub></b> = n.º de instrucciones · <b>N<sub>ci</sub></b> = ciclos por instrucción · <b>F</b> = frecuencia del reloj (Hz).<br>

 <div class="panel" id="n-vn"><h2>2.1 La arquitectura de Von Neumann</h2>
  <ul><li>Estableció el <b>modelo básico</b> de los computadores digitales (<b>1946</b>).</li>
   <li>Idea clave: <b>programa almacenado</b> en memoria (antes los programas eran <b>cableados</b>).</li>
   <li>Las unidades están conectadas permanentemente y las coordina un <b>elemento de control</b>. Sigue vigente con modificaciones.</li></ul>
  <div class="diabox"><svg class="dia" viewBox="0 0 720 300">

   <rect x="150" y="60" width="100" height="60" rx="6" fill="#fde68a" stroke="#1d2433"/><text x="200" y="88" text-anchor="middle" font-weight="700">ALU</text><text x="200" y="105" text-anchor="middle" font-size="11">aritmético-lógica</text>
   <rect x="40" y="140" width="210" height="55" rx="6" fill="#fff" stroke="#1d2433"/><text x="145" y="165" text-anchor="middle" font-weight="700">Registros</text><text x="145" y="182" text-anchor="middle" font-size="11">almacenamiento interno · buses internos</text>

   <line x1="145" y1="220" x2="145" y2="284" stroke="#1d2433" stroke-width="2"/><line x1="145" y1="284" x2="270" y2="284" stroke="#1d2433" stroke-width="2"/>

  <table class="tb"><tr><th>Elemento funcional</th><th>Qué hace</th></tr>
   <tr><td><b>CPU</b> (unidad central de proceso)</td><td>El «cerebro»: controla el sistema y ejecuta las instrucciones.</td></tr>

 <div class="panel" id="n-cpu"><h2>2.1.1 La unidad central de proceso (CPU)</h2>
  <p>Controla todo el sistema, ejecuta las instrucciones de la memoria principal y procesa los datos. Hoy es un circuito integrado: el <b>procesador o microprocesador</b>.</p>
  <div class="grid2">
   <div><h3>Unidad de control (UC)</h3><ol><li><b>Busca</b> la instrucción en la MP.</li><li>La <b>interpreta</b> (decodifica).</li><li>La <b>ejecuta</b>, generando las señales de control y estado.</li></ol>
    <div class="key">Ciclo de instrucción: <b>búsqueda → decodificación → ejecución</b>, y vuelta a empezar.</div></div>
   <div><h3>Unidad aritmético-lógica (ALU)</h3><ul><li><b>Aritméticas</b>: suma, resta, multiplicación, división…</li><li><b>Lógicas</b>: NOT, AND, OR, XOR, comparaciones…</li></ul><p>Solo hace lo que le ordena la UC.</p></div>
   <div><h3>Registros</h3><p>Almacenamiento <b>interno</b> de la CPU: guardan temporalmente lo necesario para ejecutar las instrucciones. Es la memoria más rápida.</p></div>
   <div><h3>Buses internos</h3><p>Intercambian datos, direcciones y señales de control entre la UC, la ALU y los registros.</p></div>
  </div>
 </div>

 <div class="panel" id="n-mem"><h2>2.1.2 La memoria</h2>
  <p>Los dispositivos de almacenamiento guardan datos de forma <b>temporal o permanente</b>. <b>Cuanto más rápida, más cara</b> (y de menor capacidad).</p>
  <div class="grid2">
   <div><h3>Jerarquía de memoria</h3>
    <div class="pyr">
     <div style="width:30%;background:#7c3aed">Registros</div>
     <div style="width:48%;background:#2f5bd3">Caché</div>
     <div style="width:66%;background:#0f766e">RAM</div>
     <div style="width:84%;background:#b45309">Disco duro</div>
    </div>
    <p class="muted" style="text-align:center">↑ más velocidad y precio por byte · ↓ más capacidad</p></div>
   <div><table class="tb"><tr><th>Nivel</th><th>Tipo</th><th>Función</th></tr>
    <tr><td><b>Caché</b></td><td>Volátil</td><td>Copia de datos de uso frecuente para acceso rápido; está en varios componentes.</td></tr>
    <tr><td><b>RAM</b></td><td>Volátil</td><td>Instrucciones y datos temporales; intercambia con la CPU.</td></tr>
    <tr><td><b>Disco duro</b></td><td>Permanente</td><td>Gran capacidad; intercambia con la RAM.</td></tr></table>
    <p class="muted"><b>Volátil</b> = se borra al apagar.</p></div>
  </div>
  <h3>Organización de la memoria principal</h3>
  <div class="grid2">
   <div><p>Está formada por <b>celdas</b> (casillas, posiciones o <b>palabras de memoria</b>) de un número fijo de bits. Cada celda tiene:</p>
    <ul><li><b>Dirección</b>: número que la identifica de forma única.</li><li><b>Contenido</b>: la instrucción o el dato guardado en ese momento.</li></ul>
    <p>Está ligada a las unidades más rápidas: UC y ALU.</p></div>
   <div class="tscroll"><table class="tb mono" style="max-width:320px"><tr><th>Dirección</th><th>Contenido</th></tr>
    <tr><td>0x0000</td><td>1011 0010</td></tr><tr><td>0x0001</td><td>0000 1111</td></tr><tr><td>0x0002</td><td>0100 1000 <span class="muted">('H')</span></td></tr><tr><td>…</td><td>…</td></tr></table></div>
  </div>
 </div>

 <div class="panel" id="n-ri"><h2>3. Representación de la información</h2>
  <ul><li>Un ordenador <b>recibe datos de entrada, los transforma y produce datos de salida</b>; su función principal es <b>automatizar tareas</b>.</li>
   <li>Sus componentes no entienden letras ni números, solo <b>corriente eléctrica</b> (u otras magnitudes físicas).</li>
   <li>Por eso hacen falta <b>sistemas de codificación</b>. El SO, con el hardware, transforma la información en impulsos eléctricos y viceversa.</li></ul>
 </div>

 <div class="panel" id="n-med"><h2>3.1 Medidas de información</h2>
  <div class="grid2">
   <div><p>El <b>bit</b> (0 o 1) es la unidad mínima de información.</p>
    <table class="tb"><tr><th>Unidad</th><th>Equivale a</th><th>Potencia</th></tr>
     <tr><td>Nibble (cuarteto)</td><td>4 bits</td><td></td></tr><tr><td><b>Byte</b> (octeto)</td><td>8 bits</td><td></td></tr>
     <tr><td>Kilobyte (KB)</td><td>1024 bytes</td><td>2<sup>10</sup> B</td></tr><tr><td>Megabyte (MB)</td><td>1024 KB</td><td>2<sup>20</sup> B</td></tr>
     <tr><td>Gigabyte (GB)</td><td>1024 MB</td><td>2<sup>30</sup> B</td></tr><tr><td>Terabyte (TB)</td><td>1024 GB</td><td>2<sup>40</sup> B</td></tr>
     <tr><td>Petabyte (PB)</td><td>1024 TB</td><td>2<sup>50</sup> B</td></tr><tr><td>Exabyte (EB)</td><td>1024 PB</td><td>2<sup>60</sup> B</td></tr></table></div>
   <div><div class="key"><b>B mayúscula = byte · b minúscula = bit</b><br>30 MB = 30 megabytes · 30 Mbps = 30 megabits por segundo (velocidad de red).<br>Para pasar de bits a bytes: <b>÷ 8</b>.</div>
    <div class="key"><b>Subir de unidad: ÷ 1024 · bajar: × 1024</b><br>Ej.: 3 GB = 3 × 1024 = 3072 MB = 3072 × 1024 KB.</div>
    <div class="warn"><b>Nota:</b> en los apuntes se usa 1 KB = 1024 B. Los fabricantes de discos usan 1 KB = 1000 B (sistema decimal); la norma IEC llama KiB, MiB… a las unidades de 1024. Por eso un disco de «1 TB» aparece con unos 931 GB en el sistema operativo.</div></div>
  </div>
 </div>

 <div class="panel" id="n-num"><h2>3.2 Sistemas de numeración</h2>
  <p>Conjunto de símbolos y reglas para representar cantidades. La <b>base</b> es el número de símbolos. El valor de cada símbolo depende de su <b>posición</b>.</p>
  <div class="key"><b>Teorema fundamental de la numeración (TFN)</b>: NUM = Σ X<sub>i</sub> · B<sup>i</sup> &nbsp;(X = dígito, i = posición desde la coma, B = base)<br>
   Ej.: ${sub(98, 10)} = 9·10¹ + 8·10⁰ = 90 + 8</div>
  <div class="tscroll"><table class="tb"><tr><th>Sistema</th><th>Base</th><th>Símbolos</th><th>Bits por símbolo</th><th>Uso</th></tr>
   <tr><td><b>Binario</b></td><td>2</td><td>0 1</td><td>1</td><td>El que usa el ordenador internamente (hay / no hay tensión).</td></tr>
   <tr><td><b>Octal</b></td><td>8</td><td>0–7</td><td><b>3</b></td><td>Abreviar binario.</td></tr>
   <tr><td><b>Decimal</b></td><td>10</td><td>0–9</td><td>—</td><td>El humano.</td></tr>
   <tr><td><b>Hexadecimal</b></td><td>16</td><td>0–9 A B C D E F (A=10 … F=15)</td><td><b>4</b></td><td>Direcciones de memoria, colores…</td></tr></table></div>
  <p>Con <b>n bits</b> se representan <b>2<sup>n</sup></b> valores distintos (de 0 a 2<sup>n</sup>−1). Ej.: n = 2 → 00, 01, 10, 11.</p>
  <h3>Las conversiones que tienes que dominar</h3>
  <div class="grid2">
   <div><b>① Base b → decimal: TFN</b> (suma de dígito × potencia)<br>
    <code>1011(2 = 1·2³ + 0·2² + 1·2¹ + 1·2⁰ = 8+0+2+1 = 11(10</code><br>
    <code>454(8 = 4·8² + 5·8¹ + 4·8⁰ = 256+40+4 = 300(10</code><br>
    <code>12C(16 = 1·16² + 2·16¹ + 12·16⁰ = 256+32+12 = 300(10</code></div>
   <div><b>② Decimal → base b: divisiones sucesivas</b><br>Se divide entre la base; los <b>restos</b> y el <b>último cociente</b>, leídos <b>de abajo arriba</b>, dan el número.
    <table class="div"><tr><td>9 : 2 = 4</td><td class="r">1</td></tr><tr><td>4 : 2 = 2</td><td class="r">0</td></tr><tr><td>2 : 2 = 1</td><td class="r">0</td></tr><tr><td>1 : 2 = 0</td><td class="r">1</td></tr></table>
    <code>9(10 = 1001(2</code> · <code>90(10 = 132(8</code> · <code>90(10 = 5A(16</code></div>
   <div><b>③ Binario ↔ octal: grupos de 3 bits</b> (desde la derecha)<br>
    <code>100 101 100(2 = 454(8</code> · <code>551(8 = 101 101 001(2</code></div>
   <div><b>④ Binario ↔ hexadecimal: grupos de 4 bits</b><br>
    <code>0001 0010 1100(2 = 12C(16</code> · <code>32A(16 = 0011 0010 1010(2</code></div>
   <div><b>⑤ Octal ↔ hexadecimal: pasando por binario</b><br>
    <code>551(8 = 101 101 001(2 = 1 0110 1001 = 169(16</code><br>
    <code>32A(16 = 0011 0010 1010(2 = 1 452 = 1452(8</code></div>
   <div><table class="tb mono" style="font-size:.82rem"><tr><th>Dec</th><th>Bin</th><th>Oct</th><th>Hex</th><th>Dec</th><th>Bin</th><th>Oct</th><th>Hex</th></tr>
    ${Array.from({ length: 8 }, (_, i) => `<tr><td>${i}</td><td>${i.toString(2).padStart(4, "0")}</td><td>${i.toString(8)}</td><td>${i.toString(16).toUpperCase()}</td><td>${i + 8}</td><td>${(i + 8).toString(2)}</td><td>${(i + 8).toString(8)}</td><td>${(i + 8).toString(16).toUpperCase()}</td></tr>`).join("")}</table>
    <p class="muted">Apréndete esta tabla: con ella las conversiones con octal y hex son inmediatas.</p></div>
  </div>
  <div class="exam"><b>Truco de examen:</b> para pasar binario → decimal rápido, escribe encima de cada bit su peso (…128 64 32 16 8 4 2 1) y suma los pesos donde hay un 1.</div>
 </div>

 <div class="panel" id="n-alf"><h2>3.3 Codificación alfanumérica</h2>
  <p>Los datos alfanuméricos (letras, signos) no se operan, así que se codifican con <b>tablas</b> que asignan un número a cada carácter.</p>
  <table class="tb"><tr><th>Código</th><th>Bits</th><th>Notas</th></tr>
   <tr><td><b>ASCII</b> (American Standard Code for Information Interchange)</td><td>7 (128 caracteres) u 8 (ASCII extendido, 256)</td><td>El más usado. 'A' = 65 = 100 0001; 'a' = 97.</td></tr>
   <tr><td><b>EBCDIC</b> (Extended BCD Interchange Code)</td><td>8, en 2 bloques de 4</td><td>De IBM (grandes ordenadores).</td></tr>
   <tr><td><b>FIELDATA</b></td><td>6</td><td>Poco extendido.</td></tr>
   <tr><td><b>UNICODE</b></td><td>16 (según los apuntes)</td><td>Pretende ser universal: todos los alfabetos.</td></tr></table>
  <div class="key"><b>Ejemplo de los apuntes</b>: «HOLA» en ASCII de 7 bits<br>H = 1001000 · O = 1001111 · L = 1001100 · A = 1000001<br>
   HOLA = <code>1001000 1001111 1001100 1000001</code><br><span class="muted">Puedes codificar cualquier texto en el Laboratorio.</span></div>
  <div class="warn"><b>Ampliación:</b> Unicode empezó con 16 bits, pero hoy tiene más de un millón de posiciones y se guarda con codificaciones como <b>UTF-8</b> (de 1 a 4 bytes por carácter; los caracteres ASCII ocupan 1 byte) o UTF-16. En el examen responde con lo de los apuntes: 16 bits.</div>
 </div>

 <div class="panel" id="n-ent"><h2>3.4 Representación de números enteros</h2>
  <p>Depende del <b>tamaño de palabra</b> (n bits).</p>
  <div class="tscroll"><table class="tb"><tr><th>Método</th><th>Cómo funciona</th><th>+10 (n=8)</th><th>−10 (n=8)</th><th>Rango con n bits</th></tr>
   <tr><td><b>Sin signo</b></td><td>Todos los bits son el valor absoluto.</td><td><code>0000 1010</code></td><td>—</td><td>0 … 2<sup>n</sup>−1 (n=8: 0…255)</td></tr>
   <tr><td><b>Signo y magnitud</b></td><td>Bit de la izquierda = signo (0 +, 1 −); el resto, el valor absoluto.</td><td><code>0000 1010</code></td><td><code>1000 1010</code></td><td>−(2<sup>n−1</sup>−1) … 2<sup>n−1</sup>−1 (n=8: −127…127; dos ceros)</td></tr>
   <tr><td><b>Complemento a 1 (C1)</b></td><td>Negativo = <b>invertir todos los bits</b> del positivo.</td><td><code>0000 1010</code></td><td><code>1111 0101</code></td><td>−127 … 127 (dos ceros)</td></tr>
   <tr><td><b>Complemento a 2 (C2)</b></td><td>Negativo = C1 <b>+ 1</b>.</td><td><code>0000 1010</code></td><td><code>1111 0110</code></td><td>−2<sup>n−1</sup> … 2<sup>n−1</sup>−1 (n=8: −128…127; un solo cero)</td></tr></table></div>
  <div class="grid2">
   <div class="key"><b>Ejemplo de los apuntes (16 bits): 9503</b><br>
    +9503 = ${bitsHTML("0010 0101 0001 1111")}<br>
    −9503 C1 = ${bitsHTML("1101 1010 1110 0000")}<br>
    −9503 C2 = ${bitsHTML("1101 1010 1110 0001")}</div>
   <div><h3>Truco rápido para C2</h3><p>Copia los bits <b>de derecha a izquierda hasta el primer 1 incluido</b> e invierte el resto.<br>
    +10 = 0000 10<b>10</b> → −10 = 1111 01<b>10</b>.</p>
    <p>Los ordenadores usan C2 porque la resta se convierte en suma y solo hay un cero.</p></div>
  </div>
 </div>

 <div class="panel" id="n-real"><h2>3.5 Representación de números reales: coma flotante</h2>
  <p>El ordenador usa <b>notación exponencial</b> (coma o punto flotante): <b>N = M · B<sup>E</sup></b> (M mantisa, B base, E exponente).</p>
  <p><code>13 257,3285 = 132 573 285 · 10⁻⁴ = 0,132573285 · 10⁵ = 1,32573285 · 10⁴</code><br>
   Si aumentas E, divides M entre B (y al revés). Se trabaja con números <b>normalizados</b>: no empiezan por 0 (en binario, empiezan por 1): <code>0,1001(2 = 1,001 · 2⁻¹</code>.</p>
  <h3>IEEE 754 · precisión simple (32 bits)</h3>
  <p>${bitsHTML("S EEEEEEEE MMMMMMMMMMMMMMMMMMMMMMM", i => i === 0 ? "s" : i <= 9 && i > 1 ? "e" : i > 10 ? "m" : "")}</p>
  <p><b>S</b> = signo (1 bit) · <b>E</b> = exponente en <b>exceso 127</b> (8 bits) · <b>M</b> = mantisa sin el 1 inicial (23 bits).</p>
  <div class="key"><b>Ejemplo de los apuntes: 7</b><ol>
   <li>Binario: 7<sub>(10</sub> = 111<sub>(2</sub></li><li>Normalizar: 1,11 · 2²</li><li>Signo positivo → S = 0</li>
   <li>Exponente: 2 + 127 = 129 = 1000 0001</li><li>Mantisa: lo que va detrás de la coma (11) y ceros hasta 23 bits</li></ol>
   7 = ${bitsHTML("0 10000001 11000000000000000000000", i => i === 0 ? "s" : i > 1 && i < 10 ? "e" : i > 10 ? "m" : "")}</div>
  <p class="muted">Convierte cualquier número en el Laboratorio y verás cada paso.</p>
 </div>`;
}

const DIG = "0123456789ABCDEF";
function parseIn(s, b) {
 s = s.trim().toUpperCase().replace(/\s+/g, "");
 if (!s) return null;
 if (![...s].every(c => DIG.indexOf(c) >= 0 && DIG.indexOf(c) < b)) return NaN;
 return BigInt(s.split("").reduce((v, c) => v * b + DIG.indexOf(c), 0));
}
function tfnSteps(s, b) {
 const d = s.toUpperCase().replace(/\s+/g, "").split("");
 const terms = d.map((c, i) => `${DIG.indexOf(c)}·${b}<sup>${d.length - 1 - i}</sup>`);
 const vals = d.map((c, i) => DIG.indexOf(c) * Math.pow(b, d.length - 1 - i));
 return `${sub(s.toUpperCase(), b)} = ${terms.join(" + ")} = ${vals.join(" + ")} = <b>${sub(vals.reduce((a, c) => a + c, 0), 10)}</b>`;
}
function divSteps(n, b) {
 if (n === 0) return `<p>0 en cualquier base es 0.</p>`;
 const rows = []; let q = n;
 while (q > 0) { rows.push([q, Math.floor(q / b), q % b]); q = Math.floor(q / b); }
 const res = rows.map(r => DIG[r[2]]).reverse().join("");
 return `<table class="div">${rows.map(r => `<tr><td>${r[0]} : ${b} = ${r[1]}</td><td class="r">resto ${r[2]}${b === 16 && r[2] > 9 ? " (" + DIG[r[2]] + ")" : ""}</td></tr>`).join("")}</table>
  Leyendo los restos de abajo arriba: <b>${sub(n, 10)} = ${sub(res, b)}</b>`;
}

let FC = null;
function renderFC() {
 const cats = [...new Set(CARDS.map(c => c[0]))];
 $("v-fc").innerHTML = `<div class="panel"><div class="row sb"><h2>Flashcards</h2><div class="row"><select id="fc-cat"><option value="all">Todas (${CARDS.length})</option>${cats.map(c => `<option>${c}</option>`).join("")}</select><button id="fc-sh">Barajar</button></div></div>
  <p class="lead">Pulsa la tarjeta (o la barra espaciadora) para darle la vuelta; usa las flechas para avanzar. Marca las que ya sabes.</p>
  <div class="track"><div class="bar" id="fc-bar"></div></div><div class="row sb"><span class="muted" id="fc-n"></span><span class="muted" id="fc-known"></span></div>
  <div class="fc-wrap"><div class="fc" id="fc"><div class="front"><span class="cat" id="fc-c1"></span><div id="fc-q"></div></div><div class="back"><span class="cat" id="fc-c2"></span><div id="fc-a"></div></div></div></div>
  <div class="row" style="justify-content:center"><button id="fc-prev">← Anterior</button><button id="fc-know">✓ La sé</button><button id="fc-next" class="primary">Siguiente →</button></div></div>`;
 const known = new Set(store("si1-known") || []);
 const load = () => { const c = $("fc-cat").value; FC = { list: CARDS.map((x, i) => i).filter(i => c === "all" || CARDS[i][0] === c), k: 0 }; draw(); };
 const draw = () => {
  const i = FC.list[FC.k], c = CARDS[i];
  $("fc").classList.remove("flip");
  setTimeout(() => { $("fc-q").textContent = c[1]; $("fc-a").textContent = c[2]; }, 120);
  $("fc-c1").textContent = $("fc-c2").textContent = c[0];
  $("fc-n").textContent = `Tarjeta ${FC.k + 1} de ${FC.list.length}`;
  $("fc-bar").style.width = ((FC.k + 1) / FC.list.length * 100) + "%";
  $("fc-known").textContent = `Sabidas: ${FC.list.filter(x => known.has(x)).length}/${FC.list.length}`;
  $("fc-know").textContent = known.has(i) ? "↺ Repasar" : "✓ La sé";
 };
 $("fc").onclick = () => $("fc").classList.toggle("flip");
 $("fc-next").onclick = () => { FC.k = (FC.k + 1) % FC.list.length; draw(); };
 $("fc-prev").onclick = () => { FC.k = (FC.k - 1 + FC.list.length) % FC.list.length; draw(); };
 $("fc-know").onclick = () => { const i = FC.list[FC.k]; known.has(i) ? known.delete(i) : known.add(i); store("si1-known", [...known]); draw(); };
 $("fc-sh").onclick = () => { FC.list = shuffle(FC.list); FC.k = 0; draw(); };
 $("fc-cat").onchange = load;
 document.addEventListener("keydown", e => {
  if ($("v-fc").hidden || ["INPUT", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === " ") { e.preventDefault(); $("fc").classList.toggle("flip"); }
  if (e.key === "ArrowRight") $("fc-next").click();
  if (e.key === "ArrowLeft") $("fc-prev").click();
 });
 load();
}

let QZ = null;
function renderTest() {
 const cats = [...new Set(QUIZ.map(q => q[0]))];
 $("v-test").innerHTML = `<div class="panel"><div class="row sb"><h2>Test de autoevaluación</h2><select id="qz-cat"><option value="all">Todo (${QUIZ.length})</option>${cats.map(c => `<option>${c}</option>`).join("")}</select></div>
  <p class="lead">Las opciones se barajan en cada intento. Teclas A–D para responder y Enter para seguir.</p>
  <div class="muted" id="qz-st"></div><div class="track"><div class="bar" id="qz-bar"></div></div><div id="qz-box"></div></div>`;
 const start = () => { const c = $("qz-cat").value; QZ = { list: shuffle(QUIZ.filter(q => c === "all" || q[0] === c)), k: 0, ok: 0, fails: [], ans: false }; draw(); };
 const draw = () => {
  const n = QZ.list.length;
  $("qz-st").textContent = `Pregunta ${Math.min(QZ.k + 1, n)} de ${n} · Aciertos ${QZ.ok}`;
  $("qz-bar").style.width = (QZ.k / n * 100) + "%";
  if (QZ.k >= n) {
   const best = store("si1-best") || 0, nota = QZ.ok / n * 10; if (nota > best) store("si1-best", nota);
   $("qz-box").innerHTML = `<div class="big">${nota.toFixed(1).replace(".", ",")}</div><p style="text-align:center">${QZ.ok} de ${n} · mejor nota: ${Math.max(best, nota).toFixed(1).replace(".", ",")}</p>${QZ.fails.length ? `<h3>Repasa:</h3><ul>${QZ.fails.map(q => `<li>${esc(q[1])} → <b>${esc(q[2][q[3]])}</b></li>`).join("")}</ul>` : ""}<div class="row" style="justify-content:center"><button class="primary" id="qz-again">Repetir</button></div>`;
   $("qz-again").onclick = start; return;
  }
  const q = QZ.list[QZ.k], ord = shuffle(q[2].map((_, i) => i)); QZ.ans = false;
  $("qz-box").innerHTML = `<span class="badge">${q[0]}</span><p style="font-size:1.15rem;margin:8px 0">${esc(q[1])}</p><div class="opts">${ord.map((o, p) => `<button class="opt" data-o="${o}"><b>${"ABCD"[p]}</b> ${esc(q[2][o])}</button>`).join("")}</div><div id="qz-fb"></div>`;
  document.querySelectorAll("#qz-box .opt").forEach(b => b.onclick = () => {
   if (QZ.ans) return; QZ.ans = true;
   const good = +b.dataset.o === q[3]; good ? QZ.ok++ : QZ.fails.push(q);
   document.querySelectorAll("#qz-box .opt").forEach(x => { x.disabled = true; if (+x.dataset.o === q[3]) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
   $("qz-fb").innerHTML = `<div class="fb">${good ? "✓ <b>Correcto.</b>" : "✗ <b>No.</b>"} ${esc(q[4])}</div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="primary" id="qz-next">Siguiente →</button></div>`;
   $("qz-next").onclick = () => { QZ.k++; draw(); }; $("qz-next").focus();
  });
 };
 $("qz-cat").onchange = start;
 document.addEventListener("keydown", e => {
  if ($("v-test").hidden || !QZ || ["INPUT", "SELECT"].includes(e.target.tagName)) return;
  const i = "ABCD".indexOf(e.key.toUpperCase()), b = document.querySelectorAll("#qz-box .opt");
  if (i >= 0 && b[i] && !QZ.ans) b[i].click();
 });
 start();
}
