<!DOCTYPE html>
<html>
    <head>
        <title>Ejercicio de tabla avanzada</title>
 
    </head>
    <body>
        <table border="1">
            <caption>
                <p>Análisis de ventas anuales</p>
            </caption>
            
            <thead>
                <tr>
                    <th rowspan="2">AÑO</th>
                    <th colspan="4">Expansión de ventas</th>
                </tr>
                <tr>
                    <th>Producto</br>A</th>
                    <th>Producto</br>B</th>
                    <th>Producto</br>C</th>
                    <th>Producto</br>D</th>
                </tr>
            </thead>
            
            <tfoot>
                <tr>
                    <th rowspan="3">AÑO</th>
                    <th>Producto</br>A</th>
                    <th>Producto</br>B</th>
                    <th>Producto</br>C</th>
                    <th>Producto</br>D</th>
                </tr>
                <tr>
                    <th colspan="4">Expansión de ventas</th>
                </tr>
                <tr>
                    <th colspan="4"><a href="https://google.com">Enlace a Google</a></th>
                </tr>
            </tfoot>

            <tbody>
                <tr>
                    <th>N-3</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>N-2</th>
                    <td>3</td>
                    <td>5</td>
                    <td>8</td>
                    <td>4</td>
                </tr>
                <tr>
                    <th>N-1</th>
                    <td>4</td>
                    <td>4</td>
                    <td>7</td>
                    <td>3</td>
                </tr>
                <tr>
                    <th>N</th>
                    <td>5</td>
                    <td>7</td>
                    <td>6</td>
                    <td>2</td>
                </tr>
            </tbody>

        </table>
    </body>
</html>
