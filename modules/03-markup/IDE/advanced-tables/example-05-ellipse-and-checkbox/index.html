<!DOCTYPE html>
<html>
    <head>
        <title>Example ellipse and checkbox</title>
    </head>
    <body>
        <h1>Ejercicios de HTML. Formularios. Ejercicio 7.</h1><br><br>
        <h2>Formulario de Registro.</h2>
        <form>
            <table>
                <tr>
                    <td><label for="fname">Nombre</label></td>
                    <td><input type="text" id="fname" name="fname"></td>
                </tr>
                <tr>
                    <td><label for="lname">Apellidos</label></td>
                    <td><input type="text" id="lname" name="lname"></td>
                </tr>
                <tr>
                    <td><label for="gender">Sexo</label></td>
                    <td><input type="radio" id="gender" value="Hombre" required>Hombre</td>
                    <td><input type="radio" id="gender" value="Mujer" required>Mujer</td>
                </tr>
            </table>
        </form>
    </body>
</html>
