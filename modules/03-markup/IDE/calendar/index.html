<!DOCTYPE html>
<html>
    <head>
        <title>ITS A CALENDAR</title>
        <style>
            table {
                font-family: arial, sans-serif;
                /*border-collapse: collapse;*/
                border: 1px solid black;
                width: 20%;
            }  
            
            td, th {
                border: 1px solid #dddddd;
                text-align: left;
                padding: 8px;
            }
            tr:nth-child(even) {
                background-color: #dddddd;
            }
        </style>
    </head>
    <body>
        <h1>CALENDAR</h1>
        <table>
            <tr>
                <th rowspan="2">TIME</th>
                <th>SUBJECT</th>
                <th colspan="2">GRADES</th>
                <th>ATTENDES</th>
            </tr>
            <tr>
                <td>00:01</td>
                <td>MATHS</td>
                <td>10/10</td>
                <td>yes</td>
            </tr>
            <tr>
                <td>12:01</td>
                <td>CHEM</td>
                <td>10/10</td>
                <td>yes</td>
            </tr>
            <tr>
                <td>01:01</td>
                <td>PHYSC</td>
                <td>10/10</td>
                <td>yes</td>
            </tr>
            <tr>
                <td>02:01</td>
                <td>BIOLOGY</td>
                <td>10/10</td>
                <td>yes</td>
            </tr>
            <tr>
                <td>03:01</td>
                <td>CASTILLIAN</td>
                <td>10/10</td>
                <td>yes</td>
            </tr>

        </table>
        
        
    </body>

</html>
