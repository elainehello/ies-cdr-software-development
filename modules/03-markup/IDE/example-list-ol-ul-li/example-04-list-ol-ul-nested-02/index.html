<!DOCTYPE html>
<html>
    <head>
        <title>Nested list 2</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h3>Una lista ordernada &lt;ol&gt;</h3>
        <hr>
        <p>Índice del libro</p>
        <ol>
            <li>Tema 1</li>
            <ol type="I">
                <li>Subtema 1</li>
                <li>Subtema 2</li>
                <ol type="I">
                    <li>Subtemaa</li>
                    <li>Subtemab</li>
                </ol>
                <li>Subtema 3</li>
            </ol>
            <!-- we can insert link-video-images using the reserve tag <a href> or whats required -->
            <li>Tema 2</li>
            <li>Tema 3</li>
            <li>Tema 4</li>
            <ol type="I">
                <li>Subtema 1</li>
                <li>Subtema 2</li>
                <li>Subtema 3</li>
            </ol>
            <li>Tema 5</li>
            <li>Tema 6</li>
            <li>Tema 7</li>
        </ol>
    </body>
</html>
