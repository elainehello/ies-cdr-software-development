<!DOCTYPE html>
<html>
    <head>
        <title>Nested List</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h2>Una lista ordenada &lt;ol&gt;</h2>
        <hr>
        <p>Índice del libro</p>
        <ol>
            <li>Tema 1</li>
            <ol>
                <li>Subtema 1</li>
                <li>Subtema 2</li>
                <ol type="a">
                    <li>Subtemaa</li>
                    <li>Subtemab</li>
                </ol>
                <li> Subtema 3</li>
            </ol>
            <li>Tema 2</li>
            <li>Tema 3</li>
            <li>Tema 4</li>
            <ol>
                <li>Subtema 1</li>
                <li>Subtema 2</li>
                <li>Subtema 3</li>
            </ol>
            <li>Tema 5</li>
            <li>Tema 6</li>
            <li>Tema 7</li>
        </ol>
    </body>
</html>
