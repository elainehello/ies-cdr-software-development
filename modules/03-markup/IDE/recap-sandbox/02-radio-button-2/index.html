<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>radio button 2</title>
    </head>
    <body>
        <h2>What's your favourite drink?</h2>
        <form>
            <input type="radio" id="coffee" name="fav_drink" value="Coffee">
            <label for="coffee">Coffee</label><br>

            <input type="radio" id="coke" name="fav_drink" value="Coke">
            <label for="coke">Coke</label><br>

            <input type="radio" id="tea" name="fav_drink" value="Tea">
            <label for="tea">Tea</label>
        </form>
    </body>
</html>
