<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Horror Story</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <img
            src="images/logo.png"
            alt="American Horror Story Logo"
            class="banner-logo"
        >
    </header>

    <main>
        <section class="carousel">

            <button class="carousel-arrow left"
                    id="scroll-left"
                    aria-label="Previous movies">
                &#10094;
            </button>

            <div class="movies-container" id="movies-container">

                <figure class="movie-card">
                    <img src="images/movie-listing/AHS_1.jpg"
                        alt="Murder House">

                    <figcaption>Murder House</figcaption>

                    <div class="tomatometer">
                        🍅 72% <span>Tomatometer</span>
                    </div>
                </figure>

                <figure class="movie-card">
                    <img src="images/movie-listing/AHS_2.jpg"
                        alt="Asylum">

                    <figcaption>Asylum</figcaption>

                    <div class="tomatometer">
                        🍅 84% <span>Tomatometer</span>
                    </div>
                </figure>

                <figure class="movie-card">
                    <img src="images/movie-listing/AHS_3.jpg"
                        alt="Coven">

                    <figcaption>Coven</figcaption>

                    <div class="tomatometer">
                        🍅 85% <span>Tomatometer</span>
                    </div>
                </figure>

                <figure class="movie-card">
                    <img src="images/movie-listing/AHS_4.jpg"
                        alt="Freak Show">

                    <figcaption>Freak Show</figcaption>

                    <div class="tomatometer">
                        🍅 77% <span>Tomatometer</span>
                    </div>
                </figure>

                <figure class="movie-card">
                    <img src="images/movie-listing/AHS_5.jpg"
                        alt="Hotel">

                    <figcaption>Hotel</figcaption>

                    <div class="tomatometer">
                        🍅 64% <span>Tomatometer</span>
                    </div>
                </figure>

            </div>

            <button class="carousel-arrow right"
                    id="scroll-right"
                    aria-label="Next movies">
                &#10095;
            </button>

        </section>
    </main>
    <!--JS script -->
    <script src="js/carousel.js"></script>
</body>

</html>
