<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS paso a paso</title>
<style>
:root{
 --bg:#f6f4ee;--paper:#fffdf8;--ink:#1d2433;--muted:#5d6676;--line:#d9d4c7;--accent:#4f46e5;--accent2:#eef0ff;
 --green:#16a34a;--greenbg:#e5f5ea;--red:#c8322b;--redbg:#fbe7e5;--amber:#b45309;--amberbg:#fff1dc;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
 --code:#1e1e2e;--codeink:#e6e6f0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--paper:#1c2028;--ink:#e7e9ee;--muted:#9aa3b2;--line:#353b47;--accent:#8b8cff;--accent2:#252a44;--green:#5fd18f;--greenbg:#183324;--red:#ff7a70;--redbg:#3a1d1b;--amber:#f5b25b;--amberbg:#3a2a12;--code:#0f1117}}
:root[data-theme="dark"]{--bg:#14171d;--paper:#1c2028;--ink:#e7e9ee;--muted:#9aa3b2;--line:#353b47;--accent:#8b8cff;--accent2:#252a44;--green:#5fd18f;--greenbg:#183324;--red:#ff7a70;--redbg:#3a1d1b;--amber:#f5b25b;--amberbg:#3a2a12;--code:#0f1117}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{padding:20px 16px 4px;max-width:1280px;margin:auto}header.top h1{margin:0;font-size:1.55rem}header.top p{margin:4px 0 0;color:var(--muted)}
nav#tabs{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;max-width:1280px;margin:auto;border-bottom:1px solid var(--line)}
@media(max-width:760px){nav#tabs{flex-wrap:nowrap;overflow-x:auto}nav#tabs button{flex:none}}
main.wrap{max-width:1280px;margin:auto;padding:16px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:0;max-width:100%}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.ghost{border-style:dashed}
.mono{font-family:var(--mono);font-size:.9rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{margin:4px 0 8px;font-size:1.3rem}.panel h3{margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 12px}.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
code{font-family:var(--mono);font-size:.88em;background:var(--accent2);padding:1px 5px;border-radius:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.badge{display:inline-block;background:var(--accent2);color:var(--accent);font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:20px}
.score{font-weight:700;color:var(--accent);background:var(--accent2);border-radius:8px;padding:2px 10px;font-size:.9rem}
.warn{background:var(--amberbg);border-left:4px solid var(--amber);border-radius:10px;padding:10px 14px;margin-top:10px}
.tip{background:var(--accent2);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin-top:10px}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}.bar{height:100%;background:var(--accent);transition:width .3s}
table.tb{width:100%;border-collapse:collapse;font-size:.92rem}table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.tb th{background:var(--bg)}table.tb tr.win td{background:var(--greenbg);font-weight:700}
.tscroll{overflow-x:auto}
pre.codeblock{background:var(--code);color:var(--codeink);border-radius:10px;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;line-height:1.5;margin:8px 0}
/* ruta */
.cycle{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}.cycle>div{flex:1 1 150px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}.cycle b{display:block}.cycle span{font-size:.88rem;color:var(--muted)}.cycle .ar{flex:0;align-self:center;border:0;background:none;color:var(--muted);padding:0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:10px}
.gcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}.gcard.full{border-color:var(--green)}.gcard p{margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.chip{font-size:.78rem;padding:3px 8px;border-radius:20px}.chip.ok{background:var(--greenbg);border-color:var(--green)}
.mini{font-size:.82rem;padding:4px 10px}.projlink.ok{background:var(--greenbg);border-color:var(--green)}
/* lecciones */
.lec{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
#lec-nav{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
#lec-nav .lgh{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 6px 4px}
#lec-nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;font-size:.88rem;border-radius:8px}
#lec-nav button.on{background:var(--accent);color:#fff}#lec-nav button.ok:not(.on){color:var(--green)}
#lec-sel{display:none;width:100%;margin-bottom:10px}
.intro{font-size:1.05rem}.points li{margin:4px 0}
@media(max-width:900px){.lec{grid-template-columns:1fr}#lec-nav{display:none}#lec-sel{display:block}.grid2{grid-template-columns:1fr}}
/* editor */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pg .pg-ed,.pg .pg-out{display:flex;flex-direction:column;min-width:0}
.pg-bar{display:flex;gap:4px;align-items:center;margin-bottom:6px}.pg-bar .sp{flex:1}.pg-bar button{padding:3px 12px;font-size:.85rem}.pg-bar .lbl{font-size:.85rem;font-weight:700;color:var(--muted)}
.pg-bar label{display:flex;gap:4px;align-items:center;cursor:pointer}
textarea.code{flex:1;min-height:300px;resize:vertical;background:var(--code);color:var(--codeink);border:0;font-family:var(--mono);font-size:.86rem;line-height:1.55;padding:12px;tab-size:2;white-space:pre;overflow:auto}
.pg.tall textarea.code{min-height:480px}
.pg-frame{position:relative;flex:1;min-height:300px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pg.tall .pg-frame{min-height:480px}
.pg-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pg-ov{position:absolute;inset:0;pointer-events:none}
.pg-ov>div{position:absolute}.ovm{background:rgba(246,178,107,.45)}.ovb{background:rgba(255,229,153,.55)}.ovp{background:rgba(147,196,125,.55)}.ovc{background:rgba(111,168,220,.6)}
.ovt{background:#1e293b;color:#fff;font:11px/1.6 var(--mono);padding:0 6px;border-radius:4px;white-space:nowrap}
.ovsel{outline:2px solid #db2777;background:rgba(219,39,119,.15)}
.pg-checks{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);font-size:.92rem}
.pg-checks .pg-ch-h{font-weight:700;margin-bottom:4px}.pg-checks .ok{color:var(--green)}.pg-checks .ko{color:var(--muted)}
.pg-info{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.insp-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}.insp-grid h4{margin:6px 0}
.dompath{font-family:var(--mono);font-size:.82rem;background:var(--paper);border-radius:6px;padding:4px 8px}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-family:var(--mono);font-size:.8rem}
.rule.top{border-color:var(--green)}.rule.inl{border-color:var(--amber)}.rule .spec{font-family:system-ui;color:var(--muted);font-size:.75rem}
.bm{font-family:var(--mono);font-size:.75rem;text-align:center;background:rgba(246,178,107,.4);border:1px dashed #b45309;padding:4px;border-radius:6px;color:#1d2433}
.bm-b{background:rgba(255,229,153,.8);border:2px solid #1d2433;padding:4px;flex:1}.bm-p{background:rgba(147,196,125,.7);border:1px dashed #1d2433;padding:4px;flex:1}
.bm-c{background:rgba(111,168,220,.8);border:1px solid #1d2433;padding:8px;flex:1}
.bm-row{display:flex;align-items:center;gap:4px}.bm .t{display:block;text-align:left;font-size:.65rem;opacity:.8}.bm .v{display:block}
.bm.big{font-size:.9rem;padding:14px}.bm.big .bm-b,.bm.big .bm-p{padding:14px}.bm.big .bm-c{padding:22px}
details.tree{margin-top:10px}details.tree summary{cursor:pointer;font-weight:600}
.tree-in ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed var(--line)}.tree-in>ul{padding-left:0;border:0}
.tree-in button{font-family:var(--mono);font-size:.78rem;padding:1px 6px;border:0;background:none;color:var(--accent)}.tree-in button.on{background:var(--accent);color:#fff}
@media(max-width:900px){.pg{grid-template-columns:1fr}.insp-grid{grid-template-columns:1fr}textarea.code,.pg-frame{min-height:240px}.pg.tall textarea.code,.pg.tall .pg-frame{min-height:340px}}
/* proyecto */
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.steps button{text-align:left;font-size:.85rem;display:flex;gap:8px;align-items:center}
.steps span{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);font-size:.75rem;font-weight:700}
.steps button.done span{background:var(--green);color:#fff}.steps button.on span{background:#fff;color:var(--accent)}
ol.todo li{margin:6px 0}details.soldet{margin-top:10px}details.soldet summary{cursor:pointer;color:var(--muted)}
/* test */
#spec-in{display:block;width:100%;margin-top:4px}
.qtext{font-size:1.15rem;margin:10px 0}.opts{display:grid;gap:8px}.opt{text-align:left;padding:10px 14px}.opt b{color:var(--accent);margin-right:6px}
.opt.right{background:var(--greenbg);border-color:var(--green)}.opt.wrong{background:var(--redbg);border-color:var(--red)}
.big{font-size:3rem;font-weight:800;color:var(--accent);text-align:center}
@media print{nav#tabs,.noprint{display:none}}
</style>
</head>
<body>
<header class="top"><h1>CSS paso a paso</h1><p>De cero a maquetar tu propio portfolio: 10 bloques, lecciones con editor en vivo, retos que se corrigen solos, inspector del DOM y un proyecto real.</p></header>
<nav id="tabs"></nav>
<main class="wrap">
 <section id="v-ruta"></section>
 <section id="v-lec" hidden><div class="lec"><nav id="lec-nav" aria-label="Lecciones"></nav><div><select id="lec-sel" aria-label="Lección"></select><div id="lec-main"></div></div></div></section>
 <section id="v-proj" hidden></section>
 <section id="v-lab" hidden></section>
 <section id="v-chuleta" hidden></section>
 <section id="v-test" hidden></section>
</main>
<script>
// =====================================================================
//  NÚCLEO: utilidades, imágenes de ejemplo, editor en vivo e inspector
// =====================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("css-" + k)); localStorage.setItem("css-" + k, JSON.stringify(v)); } catch (e) { return null; } }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- imágenes de ejemplo (SVG generados, funcionan sin conexión) ----------
// En el HTML se escriben como img/nombre.svg y se sustituyen al mostrar el resultado.
function svgURI(svg) { return "data:image/svg+xml," + encodeURIComponent(svg).replace(/[()']/g, ch => "%" + ch.charCodeAt(0).toString(16).toUpperCase()); }
function picture(label, c1, c2, w = 400, h = 260) {
    return svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="${w * .78}" cy="${h * .28}" r="${h * .12}" fill="#fff" opacity=".5"/><path d="M0 ${h * .82} L${w * .3} ${h * .5} L${w * .55} ${h * .75} L${w * .72} ${h * .6} L${w} ${h * .85} V${h} H0Z" fill="#000" opacity=".22"/><text x="50%" y="${h * .93}" font-family="sans-serif" font-size="${Math.round(h * .08)}" fill="#fff" text-anchor="middle">${label}</text></svg>`, w, h);
}
const IMGS = {
    foto: picture("foto", "#60a5fa", "#7c3aed"),
    paisaje: picture("paisaje 600×300", "#34d399", "#0ea5e9", 600, 300),
    vertical: picture("vertical", "#f472b6", "#f59e0b", 260, 400),
    avatar: svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#c7d2fe"/><circle cx="100" cy="80" r="40" fill="#4f46e5"/><rect x="40" y="130" width="120" height="80" rx="60" fill="#4f46e5"/></svg>`),
    sprite: svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32"><rect width="32" height="32" rx="6" fill="#ef4444"/><path d="M8 16h16M16 8v16" stroke="#fff" stroke-width="4"/><rect x="32" width="32" height="32" rx="6" fill="#22c55e"/><path d="M40 16l5 5 10-10" stroke="#fff" stroke-width="4" fill="none"/><rect x="64" width="32" height="32" rx="6" fill="#3b82f6"/><circle cx="80" cy="16" r="7" fill="#fff"/></svg>`),
    proyecto1: picture("API REST · Spring Boot", "#1e3a8a", "#7c3aed"),
    proyecto2: picture("Despliegue en AWS", "#0f766e", "#22d3ee"),
    proyecto3: picture("Modelo E/R", "#b45309", "#f472b6"),
    galeria1: picture("1", "#f87171", "#fbbf24"), galeria2: picture("2", "#34d399", "#3b82f6"), galeria3: picture("3", "#a78bfa", "#ec4899"),
    galeria4: picture("4", "#22d3ee", "#6366f1"), galeria5: picture("5", "#fde047", "#f97316"), galeria6: picture("6", "#4ade80", "#0d9488")
};
const withImgs = s => s.replace(/img\/([\w-]+)\.svg/g, (m, k) => IMGS[k] || m);

// ---------- especificidad ----------
function specificity(sel) {
    let s = String(sel).replace(/"[^"]*"|'[^']*'/g, "");
    let a = 0, b = 0, c = 0;
    s = s.replace(/:where\((?:[^()]|\([^()]*\))*\)/g, " ");
    s = s.replace(/:(?:not|is|has)\(((?:[^()]|\([^()]*\))*)\)/g, (m, x) => {
        const best = x.split(",").map(specificity).sort((p, q) => q[0] - p[0] || q[1] - p[1] || q[2] - p[2])[0] || [0, 0, 0];
        a += best[0]; b += best[1]; c += best[2]; return " ";
    });
    s = s.replace(/::[\w-]+(\([^)]*\))?/g, () => { c++; return " "; });
    s = s.replace(/:(before|after|first-line|first-letter)\b/g, () => { c++; return " "; });
    s = s.replace(/#[\w-]+/g, () => { a++; return " "; });
    s = s.replace(/\.[\w-]+|\[[^\]]*\]|:[\w-]+(\([^)]*\))?/g, () => { b++; return " "; });
    (s.match(/[a-zA-Z][\w-]*/g) || []).forEach(() => c++);
    return [a, b, c];
}
const specTxt = s => `(${s.join(", ")})`;

// ---------- helpers que reciben las comprobaciones ----------
function makeH(win, css, html) {
    const d = win.document;
    const q = s => d.querySelector(s);
    const cs = (s, p, ps) => { const e = typeof s === "string" ? q(s) : s; return e ? win.getComputedStyle(e, ps || null)[p] : ""; };
    const n = (s, p, ps) => parseFloat(cs(s, p, ps));
    const rules = [];
    const sheet = d.getElementById("u");
    (function walk(list) { for (const r of list) { if (r.selectorText) rules.push(r); else if (r.cssRules) walk(r.cssRules); } })(sheet && sheet.sheet ? sheet.sheet.cssRules : []);
    const norm = s => s.replace(/\s+/g, " ").replace(/\s*([>+~,])\s*/g, "$1").replace(/"/g, "'").trim();
    const rule = sel => { const t = norm(sel); const r = rules.find(r => norm(r.selectorText).split(",").includes(t)); return r ? r.style : null; };
    return {
        d, win, q, cs, n, rule, css, html,
        all: s => [...d.querySelectorAll(s)],
        has: re => re.test(css.replace(/\/\*[\s\S]*?\*\//g, "")),
        rect: s => { const e = q(s); return e ? e.getBoundingClientRect() : { width: 0, height: 0, left: 0, top: 0, right: 0, bottom: 0 }; },
        v: name => win.getComputedStyle(d.documentElement).getPropertyValue(name).trim(),
        near: (a, b, t = 1) => Math.abs(a - b) <= t
    };
}

// ---------- editor en vivo ----------
// o: { key, html, css, solCss, solHtml, checks:[[texto, h=>bool]], onPass, tabs:"css"|"html", tall, onChange }
const PG = {};
function mountPG(box, o) {
    const saved = (store("pg") || {})[o.key] || {};
    const st = { html: saved.html ?? o.html, css: saved.css ?? o.css, tab: o.tabs || "css", insp: false, sel: null };
    box.innerHTML = `<div class="pg ${o.tall ? "tall" : ""}">
   <div class="pg-ed"><div class="pg-bar"><button data-t="css">CSS</button><button data-t="html">HTML</button><span class="sp"></span>
     <button class="mini" data-a="reset" title="Volver al código inicial">↺ Inicio</button>${o.solCss !== undefined ? `<button class="mini" data-a="sol">Ver solución</button>` : ""}</div>
     <textarea class="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Código"></textarea></div>
   <div class="pg-out"><div class="pg-bar"><span class="lbl">Resultado</span><span class="sp"></span><label class="mini"><input type="checkbox" class="insp"> 🔍 Inspeccionar</label></div>
     <div class="pg-frame"><iframe title="Vista previa"></iframe><div class="pg-ov"></div></div></div>
  </div>
  ${o.checks ? `<div class="pg-checks"></div>` : ""}
  <div class="pg-info" hidden></div>`;
    const ta = box.querySelector("textarea"), ifr = box.querySelector("iframe"), ov = box.querySelector(".pg-ov"), info = box.querySelector(".pg-info"), chk = box.querySelector(".pg-checks");
    const setTab = t => { st.tab = t; ta.value = st[t]; box.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === t)); };
    const save = () => { const all = store("pg") || {}; all[o.key] = { html: st.html, css: st.css }; store("pg", all); };
    let timer;
    const render = () => {
        ifr.srcdoc = `<!doctype html><html lang="es"><head><meta charset="utf-8"><base target="_blank"><style id="u">${withImgs(st.css)}</style></head><body>${withImgs(st.html)}</body></html>`;
    };
    const runChecks = () => {
        if (!chk) return;
        let h; try { h = makeH(ifr.contentWindow, st.css, st.html); } catch (e) { return; }
        const res = o.checks.map(([t, f]) => { let ok = false; try { ok = !!f(h); } catch (e) { ok = false; } return [t, ok]; });
        const all = res.every(r => r[1]);
        chk.innerHTML = `<div class="pg-ch-h">${all ? "✅ ¡Reto superado!" : `Reto · ${res.filter(r => r[1]).length}/${res.length}`}</div>` + res.map(([t, ok]) => `<div class="${ok ? "ok" : "ko"}">${ok ? "✓" : "○"} ${t}</div>`).join("");
        if (all && o.onPass) o.onPass();
    };
    ifr.addEventListener("load", () => { runChecks(); hookInspector(); if (st.sel) inspect(null); if (o.onChange) o.onChange(ifr); });
    ta.addEventListener("input", () => { st[st.tab] = ta.value; save(); clearTimeout(timer); timer = setTimeout(render, 350); });
    ta.addEventListener("keydown", e => {
        if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("  ", s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
    });
    box.querySelectorAll("[data-t]").forEach(b => b.onclick = () => setTab(b.dataset.t));
    box.querySelector('[data-a="reset"]').onclick = () => { if (!confirm("¿Volver al código inicial? Se perderán tus cambios.")) return; st.html = o.html; st.css = o.css; save(); setTab(st.tab); render(); };
    const sb = box.querySelector('[data-a="sol"]');
    if (sb) sb.onclick = () => { if (!confirm("¿Sustituir tu código por la solución? (Inténtalo antes tú)")) return; st.css = o.solCss; if (o.solHtml !== undefined) st.html = o.solHtml; save(); setTab(st.tab); render(); };
    // ---- inspector ----
    const cb = box.querySelector(".insp");
    cb.onchange = () => { st.insp = cb.checked; ov.innerHTML = ""; info.hidden = !cb.checked; if (cb.checked) { info.innerHTML = `<p class="muted">Pasa el ratón por el resultado y haz clic en un elemento para ver su <b>caja</b>, su <b>lugar en el DOM</b> y las <b>reglas CSS</b> que le afectan.</p>`; treePanel(); } };
    function boxes(el, keep) {

let QZ = null;
function renderTest() {
    $("v-test").innerHTML = `<div class="panel"><div class="row sb"><h2>Test</h2><select id="qz-g"><option value="all">Todo (${QUIZ.length})</option>${GROUPS.map(([g, n]) => `<option value="${g}">${g} · ${n} (${QUIZ.filter(q => q[0] === g).length})</option>`).join("")}</select></div>
   <div class="muted" id="qz-st"></div><div class="track"><div class="bar" id="qz-bar"></div></div><div id="qz-box"></div></div>`;
    const start = () => { const g = $("qz-g").value; QZ = { list: shuffle(QUIZ.filter(q => g === "all" || q[0] === g)), k: 0, ok: 0, fails: [], ans: false }; draw(); };
    const draw = () => {
        const n = QZ.list.length; $("qz-st").textContent = `Pregunta ${Math.min(QZ.k + 1, n)} de ${n} · Aciertos ${QZ.ok}`; $("qz-bar").style.width = (QZ.k / n * 100) + "%";
        if (QZ.k >= n) { $("qz-box").innerHTML = `<div class="big">${(QZ.ok / n * 10).toFixed(1).replace(".", ",")}</div>${QZ.fails.length ? `<h3>Repasa</h3><ul>${QZ.fails.map(q => `<li>${q[1]} → <b>${q[2][q[3]]}</b> <span class="badge">${q[0]}</span></li>`).join("")}</ul>` : "<p style='text-align:center'>¡Perfecto!</p>"}<div class="row" style="justify-content:center"><button class="primary" id="qz-again">Repetir</button></div>`; $("qz-again").onclick = start; return; }
        const q = QZ.list[QZ.k], ord = shuffle(q[2].map((_, i) => i)); QZ.ans = false;
        $("qz-box").innerHTML = `<span class="badge">${q[0]}</span><p class="qtext">${q[1]}</p><div class="opts">${ord.map((o, p) => `<button class="opt" data-o="${o}"><b>${"ABCD"[p]}</b> ${q[2][o]}</button>`).join("")}</div><div id="qz-fb"></div>`;
        document.querySelectorAll("#qz-box .opt").forEach(b => b.onclick = () => {
            if (QZ.ans) return; QZ.ans = true; const good = +b.dataset.o === q[3]; good ? QZ.ok++ : QZ.fails.push(q);
            document.querySelectorAll("#qz-box .opt").forEach(x => { x.disabled = true; if (+x.dataset.o === q[3]) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
            const les = LESSONS.find(l => l.g === q[0]);
            $("qz-fb").innerHTML = `<div class="row sb" style="margin-top:10px"><span>${good ? "✓ <b>Correcto</b>" : "✗ <b>No</b>"}</span><button class="primary" id="qz-next">Siguiente →</button></div>`;
            $("qz-next").onclick = () => { QZ.k++; draw(); }; $("qz-next").focus();
        });
    };
    $("qz-g").onchange = start; start();
}
