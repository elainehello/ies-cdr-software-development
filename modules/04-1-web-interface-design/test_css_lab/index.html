  bottom: 100%;          /* just above the trigger */
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 6px;
  white-space: nowrap;
  padding: 6px 10px;
  background: black;
  color: white;
  display: none;
}

.tip:hover .bubble { display: block; }`}},
{l:'modal overlay',set:{h:`<p>Page content behind the overlay.</p>
<div class="overlay">
  <div class="dialog">Modal dialog</div>
</div>`,c:`.overlay {
  position: fixed;
  inset: 0;              /* cover the whole viewport */
  display: grid;
  place-items: center;   /* center the dialog */
  background: rgba(0, 0, 0, 0.6);
}

.dialog {
  width: 240px;
  padding: 24px;
  background: white;
  border: 3px solid black;
}`}}]}],
props:['position','top','right','bottom','left','width'],pick:'.badge, .cap, .bubble, .dialog'},

{id:'containing-block',g:'Positioning',t:'Containing block',
body:`<p>The <b>containing block</b> is the rectangle an element is sized and positioned against. Percentages for <code>width</code>, <code>padding</code>, <code>margin</code> and <code>top/right/bottom/left</code> are resolved against it.</p>
<ul><li>static, relative or sticky: the <b>content box</b> of the nearest block-level ancestor.</li>
<li>absolute: the <b>padding box</b> of the nearest ancestor with <code>position</code> other than static, or with <code>transform</code>, <code>filter</code> or <code>contain</code>.</li>
<li>fixed: the <b>viewport</b>, unless an ancestor has <code>transform</code>, <code>filter</code> or <code>perspective</code>.</li></ul>
<p class="try">Try: inspect <code>.child</code>. The explanation names its containing block, and its 50% width changes between 150px, 300px and half the viewport as you change the controls.</p>`,
html:`<div class="outer">outer (600px)
  <div class="inner">inner (300px)
    <div class="child">child: width 50%</div>
  </div>
</div>`,
css:`.outer {
  width: 600px;
  position: {{op}};
  border: 3px solid black;
  padding: 10px;
}

.inner {
  width: 300px;
  border: 2px dashed black;
  padding: 10px;
  {{it}}
}

.child {
  position: {{cp}};
  width: 50%;
  top: 0;
  right: 0;
  background: black;
  color: white;
}`,
ctl:[{k:'cp',label:'.child position',opts:['static','absolute','fixed']},{k:'op',label:'.outer position',opts:['static','relative']},
{k:'it',label:'.inner',opts:[{l:'plain',v:'/* plain */'},{l:'position: relative',v:'position: relative;'},{l:'transform',v:'transform: translateX(0); /* traps fixed too */'}]}],
props:['position','width','top','right'],pick:'.child',w:760},

{id:'stacking',g:'Positioning',t:'Stacking context & z-index',
body:`<p>Inside one stacking context, things are painted back to front: backgrounds and borders, then negative z-index, normal blocks, floats, inline content, positioned elements with <code>z-index: auto</code> or 0, and finally positive z-index.</p>
<p><code>z-index</code> only works on positioned elements and on flex or grid items. A <b>stacking context</b> is a sealed group: its children's z-index is compared only <i>inside</i> it, and the whole group is placed using its own z-index in the parent. It is created by: <code>z-index</code> other than auto on a positioned element or flex/grid item, <code>position: fixed</code> or <code>sticky</code>, <code>opacity &lt; 1</code>, <code>transform</code>, <code>filter</code>, <code>isolation: isolate</code>, <code>mix-blend-mode</code>, <code>will-change</code>, <code>contain: paint</code> and <code>container-type</code>.</p>
<p class="try">Try: the child has z-index 9999. Give A <code>z-index: 1</code> and the child sinks below B (z-index 2), because it is now trapped inside A's context.</p>`,
html:`<div class="a">
  A
  <div class="child">A's child, z-index: 9999</div>
</div>
<div class="b">B (z-index: 2)</div>`,
css:`.a, .b {
  position: relative;
  width: 220px;
  height: 140px;
  border: 3px solid black;
  padding: 8px;
}

.a {
  z-index: {{za}};
  {{ctx}}
  background: white;
}

.b {
  z-index: 2;
  margin: -80px 0 0 120px;
  background: repeating-linear-gradient(-45deg, #000 0 2px, #fff 2px 9px);
}

.child {
  position: absolute;
  z-index: 9999;
  left: 150px;
  top: 80px;
  width: 180px;
  padding: 10px;
  background: black;
  color: white;
}`,
ctl:[{k:'za',label:'.a z-index',opts:['auto','1','3']},{k:'ctx',label:'.a other trigger',opts:[{l:'none',v:'/* no other trigger */'},{l:'opacity: 0.99',v:'opacity: 0.99;'},{l:'isolation: isolate',v:'isolation: isolate;'}]}],
props:['z-index','position','opacity','isolation'],pick:'.child'},

/* ---------------- RESPONSIVE ---------------- */
{id:'media',g:'Responsive',t:'Media queries',
body:`<p><code>@media</code> applies rules only while a condition is true, usually about the viewport width. With <b>mobile-first</b> design, the base styles are for small screens, and <code>@media (min-width: …)</code> blocks add changes for larger ones.</p>
<p>The preview's width <b>is</b> the viewport of the page inside it, so drag the viewport slider. The Matched rules panel marks each <code>@media</code> block as active ✓ or inactive ✗.</p>
<ul><li>Range syntax: <code>@media (600px &lt;= width &lt; 900px)</code></li>
<li>Other features: <code>prefers-color-scheme</code>, <code>prefers-reduced-motion</code>, <code>hover</code>, <code>orientation</code></li>
<li>Real pages need <code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code></li></ul>`,
html:`<p class="hint">Layout: </p>
<div class="layout">
  <div class="card">Card 1</div>
  <div class="card">Card 2</div>
  <div class="card">Card 3</div>
</div>`,
css:`/* base = mobile */
.layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.card { border: 2px solid black; padding: 20px; }

.hint::after { content: "mobile (< {{bp1}}px)"; }

@media (min-width: {{bp1}}px) {
  .layout { grid-template-columns: 1fr 1fr; }
  .hint::after { content: "tablet (>= {{bp1}}px)"; }
}

@media (min-width: {{bp2}}px) {
  .layout { grid-template-columns: repeat(3, 1fr); }
  .card { border-width: 5px; }
  .hint::after { content: "desktop (>= {{bp2}}px)"; }
}`,
ctl:[{k:'bp1',label:'Tablet breakpoint',min:400,max:800,step:10,v:600,u:'px'},{k:'bp2',label:'Desktop breakpoint',min:800,max:1200,step:10,v:900,u:'px'}],
props:['grid-template-columns','border-top-width'],pick:'.layout',w:500},

{id:'fluid',g:'Responsive',t:'Fluid sizing: clamp(), min(), max()',
body:`<p>Instead of jumping at breakpoints, values can scale smoothly:</p>
<ul><li><code>clamp(MIN, PREFERRED, MAX)</code>: the preferred value usually uses <code>vw</code>, kept between a minimum and a maximum.</li>
<li><code>min(100%, 500px)</code>: full width on phones, capped at 500px on desktop.</li>
<li><code>max()</code>: the larger of its values.</li>
<li><code>aspect-ratio</code>: keeps a shape's proportions. For images, <code>max-width: 100%; height: auto;</code> is the classic rule.</li></ul>
<p class="try">Try: drag the viewport from 240 to 1280 and watch the title's computed font-size stop at 20px and 56px.</p>`,
html:`<h1 class="title">Fluid title</h1>
<div class="panel">width: min(100%, 500px)</div>
<div class="media">aspect-ratio</div>`,
css:`.title {
  font-size: {{fs}};
  margin: 0 0 10px;
}

.panel {
  width: min(100%, 500px);
  border: 3px solid black;
  padding: 10px;
  margin-bottom: 10px;
}

.media {
  width: 60%;
  aspect-ratio: {{ar}};
  border: 2px solid black;
  background: repeating-linear-gradient(45deg, #000 0 2px, #fff 2px 10px);
}`,
ctl:[{k:'fs',label:'Title font-size',opts:['clamp(20px, 6vw, 56px)','6vw','32px']},{k:'ar',label:'aspect-ratio',opts:['16 / 9','1','4 / 3']}],
props:['font-size','width','height'],pick:'.title'},

{id:'container',g:'Responsive',t:'Container queries',
body:`<p>Media queries look at the <b>viewport</b>. Container queries look at the size of a <b>parent you choose</b>, marked with <code>container-type: inline-size</code>. The same component can then adapt to wherever it's placed, for example a narrow sidebar or a wide main column.</p>
<p>The <code>cqi</code> unit is 1% of the container's inline size (its width in horizontal text). One limitation: the container can no longer size itself from its content in that direction.</p>
<p class="try">Try: drag the slot width past 400px; the card switches to two columns while the viewport stays the same.</p>`,
html:`<div class="slot">
  <article class="card">
    <div class="img"></div>
    <div class="txt">
      <h3>Card title</h3>
      <p>This card changes layout based on its container width, not the viewport.</p>
    </div>
  </article>
</div>`,
css:`.slot {
  container-type: inline-size;
  width: {{sw}}px;
  border: 2px dashed black;
  padding: 8px;
}

.card {
  display: grid;
  gap: 10px;
  border: 2px solid black;
  padding: 10px;
}

.img {
  aspect-ratio: 4 / 3;
  background: repeating-linear-gradient(45deg, #000 0 2px, #fff 2px 10px);
}

.txt h3 { margin: 0; font-size: clamp(16px, 6cqi, 28px); }
.txt p { margin: 6px 0 0; }

@container (min-width: 400px) {
  .card { grid-template-columns: 140px 1fr; }
}`,

{"id": "ex-cartelera0", "g": "0.soluciones", "t": "cartelera0: movie cards with one class", "body": "<p>Your teacher's solution. The page is <b>built by JavaScript<\/b> (<code>creaNodo<\/code>), so the HTML editor only contains the script: look at the <b>Elements<\/b> tree in the inspector, or the comment at the top of <code>basico.html<\/code>, for the generated structure <code>.ficha &gt; a &gt; div<\/code> (photo), then the title, description and score divs.<\/p>\n<ul><li><b>Only one class<\/b> (<code>.ficha<\/code>). Every other box is reached by its <b>position<\/b>: <code>.ficha&gt;:nth-child(2)<\/code> is the title, <code>(3)<\/code> the description, <code>(4)<\/code> or <code>:nth-last-child(1)<\/code> the score, and <code>.ficha&gt;:nth-child(1)&gt;:nth-child(1)<\/code> the photo div inside the link.<\/li>\n<li><code>.ficha&gt;*<\/code> with <code>float:left<\/code>: every direct child floats, so photo, title and description sit side by side.<\/li>\n<li><b>Vertical centering trick<\/b>: <code>line-height<\/code> equal to <code>height<\/code> (40px/40px, 140px/140px) centers one line of text.<\/li>\n<li><code>position:relative<\/code> on the card and <code>position:absolute; top:10px; left:380px<\/code> on the score: the score is placed from its card's corner, out of the flow.<\/li>\n<li><code>margin:20px auto<\/code>: auto left/right margins center each card.<\/li>\n<li><b>unico.html<\/b>: <code>:hover<\/code> raises the photo's opacity and recolors the title with <code>!important<\/code>. The JavaScript adds the class <code>.aviso<\/code> to the score while the mouse is over the photo, because the comment says hovering one element and changing another \"can't be done in CSS\". <b>unico.htm<\/b> does it in CSS with the sibling combinator: <code>.ficha&gt;:nth-child(1):hover ~ :nth-child(4)<\/code>. Today <code>:has()<\/code> can do it too.<\/li><\/ul>\n<p class=\"try\">Try: switch the variant and read \"CSS explained\" for each selector. Hover a photo, or select the <code>a<\/code> in the tree and use Force state <code>:hover<\/code> on it in the <b>unico.htm<\/b> variant.<\/p>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "unico.html (hover + JS .aviso)", "set": {"h": "<script>\n  /* datos de entrada */\n  var lista=[\n  ['Colao','Colao','descripcion1','8'],\n  ['Francisco-un-hombre-de-palabra','El papa','descripcion2','nota2'],\n  ['Girl','Girl','descripcion3','2'],\n  ['Girl','Girl','descripcion3','5']\n  ];\n\n  window.onload = function(){\n    // BEGIN\n    var padre=document.body;\n    for (j=0;j<lista.length;j++){\n      var ficha=creaNodo(padre,'','ficha','div','ficha');\n      var enlace=creaNodo(ficha,'','L'+j,'a','');    \n      var titulo=creaNodo(ficha,lista[j][1],'t'+j,'div','');\n      var desc=creaNodo(ficha,lista[j][2],'d'+j,'div','');    \n      var nota=creaNodo(ficha,lista[j][3],'n'+j,'div','');\n      var foto=creaNodo(enlace,'','f'+j,'div',''); /* dentro de enlace */\n      foto.accion=nota; /* a que elemento aplico la clase aviso al hacer hover en la foto */ \n      foto.onmouseover=ratonFoto; /* hover en un elemento y cambiar otro , no se puede por css */\n      foto.onmouseleave=ratonFotoFuera;    \n      foto.style.backgroundImage='url(img/'+lista[j][0]+'.jpg)';\n      enlace.setAttribute('href','https://www.google.com/search?q='+lista[j][1]); // lanzamos una busqueda de la pelicula\n      enlace.setAttribute('target','_blank'); // en otra pestaña\n    }\n    // END\n  }\n  function ratonFoto(){\n    this.accion.className='aviso';\n  }\n  function ratonFotoFuera(){\n    this.accion.className='';\n  }\n  function creaNodo(o,t,m,z,s){\n    // o: contenedor\n    // t: texto\n    // m: id\n    // z: tipo de elemento\n    // s: clase\n    var p = document.createElement(z);\n    var contenido = document.createTextNode(t);   \n    p.id=''+m;\n    p.n=m;\n    if (s!=''){p.className=s;}\n    p.appendChild(contenido);   \n    o.appendChild(p);\n    return p; // por si queremos trabajar con el elemento\n  }      \n<\/script>", "c": "  .ficha{ /* contenedor */\n    width:100%; \n    height:180px;\n    padding:20px;\n    border: 2px solid #841;\n    text-align:center;  /* centrado horizontal texto */\n    position:relative;\n    max-width:415px;\n    min-width:300px;\n    margin:20px auto; /* centrar horizontal cajas */\n  }\n  .ficha>*{ /* todos los hijos directos de ficha */\n    float:left;\n  }\n  .ficha>:nth-child(1)>:nth-child(1){ /* a>foto primer hijo directo de ficha*/\n    width:118px; \n    height:180px;\n    background-size:cover;  \n    opacity:0.6;\n  }\n  .ficha>:nth-child(1)>:nth-child(1):hover{ /* nieto de ficha estado hover*/\n    opacity:1;\n  }\n  .ficha>:nth-child(2){ /* segundo hijo */\n    width:280px; \n    height:40px;\n    background-color:#DDE;\n    font-size:24px;\n    color:black;\n    line-height:40px;  /* para centrar vertical */\n  }\n  .ficha>:nth-child(2):hover{\n    background-color:#A31!important; /* uso del important prioriza este estilo */\n    cursor:help;\n  }\n  .ficha>:nth-child(3){ /* descendiente tercero */\n    width:280px; \n      height:140px;\n    background-color:#FEA;\n    color:#333;\n     line-height:140px; /* centrado vertical */\n  }\n  .ficha>:nth-child(4){ /*nota*/\n    width:60px; \n      height:60px;\n    position:absolute;\n    top:10px;\n    left:380px;\n    background-color:#DAA;\n    color:white;\n    border: 1px solid #555;\n    line-height:60px; /* centrado vertical */\n  }\n  .aviso{\n    background-color:#A31!important; /* uso del important */\n  }"}}, {"l": "unico.htm (hover with ~)", "set": {"h": "<script>\n  /* datos de entrada */\n  var lista=[\n  ['Colao','Colao','descripcion1','8'],\n  ['Francisco-un-hombre-de-palabra','El papa','descripcion2','nota2'],\n  ['Girl','Girl','descripcion3','2'],\n  ['Girl','Girl','descripcion3','5']\n  ];\n\n  window.onload = function(){\n    // BEGIN\n    var padre=document.body;\n    for (j=0;j<lista.length;j++){\n      var ficha=creaNodo(padre,'','ficha','div','ficha');\n      var enlace=creaNodo(ficha,'','L'+j,'a','');    \n      var titulo=creaNodo(ficha,lista[j][1],'t'+j,'div','');\n      var desc=creaNodo(ficha,lista[j][2],'d'+j,'div','');    \n      var nota=creaNodo(ficha,lista[j][3],'n'+j,'div','');\n      var foto=creaNodo(enlace,'','f'+j,'div',''); \n      foto.accion=nota; /* a que elemento aplico la clase aviso al hacer hover en la foto */ \n      foto.onmouseover=ratonFoto; /* hover en un elemento y cambiar otro , no se puede por css */\n      foto.onmouseleave=ratonFotoFuera;    \n      foto.style.backgroundImage='url(img/'+lista[j][0]+'.jpg)';\n      enlace.setAttribute('href','https://www.google.com/search?q='+lista[j][1]); // lanzamos una busqueda de la pelicula\n      enlace.setAttribute('target','_blank'); // en otra pestaña\n    }\n    // END\n  }\n  function ratonFoto(){\n    this.accion.className='aviso';\n  }\n  function ratonFotoFuera(){\n    this.accion.className='';\n  }\n  function creaNodo(o,t,m,z,s){\n    // o: contenedor\n    // t: texto\n    // m: id\n    // z: tipo de elemento\n    // s: clase\n    var p = document.createElement(z);\n    var contenido = document.createTextNode(t);   \n    p.id=''+m;\n    p.n=m;\n    if (s!=''){p.className=s;}\n    p.appendChild(contenido);   \n    o.appendChild(p);\n    return p; // por si queremos trabajar con el elemento\n  }      \n<\/script>", "c": "  .ficha{ /* contenedor */\n    width:100%; \n    height:180px;\n    padding:20px;\n    border: 2px solid #841;\n    text-align:center;  /* centrado horizontal texto */\n    position:relative;\n    max-width:415px;\n    min-width:300px;\n    margin:20px auto; /* centrar horizontal cajas */\n  }\n  .ficha>*{ /* todos los hijos directos de ficha */\n    float:left;\n  }\n  .ficha>:nth-child(1)>:nth-child(1){ /* a>foto primer hijo directo de ficha*/\n    width:118px; \n    height:180px;\n    background-size:cover;  \n    opacity:0.6;\n  }\n    .ficha>:nth-child(2){ /* segundo hijo */\n    width:280px; \n    height:40px;\n    background-color:#DDE;\n    font-size:24px;\n    color:black;\n    line-height:40px;  /* para centrar vertical */\n  }/*\n  .ficha>:nth-child(1)>:nth-child(1):hover { \n    opacity:1;\n  }*/\n  .ficha>:nth-child(1):hover ~ :nth-child(4){\n    background-color:#A31!important; \n    cursor:help;\n  }\n  .ficha>:nth-child(3){ /* descendiente tercero */\n    width:280px; \n         height:140px;\n    background-color:#FEA;\n    color:#333;\n    line-height:140px; /* centrado vertical */\n  }\n  .ficha>:nth-child(4){ /*nota*/\n    width:60px; \n         height:60px;\n    position:absolute;\n    top:10px;\n    left:380px;\n    background-color:#DAA;\n    color:white;\n    border: 1px solid #555;\n    line-height:60px; /* centrado vertical */\n  }"}}, {"l": "basico.html (layout only)", "set": {"h": "<script>\n  /* datos de entrada */\n  var lista=[\n  ['Colao','Colao','descripcion1','8'],\n  ['Francisco-un-hombre-de-palabra','El papa','descripcion2','nota2'],\n  ['Girl','Girl','descripcion3','2'],\n  ['Girl','Girl','descripcion3','5']\n  ];\n\n  window.onload = function(){\n    // BEGIN\n    var padre=document.body;\n    for (j=0;j<lista.length;j++){\n      var ficha=creaNodo(padre,'','ficha','div','ficha');\n      var enlace=creaNodo(ficha,'','L'+j,'a','');    \n      var titulo=creaNodo(ficha,lista[j][1],'t'+j,'div','');\n      var desc=creaNodo(ficha,lista[j][2],'d'+j,'div','');    \n      var nota=creaNodo(ficha,lista[j][3],'n'+j,'div','');\n      var foto=creaNodo(enlace,'','f'+j,'div',''); /* dentro de enlace */\n      foto.accion=nota; /* a que elemento aplico la clase aviso al hacer hover en la foto */ \n      foto.onmouseover=ratonFoto; /* hover en un elemento y cambiar otro , no se puede por css */\n      foto.onmouseleave=ratonFotoFuera;    \n      foto.style.backgroundImage='url(img/'+lista[j][0]+'.jpg)';\n      enlace.setAttribute('href','https://www.google.com/search?q='+lista[j][1]); // lanzamos una busqueda de la pelicula\n      enlace.setAttribute('target','_blank'); // en otra pestaña\n    }\n    // END\n  }\n  function ratonFoto(){\n    this.accion.className='aviso';\n  }\n  function ratonFotoFuera(){\n    this.accion.className='';\n  }\n  function creaNodo(o,t,m,z,s){\n    // o: contenedor\n    // t: texto\n    // m: id\n    // z: tipo de elemento\n    // s: clase\n    var p = document.createElement(z);\n    var contenido = document.createTextNode(t);   \n    p.id=''+m;\n    p.n=m;\n    if (s!=''){p.className=s;}\n    p.appendChild(contenido);   \n    o.appendChild(p);\n    return p; // por si queremos trabajar con el elemento\n  }      \n<\/script>", "c": "/*\n\nEstructura de una ficha:;\n\n<div id=\"ficha\" class=\"ficha\">\n  <a id=\"L0\" href=\"https://www.google.com/search?q=Colao\" target=\"_blank\">\n    <div id=\"f0\" style=\"background-image: url(&quot;img/Colao.jpg&quot;);\"><\/div>\n  <\/a>\n  <div id=\"t0\">Colao<\/div>\n  <div id=\"d0\">descripcion1<\/div>\n  <div id=\"n0\">8<\/div>\n<\/div>\n\n*/\n\n/*\ntips:\nfloat:left;\nposition:relative;\nbackground-size:cover;  \nbackground-color:#DDE;\nline-height:140px; \n.ficha>:nth-child(1)>:nth-child(1)\n.ficha>:nth-child(3)\n*/\n\n/* contenedor */\n.ficha{ \n  width:415px; \n    height:180px;\n  padding:20px;\n  border: 2px solid #841;\n  text-align:center; /* centrado horizontal texto */\n  position:relative; /* tengo debajo absolute */\n  margin:20px auto; /* centrar horizontal cajas */\n}\n\n/* todos los hijos directos de ficha */\n.ficha>*{ \n  float:left;\n}\n\n /* foto */\n.ficha>:nth-child(1)>:nth-child(1){\n  width:118px; \n  height:180px;\n  background-size:cover;  \n}\n\n/* titulo */\n.ficha>:nth-child(2){ \n  width:280px; \n  height:40px;\n  background-color:#DDE;\n  font-size:24px;\n  color:black;\n  line-height:40px;  /* para centrar vertical */\n}\n\n/* descripcion */\n.ficha>:nth-child(3){ \n  width:280px; \n  height:140px;\n  background-color:#FEA;\n  color:#333;\n  line-height:140px; /* centrado vertical */\n}\n\n/* nota */\n.ficha>:nth-child(4){ \n  width:60px; \n  height:60px;\n  position:absolute;\n  top:10px;\n  left:380px;\n  background-color:#DAA;\n  color:white;\n  border: 1px solid #555;\n  line-height:60px; /* centrado vertical */\n}"}}, {"l": "index + estilo.css (nth-last-child)", "set": {"h": "<!-- javascript.js -->\n<script>\n/* datos de entrada */\nvar lista=[\n['Colao','Colao','descripcion1','8'],\n['Francisco-un-hombre-de-palabra','El papa','descripcion2','nota2'],\n['Girl','Girl','descripcion3','2'],\n['Colao','Colao','descripcion1','8'],\n['Girl','Girl','descripcion3','5']\n];\n\nwindow.onload = function(){\n  // BEGIN\n  var padre=document.body;\n  for (j=0;j<lista.length;j++){\n    var ficha=creaNodo(padre,'','ficha','div','ficha');\n    var enlace=creaNodo(ficha,'','L'+j,'a','');    \n    var titulo=creaNodo(ficha,lista[j][1],'t'+j,'div','');\n    var desc=creaNodo(ficha,lista[j][2],'d'+j,'div','');    \n    var nota=creaNodo(ficha,lista[j][3],'n'+j,'div','nota');\n    var foto=creaNodo(enlace,'','f'+j,'div',''); /* dentro de enlace */\n    foto.accion=nota; /* a que elemento aplico la clase aviso al hacer hover en la foto */ \n    //foto.onmouseover=ratonFoto; /* hover en un elemento y cambiar otro , no se puede por css */\n    //foto.onmouseleave=ratonFotoFuera;    \n    foto.style.backgroundImage='url(img/'+lista[j][0]+'.jpg)';\n    enlace.setAttribute('href','https://duckduckgo.com/?q='+lista[j][1]+'&atb=v1-1&ia=web'); // lanzamos una busqueda de la pelicula\n    enlace.setAttribute('target','_blank'); // en otra pestaña\n  }\n  // END\n}\n/*\nfunction ratonFoto(){\n  this.accion.className='aviso';\n}\nfunction ratonFotoFuera(){\n  this.accion.className='';\n}\n*/\nfunction creaNodo(o,t,m,z,s){\n  // o: contenedor\n  // t: texto\n  // m: id\n  // z: tipo de elemento\n  // s: clase\n  var p = document.createElement(z);\n  var contenido = document.createTextNode(t);   \n  p.id=''+m;\n  p.n=m;\n  if (s!=''){p.className=s;}\n  p.appendChild(contenido);   \n  o.appendChild(p);\n  return p; // por si queremos trabajar con el elemento\n}\n<\/script>", "c": "/* solo se declara una clase */\n/* el acceso a los demas por combinaciones y seudoclases */\n\n.ficha{ /* contenedor */\n  width:100%; \n    height:180px;\n  padding:20px;\n  border: 2px solid #841;\n  text-align:center;  /* centrado horizontal texto */\n  position:relative;\n  max-width:415px;\n  min-width:300px;\n  margin:20px auto; /* centrar horizontal cajas */\n}\n.ficha>*{ /* todos los hijos directos de ficha */\n  float:left;\n}\n.ficha>:nth-child(1)>:nth-child(1){ /* a>foto primer hijo directo de ficha*/\n  width:118px; \n    height:180px;\n  background-size:cover;  \n}\n.ficha>:nth-child(2){ /* segundo hijo */\n  width:280px; \n    height:40px;\n  background-color:#DDE;\n    font-size:24px;\n    color:black;\n  line-height:40px;  /* para centrar vertical */\n}\n.ficha>:nth-child(3){ /* descendiente tercero */\n  width:280px; \n    height:140px;\n  background-color:#FEA;\n  color:#333;\n   line-height:140px; /* centrado vertical */\n}\n.ficha>:nth-last-child(1){ /*nota*/\n  width:60px; \n    height:60px;\n  position:absolute;\n  top:10px;\n  left:380px;\n  background-color:#DAA;\n  color:white;\n  border: 1px solid #555;\n  line-height:60px; /* centrado vertical */\n}\n.ficha>:nth-last-child(1){ /* color de la nota */\n  background-color:#A31;\n}\n"}}]}], "props": ["position", "float", "width", "height", "line-height", "top", "left", "background-color", "opacity"], "assets": ["Colao.jpg", "Francisco-un-hombre-de-palabra.jpg", "Girl.jpg"], "w": 520, "pick": ".ficha > :nth-child(4)"},
{"id": "ex-cartelera1", "g": "0.soluciones", "t": "cartelera1: #id, descendant :nth-child, floats", "body": "<ul><li><code>div { border: solid 1px }<\/code>: a type selector, specificity (0,0,1), so <b>every<\/b> div gets a border.<\/li>\n<li><code>.ficha div:nth-child(1)<\/code> uses a <b>space<\/b> (descendant), not <code>&gt;<\/code>. It means \"any div inside .ficha that is the 1st child of <i>its own<\/i> parent\", which here is the div inside the <code>&lt;a&gt;<\/code>. Compare it with <code>.ficha&gt;:nth-child(1)<\/code> in cartelera0: one character changes which element is selected.<\/li>\n<li>The same selector appears <b>several times<\/b> (<code>.ficha div:nth-child(1)<\/code> four times). The cascade merges them: every declaration applies, and for the same property the later one wins.<\/li>\n<li><code>#contenedor &gt; div:nth-child(1)<\/code>, <code>(2)<\/code> and <code>(3)<\/code> all just float the cards. One rule, <code>#contenedor &gt; .ficha<\/code>, would do the same.<\/li>\n<li><code>#contenedor &gt; .ficha:nth-child(1) div:nth-child(1):hover<\/code> scores (1,3,2) and only changes the cursor of the <b>first<\/b> card's image.<\/li>\n<li>The JavaScript changes <code>#fondo1<\/code>'s background through <code>element.style<\/code>, which is an <b>inline style<\/b> and beats every selector. Switch to the <b>:has()<\/b> variant to see the same effect in pure CSS: \"#fondo1 that contains a hovered #titulo1\".<\/li><\/ul>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "estilo.css + repaso.js (original)", "set": {"h": "<div id='contenedor'>\n  <div id='fondo1' class='ficha'>\n    <a href='http://www.google.com'><div><\/div><\/a>\n    <div id='titulo1'>titulo<\/div>\n    <div>descripcion<\/div>\n  <\/div>\n  <div class='ficha'>\n    <a href='www.google.com'><div><\/div><\/a>\n    <div>titulo<\/div>\n    <div>descripcion<\/div>\n  <\/div>\n  <div class='ficha'>\n    <a href='www.google.com'><div><\/div><\/a>\n    <div>titulo<\/div>\n    <div>descripcion<\/div>\n  <\/div>  \n<\/div>\n\n<!-- repaso.js -->\n<script>\n// GLOBALES\n\nfunction iniciar(){\n  console.log('iniciar');\n  document.getElementById('titulo1').onmouseover=enTitulo;\n  document.getElementById('titulo1').onmouseout=fueradeTitulo;\n}\nfunction enTitulo(){\n    console.log('click');\n  document.getElementById('fondo1').style.backgroundColor='red';\n}\nfunction fueradeTitulo(){\n    console.log('click');\n  document.getElementById('fondo1').style.backgroundColor='#AAA';\n}\n<\/script>\n\n<script>\n  window.onload=iniciar;\n<\/script>", "c": "/* generales */\n\nbody {\n  font-size:0.8em;\n}\n\ndiv {\n  border:solid 1px\n}\n\n#contenedor{\n  margin:0 auto /* contenedor principal centrado */\n}\n\n/* layout de la ficha */\n.ficha{\n  background:#AAA;width:220px;height:82px;margin:20px;\n}\n\n.ficha div {\n  margin:5px;\n}\n\n/* layout de los elementos de la ficha */ \n.ficha div:nth-child(1){\n  width:60px;\n  height:70px;\n  float:left;\n}\n\n.ficha div:nth-child(2){\n  width:132px;\n  height:20px;\n  float:left;\n  padding:2px;\n}\n\n.ficha div:nth-child(3){\n  width:132px;\n  height:28px;\n  float:left;\n  padding:2px;\n}\n\n#contenedor > div:nth-child(1){\n  float:left;\n}\n\n#contenedor > div:nth-child(2){\n  float:left;\n}\n\n#contenedor > div:nth-child(3){\n  float:left;\n}\n\n/* formato ficha*/\n\n.ficha div:nth-child(2){\n  background:green;\n}\n\n.ficha div:nth-child(3){\n  background:yellow;\n}\n\n\n.ficha div:nth-child(1){\n  background-size: contain;/* una imagen de fondo ajustada al contenedor*/\n}\n\n.ficha div:nth-child(1){\n  background-image:url(\"img/v366.jpg\");\n}\n\n/* cambio de opacidad de una imagen */\n.ficha div:nth-child(1){\n  opacity:0.7\n}\n\n.ficha div:nth-child(1):hover{\n  opacity:1\n}\n\n/* un cambio del cursor */\n#contenedor > .ficha:nth-child(1) div:nth-child(1):hover{\n  cursor:wait\n}\n\n/* min max contenedor principal*/\n#contenedor{\n  width:800px;\n  height:400px; {"id": "ex-modal", "g": "0.soluciones", "t": "modal0: a modal without JavaScript (:target)", "body": "<ul><li>Clicking <code>href=\"#miModal\"<\/code> puts <code>#miModal<\/code> in the URL. <code>#miModal:target<\/code> matches the element whose <code>id<\/code> equals that fragment, and switches it from <code>display:none<\/code> to <code>display:block<\/code>.<\/li>\n<li>Your teacher's warning in the code is about <b>specificity<\/b>: <code>#miModal:target<\/code> scores (1,1,0) and beats <code>#miModal<\/code> (1,0,0). Writing just <code>:target<\/code> (0,1,0) would lose against <code>#miModal{display:none}<\/code>.<\/li>\n<li><code>position:absolute; top:0; right:0; bottom:0; left:0<\/code> stretches the black curtain over the whole page. <code>rgba(0,0,0,0.8)<\/code> is black at 80% opacity.<\/li>\n<li><code>#miModal&gt;div<\/code> uses <code>margin:10% auto<\/code>: auto left/right centers the white box, and 10% is measured from the container's <i>width<\/i>.<\/li>\n<li>The close cross uses <code>href=''<\/code>, which reloads the page and clears the <code>#<\/code>. In the lab it just clears the <code>#<\/code>.<\/li><\/ul>\n<p class=\"try\">Try: click \"click abrir modal\" in the preview, then the cross. Inspect <code>#miModal<\/code> before and after: its <code>:target<\/code> rule goes from \"waits for :target\" to active.<\/p>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "modal0.htm", "set": {"h": "<a href=\"#miModal\">click abrir modal<\/a>\n<div id=\"miModal\">\n  <div>\n    <a href=''>&#10539;<\/a>\n    <h2>Esto es un modal<\/h2>\n    <p>Este es un modal sin utilizar JavaScript<\/p>\n  <\/div>  \n<\/div>", "c": "/*\nmodal por display :target y recarga de pagina\n- href=\"#miModal\" actua sobre ese id\n- href=\"#\" recarga la pagina\n- href='' recarga de la pagina\n*/\n\n/* eliminar el subrayado de los href */ \na{\n  text-decoration: none;\n}\n\n/* cortina negra pantalla completa */\n#miModal{\n  background-color: rgba(0,0,0,0.8);\n  position: absolute; /* negro pantalla completa */\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left: 0;\n  display: none; \n  /*\n  transition: all 4s; \n  opacity: 0;  \n  pointer-events: none; \n  */\n}\n\n/* caja blanca  */\n#miModal>div{\n  background-color: #EEE;\n  width: 400px;\n  padding: 10px 20px;\n  margin: 10% auto; /* centrado horizonal y seudo vertical */\n  position: relative;\n}\n\n/*\ncuidado !\nel selector #miModal:target debe usar #miModal,\nal tener el mismo nivel :target tiene mas prioridad en la cascada de estilos\n*/\n\n/* evento click en el hiperenlace */\n#miModal:target{ \n  display: block;  \n  /*\n  opacity: 1; \n  pointer-events: auto; \n  */\n}\n\n/* cruz de cierre del modal */\n#miModal a{\n  font-size: 32px; \n}"}}]}], "props": ["display", "position", "top", "left", "background-color"], "assets": [], "pick": "#miModal"},
{"id": "ex-parrilla", "g": "0.soluciones", "t": "parrilla: a 9×9 grid of floats built by JavaScript", "body": "<ul><li>JavaScript creates 81 divs and gives them the classes <code>tipo1<\/code> (even) and <code>tipo2<\/code> (odd) with <code>className<\/code>. The CSS never needs <code>:nth-child<\/code>, because the classes come from the code.<\/li>\n<li><code>.tipo0,.tipo1,.tipo2<\/code> is a <b>group<\/b> (comma list) holding the shared part. The rules after it add the differences, so the cascade combines both for each box.<\/li>\n<li><code>float:left<\/code> puts the boxes in a row until there is no room, then they wrap. The container width is <b>calculated<\/b> so that exactly 9 fit. In estilo1.css each box is 20 (width) + 2×10 (padding) + 2×1 (border) + 2×2 (margin) = <b>46px<\/b>, and 9 × 46 = 414, which fits in 415px. In estilo2.css: 40 + 2 + 2 = 44, and 9 × 44 = 396.<\/li>\n<li><code>line-height:40px<\/code> equal to <code>height:40px<\/code> centers the number vertically (estilo2.css).<\/li>\n<li>The original switches stylesheets with the keys 1 and 2 (<code>setAttribute('href', …)<\/code>). Here, use the <b>Variant<\/b> buttons instead.<\/li><\/ul>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "estilo1.css (key 1)", "set": {"h": "<link rel=\"stylesheet\" type=\"text/css\" href=\"\"/>\n\n<!-- j.js -->\n<script>\n/*\n\n- ver eventoTeclado.html\n- posicionamiento del div con float y clear\n- usar className para poner clases , agrupar los estilos\n- dos hojas de estilos estilos1.css y estilos2.css\n- modificar con ele.setAttribute('href','estilo1.css');\n- evento pasar con el raton ele.onmouseover=raton; \nlenguaje: getElementsByTagName,Math.floor\n*/\n\nwindow.onload = function(){\n  window.onkeypress=tecla; // pulsacion de la tecla en window sera detectada en cualquier parte de la pagina\n  var padre=document.body; \n  creaNodo(padre,'','caja1','div','tipo0'); // primera caja mostrar el texto del mouseover\n  var contenedor=creaNodo(padre,'','contenedor','div',''); // contenedor de los cajas de colores\n  for (let j=0;j<81;j++){ // 81 cajas  \n    let clase='tipo2';\n    if ( j % 2 == 0 ){ clase='tipo1' }\n    // al estar dentro de un contenedor, float se encarga del salto de linea        \n    var ele=creaNodo(contenedor,j+(Math.floor(j/9)),'D'+j,'div',clase);// crear nodo\n    if ( j % 2 == 0 ){ ele.onmouseover=raton }  \n  }\n  var ele=document.getElementsByTagName('link')[0]; // primero, el unico que hay\n  ele.setAttribute('href','estilo1.css'); // modificar un atributo de un elemento\n}\nfunction raton(){\n  // muestra el texto de la caja con el evento mourover\n  var ele=document.getElementById('caja1');\n  ele.innerHTML=this.innerHTML;\n}\nfunction tecla(e){\n  // cambiar hoja de estilos al pulsar tecla 1 o 2\n  // en el parametro e tenemos la informacion del evento\n  console.log(e);\n  var estilo='estilo1.css';\n  if (e.key=='2'){estilo='estilo2.css'}\n  if (e.key=='1'){estilo='estilo1.css'}\n  var ele=document.getElementsByTagName('link')[0]; // primero pero solo hay uno\n  ele.setAttribute('href',estilo); // modificar un atributo de un elemento\n}\nfunction creaNodo(ancestro,texto,id,tipo,clase){\n  // ancestro: elemento padre\n  // t: texto que crearemos dentro de un nodo text equivamente al innerHTML\n  // m: id del nodo \n  // tipo: tipo de nodo\n  // clase: clase que ponermos al elemento\n  // crea un texto dentro del nodo createElement\n  // alternativa .innerHTML que no es estandar pero esta aceptado \n  var p = document.createElement(tipo);\n  var contenido = document.createTextNode(texto);  \n  p.n=id\n  p.id=id;\n  p.className=clase;\n  p.appendChild(contenido);   \n  ancestro.appendChild(p);\n  return p; // por si queremos trabajar con la referencia al elemento\n}\n<\/script>", "c": "#contenedor{\n  width:415px; /* calculadas segun contenidos */\n    height:416px;\n  border: 2px solid #000;\n  text-align:center;\n  margin-top:10px;\n}\n\n.tipo0,.tipo1,.tipo2{ /* parte comun */\n    height:20px;\n}\n\n.tipo0{\ntext-align:center;\n    width:80px;  \n  border: 1px solid;  \n}\n.tipo1,.tipo2{\n   height:20px;\n  padding:10px;\n  margin:2px;\n    width:20px;\n  float:left;\n  border: 1px solid #000;  \n}\n.tipo1 {\n  background-color:#FD2;\n  color:black;\n}\n.tipo2 {\n  background-color:#432;\n  color:white;\n}"}}, {"l": "estilo2.css (key 2)", "set": {"h": "<link rel=\"stylesheet\" type=\"text/css\" href=\"\"/>\n\n<!-- j.js -->\n<script>\n/*\n\n- ver eventoTeclado.html\n- posicionamiento del div con float y clear\n- usar className para poner clases , agrupar los estilos\n- dos hojas de estilos estilos1.css y estilos2.css\n- modificar con ele.setAttribute('href','estilo1.css');\n- evento pasar con el raton ele.onmouseover=raton; \nlenguaje: getElementsByTagName,Math.floor\n*/\n\nwindow.onload = function(){\n  window.onkeypress=tecla; // pulsacion de la tecla en window sera detectada en cualquier parte de la pagina\n  var padre=document.body; \n  creaNodo(padre,'','caja1','div','tipo0'); // primera caja mostrar el texto del mouseover\n  var contenedor=creaNodo(padre,'','contenedor','div',''); // contenedor de los cajas de colores\n  for (let j=0;j<81;j++){ // 81 cajas  \n    let clase='tipo2';\n    if ( j % 2 == 0 ){ clase='tipo1' }\n    // al estar dentro de un contenedor, float se encarga del salto de linea        \n    var ele=creaNodo(contenedor,j+(Math.floor(j/9)),'D'+j,'div',clase);// crear nodo\n    if ( j % 2 == 0 ){ ele.onmouseover=raton }  \n  }\n  var ele=document.getElementsByTagName('link')[0]; // primero, el unico que hay\n  ele.setAttribute('href','estilo1.css'); // modificar un atributo de un elemento\n}\nfunction raton(){\n  // muestra el texto de la caja con el evento mourover\n  var ele=document.getElementById('caja1');\n  ele.innerHTML=this.innerHTML;\n}\nfunction tecla(e){\n  // cambiar hoja de estilos al pulsar tecla 1 o 2\n  // en el parametro e tenemos la informacion del evento\n  console.lo {"id": "ex-galeria-filas", "g": "0.soluciones", "t": "flexGaleria: horizontal rows (background-image vs img)", "body": "<ul><li>There are three levels: <code>.contenedor &gt; div<\/code> is a flex row, and <code>.contenedor &gt; div &gt; div<\/code> (or <code>&gt; img<\/code>) are the photos.<\/li>\n<li><b>horizontalDIV<\/b>: each photo is a div with <code>background-image<\/code> in an inline style, plus <code>background-size: cover<\/code>. The image fills the box and gets cropped, but never distorts.<\/li>\n<li><b>horizontalIMG<\/b>: real <code>&lt;img&gt;<\/code> elements with <code>width:100%<\/code>, stretched to the row height by flex (<code>align-items: stretch<\/code>), so they <b>distort<\/b>. <code>object-fit: cover<\/code> would fix it.<\/li>\n<li><code>* { margin:0; padding:0 }<\/code> is a reset that removes the browser's default spacing.<\/li>\n<li><code>min-width:400px<\/code> stops the container from shrinking further. <code>@media<\/code> blocks lower the row height on small screens.<\/li>\n<li>horizontalIMG ends with an extra <code>}<\/code>. It's a syntax error, harmless here because nothing comes after it.<\/li><\/ul>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "horizontalDIV (background-image)", "set": {"h": "<div class=\"header\">\n  <h1>Responsive Image Gallery<\/h1>\n  <p>Resize the browser window to see the responsive effect<\/p>\n<\/div>\n<div class=\"contenedor\"> \n  <div>\n    <div style=\"background-image: url('img/wedding.jpg')\"><\/div>\n    <div style=\"background-image: url('img/rocks.jpg')\"><\/div>\n    <div style=\"background-image: url('img/falls2.jpg')\"><\/div>\n    <div style=\"background-image: url('img/paris.jpg')\"><\/div>\n    <div style=\"background-image: url('img/nature.jpg')\"><\/div>\n    <div style=\"background-image: url('img/mist.jpg')\"><\/div>\n  <\/div>\n  <div>\n    <div style=\"background-image: url('img/paris.jpg')\"><\/div>\n    <div style=\"background-im \n  margin: 4px;\n  width: 500px;\n  background-size: cover; /* comportamiento de la imagen */\n}\n@media (max-width:800px) {\n  .contenedor > div {\n    height: 120px;\n  }\n}\n@media (max-width:600px) {\n  .contenedor > div {\n    height: 80px;\n  }\n}"}}, {"l": "horizontalIMG (img)", "set": {"h": "<div class=\"header\">\n  <h1>Responsive Image Gallery<\/h1>\n  <p>Resize the browser window to see the responsive effect.<\/p>\n<\/div>\n\n<div class=\"contenedor\"> \n  <div>\n    <img src=\"img/wedding.jpg\">\n    <img src=\"img/rocks.jpg\">\n    <img src=\"img/falls2.jpg\">\n    <img src=\"img/paris.jpg\">\n    <img src=\"img/nature.jpg\">\n    <img src=\"img/mist.jpg\">\n  <\/div>\n  <div>\n    <img src=\"img/paris.jpg\">\n    <img src=\"img/underwater.jpg\">\n    <img src=\"img/ocean.jpg\">\n    <img src=\"img/wedding.jpg\">\n    <img src=\"img/mountainskies.jpg\">\n    <img src=\"img/rocks.jpg\">\n    <img src=\"img/underwater.jpg\">\n  <\/div> \n  <div>\n    <img src=\"img/wedding.jpg\">\n    <img src=\"img/rocks.jpg\">\n    <img src=\"img/falls2.jpg\">\n    <img src=\"img/paris.jpg\">\n    <img src=\"img/nature.jpg\">\n    <img src=\"img/mist.jpg\">\n  <\/div>\n  <div>\n    <img src=\"img/paris.jpg\">\n    <img src=\"img/underwater.jpg\">\n    <img src=\"img/ocean.jpg\">\n    <img src=\"img/wedding.jpg\">\n    <img src=\"img/mountainskies.jpg\">\n    <img src=\"img/rocks.jpg\">\n    <img src=\"img/underwater.jpg\">\n  <\/div>\n<\/div>", "c": "/*\n\n- layout div>div>img\n- flex para organizar los img\n- usando width 100% en img podemos hacer la imagen se ajuste\n- responsiva con height\n\n- cuando usar img cunado background-img:;\nhttps://es.stackoverflow.com/questions/24511/cu%C3%A1ndo-se-deber%C3%ADa-usar-img-y-cuando-background-image\n\n*/\n\n* { \n    margin: 0;\n    padding: 0;\n}\nbody {\n  font-family: Arial;\n}\n.header {\n  text-align: center;\n  padding: 32px;\n}\n.contenedor {\n  width: 95%;\n  margin: auto; /* centrado horizontal*/\n  min-width: 400p {"id": "ex-tamanos", "g": "0.soluciones", "t": "maxMin & textoCentrado: width limits and flex centering", "body": "<ul><li><b>maxMin<\/b>: <code>width: 90%<\/code> follows the window, but never goes below <code>min-width: 500px<\/code> or above <code>max-width: 700px<\/code>. <code>margin: auto<\/code> centers it. Drag the viewport from 400 to 1280 and watch the computed width.<\/li>\n<li>Note: the selector is just <code>div<\/code>, so <b>every<\/b> div on the page gets these rules.<\/li>\n<li><b>textoCentrado<\/b>: <code>display:flex<\/code> with <code>align-items:center<\/code> (vertical) and <code>justify-content:center<\/code> (horizontal) centers the inner box in both directions. <code>text-align:center<\/code> centers the <i>text<\/i> inside it.<\/li><\/ul>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "maxMin", "set": {"h": "<div>\n  HOLA\n<\/div>", "c": "/*\n\n- se expande hasta el 90% de la ventana\n- si cambiamos el tamaño de la ventana\n- pero no baja de min-width\n- y no sube de max-width\n- la ventana del navegador no se reduce hasta cero\n- margin auto centrado vertical\n\n*/\ndiv{\n  margin: auto;\n  width: 90%;\n  height: 400px;\n  max-width: 700px;\n  min-width: 500px;\n  background-color: yellow;\n}"}}, {"l": "textoCentrado", "set": {"h": "<div class='a'>\n  <div>HOLA SOY UN TEXTO CENTRADO RESPOSIVE<\/div>\n<\/div>", "c": "/*\ncentrado vertical de texto usando flex\n\nhttps://developer.mozilla.org/es/docs/Web/CSS/CSS_Flexible_Box_Layout/Aligning_Items_in_a_Flex_Container\n\n*/\n.a{\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  margin: auto;\n  width: 60%;\n  height: 400px;\n  margin-top: 64px;\n  max-width: 800px;\n  min-width: 600px;\n  background-color: #AAA;\n  font-size: 32px;\n}\n.a>div{\n  width: 50%;\n  text-align: center;\n  background-color: #DDD;    \n  padding: 32px;\n}"}}]}], "props": ["display", "width", "max-width", "min-width", "margin-left", "align-items", "justify-content"], "assets": [], "w": 760, "pick": "div"},
{"id": "ex-fotos", "g": "0.soluciones", "t": "indiceFotos: photo column and slider (class vs :active)", "body": "<ul><li><b>index1<\/b>: JavaScript reads the <code>ft<\/code> array (from datos.js) and creates one <code>&lt;img class=\"foto\"&gt;<\/code> per photo. <code>.contenedor{margin:auto; max-width:800px; width:100%}<\/code> gives a centered column that never gets wider than 800px. <code>display:block<\/code> on the images removes the inline gap below them.<\/li>\n<li><b>index3<\/b>: the dashes are a <code>display:flex<\/code> row (<code>.cursores<\/code>). Each one asks for <code>width:600px<\/code>, but flex items <b>shrink<\/b> (<code>flex-shrink:1<\/code>) so they all fit in one line.<\/li>\n<li><code>.cursores&gt;.activa, .cursores&gt;div:active<\/code> puts a <b>class<\/b> and a <b>pseudo-class<\/b> side by side. <code>.activa<\/code> is added and removed by the JavaScript (<code>className<\/code>) on the current photo. <code>:active<\/code> is applied by the browser only while you hold the mouse down.<\/li>\n<li><code>line-height:40px<\/code> equal to <code>height:40px<\/code> centers the dash vertically.<\/li><\/ul>\n<p class=\"try\">Try in index3: click the dashes and arrows in the preview, then inspect a dash and use Force state <code>:active<\/code>.<\/p>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "index3 (slider)", "set": {"h": "<!-- datos.js -->\n<script>\ncopi='@ derechos reservados';\n\nft=[\n'fot1','leyenda de la foto 1',\n'fot2','leyenda de la foto 2',\n'fot3','leyenda de la foto 3',\n'fot4','leyenda de la foto 4',\n'fot5','leyenda de la foto 5',\n'fot6','leyenda de la foto 6',\n'fot7','leyenda de la foto 7',\n'fot8','leyenda de la foto 8',\n'fot9','leyenda de la foto 9',\n'fot1','leyenda de la foto 10',\n'fot2','leyenda de la foto 11',\n'fot3','leyenda de la foto 12',\n'fot4','leyenda de la foto 13',\n'fot5','leyenda de la foto 14',\n'fot6','leyenda de la foto 15',\n'fot7','leyenda de la foto 16',\n'fot8','leyenda de la foto 17',\n'fot9','leyenda de la foto 18',\n'fot10','leyenda de la foto 19'\n];\n<\/script>\n\n<script>\n /*\n EJERCICIO\n -resolver sin boostrap\n -usar el mismo array datos\n PISTAS\n - https://www.w3schools.com/jsref/prop_node_parentnode.asp\n - innerHTML o Text\n */\n\n\n// CAMBIOS\n// probar en el movil\n// textos inicial y final\n// llevar datos a js comun\n// llevar pantalla inicial y final a js comun\n\n//var copi='@ derechos reservados';\n\nfunction made(){\n  console.log('MADE');\n\n  // contenedor todo\n  var e=cn('div',document.body);\n  e.setAttribute('class','contenedor');\n\n  // los cursores\n  e1=cn('div',e);\n  e1.setAttribute('class','cursores');\n  e2=cn('div',e1);\n  e2.id='primero';\n  e2.innerHTML='<';\n  e2.onclick=eAtras;\n  for (var j=0;j<ft.length;j+=2){\n    e2=cn('div',e1);\n    e2.innerHTML='-';\n    e2.onclick=eCursor;\n    e2.imagen=ft[j];\n    if (j==0){e2.className='activa'}\n  }\n  e2=cn('div',e1);\n  e2.innerHTML='>';\n  e2.id='ultimo';\n  e2.onclick=eAvanza;\n\n  // la imagen\n  var ef=cn('img',e);\n  ef.id='imagen';\n  var nombre='fotos/'+ft[0]+'.jpg';\n  ef.setAttribute('src',nombre);\n  ef.setAttribute('class','foto');\n}\n\nfunction eAvanza(){\n  var i=document.getElementById('imagen');\n  var e=document.getElementsByClassName('activa')[0];\n  var n=e.nextSibling;\n  if (n.innerText=='>'){\n    n=document.getElementById('primero').nextSibling;\n  }\n  n.className='activa';\n  e.className='';  \n  var nombre='fotos/'+n.imagen+'.jpg';\n  i.src=nombre;\n}\n\nfunction eAtras(){\n  var i=document.getElementById('imagen');\n  var e=document.getElementsByClassName('activa')[0];\n  var n=e.previousSibling;\n  if (n.innerText=='<'){\n    n=document.getElementById('ultimo').previousSibling;\n  }\n  n.className='activa';\n  e.className='';  \n  var nombre='fotos/'+n.imagen+'.jpg';\n  i.src=nombre;\n\n}\n\nfunction eCursor(){\n  var e=document.getElementById('imagen');\n  var nombre='fotos/'+this.imagen+'.jpg';\n  e.src=nombre;\n  var s=document.getElementsByClassName('activa');\n  s[0].className='';    \n  this.className='activa';  \n}\n\nfunction cn(tipo,padre){\n  var nodo = document.createElement(tipo);\n  padre.appendChild(nodo);\n  return nodo;\n}\n\nwindow.onload=made;\n<\/script>", "c": "/* moved here from <body style=\"background-color:#444;\"> */\nbody { background-color:#444; }\n\n.contenedor{\n  margin:auto;  \n  max-width: 800px;\n  height: auto; \n  width: 100%;\n}\n.cursores{\n  display:flex;\n  flex-wrap:nowrap;\n  background-color:#444; \n  height:40px;\n  line-height:40px;\n  margin-bottom:8px;\n}\n.cursores>div{\n  background-color:#666;\n  color:#FFF;\n  width:600px;\n  margin:1px;\n  text-align:center;\n}\n.cursores>.activa,.cursores>div:active{\n  background-color:#888;  \n}\n.foto{\n  display:block; \n  width: 100%; \n}"}}, {"l": "index1 (column)", "set": {"h": "<!-- datos.js -->\n<script>\ncopi='@ derechos reservados';\n\nft=[\n'fot1','leyenda de la foto 1',\n'fot2','leyenda de la foto 2',\n'fot3','leyenda de la foto 3',\n'fot4','leyenda de la foto 4',\n'fot5','leyenda de la foto 5',\n'fot6','leyenda de la foto 6',\n'fot7','leyenda de la foto 7',\n'fot8','leyenda de la foto 8',\n'fot9','leyenda de la foto 9',\n'fot1','leyenda de la foto 10',\n'fot2','leyenda de la foto 11',\n'fot3','leyenda de la foto 12',\n'fot4','leyenda de la foto 13',\n'fot5','leyenda de la foto 14',\n'fot6','leyenda de la foto 15',\n'fot7','leyenda de la foto 16',\n'fot8','leyenda de la foto 17',\n'fot9','leyenda de la foto 18',\n'fot10','leyenda de la foto 19'\n];\n<\/script>\n\n<script>\n /*\n EJERCICIO\n -resolver sin boostrap\n -usar el mismo array datos\n PISTAS\n - https://www.w3schools.com/jsref/prop_node_parentnode.asp\n - innerHTML o Text\n */\n\n\n// CAMBIOS\n// probar en el movil\n// textos inicial y final\n// llevar datos a js comun\n// llevar pantalla inicial y final a js comun\n\n\nfunction made(){\n\n  //dato();\n\n  // contenedor todo\n  var e=cn('div',document.body);\n  e.setAttribute('class','contenedor');\n\n  // la imagen\n  for (var j=0;j<ft.length;j+=2){\n    var ef=cn('img',e);\n    ef.id='imagen';\n    ef.setAttribute('src','fotos/'+ft[j]+'.jpg');\n    ef.setAttribute('class','foto');\n    }\n}\n\n\nfunction cn(tipo,padre){\n  var nodo = document.createElement(tipo);\n  padre.appendChild(nodo);\n  return nodo;\n}\n\nwindow.onload=made;\n<\/script>", "c": "/* moved here from <body style=\"background-color:#444;\"> */\nbody { background-color:#444; }\n\n.contenedor{\n  margin:auto;  \n  max-width: 800px;\n  height: auto; \n  width: 100%;\n}\n.foto{\n  margin-top:100px;\n  display:block; \n  width: 100%; \n}"}}]}], "props": ["display", "width", "flex-shrink", "height", "line-height", "background-color"], "assets": ["fot1.jpg", "fot2.jpg", "fot3.jpg", "fot4.jpg", "fot5.jpg", "fot6.jpg", "fot7.jpg", "fot8.jpg", "fot9.jpg", "fot10.jpg"], "w": 700, "pick": ".cursores > div:nth-child(2), .foto"},
{"id": "ex-fotos-modal", "g": "0.soluciones", "t": "indiceFotos 6: grayscale gallery + modal", "body": "<ul><li><code>.foto{filter: grayscale(100%); transition: filter 0.2s}<\/code> and <code>.foto:hover{filter: grayscale(0%)}<\/code>: the photo regains its color on hover, and the transition animates the change.<\/li>\n<li><code>.foto:hover{z-index:9}<\/code> <b>does nothing<\/b>: <code>.foto<\/code> is not positioned (it's a float), so z-index is ignored. The inspector flags it.<\/li>\n<li><code>#myImg<\/code> and <code>#myImg:hover<\/code> show <b>0 matches<\/b> in \"CSS explained\": no element has that id. It's leftover code.<\/li>\n<li><code>a:link, a:visited, a:active<\/code> then <code>a:hover<\/code>: link states in a safe order, with a 1-second color <code>transition<\/code>.<\/li>\n<li><code>.modal<\/code> uses <code>position:fixed<\/code> with <code>left:0; top:0; width:100%; height:100%<\/code> to cover the screen. It starts as <code>display:none<\/code>, and the JavaScript sets <code>style.display = \"block\"<\/code> (an inline style) when you click a photo.<\/li>\n<li><code>@keyframes zoom<\/code> together with <code>animation-name: zoom<\/code> makes the opened image grow from <code>scale(0.1)<\/code> to <code>scale(1)<\/code>.<\/li>\n<li>The icons come from Font Awesome, which can't load here. Only the \"X\" button is visible: click it, or press Esc, to close.<\/li><\/ul>", "html": "{{h}}", "css": "{{c}}", "ctl": [{"k": "v", "label": "Variant (file)", "opts": [{"l": "index6.htm", "set": {"h": "<div id=\"myModal\" class=\"modal\">\n  <div id=\"listaBotones\">\n    <i id='botonCierra' class=\"far fa-window-close\">X<\/i> \n    <i id='botonPlay' class=\"far fa-play-circle\"><\/i>\n    <i id='botonPara' class=\"far fa-stop-circle\"><\/i>\n    <i id='botonSigue' class=\"far fa-arrow-alt-circle-right\"><\/i>   \n    <i id='botonAtras' class=\"far fa-arrow-alt-circle-left\"><\/i>\n    <i id='' class=\"fas fa-compress\"><\/i>\n    <i id='' class=\"fas fa-expand\"><\/i>\n    <i id='botonCasa' class=\"fas fa-cat\"><\/i>   \n  <\/div>\n  <img class=\"modal-content\" id=\"img01\">\n  <div id=\"caption\"><\/div>\n<\/div>  \n\n<!-- datos.js -->\n<script>\ncopi='@ derechos reservados';\n\nft=[\n'fot1','leyenda de la foto 1',\n'fot2','leyenda de la foto 2',\n'fot3','leyenda de la foto 3',\n'fot4','leyenda de la foto 4',\n'fot5','leyenda de la foto 5',\n'fot6','leyenda de la foto 6',\n'fot7','leyenda de la foto 7',\n'fot8','leyenda de la foto 8',\n'fot9','leyenda de la foto 9',\n'fot1','leyenda de la foto 10',\n'fot2','leyenda de la foto 11',\n'fot3','leyenda de la foto 12',\n'fot4','leyenda de la foto 13',\n'fot5','leyenda de la foto 14',\n'fot6','leyenda de la foto 15',\n'fot7','leyenda de la foto 16',\n'fot8','leyenda de la foto 17',\n'fot9','leyenda de la foto 18',\n'fot10','leyenda de la foto 19'\n];\n<\/script>\n\n<script>\n \n/* EVENTOS == */\n\nfunction cargaModal(){\n  //var modal = document.getElementById('myModal');\n  //modal.style.display = \"block\";\n  var ele = document.getElementById('botonCasa');\n  ele.onclick = volverModal;\n\n  var ele = document.getElementById('botonCierra');\n  ele.onclick = volverModal;\n  \n  var ele = document.getElementById('botonSigue');\n    ele.onclick = function() { \n    modalNext();\n  clearTimeout(tiempo);\n  }\n  \n  var ele = document.getElementById('botonAtras');\n  ele.onclick = function() { \n    modalPrev();\n  clearTimeout(tiempo);\n  }\n  \n  var ele = document.getElementById('botonPlay');\n  ele.onclick = function() { \n    modalNext();\n    tiempo=setInterval(modalNext,2000);\n    this.style.color='red';\n  }\n  \n  var ele = document.getElementById('botonPara');\n  ele.onclick = function() { \n    document.getElementById('botonPlay').style.color=document.getElementById('botonPara').style.color;\n    clearTimeout(tiempo);\n  }\n} \n\n/* MANEJADORES == */\n\nfunction modal(img){ \n  console.log('MODAL');\n  document.body.style.overflow='hidden';  \n  actual=img;\n  var modal = document.getElementById('myModal');\n  modal.style.display = \"block\";\n  var modalImg = document.getElementById(\"img01\");\n\n  var captionText = document.getElementById(\"caption\");\n  modalImg.src = img.src;\n  /* atencon de taclado en la foto */\n  modalImg.tabIndex='0';\n  modalImg.onkeydown=tecla;  \n  modalImg.focus(); \n  captionText.innerHTML = img.alt;\n}\n\nfunction clickModal(){\n  console.log('click: ',this); \n  modal(this);\n}\nfunction tecla(e){\n  console.log('tecla: ',e);\n  if ( e.key=='Escape' ){\n    volverModal();\n  } \n  if ( e.key=='ArrowRight' ){\n    modalNext();\n  }\n  if ( e.key=='ArrowLeft' ){\n    modalPrev();\n  }\n}\n\nfunction volverModal(){\n    document.getElementById('botonPlay').style.color=document.getElementById('botonPara').style.color;\n    var modal = document.getElementById('myModal');\n    modal.style.display = \"none\"; \n    clearTimeout(tiempo);\n    document.body.style.overflow='auto';\n\n}\n\nfunction modalNext(){\n  var error=true;\n  if (actual.nextSibling!=null){  \n    if (actual.nextSibling.tagName=='IMG'){\n        modal(actual.nextSibling);   \n        error=false;\n    }\n  }\n  if (error){pararTimer();}\n}\n\nfunction modalPrev(){\n  var error=true;\n  if (actual.previousSibling.tagName=='IMG'){\n    modal(actual.previousSibling);\n    error=false;\n  }\n  if (error){pararTimer();}\n}\n\n/* PRINCIPAL == */\n\nfunction made(){\n  var tiempo=0; // timer\n\n  // sumas de 10 para cada linea, luego se repite\n  var r=[2.5];\n  var jr=0;\n\n  //dato();\n  cargaModal();\n\n  // contenedor todo\n  var e=cn('div',document.body);\n  e.setAttribute('class','contenedor');\n\n  // cabecera\n  var cab=cn('div',e);\n  cab.id='cabecera';\n  var tit=cn('span',cab);\n  tit.setAttribute('class','titulo');\n  tit.innerHTML='Foto Fotos';\n  var txt=cn('div',cab);\n  txt.innerHTML='<br/>social: <a target=\"_blank\" href=\"https://facebook.com/\">facebook<\/a> | <a target=\"_blank\" href=\"https://www.instagram.com/\">@tuCuenta<\/a> <br/>attribution: nombre | copyleft: <a target=\"_blank\" href=\"https://www.creativecommons.org/licenses/by-nc-nd/2.0/\">CreativeCommons BY-NC-ND<\/a> | email: foto@gmail.com<br/>***';\n  txt.setAttribute('class','texto');\n\n  // la imagen\n  for (var j=0;j<ft.length;j+=2){\n    var ef=cn('img',e);\n    ef.id='imagen';\n    var nombre='fotos/'+ft[j]+'.jpg';\n    ef.setAttribute('src',nombre);\n    ef.setAttribute('class','foto');\n    /* generar multiplos*/\n    ef.setAttribute('style','width:'+10*r[jr]+'%');\n    jr+=1;\n    if (jr==r.length){jr=0;}\n    ef.setAttribute('alt',ft[j+1]);\n    ef.onclick=clickModal;\n    // para atender la tecla hay q tener el tabindex\n    // atencion de teclado desde foto donde hice click\n    //ef.tabIndex=j;    \n    //ef.onkeydown=tecla; /* foco !!!! */   \n   }\n}\n\nfunction cn(tipo,padre){\n  var nodo = document.createElement(tipo);\n  padre.appendChild(nodo);\n  return nodo;\n}\n\n/* INICIO == */\n\nvar tiempo;\nwindow.onload=made;\n\n/*\n\niconos por librerias:\n\nhttps://www.antofernandez.com/icon-fonts-como-utilizar-font-awesome-en-nuestra-web/\n\nhttps://www.w3schools.com/css/css_icons.asp\n\nhttps://www.w3schools.com/howto/howto_css_social_media_buttons.asp\n\nhttps://www.w3schools.com/css/css_image_sprites.asp\n\n*/\n<\/script>", "c": "body{\n  background-color:#DDD;\n}\n#cabecera{\n  padding:8px;\n  box-sizing:border-box;\n}\n.titulo{\n  font-weight: bold;\n  font-size:1.6rem;\n  letter-spacing:0.4rem;\n  font-family: 'Satisfy', cursive;\n}\n.texto{\n  font-size: 0.8rem;\n}\n.contenedor{\n  margin:auto;\n  max-width:1200px;\n  min-width:600px;\n  height:200px; \n  width:80%;\n}\n.foto{\n  object-fit:cover; \n  float:left;\n  padding:4px;\n  display:block; \n  box-sizing:border-box;\n  height:100%;\n  width: 200px;\n  filter: grayscale(100%);  \n  transition: filter 0.2s;\n}\n.foto:hover{\n  filter: grayscale(0%);  \n  z-index: 9;\n}\n#myImg {\n  border-radius: 5px;\n  cursor: pointer;\n  transition: 0. function buildNav(){

    h+=`<button class="nb" type="button" data-id="${l.id}">${esc(l.t)}</button>`;o+=`<option value="${l.id}">${esc(l.t)}</option>`});
  $('#nav').innerHTML=h;$('#navsel').innerHTML=o+'</optgroup>';
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('.nb');if(b)go(b.dataset.id)});
  $('#navsel').addEventListener('change',e=>go(e.target.value));

function go(id){if(location.hash!=='#'+id)location.hash=id;else load(id)}
function load(id){
  const l=LESSONS.find(x=>x.id===id)||LESSONS[0];cur=l;st={};selPath=null;forced=null;
  document.querySelectorAll('.nb').forEach(b=>b.toggleAttribute('aria-current',b.dataset.id===l.id));
  $('#navsel').value=l.id;$('#grp').textContent=l.g;$('#title').textContent=l.t;$('#body').innerHTML=l.body;
  document.title='CSS Lab: '+l.t;
  (l.ctl||[]).forEach(c=>{if(c.opts)Object.assign(st,norm(c,c.opts[0]).set);else st[c.k]=c.v});
  const i=LESSONS.indexOf(l),p=LESSONS[i-1],n=LESSONS[i+1];
  $('#prev').textContent=p?'← '+p.t:'';$('#prev').style.visibility=p?'visible':'hidden';$('#prev').onclick=()=>p&&go(p.id);
  $('#next').textContent=n?n.t+' →':'';$('#next').style.visibility=n?'visible':'hidden';$('#next').onclick=()=>n&&go(n.id);
  const ch=!!l.cheat,sty=!!l.story,full=ch||sty;document.querySelector('.work').hidden=full;$('#explain').hidden=full;$('#insp').hidden=full;$('#cheat').hidden=!ch;$('#story').hidden=!sty;
  if(ch){renderCheat();window.scrollTo(0,0);return}
  if(sty){$('#body').innerHTML='<p class="muted">Each step changes one thing. Every box shows its own HTML and the CSS applied to it. Interact with the diagrams where the text says so, and use <b>open in lab</b> to edit any step.</p>';renderStory(l);window.scrollTo(0,0);return}
  setWidth(l.w||'fit');renderWidget();renderCtls();writeCode();
  window.scrollTo(0,0);
}
function norm(c,o){if(typeof o==='string')return{l:o,set:{[c.k]:o}};if(o.set)return o;return{l:o.l,set:{[c.k]:o.v}}}
function renderCtls(){
  $('#ctls').innerHTML=(cur.ctl||[]).map((c,ci)=>{
    if(c.opts)return`<div class="ctl"><span>${esc(c.label)}</span><div class="opts">${c.opts.map((o,oi)=>{const n=norm(c,o),on=Object.entries(n.set).every(([k,v])=>st[k]===v);
      return`<button type="button" class="ob" data-c="${ci}" data-o="${oi}" aria-pressed="${on}">${esc(n.l)}</button>`}).join('')}</div></div>`;
    return`<div class="ctl"><span>${esc(c.label)}</span><div class="rg"><input type="range" data-c="${ci}" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${st[c.k]}" aria-label="${esc(c.label)}"><output>${st[c.k]}${c.u||''}</output></div></div>`}).join('');
}

const typeChips=s=>esc(s).replace(/ \| /g,' <b class="or">|</b> ').replace(/&lt;([\w-]+)&gt;/g,(m,t)=>{const k='<'+t+'>';return TYPES[k]?`<abbr class="ty" title="${esc(TYPES[k])}">&lt;${t}&gt;</abbr>`:m});
function accHtml(p){const r=synFor(p);if(!r)return'';return`<span class="acc"><b>Accepts:</b> <code>${typeChips(r[1])}</code>${r[6]?` <i>· ${esc(r[6])}</i>`:''}${r[5]&&r[5]!=='—'?` <i>· % of ${esc(r[5])}</i>`:''}</span>`}
function synTab(){
  const legend=`<p class="chd">How to read the syntax: <code>|</code> = one of them · <code>||</code> = one or more, any order · <code>[ ]</code> = group · <code>?</code> = optional · <code>+</code> = one or more (space-separated) · <code>#</code> = one or more, comma-separated · <code>1–4 ×</code> = up to four values (top right bottom left). Types in <code>&lt;angle brackets&gt;</code> are explained below; hover them anywhere for a reminder.</p>`;
  const types=`<div class="tyg">${Object.entries(TYPES).map(([k,v])=>`<div><code>${esc(k)}</code><span>${esc(v)}</span></div>`).join('')}</div>`;
  const rows=SYN.map(r=>`<tr><td data-l="property"><code><b>${esc(r[0])}</b></code></td><td data-l="accepts"><code>${typeChips(r[1])}</code>${r[6]?`<br><span class="muted">${esc(r[6])}</span>`:''}</td><td data-l="initial"><code>${esc(r[2])}</code></td><td data-l="inherited">${r[3]?'yes':'no'}</td><td data-l="applies to">${esc(r[4])}</td><td data-l="% of">${esc(r[5])}</td></tr>`).join('');
  return`${legend}<h3 class="sth">Value types</h3>${types}<h3 class="sth">Properties (${SYN.length})</h3><div class="scroll"><table class="stack syn"><thead><tr><th>property</th><th>accepts</th><th>initial</th><th>inherited</th><th>applies to</th><th>% refers to</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function B(tag,attrs='',inner='element',css=''){let cls='el';const a=(attrs||'').replace(/class="([^"]*)"/,(m,c)=>{cls+=' '+c;return''}).trim();

{id:'st-position',t:'Positioning: static, relative, absolute, fixed, sticky',
intro:'Three boxes in a container. Every diagram changes <b>one thing</b> on the middle box (or its parent), and each box is labelled with its own HTML and the CSS applied to it.',
steps:[
 {p:'<b>static</b> is the default. Boxes are laid out in normal flow, one under the other. A static box <b>ignores</b> <code>top</code>, <code>right</code>, <code>bottom</code> and <code>left</code>: the middle box below has <code>left: 20px</code> and nothing happens.',h:D3('position: static; left: 20px;')},
 {p:'<b>relative</b> moves the box from <i>where it would normally be</i>. The space it had stays reserved, so the third box does not move up.',h:D3('position: relative; left: 20px;')},
 {p:'Offsets work like "push from that side": <code>top: 20px</code> pushes it 20px <b>down</b>. A relative box can overlap its neighbours, because the others still act as if it were in its original place.',h:D3('position: relative; top: 20px; left: 20px;')},
 {p:'<b>absolute</b> takes the box <b>out of the flow</b>: the third box moves up into the empty space. The offsets are measured from the containing block. No ancestor is positioned here, so they are measured from the page itself, outside the container.',h:D3('position: absolute; left: 100px; top: 150px;'),ht:250},
 {p:'Give the <b>parent</b> <code>position: relative</code> and it becomes the containing block: the same absolute box is now measured from the container’s corner. This "relative parent + absolute child" pair is the most common positioning pattern.',h:CT(B('div')+B('div','','element','position: absolute; left: 100px; top: 150px;')+B('div'),'position: relative;'),ht:260},
 {p:'An absolute box <b>without offsets</b> stays where it would have been (its static position), but it still takes no space: the third box slides underneath it.',h:D3('position: absolute; background: #ddd;')},
