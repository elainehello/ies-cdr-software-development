 {p:'A state on the <b>parent</b> can style a <b>child</b>: <code>.card:hover .price</code> means "the .price inside a .card that is being hovered". <b>Hover anywhere on the card.</b>',rule:'.card:hover .price',h:CT(B('div','class="card"',B('p','','name')+B('p','class="price"','20 €')))},
 {p:'<code>:focus</code> applies to the input you clicked into (or reached with Tab). <code>:focus-within</code> applies to a parent while <b>anything inside it</b> has focus. <b>Click into the input.</b>',rule:'input:focus, form:focus-within',c:'input.el{width:200px;font:inherit}',h:CT(B('form','',B('input','placeholder="click me"')))},
 {p:'<code>:checked</code> is true while a checkbox is ticked. An input has no children, so we style the <b>label right after it</b> with <code>+</code>. <b>Tick the box.</b>',rule:'input:checked + label',h:CT(B('input','type="checkbox" id="c1"')+' '+B('label','for="c1"','accept'))},
 {p:'<code>:first-child</code> and <code>:last-child</code> depend on <b>position</b>, not on state: the first and last child of their parent.',rule:'li:first-child, li:last-child',h:CT(LIST5)},
 {p:'<code>:nth-child(2n)</code> picks positions 2, 4, 6… (n counts 0, 1, 2…). <code>odd</code> and <code>even</code> are shortcuts.',rule:'li:nth-child(2n)',h:CT(LIST5)},
 {p:'In a <b>mixed</b> list, <code>p:nth-child(2)</code> means "the 2nd child, <i>if</i> it is a p" and counts siblings of any tag.',rule:'p:nth-child(2)',h:MIXED},
 {p:'<code>p:nth-of-type(2)</code> counts <b>only the p elements</b>: the 2nd p is child 3. Same list, different result.',rule:'p:nth-of-type(2)',h:MIXED},
 {p:'<code>:not()</code> selects everything that does <b>not</b> match its argument.',rule:'p:not(.x)',h:MIXED},
 {p:'<code>:has()</code> selects an element by <b>what it contains</b>, which lets you style a parent. Here: the cards that contain an <code>em</code>.',rule:'.card:has(em)',h:CT(B('div','class="card"',B('p','','plain'))+B('div','class="card"',B('p','',B('em','','featured'))))},
 {p:'<b>Class vs pseudo-class</b>: <code>.active</code> is a class you put in the HTML (or JavaScript adds it); <code>:active</code> is a state the browser applies only while you <b>hold the mouse button down</b>. <b>Press and hold the second button.</b>',rule:'.active, button:active',c:'button.el{font:inherit;cursor:pointer}',h:CT(B('button','class="active"','class="active"')+B('button','','press and hold'))},
]},
{id:'st-pseudo-elements',t:'Pseudo-elements: ::before, ::after and parts of an element',
intro:'A pseudo-element (two colons) is a box the browser <b>generates</b>, or a <b>part</b> of an element you can style. In these diagrams the generated boxes have a dashed outline so you can see where they go.',
steps:[
 {p:'<code>::before</code> and <code>::after</code> create a box <b>inside</b> the element, before and after its content. They only exist if <code>content</code> is set.',rule:'',c:'.demo::before{content:"::before";border:1px dashed #000;padding:0 4px;margin-right:6px}.demo::after{content:"::after";border:1px dashed #000;padding:0 4px;margin-left:6px}',h:CT(B('p','class="demo"','text'))},
 {p:'They are <b>inline</b> by default. With <code>display: block</code> they become full lines inside the element.',c:'.demo::before,.demo::after{display:block;border:1px dashed #000;padding:0 4px}.demo::before{content:"::before (display: block)"}.demo::after{content:"::after (display: block)"}',h:CT(B('p','class="demo"','text'))},
 {p:'<code>content: ""</code> (empty) plus a size gives a purely decorative shape. Here, a black square before each item.',c:'.demo li::before{content:"";display:inline-block;width:10px;height:10px;background:#000;margin-right:8px}.demo{list-style:none;padding-left:10px}',h:CT(B('ul','class="demo"',B('li','','one')+B('li','','two')))},
 {p:'<code>::first-letter</code> and <code>::first-line</code> style a part of the text. The first line depends on the width, so it changes when the box gets narrower or wider.',c:'.demo::first-letter{font-size:2.4em;float:left;line-height:1;margin-right:4px}.demo::first-line{font-weight:700}',h:CT(B('p','class="demo"','This paragraph shows a big first letter and a bold first line that follows the width.'))},
 {p:'<code>::marker</code> is the bullet or number of a list item.',c:'.demo li::marker{content:"→ ";font-weight:700}',h:CT(B('ul','class="demo"',B('li','','one')+B('li','','two')))},
 {p:'<code>::placeholder</code> styles the hint text of an input. <code>::selection</code> styles text while the user selects it. <b>Select some text here.</b>',c:'input.el{width:240px;font:inherit}input::placeholder{font-style:italic;letter-spacing:2px}::selection{background:#000;color:#fff}',h:CT(B('input','placeholder="::placeholder text"')+B('p','','Select me to see ::selection.'))},
 {p:'A pseudo-class and a pseudo-element can be <b>combined</b>: the pseudo-class comes first, the pseudo-element last. <b>Hover the items.</b>',rule:'',c:'li:hover::after{content:" ← :hover::after";font-style:italic;border:1px dashed #000;padding:0 4px;margin-left:4px}',h:CT(B('ul','',B('li','','one')+B('li','','two')))},
]},
{id:'st-cascade',t:'The cascade: who wins when rules disagree',
intro:'One paragraph, and rules that all set its <b>border</b>. Each step adds one rule; the border you see is the winner.',
steps:[
 {p:'One rule, nothing to fight about: the type selector gives a solid border.',rule0:'p { border: 4px solid black; }',h:CT(B('p','id="msg" class="note"','Which border?'))},
 {p:'A <b>class</b> rule is more specific (0,1,0) than a type rule (0,0,1), so dashed wins, <b>even though it is written first</b>.',rule0:'.note { border: 4px dashed black; }\np { border: 4px solid black; }',h:CT(B('p','id="msg" class="note"','Which border?'))},
 {p:'An <b>id</b> (1,0,0) beats any number of classes.',rule0:'#msg { border: 4px dotted black; }\n.note { border: 4px dashed black; }\np { border: 4px solid black; }',h:CT(B('p','id="msg" class="note"','Which border?'))},
 {p:'With <b>equal specificity</b>, the rule written <b>later</b> wins.',rule0:'.note { border: 4px dashed black; }\n.note { border: 4px double black; }',h:CT(B('p','id="msg" class="note"','Which border?'))},
 {p:'An <b>inline style</b> (the <code>style</code> attribute) beats every selector, even the id.',rule0:'#msg { border: 4px dotted black; }',h:CT(B('p','id="msg" class="note"','Which border?','border: 4px double black;'))},
 {p:'<code>!important</code> beats every normal declaration, even inline styles, whatever the specificity. Use it rarely: the only way to beat it is another !important.',rule0:'p { border: 4px solid black !important; }\n#msg { border: 4px dotted black; }',h:CT(B('p','id="msg" class="note"','Which border?','border: 4px double black;'))},
 {p:'The order of the checks: <b>!important</b> → <b>inline style</b> → <b>@layer</b> → <b>specificity</b> → <b>order of appearance</b>. Each step only matters when the previous one is a tie. Rules that set <i>different</i> properties never fight: all of them apply.'},
]},
{id:'st-inheritance',t:'Inheritance: what passes from parent to child',
intro:'The container gets the styles; the boxes inside are its children. Watch which properties reach them.',
steps:[
 {p:'Text properties (<code>color</code>, <code>font-*</code>, <code>line-height</code>, <code>letter-spacing</code>…) are <b>inherited</b>: the children get them without any rule of their own.',h:CT(B('div')+B('div'),'font-style: italic; letter-spacing: 2px;')},
 {p:'Box properties (<code>border</code>, <code>padding</code>, <code>background</code>, <code>width</code>…) are <b>not inherited</b>: the thick border stays on the container only.',h:CT(B('div')+B('div'),'border: 4px solid black; padding: 14px;')},
 {p:'A child’s <b>own rule always beats</b> what it inherits, even a weak rule. The second child sets its own font-style.',h:CT(B('div')+B('div','','element','font-style: normal;'),'font-style: italic;')},
 {p:'<code>inherit</code> forces a property to copy the parent’s value, even a non-inherited one like border.',h:CT(B('div')+B('div','','element','border: inherit;'),'border: 4px solid black;')},
 {p:'Links and form controls are special: the browser gives them their <b>own</b> color and font, so they ignore the parent’s. That’s why <code>a { color: inherit }</code> and <code>button { font: inherit }</code> are so common.',c:'a.el,button.el{display:inline-block}',h:CT(B('p','','text '+B('a','href="#"','link'))+B('button','','button')+B('a','href="#"','link with inherit','color: inherit; font: inherit;'),'color: dimgray; font-family: monospace;')},
]},
{id:'st-display',t:'display: block, inline, inline-block, none',
intro:'Three <code>span</code> elements in a line of text. Only the middle one changes. It also has <code>width: 120px; height: 40px</code> in every step.',
steps:[
 {p:'<b>inline</b> (default for span): flows inside the text. <code>width</code> and <code>height</code> are <b>ignored</b>, and so are vertical margins.',h:CT('Text '+B('span','','A')+B('span','','B','display: inline; width: 120px; height: 40px;')+B('span','','C')+' text')},
 {p:'<b>block</b>: starts on a new line and takes the full width available. Width and height work.',h:CT('Text '+B('span','','A')+B('span','','B','display: block; width: 120px; height: 40px;')+B('span','','C')+' text')},
 {p:'<b>inline-block</b>: stays inside the line like text, but respects width, height and margins.',h:CT('Text '+B('span','','A')+B('span','','B','display: inline-block; width: 120px; height: 40px;')+B('span','','C')+' text')},
 {p:'<b>none</b>: no box at all. It takes no space and the others close the gap (its label is gone too, because the whole element is gone).',h:CT('Text '+B('span','','A')+B('span','','B','display: none;')+B('span','','C')+' text')},
 {p:'Compare <code>visibility: hidden</code>: invisible, but its space stays.',h:CT('Text '+B('span','','A')+B('span','','B','display: inline-block; width: 120px; height: 40px; visibility: hidden;')+B('span','','C')+' text')},
]},
{id:'st-float',t:'float and clear',
intro:'A floated box and some text, step by step.',
steps:[
 {p:'Without float, the box is a normal block: the text starts below it.',h:CT(B('div','','box','width: 90px; height: 70px; background: #ddd;')+B('p','','Text that comes after the box in the HTML, long enough to wrap onto several lines.'))},
 {p:'<code>float: left</code> moves it to the left and <b>out of the normal flow</b>: the text wraps around it.',h:CT(B('div','','box','float: left; width: 90px; height: 70px; background: #ddd;')+B('p','','Text that comes after the box in the HTML, long enough to wrap onto several lines.'))},
 {p:'Problem: the container <b>does not grow</b> to contain the float, which sticks out at the bottom (look at the dashed border).',h:CT(B('div','','box','float: left; width: 90px; height: 90px; background: #ddd;')+'short text')+B('p','','next element')},
 {p:'<code>display: flow-root</code> on the container makes it contain its floats.',h:CT(B('div','','box','float: left; width: 90px; height: 90px; background: #ddd;')+'short text','display: flow-root;')+B('p','','next element')},
 {p:'<code>clear: both</code> on an element moves it <b>below</b> any earlier floats.',h:CT(B('div','','box','float: left; width: 90px; height: 70px; background: #ddd;')+B('p','','I clear the float','clear: both;'))},
]},
{id:'st-flex',t:'Flexbox: from a column to a row',
intro:'Three children in a container. Every step adds one property to the <b>container</b> (or one item).',
steps:[
 {p:'Without flex, the divs are blocks: one per line.',h:CT(B('div','','1')+B('div','','2')+B('div','','3'),'','#container')},
 {p:'<code>display: flex</code> turns the children into <b>flex items</b> placed in a row (the main axis). They shrink to their content.',c:'.el .el,.ct .el{width:auto}',h:CT(B('div','','1')+B('div','','2')+B('div','','3'),'display: flex; gap: 6px;')},
 {p:'<code>justify-content</code> distributes the items along the row.',c:'.ct .el{width:auto}',h:CT(B('div','','1')+B('div','','2')+B('div','','3'),'display: flex; justify-content: space-between;')},
 {p:'<code>align-items</code> aligns them on the cross axis (vertically, in a row). The container has a height so you can see it.',c:'.ct .el{width:auto}',h:CT(B('div','','1')+B('div','','2')+B('div','','3'),'display: flex; gap: 6px; height: 110px; align-items: center;')},
 {p:'<code>flex: 1</code> on one item makes it take <b>all the free space</b>.',c:'.ct .el{width:auto}',h:CT(B('div','','1')+B('div','','2','flex: 1;')+B('div','','3'),'display: flex; gap: 6px;')},
 {p:'<code>flex-direction: column</code> turns the main axis vertical: now <code>justify-content</code> works vertically and <code>align-items</code> horizontally.',c:'.ct .el{width:auto;margin:0}',h:CT(B('div','','1')+B('div','','2')+B('div','','3'),'display: flex; flex-direction: column; align-items: flex-end;')},
]},
{id:'st-zindex',t:'z-index and stacking contexts',
intro:'Overlapping boxes. z-index decides which one is in front, but only under some conditions.',
steps:[
 {p:'Two overlapping positioned boxes: the one later in the HTML is painted <b>on top</b>.',c:'.el{position:relative;width:240px;min-height:84px}',h:CT(B('div','class="a"','A','background: #fff;')+B('div','class="b"','B','margin-top: -40px; margin-left: 90px; background: #ddd;'))},
 {p:'A higher <code>z-index</code> brings A to the front.',c:'.el{position:relative;width:240px;min-height:84px}',h:CT(B('div','class="a"','A','z-index: 2; background: #fff;')+B('div','class="b"','B','margin-top: -40px; margin-left: 90px; background: #ddd; z-index: 1;'))},
 {p:'z-index <b>does nothing on a static element</b>. Here A is static, so its z-index: 2 is ignored and B stays on top.',c:'.el{width:240px;min-height:84px}.b{position:relative}',h:CT(B('div','class="a"','A','position: static; z-index: 2; background: #fff;')+B('div','class="b"','B','margin-top: -40px; margin-left: 90px; background: #ddd; z-index: 1;'))},
 {p:'A child with <b>z-index: 99</b> inside a parent that has <code>z-index: 1</code> is <b>trapped</b> in its parent’s stacking context: it can never go above B (z-index: 2), because the whole parent is below B.',c:'.el{position:relative}.p{width:240px;height:120px}.k{position:absolute;left:180px;top:46px;width:150px;background:#111;color:#fff}.k>.tg{color:#fff}.k>code{color:#ccc}.b{width:220px;min-height:90px}',h:CT(B('div','class="p"','parent '+B('div','class="k"','child','z-index: 99;'),'z-index: 1; background: #fff;')+B('div','class="b"','B','margin-top: -50px; margin-left: 70px; background: #ddd; z-index: 2;'),'','#container'),ht:260},
]},
{id:'st-margins',t:'Margins that collapse',
intro:'Vertical margins between blocks sometimes merge. The gray area is the container.',
steps:[
 {p:'Two paragraphs: 30px below the first, 20px above the second. You might expect 50px between them, but you get <b>30px</b>: the margins collapse into the larger one.',h:CT(B('p','','margin-bottom: 30px','margin: 0 0 30px;')+B('p','','margin-top: 20px','margin: 20px 0 0;'),'background: #e5e5e5;')},
 {p:'A first child’s top margin <b>escapes</b> through its parent when nothing separates them: the 30px appear <i>above</i> the gray container, not inside it.',h:'<div style="border-top:1px solid #000">top of the page</div>'+CT(B('p','','margin-top: 30px','margin: 30px 0 0;'),'background: #e5e5e5;')},
 {p:'Anything between them stops it: padding, a border, or a new formatting context like <code>display: flow-root</code>. Now the 30px are inside the container.',h:'<div style="border-top:1px solid #000">top of the page</div>'+CT(B('p','','margin-top: 30px','margin: 30px 0 0;'),'background: #e5e5e5; display: flow-root;')},
 {p:'Flex (and grid) items <b>never</b> collapse: in a flex column, the two margins add up to 50px.',h:CT(B('p','','margin-bottom: 30px','margin: 0 0 30px;')+B('p','','margin-top: 20px','margin: 20px 0 0;'),'background: #e5e5e5; display: flex; flex-direction: column;')},
]},
];
function stepCss(s){const r=s.rule?HIT(s.rule):'';return STB+(s.c||'')+r+(s.rule0?s.rule0.replace(/;\s*\}/g,';}'):'')}
function renderStory(l){
  const S=STORIES.find(x=>x.id===l.id);const box=$('#story');
  box.innerHTML=`<p class="chd">${S.intro}</p>`+S.steps.map((s,i)=>`<section class="stp"><div class="stn">${i+1}</div><div class="stb"><p>${s.p}</p>${s.rule!==undefined&&s.rule?`<pre class="str"><code>${esc(s.rule)} { /* painted black */ }</code></pre>`:''}${s.rule0?`<pre class="str"><code>${esc(s.rule0)}</code></pre>`:''}${s.h?`<iframe class="stf" data-i="${i}" title="Diagram ${i+1}" loading="lazy"></iframe><button type="button" class="stl" data-i="${i}">open in lab</button>`:''}</div></section>`).join('');
  box.querySelectorAll('.stf').forEach(f=>{const s=S.steps[f.dataset.i];
    f.onload=()=>{try{const d=f.contentDocument;if(s.ht){f.style.height=s.ht+'px'}else{f.style.height=(d.documentElement.scrollHeight+2)+'px'}}catch(e){}};
    f.srcdoc=`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="color-scheme" content="light"><style>${stepCss(s)}</style></head><body>${s.h}</body></html>`});
  box.querySelectorAll('.stl').forEach(b=>b.addEventListener('click',()=>{const s=S.steps[b.dataset.i];const P=LESSONS.find(x=>x.id==='playground');
    P.t=`Playground: ${S.t.split(':')[0]}, step ${+b.dataset.i+1}`;const t=document.createElement('template');t.innerHTML=s.h;t.content.querySelectorAll('.tg,.el>code,.lab').forEach(e=>e.remove());P.html=prettyHTML(t.innerHTML);
    P.css=fmtCss('/* diagram look */'+STB+(s.c||'')+(s.rule?'/* the selector of this step */ '+s.rule+'{background:#111;color:#fff}':'')+(s.rule0||''));go('playground')}));
}

const MQ=[['width','(min-width: 600px)','(max-width: 600px)','(600px <= width <= 1200px)'],['orientation','(orientation: portrait)','(orientation: landscape)'],['aspect-ratio','(min-aspect-ratio: 16/9)'],
 ['prefers-color-scheme','(prefers-color-scheme: dark)','(prefers-color-scheme: light)'],['prefers-reduced-motion','(prefers-reduced-motion: reduce)'],['hover / pointer','(hover: hover)','(pointer: coarse)','(pointer: fine)'],
 ['resolution','(min-resolution: 2dppx)','(min-resolution: 300dpi)'],['type','print','screen']];
function fmtCss(s){
  let out='',d=0,buf='',q=null,p=0;const ind=()=>'  '.repeat(Math.max(d,0));
  const decl=x=>x.replace(/^([\w-]+)\s*:\s*/,'$1: ');
  for(let k=0;k<s.length;k++){const ch=s[k];
    if(q){buf+=ch;if(ch===q)q=null;continue}
    if(ch==='"'||ch==="'"){q=ch;buf+=ch;continue}
    if(ch==='/'&&s[k+1]==='*'&&!p){const e=s.indexOf('*/',k+2),c=s.slice(k,e<0?s.length:e+2);if(buf.trim()){buf+=c}else out+=ind()+c+'\n';k=(e<0?s.length:e+1);continue}
    if(ch==='('){p++;buf+=ch;continue}if(ch===')'){p--;buf+=ch;continue}
    if(p){buf+=ch;continue}
    if(ch==='{'){out+=ind()+buf.trim().replace(/\s*,\s*/g,', ')+' {\n';d++;buf=''}
    else if(ch===';'){if(buf.trim())out+=ind()+decl(buf.trim())+';\n';buf=''}
    else if(ch==='}'){if(buf.trim())out+=ind()+decl(buf.trim())+';\n';buf='';d--;out+=ind()+'}\n'+(d===0?'\n':'')}
    else buf+=ch}
  return out.trim();
}
function ruleOf(it,v){return it.r?it.r.split('$').join(v):`.t{${it.p}:${v}}`}
function partsOf(it,v){const T=TPL[it.T]||{h:'',c:''};return{h:it.x||T.h,css:T.c+(it.c||'')+ruleOf(it,v)}}
function mount(host,it,v){const{h,css}=partsOf(it,v);const sh=host.shadowRoot||host.attachShadow({mode:'open'});
  sh.innerHTML=`<style>:host{display:block}*{box-sizing:border-box}.f{position:relative;width:100%;height:100%;overflow:hidden;transform:translateZ(0);font:13px/1.3 Archivo,system-ui,sans-serif;color:#000;background:#fff;padding:8px}${css}</style><div class="f">${h}</div>`;
  sh.querySelectorAll('.ind').forEach(e=>e.indeterminate=true)}

function prettyHTML(src){
  const t=document.createElement('template');t.innerHTML=src;
  const VOID=/^(input|img|br|hr|meta|link|source|col|area|wbr)$/,INL=/^(a|span|b|i|em|strong|code|small|label|input|img|br|abbr|sub|sup)$/;
  const tx=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const at=e=>[...e.attributes].map(a=>a.value===''&&!/^(alt|value|placeholder|href|src)$/.test(a.name)?` ${a.name}`:` ${a.name}="${a.value.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"`).join('');
  const out=[];
  const walk=(n,d)=>{const ind='  '.repeat(d);for(const c of n.childNodes){
    if(c.nodeType===3){const v=c.textContent.trim();if(v)out.push(ind+tx(v));continue}
    if(c.nodeType===8){out.push(ind+'<!--'+c.data+'-->');continue}
    if(c.nodeType!==1)continue;
    const tag=c.tagName.toLowerCase(),open=`<${tag}${at(c)}>`;
    if(VOID.test(tag)){out.push(ind+open);continue}
    const kids=[...c.childNodes].filter(k=>k.nodeType===1||(k.nodeType===3&&k.textContent.trim()));
    const ser=e=>e.nodeType===3?tx(e.textContent):e.nodeType!==1?'':VOID.test(e.tagName.toLowerCase())?`<${e.tagName.toLowerCase()}${at(e)}>`:`<${e.tagName.toLowerCase()}${at(e)}>${[...e.childNodes].map(ser).join('')}</${e.tagName.toLowerCase()}>`;
    const flat=[...c.childNodes].map(ser).join('').trim();
    if(!kids.length){out.push(ind+open+`</${tag}>`);continue}
    if(kids.every(k=>k.nodeType===3||INL.test(k.tagName.toLowerCase()))&&(ind+open+flat).length<=80&&!flat.includes('\n')){out.push(ind+open+flat+`</${tag}>`);continue}
    if(kids.every(k=>k.nodeType===3)){out.push(ind+open+tx(c.textContent)+`</${tag}>`);continue}
    out.push(ind+open);walk(c,d+1);out.push(ind+`</${tag}>`)}};
  walk(t.content,0);return out.join('\n');
}
let chCat=0;
function renderCheat(){
  const box=$('#cheat');
  box.innerHTML=`<div class="chbar"><input id="chq" type="search" placeholder="Search: justify, cover, :nth-child, ::before…" aria-label="Search the cheatsheet"><div class="chtabs">${CH.map((c,i)=>`<button type="button" class="ob" data-ct="${i}" aria-pressed="${i===chCat}">${esc(c.t)}</button>`).join('')}<button type="button" class="ob" data-ct="mq" aria-pressed="${chCat==='mq'}">Media features</button><button type="button" class="ob" data-ct="syn" aria-pressed="${chCat==='syn'}">Syntax table</button></div></div><div id="chbody"></div>`;
  box.querySelector('.chtabs').addEventListener('click',e=>{const b=e.target.closest('[data-ct]');if(!b)return;chCat=/^(mq|syn)$/.test(b.dataset.ct)?b.dataset.ct:+b.dataset.ct;$('#chq').value='';renderCheat()});
  let t;$('#chq').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>showCheat(e.target.value.trim().toLowerCase()),200)});
  showCheat('');
}
function showCheat(q){
  const body=$('#chbody');let list=[];
  if(chCat==='syn'){body.innerHTML=synTab();if(q)body.querySelectorAll('.syn tbody tr').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q));return}
  if(q){CH.forEach(c=>c.items.forEach(it=>{const hay=[it.p,it.g,it.d,...it.v].join(' ').toLowerCase();if(hay.includes(q))list.push([c.t,it])}))}
  else if(chCat==='mq'){body.innerHTML=mqHtml();return}
  else list=CH[chCat].items.map(it=>[CH[chCat].t,it]);
  if(!list.length){body.innerHTML='<p class="muted">Nothing found. Try a property name (margin), a value (cover) or a selector (:hover).</p>';return}
  body.innerHTML=list.map(([cat,it],k)=>`<section class="chc"><header><h3><code>${esc(it.p||it.g)}</code>${it.tag==='new'?'<span class="badge">modern</span>':''}</h3>
    <div class="chm">${q?`<span class="badge">${esc(cat)}</span>`:''}${it.i!==undefined?`<span class="badge">initial: ${esc(it.i)}</span>`:''}${it.p&&!it.p.includes(' ')?`<span class="badge">${it.h?'inherited':'not inherited'}</span>`:''}${it.p&&!it.p.includes(' ')?`<a href="https://developer.mozilla.org/en-US/docs/Web/CSS/${encodeURIComponent(it.p)}" target="_blank" rel="noopener">MDN</a>`:''}</div></header>
    ${it.d?`<p class="chd">${esc(it.d)}</p>`:''}${it.p&&synFor(it.p)?`<p class="chd">${accHtml(it.p)}</p>`:''}<div class="sws">${it.v.map((v,j)=>`<figure class="sw"><div class="swh" data-k="${k}" data-j="${j}" title="click to replay" style="${(TPL[it.T]&&TPL[it.T].ht)?`height:${TPL[it.T].ht}px`:''}"></div><figcaption><code>${esc(it.p&&!it.r?it.p+': '+v:v)}</code><button type="button" data-k="${k}" data-j="${j}">open in lab</button></figcaption></figure>`).join('')}</div></section>`).join('');
  body.querySelectorAll('.swh').forEach(h=>{const[,it]=list[h.dataset.k];mount(h,it,it.v[h.dataset.j]);h.addEventListener('click',()=>mount(h,it,it.v[h.dataset.j]))});
  body.querySelectorAll('figcaption button').forEach(b=>b.addEventListener('click',()=>{const[,it]=list[b.dataset.k],v=it.v[b.dataset.j],{h,css}=partsOf(it,v);
    let rule=ruleOf(it,v);
    if(it.r&&it.r.startsWith('$')&&it.r.length>1){const sc=splitTop(v).map(x=>/^[:*]/.test(x)?'.f '+x:x).join(', ');rule=it.r.split('$').join(sc)}
    const T=TPL[it.T]||{c:''},base='.f{padding:8px;font:13px/1.3 system-ui,sans-serif;color:#000}';
    const P=LESSONS.find(l=>l.id==='playground');P.t=`Playground: ${it.p&&!it.r?it.p+': '+v:v}`;
    P.html=prettyHTML(`<div class="f">${it.x||T.h||''}</div>`);P.css=fmtCss(base+T.c+(it.c||'')+'/* the property you are testing */ '+rule);go('playground')}));
}
function mqHtml(){
  const w=Math.round(innerWidth);
  return`<p class="chd">Media features are conditions, so they have no look of their own. Each line says whether it is true <b>right now</b> on this screen (window width ${w}px). Use them as <code>@media (feature) { … }</code>; combine with <code>and</code>, a comma (or) and <code>not</code>.</p>
  <div class="mqg">${MQ.map(([n,...qs])=>`<section class="chc"><header><h3><code>${esc(n)}</code></h3></header><ul class="mq">${qs.map(q=>{const ok=matchMedia(q).matches;return`<li><code>@media ${esc(q)}</code><b>${ok?'✓ true now':'✗ false now'}</b></li>`}).join('')}</ul></section>`).join('')}</div>
  <p class="muted">Legacy, avoid: <code>device-width</code>, <code>device-height</code>, <code>device-aspect-ratio</code> (deprecated), <code>scan</code> and <code>grid</code> (TV/terminal devices).</p>`;
}

/* ---------- live preview helpers: sticky preview, focus mode, pop-out tab ---------- */
let lastDoc='',pop=null;
function pushPop(){if(!pop||pop.closed){pop=null;return}try{const y=pop.scrollY;pop.document.open();pop.document.write(lastDoc.replace('<head>','<head><title>CSS Lab live preview</title>'));pop.document.close();pop.scrollTo(0,y)}catch(e){pop=null}}
$('#popbtn').addEventListener('click',()=>{
  const n=$('#popnote');n.hidden=true;
  try{pop=window.open('','csslab-live');}catch(e){pop=null}
  if(pop){pushPop();pop.focus();n.hidden=false;n.textContent='Live tab open: put it next to this window. Every change you type here appears there instantly. (Leave this tab open; closing it stops the updates.)'}
  else{n.hidden=false;n.innerHTML='This viewer blocked the new tab. Two ways around it: <b>Focus mode</b> (editor and preview side by side, no scrolling), or download <code>index.html</code>, open it from your computer, and use this button there.'}
});
$('#focusbtn').addEventListener('click',e=>{const on=document.body.classList.toggle('focus');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'Exit focus mode':'Focus mode';setTimeout(()=>{if(width==='fit')setWidth('fit');drawOv()},50);if(on)document.querySelector('.work').scrollIntoView()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('focus'))$('#focusbtn').click()});

buildNav();

load(location.hash.slice(1)||'cascade');
}
