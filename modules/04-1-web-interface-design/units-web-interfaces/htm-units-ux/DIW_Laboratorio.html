<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIW Laboratorio</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d2433;--mute:#5b6476;--line:#e2ded5;--acc:#1f6feb;--acc2:#0e7c66;--bad:#c0362c;--ok:#18794e;--hi:#fff4d6;--chip:#eef2fb;--tem:#eaf3ee;--trap:#fdeeea;--code:#f6f8fa;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b5;--line:#2c3340;--acc:#5b9dff;--acc2:#3cc5a3;--bad:#ff7b72;--ok:#4cd38a;--hi:#3a3220;--chip:#232b3a;--tem:#1d2c25;--trap:#36211e;--code:#151a22;--shadow:none}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b5;--line:#2c3340;--acc:#5b9dff;--acc2:#3cc5a3;--bad:#ff7b72;--ok:#4cd38a;--hi:#3a3220;--chip:#232b3a;--tem:#1d2c25;--trap:#36211e;--code:#151a22;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1240px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{font-size:18px;margin:0}.brand h1 small{font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
nav.tabs button{border:0;background:none;color:var(--mute);padding:9px 12px;font:600 14px system-ui;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-color:var(--acc)}
nav.tabs button small{display:block;font-weight:500;font-size:11px}
main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
section.tab{display:none}section.tab.on{display:block}
h2{font-size:26px;margin:4px 0 6px}h3{font-size:19px;margin:22px 0 8px}h4{margin:12px 0 6px}
p.lead{color:var(--mute);margin-top:0;max-width:880px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;font:600 14px system-ui;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:4px 9px;font-size:13px}.btn.xs{padding:2px 7px;font-size:12px;border-radius:6px}
.btn.on{background:var(--chip);border-color:var(--acc);color:var(--acc)}
input,select,textarea{font:15px system-ui;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.xs{font-size:12.5px}.mute{color:var(--mute)}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.mono,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.92em}
.tag{display:inline-block;font:700 11px system-ui;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--chip);color:var(--acc)}
.tag.t{background:var(--tem);color:var(--acc2)}.tag.x{background:var(--trap);color:var(--bad)}
.box{border-radius:10px;padding:10px 14px;margin:10px 0}.box.t{background:var(--tem)}.box.x{background:var(--trap)}.box.w{background:var(--hi)}.box ul{margin:6px 0;padding-left:20px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;border:1px solid var(--line);font-size:13px}.pill:empty{display:none}.pill.okp{border-color:var(--ok);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--chip)}
.twrap{overflow-x:auto}
figure{margin:0}figcaption{font-size:12.5px;color:var(--mute);margin-top:4px}
img.fig{max-width:100%;border-radius:8px;display:block;background:#fff}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13.5px/1.5 ui-monospace,Consolas,monospace;margin:8px 0;white-space:pre}
pre.code.big{font-size:15px}
pre.code .t{color:#22863a;font-weight:600}pre.code .a{color:#6f42c1;font-weight:500}pre.code .v{color:#032f62;font-weight:400}pre.code .s{color:#b31d28;font-weight:600}pre.code .p{color:#005cc5;font-weight:500}pre.code .c{color:#6a737d}pre.code .k{color:#d73a49}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) pre.code .t{color:#7ee787}:root:not([data-theme="light"]) pre.code .a{color:#d2a8ff}:root:not([data-theme="light"]) pre.code .v{color:#a5d6ff}:root:not([data-theme="light"]) pre.code .s{color:#ffa198}:root:not([data-theme="light"]) pre.code .p{color:#79c0ff}}
:root[data-theme="dark"] pre.code .t{color:#7ee787}:root[data-theme="dark"] pre.code .a{color:#d2a8ff}:root[data-theme="dark"] pre.code .v{color:#a5d6ff}:root[data-theme="dark"] pre.code .s{color:#ffa198}:root[data-theme="dark"] pre.code .p{color:#79c0ff}
/* acordeones */
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;box-shadow:var(--shadow)}
details.sec>summary{cursor:pointer;padding:12px 16px;font:700 17px system-ui;list-style:none;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"▸";color:var(--acc);transition:transform .2s}details.sec[open]>summary:before{transform:rotate(90deg)}
details.sec>summary .done{margin-left:auto;font:600 12px system-ui;color:var(--mute);display:flex;gap:4px;align-items:center}
details.sec>.secbody{padding:0 16px 14px}
.rahead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.count{font:800 28px system-ui;color:var(--acc)}.count small{font:600 13px system-ui;color:var(--mute);display:block}
.prog{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc2)}
/* laboratorio */
.lab{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;margin:12px 0;box-shadow:var(--shadow)}
.labhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.labnote{font-size:14px;background:var(--chip);border-radius:8px;padding:7px 10px;margin-bottom:8px}
.ctls{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:13px}.ctl{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.labgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:760px){.labgrid{grid-template-columns:minmax(0,1fr)}}
.grid>*,.labgrid>*{min-width:0}
.eds{display:flex;flex-direction:column}
.edtabs{display:flex;gap:2px}.edtabs button{border:1px solid var(--line);border-bottom:0;background:var(--bg);color:var(--mute);font:700 12px system-ui;padding:4px 12px;border-radius:6px 6px 0 0;cursor:pointer}.edtabs button.on{background:#1e1e1e;color:#fff;border-color:#1e1e1e}
textarea.ed{flex:1;min-height:200px;width:100%;resize:vertical;background:#1e1e1e;color:#d4d4d4;border:1px solid #1e1e1e;border-radius:0 8px 8px 8px;font:13.5px/1.5 ui-monospace,Consolas,monospace;padding:10px;tab-size:2;white-space:pre;overflow:auto}
.fwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;position:relative}
iframe.frame{border:0;width:100%;display:block;background:#fff;resize:vertical}
.out .frame{border:1px solid var(--line);border-radius:8px}.fwrap .frame{border:0;border-radius:0}
.insp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.ihead .btn{margin-left:auto}
.igrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}@media (max-width:760px){.igrid{grid-template-columns:1fr}}
.props td{font-size:12.5px;padding:3px 6px}.props td:first-child{color:#c0369f}
.rule{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12.5px;padding:4px 6px;border-bottom:1px solid var(--line)}.rule.win{background:var(--tem)}
/* modelo de caja */
.bm{font:11.5px ui-monospace,monospace;color:#111;text-align:center;max-width:420px}
.bm i{display:block;text-align:left;font-style:normal;font-size:10.5px;padding-left:4px}
.bm-row{display:flex;align-items:center;justify-content:space-between}.bm-row>span{width:28px;flex:none}
.bm-m{background:#f9cc9d;border:1px dashed #333;padding:2px 2px 4px}.bm-b{background:#fddd9b;border:2px solid #222;padding:2px 2px 4px;flex:1}.bm-p{background:#c3d08b;border:1px dashed #333;padding:2px 2px 4px;flex:1}.bm-c{background:#8cb6c0;border:1px solid #333;padding:10px 4px;flex:1;font-weight:700}
.choice{display:block;width:100%;text-align:left;margin:5px 0;font-weight:500}.choice.right{border-color:var(--ok);background:var(--tem)}.choice.wrong{border-color:var(--bad);background:var(--trap)}
.hidden-res .ph{border:2px dashed var(--line);border-radius:8px;padding:30px 10px;text-align:center;color:var(--mute)}
.phone{border:10px solid #222;border-radius:24px;width:395px;max-width:100%;overflow:hidden;background:#fff;margin:6px 0}
@media (max-width:440px){.phone{transform:scale(.8);transform-origin:0 0;margin-bottom:-110px}}
/* juegos */
.anat{font:14px/1.9 ui-monospace,monospace;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px}
.anat div{cursor:pointer;padding:0 6px;border-radius:4px;white-space:pre;overflow-x:auto}.anat div:hover,.anat div.on{background:var(--hi)}
.ordlist{list-style:none;padding:0}.ordlist li{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;margin:5px 0;background:var(--card)}.ordlist li span{flex:1}.ordlist li.okk{border-color:var(--ok);background:var(--tem)}.ordlist li.ko{border-color:var(--bad)}
.wire{position:relative;aspect-ratio:16/10;background:#fafafa;border:2px solid #999;border-radius:8px;max-width:640px}
.wire div{position:absolute;border:2px dashed #888;border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 13px system-ui;color:#555;cursor:pointer;background:#fff;text-align:center;padding:2px}
.wire div:hover{border-color:var(--acc)}.wire div.good{background:#d8f2e4;border-color:var(--ok)}.wire div.badz{background:#fde2de;border-color:var(--bad)}
.cls-item{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.cls-item.okk{border-color:var(--ok);background:var(--tem)}.cls-item.ko{border-color:var(--bad);background:var(--trap)}
.cs-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}@media (max-width:700px){.cs-wrap{grid-template-columns:minmax(0,1fr)}}
.cls-item select{max-width:58%}
.cs-pool,.cs-group{border:2px dashed var(--line);border-radius:10px;padding:8px;min-height:60px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.cs-group{border-style:solid;background:var(--card);flex-direction:row}.cs-group h5{width:100%;margin:0 0 4px;display:flex;justify-content:space-between;gap:6px;font-size:14px}
.cs-card{background:#fff8dc;color:#333;border:1px solid #d8c98a;border-radius:6px;padding:3px 8px;font-size:13px;cursor:grab;user-select:none}
.cs-card.sel{outline:3px solid var(--acc)}.cs-group.drop{outline:3px solid var(--acc2)}
.flip{perspective:1000px;height:240px;cursor:pointer}.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:auto}
.flip .f{font-size:20px;font-weight:700}.flip .b{transform:rotateY(180deg);background:var(--tem);font-size:15px;display:block;text-align:left}
dl.defs dt{font-weight:700;margin-top:8px}dl.defs dd{margin:2px 0 0 14px}
ol.cols2{columns:2 320px}
.soon{border:2px dashed var(--line);border-radius:12px;padding:12px;color:var(--mute)}
@media (max-width:640px){.brand h1 small{display:none}h2{font-size:22px}}
</style>
</head>

 ['html', `<div class="box t"><b>Escribe de memoria</b> (te lo pueden pedir tal cual): doctype → html lang → head (charset, viewport, title, link) → body. Truco del editor: en VS Code escribe <code>!</code> + Tab.</div>`]
]},
{id:'f2', t:'La etiqueta viewport (por qué existe)', star:true, items:[
 ['vp'],
 ['html', `<table><tr><th>Valor</th><th>Qué hace</th></tr>
 <tr><td><code>width=device-width</code></td><td>El ancho del «lienzo» = ancho real de la pantalla en píxeles CSS (375 en un iPhone típico).</td></tr>
 <tr><td><code>initial-scale=1.0</code></td><td>Sin zoom al cargar: 1 px CSS se ve a su tamaño.</td></tr>
 <tr><td><code>user-scalable=no</code> / <code>maximum-scale=1</code></td><td>Impiden hacer zoom: <b>mala práctica de accesibilidad</b>, no lo uses.</td></tr></table>
 <p class="xs mute">En un ordenador de sobremesa la etiqueta no tiene efecto (la ventana ya es el viewport); por eso pruébala con el modo dispositivo del inspector (Ctrl+Mayús+M en Firefox).</p>`]
]},
{id:'f3', t:'Estructura semántica de una página', star:true, items:[
 ['html', `<p>Las etiquetas semánticas dicen <b>qué es</b> cada zona (no cómo se ve). Por defecto son <b>bloques</b> como <code>div</code>; la diferencia es el significado para buscadores, lectores de pantalla y para ti al leer el código.</p>
 <table><tr><th>Etiqueta</th><th>Uso</th></tr><tr><td><code>header</code></td><td>Cabecera de la página o de una sección (logo, título, a veces el menú).</td></tr><tr><td><code>nav</code></td><td>Menú de navegación principal.</td></tr><tr><td><code>main</code></td><td>Contenido principal (uno por página).</td></tr><tr><td><code>section</code></td><td>Sección temática con su título.</td></tr><tr><td><code>article</code></td><td>Contenido independiente (noticia, ficha, entrada de blog).</td></tr><tr><td><code>aside</code></td><td>Contenido complementario (barra lateral, publicidad).</td></tr><tr><td><code>footer</code></td><td>Pie: autor, copyright, enlaces legales.</td></tr><tr><td><code>div</code> / <code>span</code></td><td>Contenedores genéricos sin significado: bloque / en línea.</td></tr></table>`],
 ['lab', {id:'sem', title:'Layout clásico con etiquetas semánticas', star:true, h:300, widths:['auto',360,768], note:'Pulsa <b>▦ Contornos</b> para ver cada caja. Cambia el ancho a 360 px: la <code>@media (max-width: 480px)</code> pone el aside debajo (en el móvil se ve una sola columna).',
  html:`<header>Cabecera (logo)</header>
<nav>Inicio · Productos · Contacto</nav>
<div class="cuerpo">
  <main>
    <article><h2>Artículo</h2><p>Contenido principal…</p></article>
  </main>
  <aside>Lateral</aside>
</div>
<footer>Pie © 2026</footer>`,
  css:`header, nav, footer { padding: 10px; background: #dbe7fb; }
nav { background: #eef2fb; }
.cuerpo { display: flex; gap: 10px; margin: 10px 0; }
main { flex: 3; background: #e5f3ea; padding: 10px; }
aside { flex: 1; background: #fdf0d8; padding: 10px; }
@media (max-width: 480px) {
  .cuerpo { flex-direction: column; }
}`}],
 ['pred', {id:'p-sem', q:'Sin ningún CSS, ¿cómo se colocan header, nav, main y footer?', html:'<header>header</header><nav>nav</nav><main>main</main><footer>footer</footer>', css:'header,nav,main,footer{border:2px solid #1f6feb;margin:2px}', o:['Uno al lado del otro','Uno debajo de otro, cada uno ocupando todo el ancho','Superpuestos','En dos columnas'], a:1, e:'Son elementos de <b>bloque</b>: empiezan en línea nueva y ocupan todo el ancho disponible del padre.'}]
]},
{id:'f4', t:'Bloque, en línea, inline-block y none (display)', star:true, items:[
 ['html', `<table><tr><th>display</th><th>¿Nueva línea?</th><th>¿Ancho?</th><th>width / height</th><th>margin/padding vertical</th><th>Ejemplos por defecto</th></tr>
 <tr><td><b>block</b></td><td>Sí</td><td>Todo el del padre</td><td>Sí</td><td>Sí</td><td>div, p, h1–h6, ul, section, header…</td></tr>
 <tr><td><b>inline</b></td><td>No, fluye con el texto</td><td>El de su contenido</td><td><b>No</b> se aplican</td><td>No empujan a las líneas</td><td>span, a, strong, em, img*</td></tr>
 <tr><td><b>inline-block</b></td><td>No</td><td>El de su contenido</td><td>Sí</td><td>Sí</td><td>button, input, img*</td></tr>
 <tr><td><b>none</b></td><td colspan="5">Desaparece y <b>no ocupa espacio</b> (≠ <code>visibility:hidden</code>, que oculta pero conserva el hueco).</td></tr>
 <tr><td><b>flex / grid</b></td><td colspan="5">El elemento es un bloque y sus <b>hijos</b> se colocan con las reglas de flex o grid (pestaña RA1).</td></tr></table>
 <p class="xs mute">* img es un elemento «reemplazado»: se comporta como inline pero sí acepta width/height.</p>`],
 ['lab', {id:'disp', title:'Cambia el display de los .item y del span', star:true, h:220, ctl:[{sel:'.item', prop:'display', vals:['block','inline','inline-block','flex','none']},{sel:'span', prop:'display', vals:['inline','block','inline-block']},{sel:'.oculto', prop:'visibility', vals:['visible','hidden']}],
  note:'Los .item tienen <code>width:120px; height:50px</code>: observa cuándo se respetan. Inspecciona un <code>span</code> con <code>padding</code>: el fondo crece pero no empuja la línea de arriba.',
  html:`<div class="item">item 1</div>
<div class="item oculto">item 2</div>
<div class="item">item 3</div>
<p>Texto con un <span>span con padding</span> en medio de la línea, y otra línea más para ver si el padding la empuja.</p>`,
  css:`.item { width: 120px; height: 50px; background: #dbe7fb; border: 2px solid #1f6feb; margin: 4px; }
span { background: #ffd27a; padding: 10px; }`}],
 ['chal', {id:'c-disp', title:'Tres cajas en fila sin flex', star:true, desc:'Haz que las tres <code>.c</code> se pongan <b>en la misma línea</b>, con 100 px de ancho, 60 px de alto y fondo <code>tomato</code>, usando <code>display</code>.', html:'<div class="c">1</div><div class="c">2</div><div class="c">3</div>', start:'.c {\n  \n}', sol:'.c {\n  display: inline-block;\n  width: 100px;\n  height: 60px;\n  background: tomato;\n}', checks:[['.c','display','display'],['.c','width','ancho'],['.c','height','alto'],['.c','background-color','fondo']], why:'inline-block: van en línea como el texto pero respetan width y height.'}]
]},
{id:'f5', t:'Tres formas de añadir CSS y la sintaxis', star:false, items:[
 ['html', `${'' }<div class="grid g3"><div class="card"><b>Externa</b> (recomendada)${'' }<pre class="code"><code>&lt;link rel="stylesheet" href="estilo.css"&gt;</code></pre></div><div class="card"><b>Interna</b><pre class="code"><code>&lt;style&gt; p { color: red; } &lt;/style&gt;</code></pre></div><div class="card"><b>En línea</b><pre class="code"><code>&lt;p style="color:red"&gt;</code></pre></div></div>
 <p><b>Anatomía de una regla:</b></p>${'' }<pre class="code big"><code><b class="s">selector</b> {  <i class="c">/* comentario */</i>
  <b class="p">propiedad</b>: valor;   ← declaración (no olvides el ;)
}</code></pre>
 <p>Si dos reglas con la misma especificidad chocan, <b>gana la última</b> que lee el navegador (por eso el orden de &lt;link&gt; y &lt;style&gt; importa). El estilo en línea gana a ambas.</p>`],
 ['pred', {id:'p-ord', q:'¿De qué color sale el párrafo?', html:'<p>¿Color?</p>', css:'p { color: green; }\np { color: blue; }', o:['Verde','Azul','Negro','Mezcla'], a:1, e:'Misma especificidad → gana la regla escrita <b>después</b> (cascada por orden).'}]
]},
{id:'f6', t:'Selectores', star:true, items:[
 ['html', `<table><tr><th>Selector</th><th>Selecciona</th><th>Ejemplo</th></tr>
 <tr><td><code>*</code></td><td>Todos</td><td><code>* { box-sizing: border-box; }</code></td></tr>
 <tr><td><code>p</code></td><td>Por etiqueta</td><td>todos los párrafos</td></tr>
 <tr><td><code>.ficha</code></td><td>Por clase (puede repetirse)</td><td><code>class="ficha destacada"</code></td></tr>
 <tr><td><code>#menu</code></td><td>Por id (único en la página)</td><td><code>id="menu"</code></td></tr>
 <tr><td><code>h1, h2</code></td><td>Grupo: ambos</td><td></td></tr>
 <tr><td><code>.ficha p</code></td><td><b>Descendiente</b>: p dentro de .ficha a cualquier profundidad</td><td></td></tr>
 <tr><td><code>.ficha &gt; p</code></td><td><b>Hijo directo</b></td><td></td></tr>
 <tr><td><code>h2 + p</code></td><td><b>Hermano adyacente</b>: el p justo después de un h2</td><td></td></tr>
 <tr><td><code>h2 ~ p</code></td><td><b>Hermanos generales</b>: todos los p después del h2 (mismo padre)</td><td></td></tr>
 <tr><td><code>a[target="_blank"]</code></td><td>Por atributo</td><td><code>[href^="https"]</code> empieza, <code>$=</code> termina, <code>*=</code> contiene</td></tr>
 <tr><td><code>:hover :active :focus :visited</code></td><td>Pseudo-clases de estado</td><td></td></tr>
 <tr><td><code>:first-child :last-child :nth-child(2n)</code></td><td>Por posición entre hermanos</td><td><code>.ficha&gt;:nth-child(1)</code> (cartelera)</td></tr>
 <tr><td><code>:target</code></td><td>El elemento cuyo id está en la URL (#id)</td><td>modales y pestañas sin JS</td></tr>
 <tr><td><code>::before ::after</code></td><td>Pseudo-elementos: contenido generado con <code>content</code></td><td>cartelera2</td></tr></table>`],
 ['sel'],
 ['lab', {id:'pseudo', title:'::before, ::after y :hover', star:true, h:150, note:'Como en <b>cartelera2</b>: el texto añadido con <code>content</code> no está en el HTML. Pasa el ratón por los títulos.',
  html:`<div class="ficha">
  <div>Título 1</div>
  <div>Título 2</div>
</div>`, css:`.ficha > div { border: 1px dotted #000; margin: 4px; padding: 6px; }
.ficha > div::before { content: "▶ "; color: #1f6feb; }
.ficha > div:first-child::before { content: " beforeCss1 "; }
.ficha > div::after { content: " afterCssTodos"; color: #b54708; }
.ficha > div:hover { background: #ffd27a; cursor: pointer; }`}]
]},
{id:'f7', t:'Cascada, especificidad, herencia e !important', star:true, items:[
 ['html', `<p>Cuando varias reglas dan valores distintos a la misma propiedad, el navegador decide por este orden:</p>
 <ol><li><b>!important</b> gana a todo (úsalo poco: los tips de cartelera0 lo usan).</li><li><b>Especificidad</b>: se cuenta (id, clase/atributo/pseudo-clase, elemento). Se compara de izquierda a derecha: <code>#a</code> (1,0,0) gana a <code>.x.y.z</code> (0,3,0).</li><li><b>Estilo en línea</b> (<code>style=""</code>) gana a cualquier selector.</li><li>Con empate, <b>la última regla</b> escrita.</li></ol>
 <p><b>Herencia</b>: algunas propiedades pasan de padre a hijos (<code>color, font-*, line-height, text-align, visibility, cursor</code>) y otras no (<code>margin, padding, border, width, background, display</code>). Palabras clave: <code>inherit</code> (copia del padre), <code>initial</code> (valor por defecto).</p>`],
 ['lab', {id:'casc', title:'¿Quién gana? Inspecciona el párrafo', star:true, h:150, note:'Activa 🔍 y pulsa el párrafo: abajo verás <b>todas las reglas</b> ordenadas por prioridad con su especificidad. Borra la línea con <code>#intro</code> y mira quién gana después.',
  html:`<div class="caja">
  <p id="intro" class="texto destacado">¿De qué color soy?</p>
  <p>Yo heredo el color del div (color se hereda; el borde no).</p>
</div>`, css:`p { color: green; }
.texto { color: orange; }
.texto.destacado { color: purple; }
#intro { color: blue; }
div p { color: brown; }
.caja { color: crimson; border: 2px solid #999; padding: 6px; }
p + p { color: inherit; }`}],
 ['pred', {id:'p-imp', q:'¿Color del texto?', html:'<p id="a" class="b">texto</p>', css:'#a { color: blue; }\n.b { color: red !important; }\np { color: green; }', o:['Azul (el id tiene más especificidad)','Rojo (!important)','Verde (es la última)','Negro'], a:1, e:'<code>!important</code> está por encima de la especificidad.'}],
 ['pred', {id:'p-spec', q:'¿Color del texto?', html:'<ul class="menu"><li><a class="enlace" href="#">enlace</a></li></ul>', css:'.menu li a { color: red; }\n.enlace { color: blue; }', o:['Rojo: (0,1,2) gana a (0,1,0)','Azul: es la última','Azul: las clases ganan a las etiquetas','Morado'], a:0, e:'<code>.menu li a</code> = 1 clase + 2 elementos = (0,1,2) &gt; <code>.enlace</code> (0,1,0). El orden solo decide si hay empate.'}]
]},
{id:'f8', t:'Modelo de caja (box model)', star:true, items:[
 ['html', `<p>Todo elemento es una caja de 4 capas, de dentro afuera: <span class="pill" style="background:rgba(111,168,220,.6)">contenido</span> <span class="pill" style="background:rgba(147,196,125,.6)">padding (relleno interior, tiene el fondo)</span> <span class="pill" style="background:rgba(255,229,153,.8)">border</span> <span class="pill" style="background:rgba(246,178,107,.6)">margin (separación exterior, transparente)</span>. Son los mismos colores que el inspector de Firefox/Chrome.</p>
 <div class="grid g2"><div class="card"><b>box-sizing: content-box</b> (por defecto)<br>ancho total = width + padding izq/der + border izq/der<br><code>width:200px; padding:20px; border:5px</code> → <b>250 px</b></div><div class="card"><b>box-sizing: border-box</b><br>width ya incluye padding y border<br>mismo CSS → <b>200 px</b> (el contenido se reduce a 150). Por eso casi todas las webs ponen <code>*{box-sizing:border-box}</code> (tip del paginador).</div></div>
 <ul><li>Abreviaturas: <code>margin: 10px</code> (4 lados) · <code>10px 20px</code> (vertical horizontal) · <code>10px 20px 5px</code> (arriba, lados, abajo) · <code>1px 2px 3px 4px</code> (arriba, derecha, abajo, izquierda = sentido del reloj).</li>
 <li><code>margin: 0 auto</code> centra horizontalmente un bloque <b>con width</b> (tip de cartelera1).</li>
 <li><b>Colapso de márgenes</b>: dos márgenes verticales que se tocan no se suman, queda el mayor.</li><li>El margin puede ser negativo; el padding no.</li></ul>`],
 ['lab', {id:'box', title:'Juega con padding, border, margin y box-sizing', star:true, h:230, ctl:[{sel:'.caja', prop:'padding', vals:['0','10px','30px','10px 40px']},{sel:'.caja', prop:'border', vals:['0','5px solid #333','15px dashed #333']},{sel:'.caja', prop:'margin', vals:['0','20px','0 auto','-10px 0 0 0']},{sel:'.caja', prop:'box-sizing', vals:['content-box','border-box']}],
  note:'Activa 🔍 y pulsa la caja azul: el diagrama muestra las medidas reales. Con <code>content-box</code> cada padding/borde <b>agranda</b> la caja; con <code>border-box</code> la caja sigue midiendo 200 px.',
  html:`<div class="caja">Contenido</div>
<p>Párrafo siguiente (mira cómo lo empuja el margin)</p>`, css:`.caja {
  width: 200px;
  height: 60px;
  background: #6fa8dc;
  color: white;
}`}],
 ['lab', {id:'collapse', title:'Colapso de márgenes', h:180, note:'El primer párrafo tiene <code>margin-bottom:30px</code> y el segundo <code>margin-top:20px</code>. Inspecciona: la separación es <b>30</b>, no 50.',
  html:`<p class="a">margin-bottom: 30px</p>
<p class="b">margin-top: 20px</p>`, css:`p { background: #e5f3ea; margin: 0; padding: 6px; }
.a { margin-bottom: 30px; }
.b { margin-top: 20px; }`}],
 ['pred', {id:'p-box', q:'¿Cuánto mide de ancho la caja en pantalla?', html:'<div class="c">caja</div>', css:'.c { width: 200px; padding: 20px; border: 5px solid; background: #ddd; }', o:['200 px','220 px','250 px','240 px'], a:2, e:'content-box: 200 + 20·2 + 5·2 = <b>250 px</b>. Con border-box serían 200.'}],
 ['chal', {id:'c-box', title:'Tarjeta centrada', star:true, desc:'Consigue una <code>.card</code> de <b>300 px de ancho total</b> (incluido padding y borde), con <b>padding de 20 px</b>, borde de <b>2 px sólido #333</b> y <b>centrada horizontalmente</b>.', html:'<div class="card">Tarjeta</div>', start:'.card {\n  \n}', sol:'.card {\n  box-sizing: border-box;\n  width: 300px;\n  padding: 20px;\n  border: 2px solid #333;\n  margin: 0 auto;\n}', checks:[['.card','width','ancho total'],['.card','padding-left','padding'],['.card','border-left-width','grosor del borde'],['.card','border-left-style','estilo del borde'],['.card','margin-left','centrado (margin auto)']], why:'border-box hace que 300 px sea el total; margin: 0 auto centra un bloque con ancho definido.'}]
]},
{id:'f9', t:'Tamaños: width, height, max/min, overflow', star:false, items:[
 ['html', `<ul><li><code>width/height</code> en px, %, vw/vh… El <b>%</b> es del <b>padre</b>; <code>height:%</code> solo funciona si el padre tiene altura definida (ejercicio <b>alturaPorcentaje</b>).</li><li><code>max-width</code> evita que crezca demasiado (<code>max-width:100%</code> en imágenes = responsive); <code>min-width</code> evita que encoja demasiado (3x4fichas: bloquear tamaños mínimos y máximos).</li><li><code>overflow</code>: qué pasa si el contenido no cabe: <code>visible</code> (se sale), <code>hidden</code> (se corta), <code>scroll</code> (barras siempre), <code>auto</code> (barras si hace falta).</li></ul>`],
 ['lab', {id:'ovf', title:'overflow y max-width', h:200, widths:['auto',360], ctl:[{sel:'.caja', prop:'overflow', vals:['visible','hidden','scroll','auto']},{sel:'.caja', prop:'height', vals:['auto','60px']},{sel:'.ancha', prop:'max-width', vals:['none','100%','300px']}],
  html:`<div class="caja">Texto largo que no cabe en una caja de 60 px de alto. Texto largo que no cabe. Texto largo que no cabe. Texto largo que no cabe.</div>

.ancha { width: 500px; background: #ffd27a; margin-top: 30px; }`}]

{id:'f10', t:'Unidades: px, %, em, rem, vw, vh, calc()', star:true, items:[
 ['html', `<table><tr><th>Unidad</th><th>Relativa a</th><th>Uso típico</th></tr><tr><td><b>px</b></td><td>Absoluta (píxel CSS)</td><td>bordes, sombras</td></tr><tr><td><b>%</b></td><td>El padre (en font-size: la fuente del padre)</td><td>anchos fluidos</td></tr><tr><td><b>em</b></td><td>font-size del <b>propio elemento</b> (o del padre si es font-size) → se acumula</td><td>padding de botones</td></tr><tr><td><b>rem</b></td><td>font-size del <b>html</b> (16 px por defecto) → no se acumula</td><td>tamaños de texto</td></tr><tr><td><b>vw / vh</b></td><td>1 % del ancho / alto de la ventana</td><td>secciones a pantalla completa (máscara: 100vw/100vh)</td></tr><tr><td><b>calc()</b></td><td>Mezclar unidades</td><td><code>width: calc(100% - 40px)</code></td></tr></table>`],

<div class="col"><div class="rem">rem nivel 1<div class="rem">rem nivel 2<div class="rem">rem nivel 3</div></div></div></div>`,

 ['pred', {id:'p-em', q:'html tiene 16 px. Un div con font-size: 2em contiene un p con font-size: 1.5em. ¿Tamaño del p?', html:'<div style="font-size:2em">div <p style="font-size:1.5em">p</p></div>', css:'', o:['24 px','32 px','48 px','16 px'], a:2, e:'div = 16·2 = 32 px; p = 32·1,5 = <b>48 px</b>. Con rem serían 16·1,5 = 24.'}]

{id:'f11', t:'Colores y fondos (lo básico)', star:false, items:[

}`}]
]},
{id:'f12', t:'El inspector del navegador (como en tus capturas)', star:true, items:[
 ['html', `<ol><li><b>F12</b> o clic derecho → <b>Inspeccionar</b>. Panel izquierdo: árbol HTML (pasa el ratón y se resalta en la página). Panel de reglas: el CSS que se aplica (lo tachado es lo que pierde por cascada).</li>
 <li>Pestaña <b>Diseño / Layout</b> (tu captura): <b>Flexbox</b> y <b>Grid</b> (marca un contenedor para ver su superposición con colores) y <b>Modelo de caja</b> (margin, border, padding, contenido con medidas; puedes editar los números con doble clic).</li>
 <li><b>Calculado / Computed</b>: el valor final de cada propiedad.</li><li><b>:hov</b> fuerza estados <code>:hover</code>, <code>:active</code>, <code>:focus</code>; <b>.cls</b> añade/quita clases.</li><li><b>Ctrl+Mayús+M</b>: modo diseño adaptable (móviles).</li><li>Consola: errores en rojo.</li></ol>
 <div class="box t">Los laboratorios de esta página hacen lo mismo con <b>🔍 Inspeccionar</b> (caja de colores + diagrama + reglas con especificidad) y <b>▦ Contornos</b>.</div>`]
]}
];

// ===================== RA2 · PLANIFICACIÓN DE INTERFACES (17 nov) =====================
const RA2_SECTIONS = [
{id:'r1', t:'Etapas para planificar una interfaz web', star:true, items:[
 ['html', `<div class="box w"><b>⭐ Actividad evaluada del tema:</b> «Indica las etapas para planificar una interfaz web». Apréndetelas en orden y con una frase cada una.</div>
 <ol class="steps-list">
 <li><b>Planificación / análisis de requisitos</b>: objetivos del sitio (¿para qué existe?), público objetivo, contenidos, competencia, presupuesto y plazos. Se recoge y ordena toda la información.</li>
 <li><b>Arquitectura de la información</b>: organizar, clasificar y rotular los contenidos → <b>mapa del sitio</b> (árbol de páginas) y sistema de navegación. Técnica: <b>card sorting</b>.</li>
 <li><b>Diseño</b>: modelado de usuario (<b>personas</b> y escenarios), diseño conceptual, de interacción, visual (bocetos → <b>wireframes</b> → <b>mockups</b>), definición de estilo (<b>guía de estilo</b>) y diseño de contenidos.</li>
 <li><b>Prototipado</b>: versión navegable de baja (papel, wireframe) o alta fidelidad (casi real) para probar antes de programar. Herramientas: Pencil, Balsamiq, Figma, Moqups…</li>
 <li><b>Evaluación</b>: métodos de inspección (evaluación heurística) y test con usuarios. Se vuelve al diseño si hay problemas (proceso <b>iterativo</b>).</li>
 <li><b>Implementación (desarrollo) y lanzamiento</b>: HTML, CSS, JS; validar código (W3C), probar en varios navegadores y dispositivos, accesibilidad; publicar.</li>
 <li><b>Mantenimiento y seguimiento</b>: actualizar contenidos, analítica web, test A/B, rediseños sutiles.</li></ol>
 <figure class="card">${'IMG:disenio-centrado-usuario'}<figcaption>Metodología del Diseño Centrado en el Usuario (DCU): planificación → diseño ⇄ prototipado ⇄ evaluación → implementación y lanzamiento → mantenimiento y seguimiento. Fuente: curso de usabilidad (A. Sanz) / upf.edu.</figcaption></figure>`],
 ['order']
]},
{id:'r2', t:'Componentes principales de una página web', star:true, items:[
 ['html', `<p>Objetivo del tema: <b>identificar y reconocer</b> las partes de una página. Casi todas las webs repiten las mismas zonas (convenciones): el usuario las busca donde espera encontrarlas.</p>
 <table><tr><th>Componente</th><th>Dónde suele estar</th><th>Etiqueta HTML</th></tr>
 <tr><td><b>Cabecera</b> con logotipo (enlaza a inicio)</td><td>Arriba; logo arriba a la izquierda</td><td><code>header</code></td></tr>
 <tr><td><b>Menú de navegación</b></td><td>Arriba (horizontal) o lateral</td><td><code>nav</code></td></tr>
 <tr><td><b>Buscador</b></td><td>Arriba a la derecha</td><td><code>form</code> + <code>input type="search"</code></td></tr>
 <tr><td><b>Migas de pan</b> (breadcrumbs)</td><td>Bajo el menú: Inicio › Sección › Página</td><td><code>nav</code> + lista</td></tr>
 <tr><td><b>Banner / hero</b> y llamada a la acción (CTA)</td><td>Parte superior del contenido</td><td><code>section</code>, botón</td></tr>
 <tr><td><b>Contenido principal</b></td><td>Centro</td><td><code>main</code>, <code>article</code>, <code>section</code></td></tr>
 <tr><td><b>Barra lateral</b></td><td>Izquierda o derecha</td><td><code>aside</code></td></tr>
 <tr><td><b>Pie de página</b>: contacto, aviso legal, mapa del sitio, redes</td><td>Abajo</td><td><code>footer</code></td></tr></table>
 <p>Elementos que aparecen dentro: texto, imágenes, enlaces, iconos, formularios, tablas, multimedia (audio, vídeo) y elementos interactivos.</p>`],
 ['wire']
]},
{id:'r3', t:'Clasificar sitios web según su objetivo', star:true, items:[
 ['html', `<div class="box w"><b>⭐ Actividad evaluada:</b> «Busca 10 ejemplos de páginas web y clasifícalas según el objetivo de cada web».</div>
 <table><tr><th>Tipo (objetivo)</th><th>Qué busca</th><th>Ejemplos</th></tr>
 <tr><td><b>Corporativa / empresa</b></td><td>Dar a conocer una empresa, su imagen y servicios</td><td>web de Telefónica, Inditex</td></tr>
 <tr><td><b>Comercio electrónico</b></td><td>Vender productos online</td><td>Amazon, PcComponentes, Zara</td></tr>
 <tr><td><b>Informativa / noticias</b></td><td>Publicar información actualizada</td><td>El País, RTVE, AEMET</td></tr>
 <tr><td><b>Institucional / administración</b></td><td>Servicios y trámites públicos</td><td>Agencia Tributaria, comunidad.madrid</td></tr>
 <tr><td><b>Educativa / e-learning</b></td><td>Enseñar, cursos, plataformas</td><td>Moodle (aula virtual), W3Schools, Khan Academy</td></tr>
 <tr><td><b>Red social / comunidad</b></td><td>Relacionarse y compartir</td><td>Instagram, LinkedIn</td></tr>
 <tr><td><b>Foro / preguntas y respuestas</b></td><td>Resolver dudas entre usuarios</td><td>Stack Overflow, Reddit</td></tr>
 <tr><td><b>Blog / personal / portfolio</b></td><td>Opinión, diario, mostrar trabajos</td><td>blog personal, portfolio en github.io</td></tr>
 <tr><td><b>Entretenimiento / ocio</b></td><td>Divertir: vídeo, música, juegos</td><td>Netflix, YouTube, Spotify</td></tr>
 <tr><td><b>Servicios / herramientas web</b></td><td>Hacer una tarea online</td><td>Google Maps, Booking, banca online</td></tr>
 <tr><td><b>Wiki / enciclopedia</b></td><td>Conocimiento colaborativo</td><td>Wikipedia</td></tr>
 <tr><td><b>Buscador / portal</b></td><td>Encontrar o agrupar información</td><td>Google, Yahoo</td></tr></table>
 <p class="xs mute">Otras clasificaciones que puede pedir el profesor: por <b>contenido</b> (estática / dinámica), por <b>acceso</b> (pública / intranet / extranet) o por <b>tecnología</b> (HTML estático, CMS, aplicación web).</p>`],
 ['classify', 'webs']
]},
{id:'r4', t:'Aplicaciones de desarrollo web: identificar, clasificar y combinar', star:true, items:[
 ['html', `<table><tr><th>Tipo</th><th>Para qué</th><th>Ejemplos</th></tr>
 <tr><td><b>Editores de código</b></td><td>Escribir HTML/CSS/JS con resaltado, autocompletado y extensiones</td><td>VS Code, Sublime Text, Notepad++, Vim</td></tr>
 <tr><td><b>IDE</b></td><td>Entorno completo: depurador, proyectos, servidor</td><td>WebStorm, NetBeans, Eclipse, IntelliJ</td></tr>
 <tr><td><b>Editores WYSIWYG</b> («lo que ves es lo que obtienes»)</td><td>Diseñar visualmente sin escribir código</td><td>Dreamweaver, BlueGriffon, Pinegrow</td></tr>
 <tr><td><b>CMS</b> (gestores de contenidos)</td><td>Crear y administrar webs sin programar</td><td>WordPress, Joomla, Drupal, PrestaShop</td></tr>
 <tr><td><b>Frameworks y librerías CSS</b></td><td>Componentes y rejillas ya hechos</td><td>Bootstrap, W3.CSS, Tailwind</td></tr>
 <tr><td><b>Prototipado / wireframes</b></td><td>Bocetos y prototipos navegables</td><td>Figma, Pencil, Balsamiq, Moqups, Adobe XD</td></tr>
 <tr><td><b>Edición gráfica</b></td><td>Imágenes, iconos, logotipos</td><td>GIMP, Photoshop, Inkscape, Illustrator</td></tr>
 <tr><td><b>Navegadores + herramientas de desarrollo</b></td><td>Probar e inspeccionar</td><td>Firefox, Chrome, Edge, Safari (F12)</td></tr>
 <tr><td><b>Validadores y comprobación</b></td><td>Revisar estándares y compatibilidad</td><td>validator.w3.org, validador CSS, Can I use, browserling</td></tr>
 <tr><td><b>Transferencia y publicación</b></td><td>Subir la web al servidor</td><td>FileZilla (FTP), hosting, GitHub Pages</td></tr>
 <tr><td><b>Control de versiones</b></td><td>Historial y trabajo en equipo</td><td>Git, GitHub</td></tr>
 <tr><td><b>Generadores online</b></td><td>Generar código CSS</td><td>generador flex, generador de tablas, Google Fonts</td></tr></table>
 <div class="box t"><b>Combinar</b> = elegir una herramienta de cada fase. Ejemplo de flujo: <b>Figma</b> (prototipo) → <b>GIMP</b> (recortar y exportar imágenes ligeras) → <b>VS Code</b> + <b>Bootstrap</b> (código) → <b>Firefox F12</b> (probar) → <b>validador W3C</b> → <b>Git/GitHub Pages</b> (publicar).</div>`],
 ['classify', 'apps']

{id:'r5', t:'Navegadores, versiones y compatibilidad', star:true, items:[
 ['html', `<div class="box w"><b>⭐ Actividad (versionesNavegadores):</b> buscar la versión de Firefox, Chrome, Safari y Explorer y comparar en html5test.com si soportan lo mismo.</div>
 <table><tr><th>Navegador</th><th>Empresa</th><th>Motor de renderizado</th><th>Notas</th></tr>
 <tr><td>Chrome</td><td>Google</td><td><b>Blink</b></td><td>El más usado. Edge, Opera y Brave también usan Blink.</td></tr>
 <tr><td>Firefox</td><td>Mozilla</td><td><b>Gecko</b></td><td>Código abierto; el de clase (Linux).</td></tr>
 <tr><td>Safari</td><td>Apple</td><td><b>WebKit</b></td><td>En iPhone todos los navegadores usaban WebKit.</td></tr>
 <tr><td>Edge</td><td>Microsoft</td><td>Blink (desde 2020)</td><td>Sustituyó a Internet Explorer.</td></tr>
 <tr><td>Internet Explorer</td><td>Microsoft</td><td>Trident</td><td><b>Retirado</b> (fin de soporte en junio de 2022): no soporta HTML5/CSS3 modernos (flex parcial, sin grid moderno).</td></tr></table>
 <ul><li><b>Cómo ver la versión</b>: menú Ayuda → Acerca de (Firefox: <code>about:support</code>; Chrome: <code>chrome://version</code>). Chrome y Firefox sacan versión nueva cada ~4 semanas, así que el número cambia continuamente: anota la fecha en la que lo consultas.</li>
 <li><b>¿Soportan lo mismo?</b> No del todo: cada motor implementa las novedades a su ritmo. Para comprobarlo: <b>caniuse.com</b> (tabla de compatibilidad por propiedad) y html5test.com (puntuación global; ojo, ya no se actualiza).</li>
 <li>Por eso el tema pide <b>probar en varios navegadores</b> (browserling.com), usar prefijos cuando hace falta (<code>-webkit-mask</code> en el ejercicio de máscara) y aplicar <b>mejora progresiva</b>: la página funciona en todos y se ve mejor en los modernos.</li></ul>`]
]},
{id:'r6', t:'Criterios de un buen diseño (actividad de puntuar webs)', star:true, items:[
 ['html', `<div class="box w"><b>⭐ Actividad:</b> elegir una web con buen diseño, argumentar por parejas y puntuar de 0 a 5: estructura, colores, iconos, tipografía, animaciones, facilidad de navegación y visionado de contenidos.</div>
 <table><tr><th>Criterio</th><th>Qué mirar (para argumentar)</th></tr>
 <tr><td><b>Estructura</b></td><td>Zonas claras (cabecera, menú, contenido, pie), jerarquía visual, alineación en rejilla, espacio en blanco.</td></tr>
 <tr><td><b>Colores</b></td><td>Paleta reducida (2-3 colores + neutros), contraste suficiente texto/fondo, coherencia con la marca, colores con significado (rojo error, verde ok).</td></tr>
 <tr><td><b>Iconos</b></td><td>Reconocibles (convenciones: lupa = buscar, casa = inicio), mismo estilo, acompañados de texto si hay duda.</td></tr>
 <tr><td><b>Tipografía</b></td><td>Pocas fuentes (1-2), tamaño legible (≥16 px en texto), interlineado ~1,5, jerarquía con h1-h3.</td></tr>
 <tr><td><b>Animaciones</b></td><td>Suaves, con propósito (indicar estado, guiar), que no distraigan ni ralenticen.</td></tr>
 <tr><td><b>Facilidad de navegación</b></td><td>Menú visible y consistente, migas de pan, buscador, siempre saber dónde estás (y volver a inicio).</td></tr>
 <tr><td><b>Visionado de contenidos</b></td><td>Se lee bien en móvil y escritorio (responsive), imágenes optimizadas, carga rápida, contenido importante arriba.</td></tr></table>`],
 ['rubric']
]},
{id:'r7', t:'Usabilidad: conceptos clave', star:true, items:[
 ['html', `<dl class="defs">
 <dt>Usabilidad (ISO/IEC 9241)</dt><dd>Grado de <b>eficacia, eficiencia y satisfacción</b> con la que un producto permite alcanzar objetivos a unos usuarios en un contexto de uso. (ISO/IEC 9126: capacidad de ser comprendido, aprendido, usado y atractivo).</dd>
 <dt>Atributos</dt><dd><b>Objetivos</b> (medibles): eficacia (errores) y eficiencia (tiempo). <b>Subjetivo</b>: satisfacción (se pregunta al usuario).</dd>
 <dt>Utilidad</dt><dd>Los usuarios no buscan usabilidad sino <b>utilidad</b>: algo es usable si el beneficio compensa el esfuerzo.</dd>
 <dt>Accesibilidad</dt><dd>Que <b>todas las personas</b> puedan acceder en igualdad de condiciones, sea cual sea su tecnología o discapacidad.</dd>
 <dt>Arquitectura de la información (AI)</dt><dd>Organizar, clasificar y rotular los contenidos para que el usuario encuentre la información. Se define en las <b>primeras etapas</b>.</dd>
 <dt>Experiencia de usuario (UX)</dt><dd>Sensaciones y emociones que genera la interfaz durante la interacción.</dd>
 <dt>Diseño centrado en el usuario (DCU)</dt><dd>Proceso de diseño conducido por el usuario: sus necesidades, características e intereses.</dd></dl>
 <p>Ventajas: mejor calidad, menos costes de mantenimiento y de producción (ejemplo del curso: IBM aumentó sus ventas un 400 % tras un rediseño centrado en la usabilidad).</p>`]
]},
{id:'r8', t:'Conocer al usuario: cómo ve, piensa y actúa', star:false, items:[
 ['html', `<div class="grid g3"><div class="card"><b>👁 Cómo ve</b><p>Escanea buscando lo que destaca: lo <b>inusual</b> (tamaño, color, orientación, movimiento) atrae la atención. Por eso ignoramos lo que parece publicidad («ceguera a los banners»).</p></div>
 <div class="card"><b>🧠 Cómo piensa</b><p>Cada usuario tiene su <b>mapa mental</b>: hay que clasificar los contenidos como lo haría él (no como la empresa). El significado depende del contexto (un enlace «Archivos»).</p></div>
 <div class="card"><b>✋ Cómo actúa</b><p>Usa el sistema <b>intuitivo</b> (rápido, emocional, con errores) más que el racional: hace clic en la primera opción que parece buena sin leer todas. Solución: menos opciones agrupadas bajo rótulos claros.</p></div></div>
 <figure class="card" style="max-width:420px">${'IMG:principios-disenio-visual'}<figcaption>De la complejidad a la simplicidad visual: 1) <b>Enfatizar</b> lo relevante (jerarquía), 2) <b>Organizar</b> (relaciones visuales lógicas, los enlaces todos iguales), 3) <b>Hacer reconocible</b> (iconos y rótulos que se entienden sin esfuerzo).</figcaption></figure>`],
 ['lab', {id:'jer', title:'Diseño visual en CSS: dale jerarquía a esta tarjeta', h:230, ctl:[{sel:'h2', prop:'font-size', vals:['14px','28px']},{sel:'.precio', prop:'color', vals:['inherit','#c0362c']},{sel:'.btn', prop:'background', vals:['#ddd','#1f6feb']},{sel:'.card', prop:'padding', vals:['0','20px']}],

{id:'r9', t:'Evitar errores y simplicidad', star:false, items:[
 ['html', `<div class="grid g2"><div><ol><li><b>Limitar posibilidades</b>: menos opciones, menos errores (desplegables en vez de texto libre).</li><li><b>Orientar</b> al usuario: mostrar opciones paso a paso o mensajes de ayuda.</li><li><b>Solicitar confirmación</b> antes de acciones irreversibles.</li><li><b>Evitar la pérdida de información</b>: tras un error no obligar a reescribir.</li><li><b>Permitir deshacer</b> (anterior/siguiente).</li><li><b>Solución automática</b>: «Quizás quisiste decir…».</li><li><b>Mensajes de error para humanos</b>: claros y con solución.</li></ol></div>
 <div class="grid g2" style="gap:8px">${'IMG:did-you-mean'}${'IMG:confirmar'}${'IMG:mensaje-error'}${'IMG:anterior-siguiente'}</div></div>
 <p><b>Simplicidad</b>: <b>reducción</b> (si quitas algo y no se nota, sobraba), <b>espacios vacíos</b> que guían la atención, equilibrio entre nº de funciones y usabilidad (más funciones = parece más capaz pero menos usable), y organizar, clasificar u ordenar.</p>
 <div class="grid g2"><figure>${'IMG:google-abril-1999'}<figcaption>Google en 1999: espacio vacío, una sola tarea.</figcaption></figure><figure>${'IMG:yahoo-abril-1999'}<figcaption>Yahoo en 1999: todo a la vez, nada destaca.</figcaption></figure></div>`]
]},
{id:'r10', t:'Metodología DCU: fases y subfases', star:true, items:[
 ['html', `<ol><li><b>Planificación</b>: recoger y analizar información (requisitos, usuarios, objetivos).</li>
 <li><b>Diseño</b>, con subfases: <b>modelado de usuario</b> (personas + escenarios) · <b>diseño conceptual</b> (organización y navegación = arquitectura de información, sin apariencia) · <b>diseño de interacción</b> (qué acciones y cómo responde el sitio) · <b>diseño visual</b> (composición, aspecto de los elementos, multimedia) · <b>definición de estilo</b> (guía de estilo para mantener coherencia) · <b>diseño de contenidos</b>.</li>
 <li><b>Prototipado</b>: baja fidelidad (boceto, wireframe) y alta fidelidad.</li><li><b>Evaluación</b>: métodos de inspección y de test.</li><li><b>Implementación y lanzamiento</b>: validadores de código y de accesibilidad.</li><li><b>Mantenimiento y seguimiento</b>: rediseños sutiles para no desorientar a los usuarios habituales.</li></ol>
 <div class="grid g2"><div class="card"><b>Persona</b>: arquetipo de usuario con identidad inventada (nombre, edad, foto, descripción) pero atributos reales de la audiencia. El <b>escenario</b> describe una situación concreta de uso. Sirven para que el diseñador no se imagine a sí mismo como usuario.</div>
 <div class="card"><b>Diseño de contenidos</b>: estructura piramidal (lo importante primero), un párrafo = una idea, conciso, vocabulario del usuario, encabezados h1-h3 para escanear, tono cercano y respetuoso.</div></div>
 <div class="grid g2"><figure>${'IMG:prototipo'}<figcaption>Prototipo (wireframe) de un blog.</figcaption></figure><figure>${'IMG:disenio-interaccion'}<figcaption>Diagrama de diseño de interacción (flujo entre páginas).</figcaption></figure></div>
 <p><b>Variables para evaluar la usabilidad</b>: facilidad de <b>aprendizaje</b> (primera vez), <b>eficacia</b> (% tareas completadas), facilidad de <b>recuerdo</b> (tras un tiempo sin usarla), <b>eficiencia</b> (tiempo, errores, clics) y <b>satisfacción</b> (¿lo recomendaría?).</p>`]
]},
{id:'r11', t:'Los 10 principios de usabilidad de Jakob Nielsen', star:true, items:[
 ['html', `<ol class="cols2"><li><b>Visibilidad del estado del sistema</b>: informar de lo que pasa (barra de progreso al adjuntar).</li><li><b>Adecuación al mundo real</b>: lenguaje del usuario, sin tecnicismos.</li><li><b>Libertad y control</b>: salidas de emergencia (saltar intro, cancelar).</li><li><b>Consistencia y estándares</b>: mismo estilo; logo arriba izquierda enlazando a inicio, menú arriba, pie con mapa.</li><li><b>Prevención de errores</b>: mejor que un buen mensaje de error.</li><li><b>Reconocimiento antes que recuerdo</b>: opciones visibles, no obligar a memorizar.</li><li><b>Flexibilidad y eficiencia</b>: fácil para novatos, atajos para expertos.</li><li><b>Diseño estético y minimalista</b>: nada irrelevante.</li><li><b>Ayudar a reconocer, diagnosticar y recuperarse de errores</b>: causa clara + solución, conservar lo escrito.</li><li><b>Ayuda y documentación</b>: si hace falta, fácil de encontrar.</li></ol>`],
 ['classify', 'nielsen']
]},
{id:'r12', t:'Técnicas de evaluación + card sorting', star:true, items:[
 ['html', `<table><tr><th>Técnica</th><th>En qué consiste</th><th>Datos clave</th></tr>
 <tr><td><b>Card sorting</b></td><td>Los participantes agrupan tarjetas de conceptos por similitud → arquitectura de información según su modelo mental.</td><td><b>Abierto</b> (sin categorías, ellos las crean: descubrir) antes que <b>cerrado</b> (con categorías: evaluar). Etapas tempranas.</td></tr>
 <tr><td><b>Evaluación heurística</b></td><td>Expertos revisan el sitio con principios (Nielsen).</td><td><b>3–5 evaluadores</b> independientes + informe común. Rápida y barata; encuentra problemas menores; no sustituye al test.</td></tr>
 <tr><td><b>Test de usuarios</b></td><td>Observar a usuarios reales haciendo tareas.</td><td>≈15 participantes, mejor <b>3 rondas de 5</b>. «Test de 5 segundos», pensar en voz alta. Más caro y fiable; después de la heurística.</td></tr>
 <tr><td><b>Eye-tracking</b></td><td>Registrar dónde y cuánto miran.</td><td>Caro; solo sobre diseños elaborados.</td></tr>
 <tr><td><b>Feedback</b></td><td>Opinión del usuario: pasiva (mensajes) o activa (encuestas, entrevistas).</td><td>Indica problemas, no soluciones. Preguntar por problemas, no por preferencias.</td></tr>
 <tr><td><b>Analítica web</b></td><td>Datos de uso reales (páginas vistas, rutas, horas, búsquedas).</td><td>Solo con el sitio publicado; barata y sin sesgo.</td></tr>
 <tr><td><b>Test A/B</b></td><td>Dos versiones a la vez, el tráfico se reparte; gana la que más convierte.</td><td>Sobre sitios publicados.</td></tr></table>

{id:'r13', t:'«No me hagas pensar» (Steve Krug): ideas clave', star:false, items:[
 ['html', `<ul><li><b>Primera ley</b>: una página debe ser <b>evidente por sí misma</b>; si no, al menos autoexplicativa. Cada duda («¿esto es un enlace?», «¿dónde estoy?») suma esfuerzo.</li>
 <li>Los usuarios <b>no leen, escanean</b>; no eligen la mejor opción sino la primera razonable («satisficing»), y <b>se las apañan</b> sin entender cómo funciona.</li>
 <li>Diseña para escanear: <b>jerarquía visual clara</b>, convenciones, zonas bien definidas, que lo clicable sea evidente, menos ruido.</li>
 <li><b>Elimina palabras innecesarias</b>: textos de bienvenida e instrucciones que nadie lee.</li>
 <li><b>Navegación persistente</b> en todas las páginas: identificador del sitio, botón de inicio, secciones, buscador, utilidades. Nombre de página visible y migas de pan; las <b>pestañas</b> son una buena metáfora.</li>
 <li>«<b>Test del maletero</b>»: en cualquier página, ¿sabes qué sitio es, en qué página estás, cuáles son las secciones principales y dónde estás dentro de ellas?</li>
 <li>La página de inicio debe responder: ¿qué es esto?, ¿qué puedo hacer aquí?, ¿por qué aquí?</li>
 <li><b>Pruebas de usabilidad baratas</b> y frecuentes: pocos usuarios (3) con frecuencia valen más que un gran estudio al final.</li>
 <li>Cortesía con el usuario: no esconder información que busca (precios, contacto), no pedir datos innecesarios.</li></ul>`]
]},
{id:'r14', t:'Color y tipografía para la interfaz', star:false, items:[
 ['html', `<div class="grid g2"><div><p><b>Colores</b>: primarios, secundarios y terciarios (círculo cromático); <b>cálidos</b> (rojo, naranja, amarillo: energía, cercanía, llaman la atención) y <b>fríos</b> (azul, verde: calma, confianza, profesionalidad). Elegir la clasificación según el mapa mental del usuario (ejemplo del curso).</p><ul><li>Paleta: un color principal, uno de acento y neutros.</li><li><b>Contraste</b> suficiente texto/fondo (accesibilidad: WCAG pide 4,5:1 en texto normal).</li><li>No transmitir información solo con el color.</li></ul></div><figure>${'IMG:colores'}<figcaption>Dos formas de clasificar los colores.</figcaption></figure></div>
 <p><b>Tipografía</b>: <b>serif</b> (con remates, p. ej. Georgia: tradición, impresos), <b>sans-serif</b> (sin remates, p. ej. Arial, Roboto: pantallas, modernidad), <b>monospace</b> (código), decorativas (solo títulos). Máximo 2 familias, tamaño ≥ 16 px, interlineado 1,4–1,6, líneas de 60–80 caracteres. Google Fonts con <code>&lt;link&gt;</code> + <code>font-family</code> (actividad cartas).</p>`]
]}
];

      const [rr, q, o, e] = Q[k]; const ord = shuffle(o.map((_, i) => i));
      $('#rvB').innerHTML = `<div class="card"><div class="prog"><i style="width:${k / Q.length * 100}%"></i></div><p class="mute xs">${k + 1}/${Q.length} · ${rr === 'F' ? 'Fundamentos' : rr}</p><h4 style="font-size:18px">${esc(q)}</h4>${ord.map(i => `<button class="btn choice" data-o="${i}">${esc(o[i])}</button>`).join('')}<div id="rvE"></div></div>`;
      $$('#rvB [data-o]').forEach(b => b.onclick = () => { if ($('#rvE').innerHTML) return; const g = +b.dataset.o === 0; if (g) ok++; b.classList.add(g ? 'right' : 'wrong'); $('#rvB [data-o="0"]').classList.add('right');
        $('#rvE').innerHTML = `${e ? `<div class="box ${g ? 't' : 'x'} xs">${esc(e)}</div>` : ''}<button class="btn p" id="rvN">Siguiente →</button>`; $('#rvN').onclick = () => { k++; show(); }; }); };
    show(); };
  const cards = r => { const L = shuffle(FC.filter(c => !r || c[0] === r)); let i = 0;
    $('#rvB').innerHTML = `<div class="card" style="max-width:640px;margin:auto"><div class="flip" id="fl"><div class="in"><div class="f" id="flF"></div><div class="b" id="flB"></div></div></div><div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn" id="flP">←</button><span class="pill" id="flN"></span><button class="btn p" id="flX">→</button></div><p class="xs mute" style="text-align:center">Pulsa la tarjeta para girarla.</p></div>`;
    const sh = () => { $('#fl').classList.remove('on'); $('#flF').textContent = L[i][1]; $('#flB').textContent = L[i][2]; $('#flN').textContent = `${i + 1} / ${L.length}`; };
    $('#fl').onclick = () => $('#fl').classList.toggle('on'); $('#flX').onclick = () => { i = (i + 1) % L.length; sh(); }; $('#flP').onclick = () => { i = (i - 1 + L.length) % L.length; sh(); }; sh(); };
  run();
}
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
go((location.hash || '').slice(1) || store.get('tab', 'fund'));

</script>
