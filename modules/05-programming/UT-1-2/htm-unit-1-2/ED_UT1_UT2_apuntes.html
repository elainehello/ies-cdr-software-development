<style>
:root{
 --bg:#f6f4ee;--paper:#fffdf8;--ink:#1d2433;--muted:#5d6676;--line:#d9d4c7;--accent:#2f5bd3;--accent2:#e9efff;
 --red:#c8322b;--green:#1f8a4c;--greenbg:#e5f5ea;--redbg:#fbe7e5;--amber:#b45309;--amberbg:#fff1dc;--violet:#7a2fb8;--violetbg:#f3e8ff;
 --term:#1e1e2e;--termink:#e6e6e6;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#14171d;--paper:#1c2028;--ink:#e7e9ee;--muted:#9aa3b2;--line:#353b47;--accent:#7ea2ff;--accent2:#232c42;
 --red:#ff7a70;--green:#5fd18f;--greenbg:#183324;--redbg:#3a1d1b;--amber:#f5b25b;--amberbg:#3a2a12;--violet:#c4a1ff;--violetbg:#2c2140;--term:#0d0f14;
}}
:root[data-theme="dark"]{
 --bg:#14171d;--paper:#1c2028;--ink:#e7e9ee;--muted:#9aa3b2;--line:#353b47;--accent:#7ea2ff;--accent2:#232c42;
 --red:#ff7a70;--green:#5fd18f;--greenbg:#183324;--redbg:#3a1d1b;--amber:#f5b25b;--amberbg:#3a2a12;--violet:#c4a1ff;--violetbg:#2c2140;--term:#0d0f14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 16px 6px;max-width:1180px;margin:auto}header h1{margin:0;font-size:1.55rem}header p{margin:4px 0 0;color:var(--muted)}
nav#tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;max-width:1180px;margin:auto;border-bottom:1px solid var(--line)}
nav#tabs .grp{align-self:center;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 8px}

main{max-width:1180px;margin:auto;padding:16px}
button,select,input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:0;max-width:100%}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 8px;font-size:1.3rem}h3{margin:16px 0 6px;font-size:1.05rem}
.lead{color:var(--muted);margin:0 0 12px}.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
code{font-family:var(--mono);font-size:.9em;background:var(--accent2);padding:1px 5px;border-radius:5px}
pre{font-family:var(--mono);font-size:.86rem;background:var(--term);color:var(--termink);border-radius:10px;padding:12px 14px;overflow-x:auto;line-height:1.5;margin:8px 0}
pre .c{color:#7fd1a8}pre .p{color:#8ab4ff}pre .k{color:#f5b25b}pre .o{color:#a7a7b8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{background:var(--accent2);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0}
.warn{background:var(--amberbg);border-left:4px solid var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0}
.exam{background:var(--violetbg);border-left:4px solid var(--violet);border-radius:10px;padding:10px 14px;margin:10px 0}.exam>b:first-child{color:var(--violet)}
.bad{background:var(--redbg);border-left:4px solid var(--red);border-radius:10px;padding:10px 14px;margin:10px 0}
.good{background:var(--greenbg);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px;margin:10px 0}
table.tb{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.tb th{background:var(--bg)}
.tscroll{overflow-x:auto}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.toc a{font-size:.86rem;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:var(--paper)}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}.card h4{margin:0 0 4px}
.card p{margin:4px 0;font-size:.92rem}
.pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:20px;padding:1px 8px;margin:1px 2px 1px 0}
.pl{background:var(--greenbg);color:var(--green)}.pp{background:var(--redbg);color:var(--red)}.pn{background:var(--accent2);color:var(--accent)}
/* flujos */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:10px 0}
.flow .st{flex:1 1 140px;border-radius:10px;padding:10px;border:2px solid;font-size:.88rem;background:var(--paper)}

.s1{border-color:#3d8bd8}.s2{border-color:#22c55e}.s3{border-color:#d4a72c}.s4{border-color:#e05252}.s5{border-color:#8b5cf6}.s6{border-color:#0f766e}
/* diagramas */

svg.dia text{font-family:system-ui,sans-serif;fill:#1d2433}
.diabox{background:#fffefa;border:1px dashed var(--line);border-radius:12px;padding:8px}
/* interactivos */
.in{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted)}
.in input{width:120px;font-family:var(--mono)}

.res div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.res b{display:block;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.res span{font-family:var(--mono);font-size:1.05rem}
table.cmp td,table.cmp th{font-size:.9rem}
table.cmp td.code{font-family:var(--mono);white-space:pre}
.chk{display:flex;gap:4px;flex-wrap:wrap}.chk button{padding:3px 8px;font-size:.82rem}
.chk button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
tr.ok td{background:var(--greenbg)}tr.ko td{background:var(--redbg)}
.sol{font-size:.85rem;color:var(--muted)}
/* revisión */
.rev{display:grid;gap:8px}.rev .it{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--bg)}
.rev .ic{font-size:1.1rem;line-height:1.4}
.score{display:inline-block;font-weight:800;border-radius:8px;padding:2px 10px;background:var(--accent2);color:var(--accent)}
/* kanban mini */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.kb .col{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.kb .col h5{margin:0 0 6px;font-size:.85rem;display:flex;justify-content:space-between}
.kb .t{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.8rem;margin-bottom:4px;cursor:pointer}
.kb .col.full{border-color:var(--red)}
/* flashcards / test */
.fc-wrap{perspective:1200px;max-width:640px;margin:10px auto}
.fc{position:relative;min-height:230px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc .front{background:var(--paper);font-size:1.15rem;font-weight:600}.fc .back{background:var(--accent2);transform:rotateY(180deg)}
.fc .cat{position:absolute;top:10px;left:14px;font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase}
.track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}.bar{height:100%;background:var(--accent);transition:width .3s}
.opts{display:grid;gap:8px;margin-top:10px}.opt{text-align:left;padding:10px 14px}
.opt.right{background:var(--greenbg);border-color:var(--green)}.opt.wrong{background:var(--redbg);border-color:var(--red)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.big{font-size:3rem;font-weight:800;color:var(--accent);text-align:center}
.badge{display:inline-block;background:var(--accent2);color:var(--accent);font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:20px}
@media (max-width:760px){.grid2,.grid3,.grid4,.kb{grid-template-columns:1fr}.panel{padding:14px}.flow .ar{display:none}}
@media print{nav#tabs,.noprint{display:none}body{background:#fff}.panel{box-shadow:none;break-inside:avoid}section[hidden]{display:block!important}}

<body>
<header>
 <h1>Entornos de Desarrollo · UT1 y UT2</h1>
 <p>Módulo 0487 · Desarrollo de software (UT1) e Instalación y uso de IDE (UT2): apuntes, metodologías ágiles, ejercicios resueltos, revisión de tus prácticas, flashcards y test.</p>
</header>
<nav id="tabs" role="tablist"></nav>
<main>
<section id="v-ut1"></section>
<section id="v-agil" hidden></section>
<section id="v-ut2" hidden></section>
<section id="v-ej" hidden></section>
<section id="v-rev" hidden></section>
<section id="v-fc" hidden></section>
<section id="v-test" hidden></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toc = list => `<div class="toc">${list.map(([id, t]) => `<a href="#${id}">${t}</a>`).join("")}</div>`;

// =====================================================================
//  UT1
// =====================================================================
function renderUT1() {
 $("v-ut1").innerHTML = toc([["u1-sw", "Software"], ["u1-lic", "Distribución y licencias"], ["u1-cal", "Calidad y métricas"], ["u1-hw", "Hardware y UC"], ["u1-cod", "Tipos de código"], ["u1-len", "Lenguajes"], ["u1-comp", "Compilación"], ["u1-ciclo", "Ciclo de vida"], ["u1-mod", "Modelos"], ["u1-case", "CASE y frameworks"]]) + `
 <div class="panel" id="u1-sw"><h2>1. Software y programa</h2>
  <div class="grid2">
   <div><p><b>Software</b>: conjunto de componentes <b>lógicos</b> que hacen posible realizar tareas específicas en un sistema informático. Actúa sobre el <b>hardware</b> y lo necesita para ejecutarse.</p>
    <p><b>Programa</b>: conjunto de <b>instrucciones</b> escritas en un lenguaje de programación que indican a la máquina qué operaciones ejecutar sobre unos datos.</p></div>
   <div class="key"><b>Objetivos de la unidad</b><ul style="margin:4px 0"><li>Relacionar los programas con los componentes del sistema.</li><li>Diferenciar código <b>fuente, objeto y ejecutable</b>.</li><li>Identificar las <b>fases</b> de desarrollo.</li><li>Clasificar los <b>lenguajes</b> de programación.</li></ul></div>
  </div>
  <h3>Taxonomía del software</h3>
  <div class="tscroll"><table class="tb"><tr><th>Criterio</th><th>Tipos</th></tr>
   <tr><td><b>Según su función / uso</b></td><td><b>Sistemas</b>: SO, drivers, BIOS, gestión de redes; mucha interacción con el hardware. · <b>Programación</b>: editores, compiladores. · <b>Aplicación</b>: resuelve problemas de negocio o de usuario (ofimática, navegadores, ERP Odoo).</td></tr>
   <tr><td><b>Según su ámbito</b></td><td><b>Ingeniería / ciencias</b>: algoritmos y simulación (clima). · <b>Incrustado o embebido</b>: dentro de un producto (termostato, coche). · <b>Línea de producto</b>: funcionalidad para el consumidor. · <b>Web / nube / IA</b>: móvil, Google Cloud, redes neuronales.</td></tr>
   <tr><td><b>Según su distribución</b></td><td><b>Shareware</b> (prueba por tiempo) · <b>Freeware</b> (gratis con restricciones) · <b>Adware</b> (gratis con publicidad).</td></tr>
   <tr><td><b>Según su licencia</b></td><td><b>Libre</b> · <b>Propietario</b> · <b>Dominio público</b>.</td></tr></table></div>
 </div>

 <div class="panel" id="u1-lic"><h2>2. Distribución y licencias</h2>
  <div class="grid3">
   <div class="card"><h4>Shareware</h4><p>Gratis durante un <b>periodo de prueba</b>; después hay que comprarlo o dejar de usarlo (WinZip, WinRAR).</p></div>
   <div class="card"><h4>Freeware</h4><p>Totalmente <b>gratuito</b>, pero normalmente <b>no se puede modificar</b> su código.</p></div>
   <div class="card"><h4>Adware</h4><p>Gratuito pero muestra <b>publicidad</b> mientras no compres la licencia.</p></div>
  </div>
  <p>Una <b>licencia</b> es un contrato entre desarrollador y usuario con derechos y deberes.</p>
  <div class="grid3">
   <div class="card"><h4>Software libre · 4 libertades</h4><p>0. <b>Usar</b> con cualquier fin.<br>1. <b>Estudiar y adaptar</b> el código.<br>2. <b>Distribuir</b> copias.<br>3. <b>Mejorar</b> y publicar las mejoras.</p></div>
   <div class="card"><h4>Propietario</h4><p>Se distribuye en <b>binario</b>, sin código fuente. Prohíbe copia, modificación o redistribución.</p></div>
   <div class="card"><h4>Dominio público</h4><p><b>Sin derechos de autor</b>: el autor renunció o los derechos caducaron.</p></div>
  </div>
  <div class="warn"><b>¡No confundir!</b> <b>Freeware</b> habla del <b>precio</b> (gratis) y <b>libre</b> habla de la <b>libertad</b> (código accesible y modificable). Un programa puede ser gratis y propietario (freeware) o libre y de pago.</div>
 </div>

 <div class="panel" id="u1-cal"><h2>3. Calidad del software y métricas</h2>
  <div class="grid4">${[["Corrección", "Cumple las especificaciones."], ["Fiabilidad", "Pocos fallos en ejecución."], ["Eficiencia", "Buen uso de recursos."], ["Seguridad", "Protege los datos de accesos no autorizados."], ["Usabilidad", "Fácil de aprender y usar."], ["Mantenibilidad", "Fácil de corregir y mejorar."], ["Portabilidad", "Fácil de llevar a otros entornos."], ["Interoperabilidad", "Funciona junto a otros sistemas."]].map(([a, b]) => `<div class="card"><h4>${a}</h4><p>${b}</p></div>`).join("")}</div>
  <h3>Métricas</h3>
  <p>La <b>ingeniería del software</b> pasa del proceso artesanal a procesos industriales que se pueden medir.</p>
  <div class="grid2">
   <div class="key"><b>Orientadas al tamaño (KLDC = miles de líneas de código)</b><br>
    Calidad = <b>errores / KLDC</b><br>Productividad = <b>KLDC / persona-mes</b><br>Coste = <b>€ / KLDC</b></div>
   <div class="key"><b>Puntos de función (PF)</b>: valoran la funcionalidad que se ofrece al usuario<br>
    Calidad = <b>errores / PF</b><br>Productividad = <b>PF / persona-mes</b><br>Coste = <b>€ / PF</b></div>
  </div>
  <div class="exam"><b>Para el examen:</b> en las tres fórmulas, la medida (KLDC o PF) va <b>abajo</b> en calidad y coste, y <b>arriba</b> en productividad. Calidad: <b>menos es mejor</b>. Practica con la calculadora del Ejercicio 1.1.</div>
 </div>

 <div class="panel" id="u1-hw"><h2>4. Hardware, Von Neumann y la unidad de control</h2>
  <div class="grid2">
   <div><p><b>Hardware</b>: componentes físicos y tangibles: monitor, placa base, CPU, RAM, ranuras de expansión, fuente de alimentación, disco duro / SSD y periféricos.</p>
    <h3>Arquitectura de Von Neumann (1945)</h3>
    <ul><li><b>UC</b>: interpreta y ejecuta las instrucciones de la memoria y genera señales de control.</li>
     <li><b>ALU</b>: operaciones aritméticas y comparaciones lógicas.</li>
     <li><b>Registros</b>: memoria muy rápida dentro de la CPU.</li>
     <li><b>Memoria principal (RAM)</b>: instrucciones <b>y</b> datos.</li>
     <li><b>E/S</b>: transferencia entre CPU/memoria y el exterior.</li></ul>
    <p class="muted">En Sistemas Informáticos verás «1946»: en 1945 Von Neumann publicó el informe que describe el modelo, y en 1946 se presentó el diseño del ordenador IAS. Las dos fechas se refieren a lo mismo.</p></div>
   <div><h3>Registros de la UC</h3>
    <table class="tb"><tr><th>Registro</th><th>Contiene</th></tr>
     <tr><td><b>PC</b> · contador de programa</td><td>Dirección de la <b>siguiente</b> instrucción.</td></tr>
     <tr><td><b>IR</b> · registro de instrucción</td><td>La instrucción que se ejecuta <b>ahora</b>.</td></tr>
     <tr><td><b>MAR</b> · registro de dirección de memoria</td><td>La <b>dirección</b> a la que se quiere acceder.</td></tr>
     <tr><td><b>MBR</b> · registro de intercambio de memoria</td><td>El <b>dato</b> leído o que se va a escribir en esa dirección.</td></tr></table>
    <p><b>Decodificador (ID)</b>: analiza la instrucción del IR. · <b>Reloj</b>: marca el ritmo con impulsos. · <b>Secuenciador</b>: genera las órdenes elementales sincronizadas con el reloj.</p></div>
  </div>
  <div class="key"><b>Ciclo de una instrucción</b>: PC → MAR (dirección) → memoria → MBR (instrucción) → IR → decodificador → secuenciador ejecuta → PC + 1.</div>
  <h3>Relación hardware–software</h3>
  <div class="flow"><div class="st s1"><b>Aplicaciones</b>Programas que el hardware interpreta y ejecuta.</div><div class="ar">↕</div><div class="st s2"><b>Sistema operativo</b>Intermediario: coordina el hardware y reparte recursos.</div><div class="ar">↕</div><div class="st s3"><b>Hardware</b>Disco (guarda binarios y datos) · RAM (código en ejecución) · CPU (lee y ejecuta) · E/S.</div></div>
 </div>

 <div class="panel" id="u1-cod"><h2>5. Tipos de código</h2>
  <div class="flow"><div class="st s1"><b>Código fuente</b>Texto legible escrito por personas: <code>.java</code>, <code>.c</code>, <code>.py</code></div><div class="ar">→ compilador →</div>
   <div class="st s3"><b>Código objeto / intermedio</b>Binario <b>no</b> ejecutable directamente por el SO. En Java: <b>bytecode</b> <code>.class</code></div><div class="ar">→ enlazador / JVM →</div>
   <div class="st s4"><b>Código ejecutable</b>Código máquina listo para cargarse en RAM y ejecutarse en la CPU.</div></div>
  <div class="grid2"><div class="key"><b>Compilados</b> (C, C++): la compilación genera directamente el ejecutable para una plataforma concreta.</div>
   <div class="key"><b>Interpretados</b> (JavaScript, PHP, Python): un intérprete ejecuta el código sin generar un ejecutable independiente.</div></div>
  <div class="warn"><b>Java es híbrido:</b> se <b>compila</b> (<code>javac</code>) a bytecode y la JVM lo <b>interpreta</b> (y lo compila al vuelo con JIT). Los apuntes lo colocan entre los interpretados porque no genera un ejecutable nativo; en el examen puedes decir «compilado a bytecode e interpretado por la JVM».</div>
 </div>

 <div class="panel" id="u1-len"><h2>6. Lenguajes de programación</h2>
  <p>Idioma artificial (símbolos + normas) para comunicarnos con el hardware. El lenguaje se <b>elige en el diseño</b> y se <b>usa en la codificación</b>.</p>
  <h3>Evolución: de menor a mayor abstracción</h3>
  <div class="flow"><div class="st s4"><b>Máquina</b>0 y 1. Lo único que entiende el hardware. Depende del procesador.</div><div class="ar">→</div><div class="st s3"><b>Ensamblador</b>Mnemotécnicos (MOV, ADD). Necesita traducción; ligado a la arquitectura.</div><div class="ar">→</div><div class="st s2"><b>Alto nivel</b>Cercano al inglés. Portable. Necesita traducción.</div><div class="ar">→</div><div class="st s1"><b>Entornos visuales</b>Se programa gráficamente y se genera el código.</div></div>
  <h3>Clasificación</h3>
  <div class="tscroll"><table class="tb"><tr><th>Criterio</th><th>Tipos</th><th>Ejemplos</th></tr>
   <tr><td>Traducción</td><td>Compilados · interpretados</td><td>C++ · Python, JavaScript (Java: híbrido)</td></tr>
   <tr><td>Paradigma</td><td><b>Imperativo</b>: dice <b>cómo</b>, paso a paso · <b>Declarativo</b>: dice <b>qué</b></td><td>C, Java · SQL, Prolog, Haskell</td></tr>
   <tr><td>Técnica</td><td>Estructurada · modular · <b>orientada a objetos</b></td><td>C · Java, C++, C#</td></tr></table></div>
  <div class="grid2">
   <div class="card"><h4>Programación estructurada</h4><p>Solo 3 estructuras: <b>secuencial</b>, <b>selectiva</b> (if) y <b>repetitiva</b> (bucles).</p>
    <p><span class="pill pl">+</span>Fácil de leer, rápida, mantenimiento sencillo.<br><span class="pill pp">−</span>Todo en un único bloque; poca reutilización. La sustituyó la <b>modular</b>.</p></div>
   <div class="card"><h4>Programación orientada a objetos (POO)</h4><p><b>Clase</b>: molde (Persona). <b>Objeto</b>: ejemplar concreto (Noa). <b>Atributos</b>: datos (edad). <b>Métodos</b>: acciones (saludar). Los objetos se comunican por <b>mensajes</b> (llamadas a métodos).</p>
    <p><span class="pill pl">+</span>Código reutilizable y errores más fáciles de localizar.</p></div>
  </div>
<pre><span class="k">public class</span> Persona {            <span class="c">// clase</span>
    <span class="k">int</span> edad; String nombre;      <span class="c">// atributos</span>
    <span class="k">void</span> saludar() {               <span class="c">// método</span>
        System.out.println(<span class="p">"Buenos días, soy "</span> + nombre);
    }
}
Persona noa = <span class="k">new</span> Persona();   <span class="c">// objeto</span>
noa.saludar();                   <span class="c">// envío de mensaje</span></pre>
 </div>

 <div class="panel" id="u1-comp"><h2>7. Compilación: las tres fases de análisis</h2>
  <div class="flow"><div class="st s1"><b>Código fuente</b><code>suma = 5 + 3</code></div><div class="ar">→</div>
   <div class="st s2"><b>1. Léxico</b>Identifica <b>símbolos</b> y genera <b>tokens</b>: <code>suma</code> <code>=</code> <code>5</code> <code>+</code> <code>3</code>. Error si un símbolo no existe en el lenguaje.</div><div class="ar">→</div>
   <div class="st s3"><b>2. Sintáctico</b>Revisa la <b>gramática</b>: el orden de los tokens. Construye el <b>árbol sintáctico</b>.</div><div class="ar">→</div>
   <div class="st s4"><b>3. Semántico</b>Revisa el <b>significado</b>: variables declaradas, tipos compatibles. Genera el ejecutable o bytecode.</div></div>
  <p class="muted">Si falla cualquier fase, la compilación se detiene (gestión de errores).</p>
  <div class="tscroll"><table class="tb"><tr><th>Fase</th><th>Pregunta que se hace</th><th>Ejemplo de error en Java</th></tr>
   <tr><td><b>Léxico</b></td><td>¿Existe esta palabra o símbolo?</td><td><code>int x = 5 # 2;</code> → <code>#</code> no es un símbolo de Java</td></tr>
   <tr><td><b>Sintáctico</b></td><td>¿Están bien colocadas?</td><td><code>int x = 5</code> (falta <code>;</code>) · <code>x = = 5;</code></td></tr>
   <tr><td><b>Semántico</b></td><td>¿Tiene sentido?</td><td><code>int x = "hola";</code> (tipos) · <code>y = 3;</code> sin declarar <code>y</code></td></tr></table></div>
  <div class="exam"><b>Truco:</b> léxico = <b>palabras</b>, sintáctico = <b>gramática</b>, semántico = <b>significado</b>. Como en español: «gato el ¿» (léxico), «el come gato» (sintáctico), «el gato pilota un avión» (bien construida pero sin sentido). Practícalo en el Ejercicio 1.2.</div>
 </div>

 <div class="panel" id="u1-ciclo"><h2>8. Desarrollo de software: el ciclo de vida</h2>
  <p>Proceso desde la idea hasta el programa funcionando. <b>Invertir en análisis y diseño</b> evita que los errores se propaguen (cuanto más tarde se detecta un error, más caro es).</p>
  <div class="tscroll"><table class="tb"><tr><th>Fase</th><th>Qué se hace</th><th>Entregable</th></tr>
   <tr><td><b>1. Análisis</b></td><td>Necesidades del cliente y <b>requisitos</b> (funcionales y no funcionales), sin ambigüedades. Estimación de tiempos (Gantt).</td><td><b>ERS</b>: especificación de requisitos software</td></tr>
   <tr><td><b>2. Diseño</b></td><td>Arquitectura, descomposición en módulos, diseño detallado, de datos y de interfaz.</td><td>Documento de diseño + <b>plan de pruebas</b></td></tr>
   <tr><td><b>3. Codificación</b></td><td>Escribir el código (C, Java… y también HTML, XML, JSON) con IDE; <b>pruebas unitarias</b>.</td><td>Código fuente y módulos probados</td></tr>
   <tr><td><b>4. Pruebas</b></td><td><b>Unitarias</b> (cada parte por separado, JUnit) e <b>integración</b> (todo junto). Se comparan resultados obtenidos y esperados.</td><td>Sistema integrado + informe de pruebas</td></tr>
   <tr><td><b>5. Mantenimiento</b></td><td>Control, mejora y optimización tras la implantación.</td><td>Parches y nuevas versiones</td></tr></table></div>
  <div class="grid2">
   <div><h3>Una buena ERS es…</h3><p>Completa · concisa · <b>sin ambigüedades</b> · sin detalles de diseño · entendible por el cliente · separa requisitos <b>funcionales</b> y <b>no funcionales</b> · jerarquizada · con criterios de validación.</p>
    <div class="key"><b>Funcional</b> = <b>qué hace</b> el sistema (dar de alta, consultar, calcular).<br><b>No funcional</b> = <b>cómo es / con qué condiciones</b> (rendimiento, seguridad, hardware, legislación, usabilidad, disponibilidad).</div></div>
   <div><h3>Tipos de mantenimiento</h3>
    <table class="tb"><tr><td><b>Correctivo</b></td><td>Corrige un error.</td></tr><tr><td><b>Perfectivo</b></td><td>Mejora lo que ya hay (rendimiento, funcionalidad).</td></tr><tr><td><b>Evolutivo</b></td><td>El cliente pide mejoras: <b>nuevos requisitos</b>.</td></tr><tr><td><b>Adaptativo</b></td><td>Se adapta a cambios externos: hardware, normativa, mercado.</td></tr></table></div>
  </div>
 </div>

 <div class="panel" id="u1-mod"><h2>9. Modelos de ciclo de vida</h2>
  <div class="grid3">
   <div class="card"><h4>Cascada</h4><p>Secuencial: cada fase termina antes de empezar la siguiente.</p><p><span class="pill pl">+</span>Fácil de planificar. <span class="pill pp">−</span>Inflexible; requisitos 100 % definidos al inicio.</p><p class="muted">Para proyectos pequeños y requisitos estables.</p></div>
   <div class="card"><h4>Cascada con retroalimentación</h4><p>Permite <b>volver a fases anteriores</b> si se detectan errores o pequeños cambios.</p><p><span class="pill pl">+</span>Más flexible. <span class="pill pp">−</span>Costes difíciles de estimar si hay muchos cambios.</p></div>
   <div class="card"><h4>Modelo en V</h4><p>Cada fase de desarrollo tiene su <b>fase de pruebas</b> enfrente.</p><p><b>Verificación</b>: ¿cumple el diseño? («¿lo hemos construido bien?»). <b>Validación</b>: ¿satisface al cliente? («¿hemos construido lo correcto?»).</p></div>
   <div class="card"><h4>Iterativo incremental</h4><p>Versiones parciales que crecen en cada iteración.</p><p><span class="pill pl">+</span>Entregas tempranas y feedback rápido. <span class="pill pp">−</span>Riesgo de que el alcance crezca sin control.</p></div>
   <div class="card"><h4>Espiral (Boehm)</h4><p>4 cuadrantes por vuelta: <b>objetivos → análisis de riesgos → desarrollo → planificación</b>.</p><p><span class="pill pl">+</span>Gestión de riesgos. <span class="pill pp">−</span>Caro y complejo.</p></div>
   <div class="card"><h4>Ágiles: XP, Scrum, Kanban</h4><p><b>XP</b> (Kent Beck): 4 valores: sencillez, comunicación, retroalimentación y valentía; cliente presente y refactorización.</p><p><b>Scrum y Kanban</b>: tableros, iteraciones cortas, reuniones de sincronización y valor continuo. Ver la pestaña «Metodologías ágiles».</p></div>
  </div>
  <h3>Matriz de decisión</h3>
  <table class="tb"><tr><th>Dimensión</th><th>Cascada (tradicional)</th><th>Metodologías ágiles</th></tr>
   <tr><td>Requisitos</td><td>Rígidos, definidos al inicio</td><td>Flexibles, cambian durante el proyecto</td></tr>
   <tr><td>Ejecución de fases</td><td>Secuencial: hay que acabar la anterior</td><td>Solapadas: iteraciones cortas y continuas</td></tr>
   <tr><td>Implicación del cliente</td><td>Al inicio (análisis) y al final (entrega)</td><td>Constante, durante todo el ciclo</td></tr>
   <tr><td>Producto</td><td>Una única entrega final</td><td>Versiones parciales funcionales (incrementos)</td></tr></table>
  <div class="exam"><b>Cómo justificar un modelo</b> (te lo piden en las prácticas): requisitos <b>claros y cerrados</b> → cascada (con retroalimentación si puede haber ajustes); requisitos que <b>cambian</b> o cliente disponible → ágil o incremental; proyecto <b>grande y con riesgo</b> → espiral; pruebas muy importantes → V.</div>
 </div>

 <div class="panel" id="u1-case"><h2>10. Herramientas CASE y frameworks</h2>
  <div class="grid2">
   <div><h3>CASE (Computer Aided Software Engineering)</h3><p>Automatizan fases del desarrollo para reducir costes y tiempo y aumentar la fiabilidad.</p>
    <table class="tb"><tr><td><b>U-CASE</b> (upper)</td><td>Fases iniciales: planificación y análisis de requisitos.</td></tr><tr><td><b>M-CASE</b> (medium)</td><td>Análisis detallado y diseño.</td></tr><tr><td><b>L-CASE</b> (lower)</td><td>Codificación, errores, pruebas y documentación automática.</td></tr></table>
    <p class="muted">Truco: Upper = arriba = inicio del ciclo; Lower = abajo = final.</p></div>
   <div><h3>Frameworks</h3><p>Estructura de soporte (bibliotecas, programas, entorno) para no empezar desde cero.</p>
    <p><span class="pill pl">+</span>Desarrollo rápido, reutilización, diseño uniforme. <span class="pill pp">−</span>Dependencia del framework y más consumo de recursos.</p>
    <table class="tb"><tr><td><b>.NET</b></td><td>Aplicaciones Windows (C#)</td></tr><tr><td><b>Spring</b></td><td>Java profesional</td></tr><tr><td><b>Qt</b></td><td>C++ multiplataforma</td></tr><tr><td><b>Angular</b></td><td>Web con JavaScript/TypeScript</td></tr></table></div>
  </div>
 </div>`;
}

function renderAgil() {
 $("v-agil").innerHTML = `
 <div class="panel"><h2>Metodologías ágiles: Scrum y Kanban</h2>
  <p class="lead">Resumen de los dos vídeos del aula virtual: <b>«SCRUM vs KANBAN – Conceptos, desarrollo, similitudes, diferencias y aplicaciones»</b> (Asier Balduz, UPNA) y <b>«Metodologías ágiles: principios, scrum y kanban»</b> (Programación en español: manifiesto Agile, Scrum, Kanban, Trello/Jira y tabla comparativa).</p>
  <h3>Ágil frente a tradicional</h3>
  <p>Las metodologías tradicionales (cascada) planifican todo al principio y entregan al final. Las <b>ágiles</b> trabajan en <b>ciclos cortos</b>, entregan software funcionando pronto y aceptan el cambio.</p>
  <h3>Manifiesto Ágil (2001): 4 valores</h3>
  <div class="grid2">${[["Individuos e interacciones", "procesos y herramientas"], ["Software funcionando", "documentación exhaustiva"], ["Colaboración con el cliente", "negociación contractual"], ["Respuesta ante el cambio", "seguir un plan"]].map(([a, b]) => `<div class="card"><h4>${a}</h4><p class="muted">por encima de ${b}</p></div>`).join("")}</div>
  <p class="muted">Lo de la derecha también tiene valor, pero se valora más lo de la izquierda.</p>
  <details><summary><b>Los 12 principios (resumidos)</b></summary><ol>
   <li>Satisfacer al cliente con entregas tempranas y continuas.</li><li>Aceptar cambios de requisitos, incluso tarde.</li><li>Entregar software funcional con frecuencia (semanas).</li><li>Negocio y desarrolladores trabajan juntos a diario.</li><li>Equipos motivados con confianza y apoyo.</li><li>Comunicación cara a cara.</li><li>El software funcionando es la medida del progreso.</li><li>Ritmo de trabajo sostenible.</li><li>Excelencia técnica y buen diseño.</li><li>Simplicidad: maximizar el trabajo no hecho.</li><li>Equipos autoorganizados.</li><li>Reflexión periódica para mejorar.</li></ol></details>
 </div>

 <div class="panel"><h2>Scrum</h2>
  <p>Marco de trabajo con <b>iteraciones de duración fija</b> llamadas <b>sprints</b> (normalmente 1–4 semanas). Cada sprint entrega un <b>incremento</b> del producto.</p>
  <div class="grid3">
   <div class="card"><h4>3 roles</h4><p><b>Product Owner</b>: representa al cliente; prioriza el Product Backlog (el «qué»).</p><p><b>Scrum Master</b>: facilita el proceso y elimina impedimentos.</p><p><b>Equipo de desarrollo</b>: autoorganizado; construye el incremento (el «cómo»).</p></div>
   <div class="card"><h4>3 artefactos</h4><p><b>Product Backlog</b>: lista priorizada de todo lo que necesita el producto (historias de usuario).</p><p><b>Sprint Backlog</b>: lo elegido para este sprint.</p><p><b>Incremento</b>: el producto funcionando al final del sprint.</p></div>
   <div class="card"><h4>5 eventos</h4><p><b>Sprint</b> · <b>Sprint Planning</b> (qué y cómo) · <b>Daily Scrum</b> (15 min: qué hice, qué haré, qué me bloquea) · <b>Sprint Review</b> (se enseña al cliente) · <b>Retrospectiva</b> (cómo mejorar el equipo).</p></div>
  </div>
  <div class="flow"><div class="st s1"><b>Product Backlog</b>priorizado por el PO</div><div class="ar">→</div><div class="st s2"><b>Sprint Planning</b></div><div class="ar">→</div><div class="st s3"><b>Sprint</b> (2–4 sem.) con Daily Scrum cada día</div><div class="ar">→</div><div class="st s4"><b>Review</b> + <b>Retrospectiva</b></div><div class="ar">→</div><div class="st s5"><b>Incremento</b> entregable ↺</div></div>
 </div>

 <div class="panel"><h2>Kanban</h2>
  <p>Método de <b>gestión visual del flujo</b> continuo (nació en Toyota). No hay sprints: las tareas entran y salen del tablero de forma continua.</p>
  <div class="grid2"><div><ul>
   <li><b>Visualizar el flujo</b> en un tablero con columnas (Por hacer · En curso · Revisión · Hecho).</li>
   <li><b>Limitar el trabajo en curso (WIP)</b>: máximo de tareas por columna; obliga a terminar antes de empezar otra.</li>
   <li><b>Sistema pull</b>: se «tira» de una tarea nueva cuando hay hueco.</li>
   <li><b>Gestionar y medir el flujo</b>: <i>lead time</i> (desde que se pide hasta que se entrega) y <i>cycle time</i> (desde que se empieza).</li>
   <li><b>Mejora continua</b>; no impone roles fijos.</li></ul></div>
   <div><p class="muted">Pruébalo: pulsa una tarea para moverla a la siguiente columna. La columna «En curso» tiene un <b>límite WIP de 2</b>.</p>
    <div class="kb" id="kb"></div><button id="kb-reset" class="noprint">Reiniciar tablero</button></div></div>
 </div>

 <div class="panel"><h2>Scrum frente a Kanban</h2>
  <div class="tscroll"><table class="tb"><tr><th></th><th>Scrum</th><th>Kanban</th></tr>
   <tr><td><b>Ritmo</b></td><td>Sprints de duración fija</td><td>Flujo continuo</td></tr>
   <tr><td><b>Roles</b></td><td>Product Owner, Scrum Master, equipo</td><td>No hay roles obligatorios</td></tr>
   <tr><td><b>Entregas</b></td><td>Al final de cada sprint</td><td>Continuas, cuando la tarea está lista</td></tr>
   <tr><td><b>Cambios</b></td><td>No se cambia el sprint en curso</td><td>En cualquier momento</td></tr>
   <tr><td><b>Límite de trabajo</b></td><td>Lo que cabe en el sprint</td><td>Límite WIP por columna</td></tr>
   <tr><td><b>Métricas</b></td><td>Velocidad (puntos por sprint), burndown</td><td>Lead time, cycle time</td></tr>
   <tr><td><b>Ideal para</b></td><td>Producto nuevo con entregas planificadas</td><td>Soporte, mantenimiento, peticiones continuas</td></tr></table></div>
  <div class="good"><b>En común:</b> ágiles, tablero visual, mejora continua, equipos autoorganizados y entrega de valor frecuente. <b>Herramientas</b>: Trello (tableros sencillos) y Jira (Scrum y Kanban profesionales).</div>
  <div class="exam"><b>Pregunta típica:</b> «¿Scrum o Kanban para un equipo de soporte que recibe incidencias a diario?» → <b>Kanban</b> (trabajo continuo e imprevisible). «¿Y para desarrollar una app nueva con entregas cada dos semanas?» → <b>Scrum</b>.</div>
 </div>`;
 const COLS = ["Por hacer", "En curso", "Revisión", "Hecho"], WIP = { 1: 2 };
 let tasks;
 const reset = () => { tasks = [["Login", 0], ["Carrito", 0], ["Facturas", 0], ["Stock", 0], ["Informe ventas", 0]]; draw(); };
 const draw = () => {
  $("kb").innerHTML = COLS.map((c, i) => { const n = tasks.filter(t => t[1] === i).length; return `<div class="col ${WIP[i] && n >= WIP[i] ? "full" : ""}"><h5>${c}<span>${WIP[i] ? n + "/" + WIP[i] : n}</span></h5>${tasks.map((t, k) => t[1] === i ? `<div class="t" data-k="${k}">${t[0]}</div>` : "").join("")}</div>`; }).join("");
  $("kb").querySelectorAll(".t").forEach(el => el.onclick = () => {
   const t = tasks[+el.dataset.k]; if (t[1] >= 3) return;
   const nx = t[1] + 1; if (WIP[nx] && tasks.filter(x => x[1] === nx).length >= WIP[nx]) { el.animate([{ transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "none" }], { duration: 250 }); alert("Límite WIP alcanzado en «" + COLS[nx] + "»: termina una tarea antes de empezar otra."); return; }
   t[1] = nx; draw();
  });
 };
 $("kb-reset").onclick = reset; reset();
}

 <div class="panel" id="u2-sem"><h2>8. Proyecto con paquetes: el semáforo</h2>
  <div class="grid2">
   <div><p>Un profesor pregunta el color del semáforo; el estudiante consulta el ordenador y responde. Tres actores → tres clases (más <code>persona</code>, de la que heredan).</p>
<pre>EDSemaforo/

│   ├── profesor.java       <span class="c"># extends persona</span>
│   └── ordenador.java      <span class="c"># color() aleatorio</span>
├── principal/
│   └── clasecolor.java     <span class="c"># main · import clases.profesor;</span>
└── META-INF/MANIFEST.MF</pre></div>
   <div><div class="flow" style="flex-direction:column"><div class="st s1"><b>clasecolor.main()</b>crea un profesor y llama a <code>preguntacolor()</code></div><div class="st s2"><b>profesor.preguntacolor()</b>crea un estudiante y le pregunta</div><div class="st s3"><b>estudiante.preguntacolor()</b>se presenta y consulta el ordenador</div><div class="st s4"><b>ordenador.color()</b>devuelve «rojo», «amarillo» o «verde» al azar</div></div></div>
  </div>

 <div class="panel" id="u2-jar"><h2>9. Empaquetar en un archivo .jar</h2>
  <p>Un <b>.jar</b> (Java ARchive) reúne todos los <code>.class</code> y recursos en un único archivo comprimido, fácil de distribuir.</p>
<pre><span class="o">$</span> mkdir -p META-INF
<span class="o">$</span> printf <span class="p">'Main-Class: principal.clasecolor\n'</span> > META-INF/MANIFEST.MF   <span class="c"># ¡con salto de línea final!</span>
<span class="o">$</span> jar cmf META-INF/MANIFEST.MF semaforo.jar clases/*.class principal/*.class
<span class="o">$</span> java -jar semaforo.jar    <span class="c"># ejecutar</span>
<span class="o">$</span> jar tf semaforo.jar        <span class="c"># ver contenido sin descomprimir</span>
<span class="o">$</span> jar xf semaforo.jar        <span class="c"># descomprimir (mejor en otra carpeta)</span></pre>
  <table class="tb"><tr><th>Opción de <code>jar</code></th><th>Significa</th></tr><tr><td><code>c</code></td><td><b>c</b>rear un archivo</td></tr><tr><td><code>m</code></td><td>incluir el <b>m</b>anifiesto indicado</td></tr><tr><td><code>f</code></td><td>el nombre del archivo (<b>f</b>ile) va a continuación</td></tr><tr><td><code>t</code></td><td>lis<b>t</b>ar el contenido</td></tr><tr><td><code>x</code></td><td>e<b>x</b>traer</td></tr></table>
  <h3>Script para automatizar</h3>
<pre><span class="o">$</span> cat compilar.sh
<span class="k">#!/bin/bash</span>
javac clases/*.java principal/clasecolor.java
jar cmf META-INF/MANIFEST.MF semaforo.jar clases/*.class principal/*.class
<span class="o">$</span> chmod +x compilar.sh && ./compilar.sh</pre>
 </div>

 <div class="panel" id="u2-err"><h2>10. Erratas de las diapositivas (para que no te confundan)</h2>
  <div class="bad"><b>Script <code>compilar.sh</code>:</b> las diapositivas escriben <code>META-INF/MANIFEST.mf</code> (en minúsculas), pero el archivo se creó como <code>MANIFEST.MF</code>. En Linux las mayúsculas importan, así que el script fallaría con «No such file». Usa siempre <code>MANIFEST.MF</code> y añade la primera línea <code>#!/bin/bash</code>.</div>
  <div class="bad"><b>Carpeta de plugins:</b> la diapositiva dice «dropings»; la carpeta real de Eclipse se llama <code>dropins</code>.</div>
  <div class="warn"><b>Nombres de clases:</b> en el ejemplo las clases van en minúsculas (<code>clasecolor</code>, <code>ordenador</code>). Funciona, pero la convención de Java es <b>PascalCase</b> para clases (<code>ClaseColor</code>, <code>Ordenador</code>) y camelCase para variables (<code>edad</code>, no <code>Edad</code>). En tus programas usa la convención.</div>
  <div class="warn"><b>«Interpretador»:</b> en español lo correcto es <b>intérprete</b>.</div>
 </div>`;

  document.querySelectorAll(`#${tid} tr[data-i]`).forEach(tr => tr.querySelectorAll(".chk button").forEach(b => b.onclick = () => { ans[tr.dataset.i] = b.dataset.k; tr.querySelectorAll(".chk button").forEach(x => x.classList.toggle("sel", x === b)); tr.classList.remove("ok", "ko"); }));
  const show = (grade) => {
   let ok = 0;
   document.querySelectorAll(`#${tid} tr[data-i]`).forEach(tr => {
    const i = +tr.dataset.i, d = data[i];
    tr.querySelector("[data-sol]").innerHTML = `<b>${NAMES[d[ansIdx]]}</b> · ${d[whyIdx]}`;
    if (grade) { const good = ans[i] === d[ansIdx]; good && ok++; tr.classList.toggle("ok", good); tr.classList.toggle("ko", !good); }
   });
   if (grade) { $(tid + "-score").hidden = false; $(tid + "-score").textContent = `${ok} / ${data.length}`; }
  };
  $(tid + "-chk").onclick = () => show(true);
  $(tid + "-sol").onclick = () => show(false);
  $(tid + "-reset").onclick = () => { Object.keys(ans).forEach(k => delete ans[k]); document.querySelectorAll(`#${tid} tr[data-i]`).forEach(tr => { tr.classList.remove("ok", "ko"); tr.querySelector("[data-sol]").innerHTML = ""; tr.querySelectorAll("button").forEach(b => b.classList.remove("sel")); }); $(tid + "-score").hidden = true; };
 };
 setup("e12", E12, 1, 2); setup("e13", E13, 1, 2);
}

let QZ = null;
function renderTest() {
 const cats = [...new Set(QUIZ.map(q => q[0]))];
 $("v-test").innerHTML = `<div class="panel"><div class="row sb"><h2>Test de autoevaluación</h2><select id="qz-cat"><option value="all">Todo (${QUIZ.length})</option>${cats.map(c => `<option>${c}</option>`).join("")}</select></div>
  <p class="lead">Opciones barajadas en cada intento. Teclas A–D para responder.</p>
  <div class="muted" id="qz-st"></div><div class="track"><div class="bar" id="qz-bar"></div></div><div id="qz-box"></div></div>`;
 const start = () => { const c = $("qz-cat").value; QZ = { list: shuffle(QUIZ.filter(q => c === "all" || q[0] === c)), k: 0, ok: 0, fails: [], ans: false }; draw(); };
 const draw = () => {
  const n = QZ.list.length;
  $("qz-st").textContent = `Pregunta ${Math.min(QZ.k + 1, n)} de ${n} · Aciertos ${QZ.ok}`;
  $("qz-bar").style.width = (QZ.k / n * 100) + "%";
  if (QZ.k >= n) {
   const best = store("ed-best") || 0, nota = QZ.ok / n * 10; if (nota > best) store("ed-best", nota);
   $("qz-box").innerHTML = `<div class="big">${nota.toFixed(1).replace(".", ",")}</div><p style="text-align:center">${QZ.ok} de ${n} · mejor nota: ${Math.max(best, nota).toFixed(1).replace(".", ",")}</p>${QZ.fails.length ? `<h3>Repasa:</h3><ul>${QZ.fails.map(q => `<li>${esc(q[1])} → <b>${esc(q[2][q[3]])}</b></li>`).join("")}</ul>` : ""}<div class="row" style="justify-content:center"><button class="primary" id="qz-again">Repetir</button></div>`;
   $("qz-again").onclick = start; return;
  }
  const q = QZ.list[QZ.k], ord = shuffle(q[2].map((_, i) => i)); QZ.ans = false;
  $("qz-box").innerHTML = `<span class="badge">${q[0]}</span><p style="font-size:1.15rem;margin:8px 0">${esc(q[1])}</p><div class="opts">${ord.map((o, p) => `<button class="opt" data-o="${o}"><b>${"ABCD"[p]}</b> ${esc(q[2][o])}</button>`).join("")}</div><div id="qz-fb"></div>`;
  document.querySelectorAll("#qz-box .opt").forEach(b => b.onclick = () => {
   if (QZ.ans) return; QZ.ans = true;
   const good = +b.dataset.o === q[3]; good ? QZ.ok++ : QZ.fails.push(q);
   document.querySelectorAll("#qz-box .opt").forEach(x => { x.disabled = true; if (+x.dataset.o === q[3]) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
   $("qz-fb").innerHTML = `<div class="fb">${good ? "✓ <b>Correcto.</b>" : "✗ <b>No.</b>"} ${esc(q[4])}</div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="primary" id="qz-next">Siguiente →</button></div>`;
   $("qz-next").onclick = () => { QZ.k++; draw(); }; $("qz-next").focus();
  });
 };
 $("qz-cat").onchange = start;
 document.addEventListener("keydown", e => {
  if ($("v-test").hidden || !QZ || ["INPUT", "SELECT"].includes(e.target.tagName)) return;
  const i = "ABCD".indexOf(e.key.toUpperCase()), b = document.querySelectorAll("#qz-box .opt");
  if (i >= 0 && b[i] && !QZ.ans) b[i].click();
 });
 start();
}

function show(v) {

 store("ed-view", v); window.scrollTo({ top: 0 });
}
$("tabs").innerHTML = GROUPS.map(([g, items]) => `<span class="grp">${g}</span>` + items.map(([k, n]) => `<button id="t-${k}" role="tab">${n}</button>`).join("")).join("");
